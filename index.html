te":"","referenceItems":[{"statuteRef":215}]},{"id":108,"year":15,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟の判決に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["裁判所は，１億円の支払請求に対し，被告によって１億円が既に支払われていると判断したならば，原告の訴えを不適法として却下する判決をしなければならない。","裁判所は，原告が土地所有権の確認を請求している場合，審理の結果，被告が土地を不法占拠していることが明らかになったからといって，土地の明渡しを命じる判決をすることはできない。","裁判所は，原告が１億円の売買代金を請求した場合において，被告から同時履行の抗弁権が行使され，それが認められたときは，請求を棄却する判決をしなければならない。","裁判所は，原告が１億円の損害賠償を請求したときでも，審理の結果，明らかになった適切な賠償金額として，２億円の支払を命ずる判決をすることができる。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。被告が既に1億円を支払っているなら、原告の請求に理由がないため『請求棄却』となります。訴え自体が不適法なわけではないので『却下』ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。処分権主義により、裁判所は原告が求めていない給付を命じることができません。所有権確認請求だけがされているのに、土地明渡しまで命じることはできません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。同時履行の抗弁が認められた場合、請求を全面棄却するのではなく、原告の反対給付と引換えに支払を命ずる引換給付判決をします。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。裁判所は原告の申立てを超える判決をできません。1億円請求に対して2億円を命ずるのは処分権主義に反します。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法246条裁判所は、当事者が申し立てていない事項について、判決をすることができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":215}]},{"id":109,"year":14,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟の管轄に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["自然人を被告として財産権上の訴えを提起する場合には，被告の住所又は居所の所在地を管轄する裁判所に対してしなければならない。","専属管轄に違反して訴えが提起され，それが訴訟係属中に判明した場合には，強行規定に反するので，訴えの提起は無効となる。","被告が第一審裁判所において管轄違いの抗弁を提出しないで本案について弁論をしたときは，その裁判所は管轄権を有する。","管轄の合意は裁判所を拘束する公法上の契約であるから，私法上の意思表示の瑕疵を主張して無効とすることはできない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。自然人に対する財産権上の訴えは普通裁判籍として住所地等に提起できますが、契約上の義務履行地、不法行為地、不動産所在地など特別裁判籍が認められる場合もあり、住所地裁判所に『しなければならない』とは限りません。","corrected":"","inferredBasis":["憲法29条","民法709条"]},{"mark":"×","explanation":"誤り。専属管轄違反が判明した場合、訴え自体が無効になるのではなく、原則として管轄裁判所へ移送することになります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。専属管轄の場合を除き、被告が第一審裁判所で管轄違いの抗弁をせず本案について弁論等をすると、応訴管轄が生じます（民事訴訟法12条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。管轄合意にも当事者の意思表示が必要であり、錯誤・詐欺等の意思表示の瑕疵に関する私法上の規律が問題となり得ます。『一切主張できない』わけではありません。","corrected":"","inferredBasis":["民法95条","民法96条"]}],"references":["民事訴訟法4条1項（普通裁判籍・学習用抜粋）訴えは、被告の普通裁判籍の所在地を管轄する裁判所の管轄に属する。","民事訴訟法5条（特別裁判籍・学習用抜粋）財産権上の訴え、事務所又は営業所に関する訴え、不法行為に関する訴え、不動産に関する訴え等について、法定の土地の裁判所にも提起することができる。","民事訴訟法11条（管轄の合意・学習用抜粋）当事者は、第一審に限り、合意により管轄裁判所を定めることができる。合意は一定の法律関係に基づく訴えについて書面等でしなければならない。","民事訴訟法12条被告が第一審裁判所において管轄違いの抗弁を提出しないで本案について弁論等をしたときは、その裁判所は管轄権を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":216},{"statuteRef":217},{"statuteRef":218},{"statuteRef":219},{"learningNote":"憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。","statuteRef":106},{"learningNote":"民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","statuteRef":111},{"learningNote":"","statuteRef":76},{"learningNote":"","statuteRef":66}]},{"id":110,"year":13,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟における権利能力なき社団に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["代表者の定めのある権利能力なき社団は，被告にもなることができる。","権利能力なき社団は，不動産登記訴訟の原告になることができる。","第一審判決において権利能力なき社団ではないと認定されたために訴えを却下された団体は，控訴を提起することができない。","権利能力なき社団は，法人格ある社団と同様，その代表者が訴訟を追行する。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。代表者又は管理人の定めがある権利能力なき社団は、民事訴訟法29条により当事者能力が認められ、被告にもなれます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。権利能力なき社団にも当事者能力が認められるため、不動産に関する登記請求等の訴訟で原告となることができます。ただし登記名義の扱いには実体法・登記法上の制約があります。","corrected":"","inferredBasis":["民事訴訟法29条"]},{"mark":"×","explanation":"誤り。第一審で権利能力なき社団ではないとして訴えを却下されたとしても、その判断自体を争うため当該団体は控訴を提起できます。『控訴できない』では不服申立ての機会が失われます。","corrected":"","inferredBasis":["民事訴訟法29条"]},{"mark":"○","explanation":"正しい。権利能力なき社団の訴訟は、定款等で定められた代表者・管理人が社団を代表して追行します。","corrected":"","inferredBasis":["民事訴訟法29条"]}],"references":["民事訴訟法29条法人でない社団又は財団で代表者又は管理人の定めがあるものは、その名において訴え、又は訴えられることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":220}]},{"id":111,"year":13,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"次の１から４までの記述のうち，民事訴訟手続の中断事由に当たらないものを1つ選びなさい。","choices":["訴訟代理人の死亡","当事者の死亡","当事者である法人の合併による消滅","当事者の訴訟能力の喪失"],"answer":1,"details":[{"mark":"○","explanation":"中断事由ではありません。訴訟代理人が死亡しても、当事者本人の訴訟追行主体としての地位は失われないため、原則として訴訟手続は中断しません。新たな代理人選任等で対応します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"中断事由です。当事者が死亡した場合、相続人等の承継人が訴訟を受継するまで、原則として訴訟手続は中断します。ただし訴訟代理人がいる場合など例外があります。","corrected":"","inferredBasis":["民法882条"]},{"mark":"×","explanation":"中断事由です。当事者である法人が合併により消滅すると、その権利義務を承継する法人による訴訟受継が必要となるため、原則として訴訟手続は中断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"中断事由です。当事者が訴訟能力を失った場合、法定代理人等による適法な訴訟追行が必要になるため、受継まで訴訟手続が中断します。現行法メモ・2020年改正後の現行民法では、旧法の「時効の中断」は「完成猶予」と「更新」に整理されています。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法124条（訴訟手続の中断・学習用抜粋）当事者の死亡、法人の合併による消滅、訴訟能力の喪失等の一定の場合に訴訟手続は中断する。ただし、訴訟代理人がある場合等には例外がある。"],"oldLawNote":"","referenceItems":[{"statuteRef":221},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":112,"year":12,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟法上の証拠調べに関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["裁判所は，当事者が申し出た証拠で必要でないと認めるものは，取り調べることを要しない。","裁判所において当事者が自白した事実は，証明することを要しない。","裁判所は，相当と認めるときは，裁判所外において証拠調べをすることができる。","証拠調べは，当事者が期日に出頭しない場合，することができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。裁判所は当事者が申し出た証拠でも、争点との関連性がなく必要でないと認めるものは取り調べる必要がありません（民事訴訟法181条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。裁判上の自白が成立した事実は、原則として証明を要しません（民事訴訟法179条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。裁判所は相当と認めるとき、裁判所外で証拠調べをすることができます。現場検証や遠隔地の証人等で用いられます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。証拠調べは、当事者の一方又は双方が期日に出頭しなくても行うことができます。『不出頭なら証拠調べできない』という一般的制限はありません。","corrected":"","inferredBasis":[]}],"references":["民訴法179条裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。民訴法181条1項裁判所は、当事者が申し出た証拠で必要でないと認めるものは、取り調べることを要しない。"],"oldLawNote":"","referenceItems":[{"statuteRef":222}]},{"id":113,"year":17,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"争点及び証拠の整理手続に","prompt":"争点及び証拠の整理手続に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["争点及び証拠の整理手続には、弁論準備手続、準備的口頭弁論及び書面による準備手続がある。","裁判所は、準備的口頭弁論を公開の法廷で行うことができない。","裁判所は、弁論準備手続の期日において、証人尋問をすることができない。","裁判長は、書面による準備手続において電話会議システムを利用して当事者双方と協議をすることができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。争点・証拠整理手続には、準備的口頭弁論、弁論準備手続、書面による準備手続があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。準備的口頭弁論は『口頭弁論』なので公開法廷で行われます。公開されない弁論準備手続と混同している点が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。弁論準備手続は争点・証拠整理のための手続で、証人尋問そのものを行う手続ではありません。証拠調べは原則として口頭弁論期日に行います。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。書面による準備手続では、裁判長等が電話・映像等の通信方法を利用して当事者双方と協議することができます。制度改正により利用可能な通信方法は拡充されています。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法92条（弁論準備手続・学習用抜粋）裁判所は、争点及び証拠の整理を行うため必要があると認めるときは、当事者双方が立ち会うことができる期日に弁論準備手続を行うことができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":223}]},{"id":114,"year":19,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"文書提出命令に関する次の","prompt":"文書提出命令に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["第三者が文書提出命令に従わないときは、第三者は２０万円以下の過料に処される。","当事者が文書提出命令を出された文書を相手方の使用を妨げる目的で滅失させたときは、当事者は刑罰に処される。","当事者が文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。","第三者が文書提出命令を出された文書をすでに滅失させていたときは、第三者に対する民事訴訟法上の制裁はない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。第三者が文書提出命令に従わない場合、民事訴訟法225条により20万円以下の過料に処されることがあります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。当事者が相手方の使用を妨げる目的で提出命令対象文書を滅失等した場合、民事訴訟法上の制裁は、裁判所が当該文書の記載に関する相手方の主張を真実と認め得るという証拠法上の不利益です。直ちに『刑罰に処される』制度ではありません。","corrected":"","inferredBasis":["民事訴訟法224条","民事訴訟法225条"]},{"mark":"○","explanation":"正しい。当事者が文書提出命令に従わない場合、裁判所は当該文書の記載に関する相手方の主張を真実と認めることができます（民事訴訟法224条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。第三者が既に文書を滅失していて提出不能であるだけなら、文書提出命令への不服従を理由とする過料等の制裁を科す前提を欠きます。故意の滅失等が別の責任を生むかは別問題です。","corrected":"","inferredBasis":["民事訴訟法224条","民事訴訟法225条"]}],"references":["民訴法224条1項当事者が文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。","民事訴訟法225条（解説中参照・条文要旨） 第三者が文書提出命令に従わない場合、民事訴訟法225条により20万円以下の過料に処されることがあります。"],"oldLawNote":"","referenceItems":[{"statuteRef":224},{"learningNote":"第三者が文書提出命令に従わない場合、民事訴訟法225条により20万円以下の過料に処されることがあります。","statuteRef":225},{"learningNote":"","statuteRef":226}]},{"id":115,"year":16,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"筆界","prompt":"筆界確定の訴えに関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["裁判所は、原告の主張、立証によって客観的な筆界を知り得ないとき、筆界確定請求を棄却しなければならない。","土地の筆界について当事者が合意しても、裁判所はこれに拘束されない。","裁判所は、当事者が主張する特定の筆界線に拘束されないで筆界を確定することができる。","被告は、自己に有利な筆界線を主張したいときであっても、反訴を提起する必要はない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。筆界確定訴訟は客観的な筆界を確定する形式的形成訴訟とされ、証拠が十分でないからといって単純に請求を棄却するのではなく、裁判所が資料を尽くして何らかの筆界を確定すべき性質を有します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。筆界は当事者が自由に処分できる私法上の権利境界ではないため、当事者が合意した線に裁判所が拘束されることはありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。裁判所は原告・被告が主張する筆界線のいずれかを選ぶだけでなく、証拠に基づいて別の位置を真の筆界として確定できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。筆界確定訴訟では裁判所が客観的筆界を確定するため、被告が自己に有利な線を主張するために反訴を提起する必要はありません。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法246条裁判所は、当事者が申し立てていない事項について、判決をすることができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":215}]},{"id":116,"year":15,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"裁判","prompt":"裁判上の和解に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["民事上の争いについて，当事者は，訴えの提起をする前に，簡易裁判所に和解の申立てをすることができる。","裁判上の和解を調書に記載したときは，その記載は，確定判決と同一の効力を有する。","裁判上の和解は，最初の口頭弁論期日にすることができる。","相互に隣接する土地の筆界を定める裁判上の和解をすることにより，この和解によって一筆の土地の筆界は変動する。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。訴え提起前でも、民事上の紛争について簡易裁判所へ和解を申し立てることができます（いわゆる起訴前の和解・即決和解）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。裁判上の和解を調書に記載すると、その記載は確定判決と同一の効力を有し、債務名義ともなります。","corrected":"","inferredBasis":["民事訴訟法267条"]},{"mark":"○","explanation":"正しい。裁判上の和解は訴訟係属後であれば、最初の口頭弁論期日を含め訴訟のどの段階でも成立し得ます。","corrected":"","inferredBasis":["民事訴訟法267条"]},{"mark":"×","explanation":"誤り。筆界は公法上の境界で、当事者の合意や裁判上の和解によって自由に移動・変更することはできません。和解で所有権界・利用関係を定めることはできても、一筆の筆界そのものは変動しません。","corrected":"","inferredBasis":["民事訴訟法267条"]}],"references":["民事訴訟法267条和解又は請求の放棄若しくは認諾を調書に記載したときは、その記載は、確定判決と同一の効力を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":227}]},{"id":117,"year":11,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"訴えの取下げに関する次の","prompt":"訴えの取下げに関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["訴えの取下げの書面の送達を受けた日から２週間以内に相手方が異議を述べないときは，相手方は，訴えの取下げに同意したものとみなされる。","訴えが取り下げられると，訴訟は，初めから係属していなかったものとみなされる。","当事者双方が，連続して2回，口頭弁論期日に出頭しなかった場合には，訴えの取下げがあったものとみなされる。","訴えは，本案について終局判決がなされた後には，取り下げることができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。被告の同意が必要な段階で訴え取下書が送達され、被告が2週間以内に異議を述べなければ、取下げに同意したものとみなされます。","corrected":"","inferredBasis":["民事訴訟法261条"]},{"mark":"○","explanation":"正しい。訴えが取り下げられると、その訴訟は初めから係属していなかったものとみなされます（民事訴訟法262条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。当事者双方が連続して2回、口頭弁論・弁論準備手続等の期日に出頭せず、一定の要件を満たす場合、訴えの取下げがあったものとみなされます。","corrected":"","inferredBasis":["民事訴訟法261条"]},{"mark":"×","explanation":"誤り。訴えは判決が『確定するまで』取り下げることができます。本案について終局判決が言い渡された後でも、確定前であれば取下げは可能です。ただし再訴禁止等の効果に注意します。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法261条1項訴えは、判決が確定するまで、その全部又は一部を取り下げることができる。","民事訴訟法262条第1項（解説中参照・条文要旨） 訴えが取り下げられると、その訴訟は初めから係属していなかったものとみなされます（民事訴訟法262条1項）。"],"oldLawNote":"","referenceItems":[{"statuteRef":228},{"learningNote":"訴えが取り下げられると、その訴訟は初めから係属していなかったものとみなされます（民事訴訟法262条1項）。","statuteRef":229}]},{"id":118,"year":17,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"訴状の送達に関する次の１","prompt":"訴状の送達に関する次の１から４までの記述のうち、誤っているのを１つ選びなさい。","choices":["訴状の送達に関する事務は、裁判所書記官が取り扱う。","訴状の送達は、特別の定めがある場合を除き、郵便又は執行官によってする。","公示送達の場合、裁判所書記官が訴状等の書類を保管し、いつでも送達を受けるべき者に交付すべき旨を官報で公告しなければならない。","書留郵便等に付して訴状を発送した場合には、その発送の時に送達があったものとみなされる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。送達に関する事務は裁判所書記官が取り扱います（民事訴訟法98条2項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。送達は特別の定めがある場合を除き、郵便又は執行官によって行います（民事訴訟法99条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。公示送達は裁判所書記官が送達書類を保管し、送達を受けるべき者にいつでも交付する旨を裁判所の掲示場等に掲示する方法等で行います。『官報で公告しなければならない』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。書留郵便等に付する送達（付郵便送達）は、一定の要件の下で書類を発送した時に送達があったものとみなされます。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法111条（公示送達の方法・学習用抜粋）公示送達は、裁判所書記官が送達すべき書類を保管し、いつでも送達を受けるべき者に交付すべき旨を裁判所の掲示場に掲示する等の方法により行う。","民事訴訟法112条（公示送達の効力発生時期・学習用抜粋）公示送達は、原則として掲示等を始めた日から二週間を経過することによって効力を生ずる。","民事訴訟法98条第2項（解説中参照・条文要旨） 送達に関する事務は裁判所書記官が取り扱います（民事訴訟法98条2項）。","民事訴訟法99条（解説中参照・条文要旨） 送達は特別の定めがある場合を除き、郵便又は執行官によって行います（民事訴訟法99条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":230},{"statuteRef":231},{"learningNote":"送達に関する事務は裁判所書記官が取り扱います（民事訴訟法98条2項）。","statuteRef":232},{"learningNote":"送達は特別の定めがある場合を除き、郵便又は執行官によって行います（民事訴訟法99条）。","statuteRef":233}]},{"id":119,"year":20,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"訴訟要件に関する次の１か","prompt":"訴訟要件に関する次の１から４までの記述のうち、誤っているものを1つ選びなさい。","choices":["裁判所は、当事者の申立てがなければ、当事者間に仲裁合意があることを理由にして、訴えを却下する判決をすることができない。","訴訟要件は、本案の審理開始の要件ではない。","民事調停の当事者は、調停中の事件について訴えを提起することができない。","裁判所は、訴えが不適法でその不備を補正することができないときは、口頭弁論を経ないで、判決で、訴えを却下することができる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。仲裁合意があることによる訴え却下は被告の抗弁的な申立てを要し、裁判所が当事者の申立てなく職権で仲裁合意を理由に却下することはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。訴訟要件は本案判決をするための要件ですが、本案審理そのものを一切開始できないという意味ではありません。審理の過程で訴訟要件の有無を調査することがあります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民事調停が係属中でも、当事者が同一事件について民事訴訟を提起することは可能です。調停前置が法定される一部事件を除き、『調停中は訴えを提起できない』という一般的禁止はありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。訴えが明らかに不適法で補正不能な場合、裁判所は口頭弁論を経ず判決で訴えを却下できます（民事訴訟法140条）。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法133条1項訴えの提起は、訴状を裁判所に提出してしなければならない。","民事訴訟法140条（解説中参照・条文要旨） 訴えが明らかに不適法で補正不能な場合、裁判所は口頭弁論を経ず判決で訴えを却下できます（民事訴訟法140条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":234},{"learningNote":"訴えが明らかに不適法で補正不能な場合、裁判所は口頭弁論を経ず判決で訴えを却下できます（民事訴訟法140条）。","statuteRef":235}]},{"id":120,"year":20,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。なお、民間紛争解決手続代理関係業務については、土地家屋調査士法第３条第２項に規定する土地家屋調査士（以下「認定土地家屋調査士」という。）が弁護士と共同で受任するものとする。","choices":["認定土地家屋調査士Ａは、以前Ｙからの依頼として建物の表示に関する登記を受任していた場合、Ｙを相手方とする民間紛争解決手続代理関係業務をＸから依頼されたときは、これを受任することができる。","民間紛争解決手続代理関係業務を行うことを目的としない土地家屋調査士法人Ｂが、筆界特定の手続について法務局に提出する書類作成業務の依頼をＸから受任している場合、Ｂの社員である認定土地家屋調査士Ａは、Ｘが同意したときでなければ、当該手続の相手方であるＹからの依頼による他の民間紛争解決手続代理関係業務を行うことはできない。","土地家屋調査士法人Ｂは、ＸからＹを相手方とする民間紛争解決手続代理関係業務を受任している。Ｂの使用人である認定土地家屋調査士Ａは、自らその事件に関与している場合、Ｘの同意なくＹから他の民間紛争解決手続代理関係業務の依頼を受けることはできない。","認定土地家屋調査士Ａは、Ｘから土地の筆界が現地において明らかでないことを原因とする民事に関する紛争に係る民間紛争解決手続についての相談の依頼を受けたときは、正当な事由がなくとも、依頼を拒むことができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。過去に相手方Yから建物表示登記の依頼を受けていたというだけで、現在のX対YのADR事件が当然に受任禁止となるわけではありません。受任制限は法定の同一・関連事件等の類型に具体的に当てはめます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法人Bが受任しているのは筆界特定手続の『書類作成業務』であり、そのことだけで社員Aが相手方Yから別のADR代理業務を受任する際にXの同意が必須となるとは限りません。土地家屋調査士法22条の2の禁止類型を事件の同一性・関与内容ごとに判断します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。所属法人がXからYを相手方とするADR代理業務を受任し、A自身がその事件に関与している場合、相手方Yから他事件を受任することには利益相反・秘密保持の問題が生じ、法定の受任制限に服します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。土地家屋調査士法22条の依頼に応ずる義務は、民間紛争解決手続代理関係業務を除外しています。したがってADR相談については、正当な事由がなくても依頼を断ることができます。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","土地家屋調査士法22条（解説中参照・条文要旨） 土地家屋調査士法22条の2の禁止類型を事件の同一性・関与内容ごとに判断します。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法22条の2の禁止類型を事件の同一性・関与内容ごとに判断します。","statuteRef":237},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":121,"year":19,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。なお、民間紛争解決手続代理関係業務については、土地家屋調査士法第３条第２項に規定する土地家屋調査士（以下「認定土地家屋調査士」という。）が弁護士と共同で受任するものとする。","choices":["依頼者から民間紛争解決手続代理関係業務の依頼を受けた認定土地家屋調査士Ａは、代理権も弁護士と共同で行使しなければならない。","認定土地家屋調査士Ａは、かつて土地家屋調査士法人Ｂの社員であった期間内にＢが受任していた筆界特定の代理業務に関与していた場合において、Ｂを退社した後に当該筆界特定の代理業務の相手方から建物表題登記の申請手続の代理業務を依頼されたときは、これを受任することはできない。","認定土地家屋調査士Ａは、Ｙを相手方とする民間紛争解決手続代理関係業務をＸから受任している場合、当該民間紛争解決手続と関係のない土地に関する筆界特定手続代理関係業務をＹから受任するのにＸの同意は必要ない。","認定土地家屋調査士Ａは、Ｙを相手方とする民間紛争解決手続代理関係業務をＸから受任していたが、その手続の途中でＸから解任された。その後、Ｙから同一事件の民間紛争解決手続代理関係業務を依頼された場合、ＡはＹの依頼を受任することはできない。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。弁護士との共同受任が必要でも、認定土地家屋調査士がADR手続内で行う個々の代理行為を常に弁護士と共同して行使しなければならないわけではありません。共同受任・協議の枠内で単独行為が許される場面があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。過去に法人Bで筆界特定代理業務に関与していたからといって、退社後に相手方から全く別種の建物表題登記申請手続を受任することまで一律に禁止されるわけではありません。受任制限は法定の業務類型・事件関連性によります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現在XからYを相手方とするADR代理業務を受任している以上、Yから別事件の筆界特定代理を受任することには利益相反・秘密保持の問題があり、単に『関係ない土地だからXの同意不要』とはいえません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。同一事件について一方当事者Xの代理人として関与した後、解任されたからといって相手方Y側へ乗り換えることはできません。過去の受任によって知った秘密・利益相反を防ぐための受任制限です。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":122,"year":18,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。なお、民間紛争解決手続代理関係業務については、土地家屋調査士法第３条第２項に規定する土地家屋調査士が弁護士と共同で受任するものとする。","choices":["認定土地家屋調査士は、同一の依頼者から民間紛争解決手続代理関係業務及び表示に関する登記の申請手続を受任した場合には、その知り得た秘密が表示に関する登記の申請手続に関するものであっても、正当な事由なく他に漏らしてはならない。","認定土地家屋調査士は、民事調停委員として取り扱った事件であっても、その業務を行うことができる。","民間紛争解決手続代理関係業務を行うことを目的とする土地家屋調査士法人は、認定土地家屋調査士である社員が常駐していない事務所においても、民間紛争解決手続代理関係業務を取り扱うことができる。","認定土地家屋調査士は、民間紛争解決手続代理関係業務を受任した場合、相手方に対して、自ら単独で作成した和解案を示して和解のための交渉を行うことができる。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。土地家屋調査士の秘密保持義務は、業務の種類にかかわらず職務上知り得た秘密を正当な事由なく漏らさない義務です。同一依頼者の登記業務で知った秘密も対象となります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民事調停委員として取り扱った事件について、その後当事者の代理人としてADR代理業務を行うことは、公正性・利益相反の観点から受任制限の対象となります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。ADR代理業務を目的とする土地家屋調査士法人では、当該業務を扱う事務所に認定土地家屋調査士である社員を配置する等の要件があります。認定社員が常駐しない事務所で自由に取り扱えるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。認定土地家屋調査士のADR代理業務は弁護士との共同受任が前提であり、和解案の作成・交渉についても共同受任した弁護士との協議・役割分担を外れて独断で行うことはできません。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":123,"year":17,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。なお、民間紛争解決手続代理関係業務については、土地家屋調査士法第３条第２項に規定する土地家屋調査士が弁護士と共同で受任するものとする。","choices":["認定土地家屋調査士は、正当な事由がある場合でなければ、筆界特定手続代理関係業務に関する依頼を拒んではならない。","民間紛争解決手続代理関係業務を行うことを目的とする土地家屋調査士法人が受任した民間紛争解決手続代理関係業務については、認定土地家屋調査士である当該法人の社員でなければ、その業務を執行することができない。","認定土地家屋調査士は、民間紛争解決手続代理関係業務を弁護士と共同で受任した場合、当該弁護士と協議した内容の範囲であれば、当該民間紛争解決手続において単独で意見を述べることができる。","認定土地家屋調査士は、筆界調査委員として過去に取り扱った事件について、民間紛争解決手続代理関係業務を行うことができない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。土地家屋調査士法22条の正当な事由がない限り依頼を拒んではならない義務から除外されるのは民間紛争解決手続代理関係業務であり、筆界特定手続代理関係業務は原則として受任義務の対象です。本肢は業務区分と受任義務の関係を逆に捉えています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。ADR代理業務を目的とする土地家屋調査士法人が受任した民間紛争解決手続代理関係業務は、認定土地家屋調査士である社員が執行する必要があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。弁護士と共同受任し、共同受任弁護士と協議した内容の範囲内であれば、認定土地家屋調査士がADR手続で単独で意見を述べることは可能です。共同受任は『一言一言を常に二人で行う』という意味ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。筆界調査委員として関与した事件について、その後一方当事者の代理人としてADR代理業務を行うことは、公正性・利益相反を害するため受任できません。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","土地家屋調査士法22条（解説中参照・条文要旨） 土地家屋調査士法22条の正当な事由がない限り依頼を拒んではならない義務から除外されるのは民間紛争解決手続代理関係業務であり、筆界特定手続代理関係業務は原則として受任義務の対象です。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法22条の正当な事由がない限り依頼を拒んではならない義務から除外されるのは民間紛争解決手続代理関係業務であり、筆界特定手続代理関係業務は原則として受任義務の対象です。","statuteRef":237},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":124,"year":16,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。なお、民間紛争解決手続代理関係業務については、土地家屋調査士法第３条第２項に規定する土地家屋調査士が弁護士と共同で受任するものとする。","choices":["民間紛争解決手続代理関係業務を行うことを目的とする土地家屋調査士法人以外の土地家屋調査士法人は、民間紛争解決手続代理関係業務についての相談業務であれば、弁護士との共同受任でなくても単独で行うことができる。","認定土地家屋調査士は、正当な事由がなければ民間紛争解決手続代理関係業務の依頼を拒んではならない。","認定土地家屋調査士は、別事件の筆界特定手続書類作成業務を受任したことがある依頼者を相手方とする民間紛争解決手続代理関係業務を受任することができる。","認定土地家屋調査士は、民間紛争解決手続代理関係業務を共同受任した弁護士と共同で作成した和解案であっても、相手方との和解の交渉を単独で行うことはできない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。民間紛争解決手続代理関係業務は、法務大臣の認定を受けた調査士が弁護士と共同受任して行う特別の代理業務であり、これを目的としない土地家屋調査士法人が『相談だけなら単独で自由に行える』わけではありません。法人の目的・社員資格等の法定要件を満たす必要があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。土地家屋調査士法22条の依頼に応ずる義務は、民間紛争解決手続代理関係業務については除外されています。したがって認定土地家屋調査士は、ADR代理業務について正当な事由がなくても受任を断ることができます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。過去に別事件で相手方から筆界特定手続の書類作成業務を受任した事実だけで、現在のADR代理業務が当然に受任禁止になるわけではありません。事件の同一性・関連性や法22条の2の具体的な禁止類型に該当するかで判断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。弁護士と共同受任し共同で和解案を作成した場合でも、共同受任弁護士と協議した役割分担の範囲内で認定調査士が単独で交渉行為を行える場面があります。『常に単独交渉不可』という断定が誤りです。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","土地家屋調査士法22条（解説中参照・条文要旨） 土地家屋調査士法22条の依頼に応ずる義務は、民間紛争解決手続代理関係業務については除外されています。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法22条の依頼に応ずる義務は、民間紛争解決手続代理関係業務については除外されています。","statuteRef":237},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":125,"year":15,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。なお，民間紛争解決手続代理関係業務については，法務大臣の認定を受けた土地家屋調査士（以下「認定土地家屋調査士」という。）が弁護士と共同で受任するものとする。","choices":["認定土地家屋調査士Ａは，甲土地の分筆の登記の申請手続をＢから受任している場合，甲土地に隣接する乙土地の所有者Ｃから，Ｄを相手方とする，Ｃ所有の丙土地の民間紛争解決手続代理関係業務の依頼を受任することができる。","認定土地家屋調査士Ａは，Ｂを相手方とする筆界特定手続代理関係業務に関する相談をＣから受けたが，筆界の位置について自身の見解を述べたところ，Ｃが納得しなかったために，筆界特定手続の申請には至らずに業務は終了した。この場合Ａは，Ｃの同意を得れば，Ｃを相手方とする同一事件について，民間紛争解決手続代理関係業務をＢから受任することができる。","認定土地家屋調査士Ａは，Ｂを相手方とする民間紛争解決手続代理関係業務をＣから受任している場合，Ｃの同意がなくても，当該民間紛争解決手続と関係のない土地に関する民間紛争解決手続代理関係業務をＢから受任することができる。","認定土地家屋調査士Ａは，調査士法人Ｂの社員であった期間内にＢが受任していた民間紛争解決手続代理関係業務に自ら関与していなかった場合であっても，Ｂを退社した後に当該民間紛争解決手続代理関係業務の相手方から，同一土地の筆界特定代理関係業務に関する依頼を受任することはできない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。AがBから受任しているのは甲土地の分筆登記であり、Cから依頼されたのは別人Dを相手方とする丙土地のADR代理業務です。事件・当事者が別で、法定の利益相反・受任禁止類型に該当しない限り受任できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。AはCから同一事件について筆界特定手続代理関係業務の相談を受け、法律的・専門的見解を示しています。その後相手方B側から同一事件のADR代理を受任することは、Cの同意だけで解消できない法定の受任制限に触れます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現在CからBを相手方とするADR代理業務を受任している以上、Bから別のADR代理業務を受任することには利益相反・秘密保持の問題が生じます。『関係ない土地ならCの同意不要』と一律にはいえません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法人B在籍中に当該ADR事件にA自身が関与していなかったのであれば、退社後に相手方から同一土地の筆界特定代理を受任することが当然に禁止されるとは限りません。受任制限は本人の関与の有無や法定類型を具体的に確認します。","corrected":"","inferredBasis":[]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"statuteRef":236},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":126,"year":14,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。なお，民間紛争解決手続代理関係業務については，法務大臣の認定を受けた土地家屋調査士（以下「認定土地家屋調査士」という。）が弁護士と共同で受任するものとする。","choices":["Ａが申請したＢを関係人とする筆界特定手続において，筆界特定調査委員として任命された認定土地家屋調査士Ｃは，その手続の完了後，当該筆界特定手続と関係のない土地に関する民間紛争解決手続代理関係業務をＢから受任することができる。","認定土地家屋調査士Ａは，Ｂを相手方とする民間紛争解決手続代理関係業務に関する事件をＣから受任している場合には，Ｃの同意を得ない限り，Ｂから当該事件と関係のない土地に関する不動産の表示に関する登記の申請手続を代理して行う業務を受任することができない。","民間紛争解決手続代理関係業務を行うことを目的としない土地家屋調査士法人Ａの社員である認定土地家屋調査士Ｂは，ＡがＣから筆界特定手続代理関係業務に関するものとして受任している事件について，Ｄから，Ｃを相手方として民間紛争解決手続代理関係業務を受任することができる。","Ａを相手方とする筆界特定手続代理関係業務に関する事件をＢから依頼された認定土地家屋調査士Ｃは，Ｂの代理人として筆界特定手続を申請した後にＢの代理人を辞任した場合には，Ｂの同意があれば，Ａから当該事件について民間紛争解決手続代理関係業務を受任することができる。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。筆界特定調査委員として関与した事件そのものについて当事者代理をすることはできませんが、手続完了後、当該筆界特定事件と関係のない別土地・別事件のADR代理を関係人Bから受任することまで一律に禁止されません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現在CからBを相手方とするADR事件を受任していても、Bから受任する別件が単なる表示登記申請業務で、現在の紛争と無関係なら、Cの同意が常に法定要件となるわけではありません。業務類型ごとの受任制限を区別します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法人AがCから筆界特定手続代理関係業務を受任している事件について、同法人の社員Bが相手方側Dから同一事件に関連するADR代理を受任することは、法人内の利益相反・受任制限に触れます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。CがB側の代理人として同一筆界特定事件に関与した以上、辞任後にBの同意を得ても相手方A側に回って同一事件のADR代理を受任することはできません。利益相反・秘密保持を防ぐための法定制限です。","corrected":"","inferredBasis":[]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"statuteRef":236},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":127,"year":13,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士が行う業務に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。なお，民間紛争解決手続代理関係業務については，土地家屋調査士法第３条第２項に規定する土地家屋調査士が弁護士と共同で受任するものとする。","choices":["甲土地の登記名義人Ａが申請する筆界特定の代理業務を受任している土地家屋調査士Ｂは，当該筆界特定の事件に係る関係土地の登記名義人ＣからＤを相手方とする民間紛争解決手続の代理業務を依頼された場合，これを受任することができる。","過去にＡからの依頼により建物の滅失の登記の申請手続を受任したことのある土地家屋調査士Ｂは，Ａを相手方とする民間紛争解決手続の代理業務をＣから依頼された場合，これを受任することはできない。","土地家屋調査士Ａは，かつて土地家屋調査士法人Ｂの社員であった期間内にＢが受任していた筆界特定の代理業務に関与していた場合において，Ｂを退社した後に当該筆界特定の代理業務の相手方から建物の表題の登記の申請手続を依頼されたときは，これを受任することはできない。","Ａを相手方とする甲土地に係る民間紛争解決手続の代理業務をＢから受任している土地家屋調査士Ｃは，Ｄを相手方とする乙土地に係る筆界特定の代理業務の依頼をＡから受けた場合，当該筆界特定の代理業務を受任することについてＢから同意を得たとしても，これを受任することはできない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。BがAから受任している筆界特定事件と、Cから依頼されたDを相手方とするADR事件が別事件であり、Cは筆界特定事件の関係土地所有者にすぎません。この事情だけで直ちに法定の受任禁止にはなりません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。過去にAから建物滅失登記という表示登記業務を受任した事実だけで、後にAを相手方とする別のADR事件をCから受任することが一律に禁止されるわけではありません。過去事件との同一性・関連性を確認します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法人B在籍中にA自身が筆界特定代理事件に関与していたとしても、退社後、相手方から依頼された業務が別種の建物表題登記である場合まで一律に受任禁止とはされません。法定の禁止業務類型・事件同一性によります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。CがBからAを相手方とする甲土地ADR事件を受任中でも、Aから受任する乙土地の筆界特定代理が別事件であり、かつBの同意を得ている場合にまで絶対的に禁止されるとは限りません。『同意があっても必ず不可』という断定が誤りです。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":128,"year":12,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"代理","prompt":"土地家屋調査士法第３条第２項に規定する土地家屋調査士（以下「認定調査士」という。）の業務に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。なお，民間紛争解決手続代理関係業務については，弁護士と共同で受任するものとする。","choices":["Ｇから筆界特定手続書類作成業務を受任したことがある認定調査士は，Ｇを相手方とする民間紛争解決手続代理関係業務を受任することができない。","民間紛争解決手続代理関係業務を認定調査士が受任した後に，その依頼者が死亡した場合，その時点で認定調査士の代理権は消滅する。","ＡからＢを相手方とする民間紛争解決手続代理関係業務を受任している土地家屋調査士法人の使用人である認定調査士Ｃは，自らその事件に関与している場合であっても，Ａの同意なくＢから他の民間紛争解決手続代理関係業務の依頼を受けることができる。","認定調査士Ｄは，ＥからＦを相手方とする民間紛争解決手続代理関係業務を受任していたが，その手続の途中でＥから解任された。その後，Ｆから同じ手続の代理業務を依頼された場合，ＤはＦの依頼を受けることができる。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。過去にGから筆界特定手続の書類作成業務を受任しただけで、後にGを相手方とする別のADR事件を当然に受任できなくなるわけではありません。事件の同一性・関連性や法定受任制限を確認します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。代理権は原則として本人の死亡により消滅します。ADR代理業務を受任中に依頼者本人が死亡した場合、代理権はその時点で消滅し、相続人との新たな委任関係等が必要になります。","corrected":"","inferredBasis":["民法882条"]},{"mark":"×","explanation":"誤り。同一法人がAからBを相手方とするADR事件を受任し、使用人C自身がその事件に関与しているのに、Aの同意なくBから別のADR代理を受任することは利益相反・受任制限に反します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。Dは同一事件でE側の代理人として関与していたため、途中で解任されても相手方F側へ回って同一手続を受任することはできません。過去の依頼者の秘密・利益を保護するための受任制限です。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"statuteRef":77},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":129,"year":11,"sourceQuestion":15,"category":"土地家屋調査士法・ADR","theme":"土地家屋調査士","prompt":"土地家屋調査士法第３条第２項に規定する土地家屋調査士（以下「認定調査士」という。）の業務に関する以下の記述のうち，誤っているものを１つ選びなさい。","choices":["民間紛争解決手続代理関係業務を行うことを目的とする土地家屋調査士法人は，主たる事務所及び従たる事務所のすべてに，認定調査士を置かなければならない。","認定調査士は，民間紛争解決手続代理関係業務を弁護士と共同で受任した場合には，当該弁護士との協議による内容について，当該民間紛争解決手続の期日において，単独で代理人として意見を述べることができる。","認定調査士は，民事調停委員として取り扱った事件については，その業務を行ってはならない。","認定調査士は，民間紛争解決手続代理関係業務の依頼があった場合において，その依頼を承諾しないときは，速やかに，その旨を依頼者に通知しなければならない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。ADR代理業務を目的とする土地家屋調査士法人について、すべての事務所に認定調査士を『置くだけ』で足りるという単純な規定ではなく、当該業務を扱う事務所ごとの社員資格・常駐等の法定要件があります。本肢は配置要件の表現が不正確です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。弁護士との共同受任後、共同受任弁護士と協議した内容の範囲内であれば、認定調査士がADR期日に単独で代理人として意見を述べることができます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民事調停委員として取り扱った事件について、その後認定調査士として一方当事者のADR代理業務を行うことは、公正性・利益相反の観点から禁止されます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。ADR代理業務の依頼を承諾しない場合、依頼者が速やかに他の専門家を探せるよう、認定調査士は速やかに不受任の旨を通知する必要があります。","corrected":"","inferredBasis":[]}],"references":["土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":236},{"learningNote":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteRef":238}]},{"id":130,"year":20,"sourceQuestion":14,"category":"民法その他","theme":"裁判","prompt":"次の１から４までの記述のうち、甲土地の明渡請求訴訟を裁判によらないで完結させるものを1つ選びなさい。","choices":["被告が甲土地を占有していないことが、受訴裁判所に判明したとき。","原告が裁判外で訴えの取下げの意思を示して、被告がこれに同意したとき。","原告が、口頭弁論の期日において請求を放棄したとき。","原告の死亡が受訴裁判所に判明したとき。"],"answer":3,"details":[{"mark":"×","explanation":"不適切。被告が占有していないことが判明しても、裁判所が請求棄却等の裁判をして訴訟を終結させる問題です。『裁判によらない完結』ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"不適切。訴えの取下げは裁判外の意思表示だけでは効力を生じません。訴訟手続上、裁判所に対して適法な方式で取下げを行う必要があります。","corrected":"","inferredBasis":["民事訴訟法261条"]},{"mark":"○","explanation":"正しい。請求の放棄は、原告が自ら請求に理由がないことを認める訴訟行為で、口頭弁論等の期日に調書へ記載されると確定判決と同一の効力を有し、裁判所の本案判決を要せず訴訟が終了します。","corrected":"","inferredBasis":["民事訴訟法267条"]},{"mark":"×","explanation":"不適切。原告が死亡した場合、原則として相続人等による訴訟受継まで手続が中断するだけで、訴訟が当然に完結するわけではありません。","corrected":"","inferredBasis":["民法882条"]}],"references":["民事訴訟法4条1項（普通裁判籍・学習用抜粋）訴えは、被告の普通裁判籍の所在地を管轄する裁判所の管轄に属する。","民事訴訟法5条（特別裁判籍・学習用抜粋）財産権上の訴え、事務所又は営業所に関する訴え、不法行為に関する訴え、不動産に関する訴え等について、法定の土地の裁判所にも提起することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":216},{"statuteRef":217},{"learningNote":"","statuteRef":239},{"learningNote":"民事訴訟法267条和解又は請求の放棄若しくは認諾を調書に記載したときは、その記載は、確定判決と同一の効力を有する。","statuteRef":240},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":131,"year":18,"sourceQuestion":2,"category":"民法その他","theme":"裁判","prompt":"裁判に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["裁判官の罷免の裁判は、国会が設ける弾劾裁判所が行う。","行政機関は、終審として裁判を行うことができない。","裁判の判決は、公開の法廷で行わなければならない。","下級裁判所の裁判官は、憲法及び法律並びに最高裁判所の先例に拘束される。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。憲法64条により、国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設けます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法76条2項により、行政機関は終審として裁判を行うことができません。行政審判等が認められても、最終的に司法審査の道が確保される必要があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法82条1項は裁判の対審及び判決を公開法廷で行うことを原則とし、判決は非公開にできません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『最高裁判所の先例に拘束される』という部分が誤りです。憲法76条3項は裁判官がその良心に従い独立して職権を行い、憲法及び法律にのみ拘束されると定めています。最高裁判例は実務上重要ですが、憲法上の拘束対象として列挙されていません。","corrected":"","inferredBasis":[]}],"references":["憲法76条2項特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行うことができない。","憲法82条1項裁判の対審及び判決は、公開法廷でこれを行う。","憲法64条（解説中参照・条文要旨） 憲法64条により、国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設けます。"],"oldLawNote":"","referenceItems":[{"statuteRef":241},{"statuteRef":242},{"learningNote":"憲法64条により、国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設けます。","statuteRef":42},{"learningNote":"憲法76条3項は裁判官がその良心に従い独立して職権を行い、憲法及び法律にのみ拘束されると定めています。","statuteRef":243}]},{"id":132,"year":18,"sourceQuestion":13,"category":"民法その他","theme":"裁判","prompt":"裁判所の管轄に関する次の１から４までの記述のうち、正しいものを1つ選びなさい。","choices":["日本国内に主たる事務所を有する外国の会社に対する訴えは、その主たる事務所の所在地を管轄する裁判所に提起することができる。","Ａ市に所在する土地に関し、Ｂ市に住所を持つ被告に対して提起する訴えは、Ａ市を管轄する裁判所に提起しなければならない。","裁判所は、管轄に関する事項について、職権で証拠調べをすることができない。","登記又は登録に関する訴えは、登記又は登録をすべき地を管轄する裁判所に提起しなければならない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。外国会社でも日本国内に主たる事務所・営業所がある場合、その所在地に普通裁判籍が認められ、そこを管轄する裁判所へ訴えを提起できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不動産に関する訴えは不動産所在地にも提起できますが、常にそこへ『提起しなければならない』専属管轄ではありません。被告の普通裁判籍等が認められる場合があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。裁判所は管轄の有無を判断するため、管轄に関する事項について職権で証拠調べをすることができます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。登記・登録に関する訴えには登記地等の特別裁判籍が認められますが、必ずその裁判所へ提起しなければならない専属管轄とは限りません。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法4条1項（普通裁判籍・学習用抜粋）訴えは、被告の普通裁判籍の所在地を管轄する裁判所の管轄に属する。","民事訴訟法5条（特別裁判籍・学習用抜粋）財産権上の訴え、事務所又は営業所に関する訴え、不法行為に関する訴え、不動産に関する訴え等について、法定の土地の裁判所にも提起することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":216},{"statuteRef":217}]},{"id":133,"year":11,"sourceQuestion":13,"category":"民法その他","theme":"裁判","prompt":"訴訟における裁判所の管轄に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["不法行為に関する訴えは，不法行為があった地を管轄する裁判所に提起することができる。","地方裁判所は，価額が１４０万円以下の不動産に関する訴訟について，第１審の裁判権を有する。","離婚の訴えは，家庭裁判所に提起しなければならない。","不動産に関する訴えは，不動産の所在地を管轄する裁判所に提起しなければならない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。不法行為に関する訴えは、不法行為があった地に特別裁判籍が認められ、その所在地を管轄する裁判所へ提起できます。","corrected":"","inferredBasis":["民法709条"]},{"mark":"○","explanation":"正しい。簡易裁判所が第一審管轄を有する民事事件は原則として訴額140万円以下ですが、不動産に関する訴えについては地方裁判所にも競合的管轄が認められます。したがって地方裁判所も第一審裁判権を有します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。離婚訴訟は人事訴訟法に基づき家庭裁判所の専属管轄に属します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不動産に関する訴えは不動産所在地の裁判所にも提起できますが、そこだけが必ず専属管轄となるわけではありません。被告住所地など他の管轄が認められる場合があります。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法4条1項（普通裁判籍・学習用抜粋）訴えは、被告の普通裁判籍の所在地を管轄する裁判所の管轄に属する。","民事訴訟法5条（特別裁判籍・学習用抜粋）財産権上の訴え、事務所又は営業所に関する訴え、不法行為に関する訴え、不動産に関する訴え等について、法定の土地の裁判所にも提起することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":216},{"statuteRef":217},{"learningNote":"民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","statuteRef":111}]},{"id":134,"year":15,"sourceQuestion":10,"category":"民法その他","theme":"売主の担保責任に関する次","prompt":"売主の担保責任に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["売買契約において，売主が担保の責任を負わない旨の特約をした場合であっても，売主は，知りながら告げなかった事実については，その責任を免れることができない。","引き渡された売買の目的物が種類，品質又は数量に関して契約の内容に適合しない場合であっても，その不適合が買主の責めに帰すべき事由によるものであるときは，買主は，売主に対し，目的物の修補，代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができない。","引き渡された目的物が売買契約で定められた数量に不足していた場合，買主は，売主に対し，代金の減額を請求することはできるが，債務不履行に基づく損害賠償を請求することはできない。","売買の目的物である土地の一部が売主以外の者の所有であり，売主がこれを買主に移転することができない場合は，買主は，売買契約締結時に当該土地の一部が売主の所有に属さないことを知っていたときであっても，売主に対し，その不足する部分の割合に応じて代金の減額を請求することができる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。売主が担保責任を負わない特約をしても、売主が不適合等を知りながら買主に告げなかった事実については免責されません。","corrected":"","inferredBasis":["民法572条"]},{"mark":"○","explanation":"正しい。契約不適合が買主の責めに帰すべき事由による場合、買主は売主に履行の追完を請求できません（民法562条2項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。数量不足という契約不適合があれば、代金減額請求だけでなく、売主に帰責事由がある場合には債務不履行に基づく損害賠償請求も可能です。『損害賠償はできない』が誤りです。","corrected":"","inferredBasis":["民法562条","民法563条"]},{"mark":"○","explanation":"正しい。売買目的物の一部が他人所有で売主が移転できない場合、買主がその事情を知っていたとしても、現行の契約不適合責任の枠組みでは一定の代金減額等を請求し得ます。ただし買主の認識・契約内容により要件を具体的に検討します。","corrected":"","inferredBasis":["民法562条","民法563条"]}],"references":["民法562条1項（履行の追完請求・学習用抜粋）引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないときは、買主は修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。","民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。","民法572条売主は、担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実等については、その責任を免れることができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":163},{"statuteRef":121},{"statuteRef":244},{"learningNote":"契約不適合が買主の責めに帰すべき事由による場合、買主は売主に履行の追完を請求できません（民法562条2項）。","statuteRef":245}]},{"id":135,"year":12,"sourceQuestion":9,"category":"民法その他","theme":"売主の担保責任に関する次","prompt":"売主の担保責任に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["買主は，売買の目的物に隠れた瑕疵があっても，目的物が不動産であれば，当該売買契約を解除することができない。","売主が瑕疵担保責任を負う期間を短縮する特約は有効であるが，これを全部免除する特約を結ぶことはできない。","他人の所有する土地の売主は，売買契約自体が無効であるので，担保責任を負わない。","数量指示売買において数量が不足していた場合，買主は，売主に対して，代金の減額を請求することができる。"],"answer":4,"details":[{"mark":"×","explanation":"誤り（旧法の瑕疵担保責任）。不動産であっても、隠れた瑕疵により契約目的を達成できない場合には、旧民法下で買主は解除できました。現在は契約不適合責任として整理されます。","corrected":"","inferredBasis":["民法562条","民法563条"]},{"mark":"×","explanation":"誤り。売主の担保責任を全部免除する特約自体も原則として可能です。ただし売主が知りながら告げなかった事実等については免責されません。","corrected":"","inferredBasis":["民法572条"]},{"mark":"×","explanation":"誤り。他人物売買も有効です。売主は他人の権利を取得して買主へ移転する義務を負い、履行できなければ担保責任・債務不履行責任が問題となります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい（旧法の数量指示売買）。数量を基礎として代金額を定めた売買で数量不足があれば、買主は不足割合に応じた代金減額を請求できました。現行法では数量に関する契約不適合として民法562条以下で整理します。現行法メモ・2020年改正後は、旧来の瑕疵担保責任は契約不適合責任の体系に改められています。","corrected":"","inferredBasis":[]}],"references":["民法562条1項（履行の追完請求・学習用抜粋）引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないときは、買主は修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。","民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。","民法572条売主は、担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実等については、その責任を免れることができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":163},{"statuteRef":121},{"statuteRef":244},{"learningNote":"現行法では数量に関する契約不適合として民法562条以下で整理します。","statuteRef":120}]},{"id":136,"year":17,"sourceQuestion":9,"category":"民法その他","theme":"利息及び利率に関する次の","prompt":"利息及び利率に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["債務者が貸金債務の履行を遅滞した場合、債権者は、法定利率又は約定利率により算定された額を超える損害が生じたことを証明しても、履行遅滞による損害賠償として、当該超過部分の損害の賠償を請求することができない。","金銭消費貸借契約において、利息につき法定利率を超える約定利率の定めがあるが、遅延損害金につき利率の定めがない場合、貸主は、履行を遅滞した借主に対して、法定利率の割合を超える遅延損害金の支払を求めることはできない。","利息の支払が１年分以上延滞した場合において、債権者が催告をしても債務者がその利息を支払わないときは、債権者は、延滞した利息を元本に組み入れることができる。","利息を生ずべき債権について別段の意思表示がないときは、その利率は、その利息が生じた最初の時点における法定利率による。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。金銭債務の履行遅滞による損害賠償は、原則として法定利率又は約定利率によって定型的に算定され、債権者がそれを超える実損を立証しても超過損害を請求できないという特則があります（民法419条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。元本について法定利率を超える約定利率が定められている場合、遅延損害金の率を別に定めていなくても、その約定利率が法定利率を超えるなら原則として約定利率によって遅延損害金を算定します。『法定利率を超えて請求できない』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。利息の支払が1年分以上延滞し、債権者が催告しても支払わない場合、民法405条により延滞利息を元本に組み入れることができます（法定重利）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。利息を生ずべき債権について別段の意思表示がなければ、その利率は利息が生じた最初の時点における法定利率によります（民法404条）。","corrected":"","inferredBasis":[]}],"references":["民法436条（連帯債務者に対する履行請求・学習用抜粋）債務の目的がその性質上可分である場合でも、法令又は当事者の意思表示により数人が連帯して債務を負担するときは、債権者は連帯債務者の一人又は数人に全部又は一部の履行を請求できる。","民法419条（解説中参照・条文要旨） 金銭債務の履行遅滞による損害賠償は、原則として法定利率又は約定利率によって定型的に算定され、債権者がそれを超える実損を立証しても超過損害を請求できないという特則があります（民法419条）。","民法405条（解説中参照・条文要旨） 利息の支払が1年分以上延滞し、債権者が催告しても支払わない場合、民法405条により延滞利息を元本に組み入れることができます（法定重利）。","民法404条（解説中参照・条文要旨） 利息を生ずべき債権について別段の意思表示がなければ、その利率は利息が生じた最初の時点における法定利率によります（民法404条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":182},{"learningNote":"金銭債務の履行遅滞による損害賠償は、原則として法定利率又は約定利率によって定型的に算定され、債権者がそれを超える実損を立証しても超過損害を請求できないという特則があります（民法419条）。","statuteRef":246},{"learningNote":"利息の支払が1年分以上延滞し、債権者が催告しても支払わない場合、民法405条により延滞利息を元本に組み入れることができます（法定重利）。","statuteRef":247},{"learningNote":"利息を生ずべき債権について別段の意思表示がなければ、その利率は利息が生じた最初の時点における法定利率によります（民法404条）。","statuteRef":248}]},{"id":137,"year":14,"sourceQuestion":14,"category":"民法その他","theme":"口頭弁論に関する諸原則に","prompt":"口頭弁論に関する諸原則に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["攻撃防御方法は訴訟の進行状況に応じ適切な時期に提出しなければならないとされる適時提出主義の下でも，適切な時期に提出されなかった攻撃防御方法が常に却下されるわけではない。","民事訴訟法は口頭主義の原則を採用しているが，訴えの提起は審理の基礎となる重要な訴訟行為であるため，原則として訴状によらなければならない。","弁論や証拠調べは判決をする裁判官によって行わなければならず，裁判官が代わった場合には，当事者は従前の口頭弁論の結果を陳述しなければならない。","公開主義は憲法上の要請であるから，弁論準備手続は，公開された法廷において行わなければならない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。適時提出主義の下でも、適切な時期を逸した攻撃防御方法が直ちに常に却下されるわけではありません。故意又は重大な過失による時機後れで訴訟完結を遅延させると認められる場合などに却下されます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。口頭弁論では口頭主義が基本ですが、訴えの提起は原則として訴状を裁判所に提出して行います（民事訴訟法133条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。直接主義の要請から、判決をする裁判官が弁論・証拠調べに関与するのが原則です。裁判官が交代した場合、当事者は従前の口頭弁論の結果を陳述します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『弁論準備手続は公開法廷で行わなければならない』という部分が誤りです。弁論準備手続は争点・証拠整理のための手続で、公開法廷で行う通常の口頭弁論とは異なります。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法133条1項訴えの提起は、訴状を裁判所に提出してしなければならない。","民事訴訟法157条1項（時機に後れた攻撃防御方法の却下・学習用抜粋）当事者が故意又は重大な過失により時機に後れて提出した攻撃又は防御の方法について、訴訟の完結を遅延させると認めたときは、裁判所は申立て又は職権で却下できる。"],"oldLawNote":"","referenceItems":[{"statuteRef":234},{"statuteRef":249},{"learningNote":"口頭弁論では口頭主義が基本ですが、訴えの提起は原則として訴状を裁判所に提出して行います（民事訴訟法133条）。","statuteRef":250}]},{"id":138,"year":16,"sourceQuestion":11,"category":"民法その他","theme":"土地の工作物等に関する責","prompt":"土地の工作物等に関する責任についての次の１から４までの記述のうち、誤っているものを１つ選びなさい。かし","choices":["土地の工作物の設置又は保存の瑕疵とは、工作物が備えるべき通常の安全性を欠く状態をいう。かし","土地の工作物の設置又は保存に瑕疵があったことによって他人に損害を生じさせた場合、その占有者及び所有者が損害の発生を防止するのに必要な注意をしたときは、占有者及び所有者は、いずれも損害賠償責任を免れる。","土地の工作物の設置又は保存に瑕疵があったことによって他人に損害が生じた場合、その他人に損害賠償をした占有者又は所有者は、損害の原因について他にその責任を負う者があるときは、その者に対して求償権を行使することができる。かし","竹木の栽植又は支持に瑕疵があることによって他人に損害を生じた場合、その占有者が損害の発生を防止するのに必要な注意をしたときは、占有者は、損害賠償責任を免れる。かし"],"answer":2,"details":[{"mark":"○","explanation":"正しい。工作物の『設置又は保存の瑕疵』とは、その工作物が通常備えるべき安全性を欠いている状態をいいます。用途・場所・利用状況等を踏まえて客観的に判断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。占有者が必要な注意を尽くせば占有者は免責されますが、その場合は所有者が無過失責任を負います（民法717条1項ただし書）。『占有者も所有者も両方免責』となる点が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法717条3項により、損害を賠償した占有者又は所有者は、損害原因について他に責任を負う者がいる場合、その者に求償できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。竹木の栽植又は支持の瑕疵にも工作物責任の規定が準用されます。占有者が損害防止に必要な注意を尽くした場合、占有者自身は免責されます。","corrected":"","inferredBasis":[]}],"references":["民法717条1項土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。"],"oldLawNote":"","referenceItems":[{"statuteRef":192},{"learningNote":"民法717条3項により、損害を賠償した占有者又は所有者は、損害原因について他に責任を負う者がいる場合、その者に求償できます。","statuteRef":199}]},{"id":139,"year":17,"sourceQuestion":8,"category":"民法その他","theme":"地上権に関する次の１から","prompt":"地上権に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["無償の地上権を設定することはできない。","上下の範囲を定めて、地下を地上権の目的とすることができる。","法定地上権を取得した者は、土地の所有者に対して、地代を支払う義務を負わない。","地上権は、抵当権の目的とすることができない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。地上権は有償である必要はなく、無償で設定することもできます。地代は地上権の成立要件ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法269条の2により、地下又は空間について上下の範囲を定めて区分地上権を設定することができます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法定地上権が成立しても、土地利用が無償になるわけではありません。地代について当事者の協議が調わなければ裁判所が定めます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。地上権は譲渡可能な物権であり、抵当権の目的とすることもできます（民法369条2項）。","corrected":"","inferredBasis":[]}],"references":["民法604条（賃貸借の存続期間・学習用抜粋）賃貸借の存続期間は、五十年を超えることができない。これより長い期間を定めたときは、その期間は五十年とする。","民法269条（解説中参照・条文要旨） 民法269条の2により、地下又は空間について上下の範囲を定めて区分地上権を設定することができます。","民法369条第2項（解説中参照・条文要旨） 地上権は譲渡可能な物権であり、抵当権の目的とすることもできます（民法369条2項）。"],"oldLawNote":"","referenceItems":[{"statuteRef":251},{"learningNote":"民法269条の2により、地下又は空間について上下の範囲を定めて区分地上権を設定することができます。","statuteRef":252},{"learningNote":"地上権は譲渡可能な物権であり、抵当権の目的とすることもできます（民法369条2項）。","statuteRef":253}]},{"id":140,"year":13,"sourceQuestion":9,"category":"民法その他","theme":"地上権及び土地の賃借権に","prompt":"地上権及び土地の賃借権に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["地上権と土地の賃借権は，いずれも抵当権の目的とすることができる。","土地所有者は，地上権者に対し，土地を使用に適する状態にする義務を負わないが，賃貸人は，賃借人に対し，土地を使用に適する状態にする義務を負う。","地上権者は，土地所有者の承諾を得ることなく地上権を第三者に譲渡することができるが，建物の所有を目的とする土地の賃借人は，賃貸人の承諾又はそれに代わる裁判所の許可を得なければ，土地の賃借権を譲渡することができない。","建物の所有を目的とする土地の地上権又は土地の賃借権は，その登記がなくても，土地の上に当該権利者が登記されている建物を所有するときは，これをもって第三者に対抗することができる。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。地上権は抵当権の目的にできますが、土地賃借権は債権であり、民法上当然に抵当権の目的とすることはできません。『いずれも』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。地上権設定者には賃貸人のような修繕・使用収益可能状態維持義務は原則ありませんが、賃貸人は賃借人に使用収益させる義務を負います。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。地上権は土地所有者の承諾なく譲渡できますが、土地賃借権の譲渡には原則として賃貸人の承諾が必要で、建物所有目的借地権には裁判所の許可制度があります。","corrected":"","inferredBasis":["民法612条"]},{"mark":"○","explanation":"正しい。建物所有目的の地上権・土地賃借権は、借地権者が土地上に自己名義の登記建物を所有すれば、借地権自体の登記がなくても第三者に対抗できます。","corrected":"","inferredBasis":[]}],"references":["民法605条不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。","民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","借地借家法10条1項借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","借地借家法19条1項（学習用抜粋）借地権者が賃借権の目的である土地上の建物を第三者に譲渡する場合、賃貸人が賃借権の譲渡を承諾しないときは、裁判所は一定の要件の下で賃貸人の承諾に代わる許可を与えることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":254},{"statuteRef":140},{"statuteRef":255},{"statuteRef":256}]},{"id":141,"year":20,"sourceQuestion":8,"category":"民法その他","theme":"建物の所有を目的とする地","prompt":"建物の所有を目的とする地上権及び土地の賃借権に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["地上権者は、土地所有者の承諾を得ることなく地上権を第三者に譲渡することができるが、賃借人は、賃貸人の承諾又はそれに代わる裁判所の許可を得なければ、賃借権を譲渡することができない。","土地所有者は、地上権者に対して土地を使用に適する状態にする義務を負わないが、賃貸人は、賃借人に対して土地を使用に適する状態にする義務を負う。","地上権と賃借権は、いずれも、その登記がなくても、当該権利者がその土地の上に登記されている建物を所有するときは、これをもって第三者に対抗することができる。","地上権と賃借権は、いずれも抵当権の目的とすることができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。地上権は物権なので原則として土地所有者の承諾なく譲渡できます。一方、賃借権の譲渡・転貸は原則として賃貸人の承諾を要し、借地権では裁判所の許可制度があります。","corrected":"","inferredBasis":["民法612条","民法613条"]},{"mark":"○","explanation":"正しい。地上権設定者には賃貸人のような目的物使用収益に必要な修繕等の義務は原則ありません。賃貸人には賃借物を使用収益させる義務があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。建物所有目的の地上権・土地賃借権は、借地権者がその土地上に自己名義で登記された建物を所有するとき、借地借家法10条により土地権利自体の登記がなくても第三者に対抗できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。地上権は抵当権の目的にできますが、賃借権は債権であり、民法上の抵当権の目的として当然に設定できるものではありません。『いずれも抵当権の目的にできる』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法605条不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。","民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","借地借家法10条1項借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","借地借家法19条1項（学習用抜粋）借地権者が賃借権の目的である土地上の建物を第三者に譲渡する場合、賃貸人が賃借権の譲渡を承諾しないときは、裁判所は一定の要件の下で賃貸人の承諾に代わる許可を与えることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":254},{"statuteRef":140},{"statuteRef":255},{"statuteRef":256},{"learningNote":"建物所有目的の地上権・土地賃借権は、借地権者がその土地上に自己名義で登記された建物を所有するとき、借地借家法10条により土地権利自体の登記がなくても第三者に対抗できます。","statuteRef":125},{"learningNote":"民法613条（解説で参照する該当箇所・学習用要点） ただしAに対する責任は、原賃貸借・転貸借双方の賃料額等の範囲で調整されます（民法613条）。","statuteRef":148}]},{"id":142,"year":12,"sourceQuestion":8,"category":"民法その他","theme":"所有権の帰属に関する次の","prompt":"所有権の帰属に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["所有者を異にし，主従の区別のある２個の動産が付合した場合，従たる動産の所有者は，その付合の時における価額の割合に応じてその合成物の共有持分を取得する。","土地の賃借人が，当該土地賃貸借契約を債務不履行により解除された後にその土地に付合させた物は，当該土地賃借人の所有権に属する。","所有者のない財産の所有権は，動産については最初に所有の意思をもって占有した者に帰属し，不動産については国庫に帰属する。","他人の動産に工作を加えた者があるときの加工物の所有権は，民法の規定に従って帰属する者が定められ，加工前に所有者と加工者との間で民法の加工に関する規定と異なる合意をしても，その合意の効力は生じない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。主従の区別がある動産の付合では、原則として主たる動産の所有者が合成物の所有権を取得し、従たる動産所有者が当然に価額割合の共有持分を取得するわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。土地賃貸借解除後、賃借権原を失ってから付合させた物についても、付合の要件を満たせば土地所有権に帰属することがあります。元賃借人の所有に当然残るわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。所有者のない動産は所有の意思をもって占有した者が所有権を取得し（無主物先占）、所有者のない不動産は国庫に帰属します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。加工による所有権帰属の民法規定は任意規定であり、所有者と加工者があらかじめ異なる合意をすることまで禁止されていません。『合意の効力は生じない』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法239条（無主物の帰属・学習用抜粋）所有者のない動産は、所有の意思をもって占有することによって所有権を取得する。所有者のない不動産は、国庫に帰属する。","民法242条不動産の所有者は、その不動産に従として付合した物の所有権を取得する。ただし、権原によってその物を附属させた他人の権利を妨げない。","民法246条（加工・学習用抜粋）他人の動産に工作を加えた者があるときは、原則として加工物の所有権は材料の所有者に帰属するが、工作によって生じた価格が材料の価格を著しく超えるときは、加工者が所有権を取得する。"],"oldLawNote":"","referenceItems":[{"statuteRef":257},{"statuteRef":258},{"statuteRef":259}]},{"id":143,"year":13,"sourceQuestion":11,"category":"民法その他","theme":"敷金に関する次の１から４","prompt":"敷金に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["賃貸借契約の目的建物の譲受人が賃貸人たる地位を承継した場合，旧賃貸人に対し差し入れられた敷金は，賃借人の旧賃貸人に対する未払賃料債務があればその弁済としてこれに当然充当され，残額についてのみ，その権利義務関係が新賃貸人に承継される。","土地の賃貸借契約において，目的土地上の建物の所有権が土地賃借権とともに譲渡され，その土地賃借権の譲渡について賃貸人が承諾したことにより旧賃借人が賃貸借関係から離脱した場合，旧賃借人が差し入れた敷金についての権利義務関係は，土地賃借権とともに当然に新賃借人に移転する。","敷金は賃貸借契約終了後目的物の明渡義務履行までに生じる損害金その他賃貸借契約関係により賃貸人が賃借人に対し取得する一切の債権を担保するものであるから，その返還請求権は，目的物の明渡し完了の時にそれまで生じた被担保債権を控除し，なお残額がある場合にその残額について発生する。","建物賃貸借契約終了に伴う賃借人の建物明渡債務と賃貸人の敷金返還債務とは，特別の約定のない限り，同時履行の関係には立たず，賃貸人は，賃借人から建物の明渡しを受けた後に敷金の残額を返還すれば足りる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。賃貸不動産の譲渡により賃貸人たる地位が移転するとき、旧賃貸人に差し入れられた敷金は、旧賃貸人に対する未払債務を控除した残額について新賃貸人に承継されます。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"×","explanation":"誤り。賃借権譲渡について賃貸人が承諾し旧賃借人が関係から離脱しても、旧賃借人が差し入れた敷金関係が賃借権とともに当然に新賃借人へ移転するわけではありません。敷金返還請求権の帰属には別途合意等が必要です。","corrected":"","inferredBasis":["民法612条","民法622条の2"]},{"mark":"○","explanation":"正しい。敷金は賃貸借終了後、明渡しまでに生じた賃料・損害金等一切の債務を担保し、明渡し時にそれらを控除して残額があれば返還請求権が具体化します。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"○","explanation":"正しい。建物明渡債務が先履行で、敷金返還債務とは原則として同時履行関係に立ちません。賃貸人は明渡しを受けた後に清算して残額を返還します。","corrected":"","inferredBasis":["民法622条の2"]}],"references":["民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。"],"oldLawNote":"","referenceItems":[{"statuteRef":260},{"learningNote":"民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。","statuteRef":261},{"learningNote":"民法612条（解説で参照する該当箇所・学習用要点） 賃借権の譲渡・転貸には原則として賃貸人の承諾が必要です（民法612条）。","statuteRef":147}]},{"id":144,"year":13,"sourceQuestion":5,"category":"民法その他","theme":"条件が付された法律行為に","prompt":"条件が付された法律行為に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["Ａが，Ｂとの間で，「私の気が向いたら宝石を贈与する。」という条件を付した贈与契約を締結した場合，この契約は無効となる。","条件が成就することによって不利益を受ける当事者が故意にその条件の成就を妨げたときは，相手方は，その条件が成就したものとみなすことができる。","条件付法律行為の各当事者は，条件の成否が未定である間は，その権利義務を処分することができない。","条件が成就しないことが法律行為の時に既に確定していた場合において，その条件が停止条件であるときは，その法律行為は無効となる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。『私の気が向いたら』という純粋随意条件は、債務者の意思のみに係る停止条件であり、その法律行為は無効となります（民法134条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。条件成就で不利益を受ける当事者が故意に成就を妨げたとき、相手方は条件が成就したものとみなすことができます（民法130条1項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。条件成否未定中の権利義務（期待権）も、一般規定に従い処分・相続・保存等の対象となり得ます（民法129条）。『処分できない』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。法律行為時に条件不成就が確定している不能の停止条件を付した法律行為は無効となります。","corrected":"","inferredBasis":[]}],"references":["民法127条（条件が成就した場合の効果・学習用抜粋）停止条件付法律行為は停止条件が成就した時からその効力を生じ、解除条件付法律行為は解除条件が成就した時からその効力を失う。","民法130条（条件成就の妨害等・学習用抜粋）条件の成就によって不利益を受ける当事者が故意に条件成就を妨げたときは、相手方は条件が成就したものとみなすことができる。","民法134条（解説中参照・条文要旨） 『私の気が向いたら』という純粋随意条件は、債務者の意思のみに係る停止条件であり、その法律行為は無効となります（民法134条）。","民法129条（解説中参照・条文要旨） 条件成否未定中の権利義務（期待権）も、一般規定に従い処分・相続・保存等の対象となり得ます（民法129条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":262},{"statuteRef":263},{"learningNote":"『私の気が向いたら』という純粋随意条件は、債務者の意思のみに係る停止条件であり、その法律行為は無効となります（民法134条）。","statuteRef":264},{"learningNote":"条件成否未定中の権利義務（期待権）も、一般規定に従い処分・相続・保存等の対象となり得ます（民法129条）。","statuteRef":265},{"learningNote":"条件成就で不利益を受ける当事者が故意に成就を妨げたとき、相手方は条件が成就したものとみなすことができます（民法130条1項）。","statuteRef":266}]},{"id":145,"year":11,"sourceQuestion":1,"category":"民法その他","theme":"法律の制定手続に関する次","prompt":"法律の制定手続に関する次の１から４までの記述のうち，正しいものを一つ選びなさい。","choices":["衆議院で可決し，参議院でこれと異なった議決をした法律案は，衆議院で総議員の過半数で再び可決したときは，法律となる。","法律の公布は，天皇が内閣の助言と承認により行う。","参議院が，衆議院の可決した法律案を受け取った後，国会休会中の期間を除いて６０日以内に議決しないときは，衆議院は，参議院がその法律案を可決したものとみなすことができる。","法律案は，さきに衆議院に提出しなければならない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。法律案について衆議院の再議決で法律とするには、出席議員の3分の2以上の多数が必要です（憲法59条2項）。『総議員の過半数』ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法7条1号により、天皇は内閣の助言と承認により法律を公布します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。参議院が衆議院の可決した法律案を受け取った後60日以内に議決しない場合、衆議院は参議院がその法律案を『否決した』ものとみなすことができます。『可決したものとみなす』ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。法律案には予算のような衆議院先議の原則はありません。法律案は衆議院・参議院のいずれにも先に提出できます。","corrected":"","inferredBasis":[]}],"references":["憲法59条2項衆議院で可決し、参議院でこれと異なった議決をした法律案は、衆議院で出席議員の三分の二以上の多数で再び可決したときは、法律となる。","憲法7条（解説中参照・条文要旨） 憲法7条1号により、天皇は内閣の助言と承認により法律を公布します。"],"oldLawNote":"","referenceItems":[{"statuteRef":267},{"learningNote":"憲法7条1号により、天皇は内閣の助言と承認により法律を公布します。","statuteRef":28}]},{"id":146,"year":19,"sourceQuestion":8,"category":"民法その他","theme":"用益物権に関する次の１か","prompt":"用益物権に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["地役権は、要役地の所有権から独立して譲り渡すことができる。","地上権は、その存続期間を定めずに設定することができる。","地役権は、時効によって取得することができない。","地上権者がその地上権の目的である土地上の工作物の所有権を第三者に移転したときであっても、当事者間に別段の合意がない限り、地上権は移転しない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。地役権は要役地の便益のために存在する従たる権利であり、原則として要役地の所有権から切り離して単独で譲渡できません。要役地の所有権とともに移転します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。地上権は存続期間を定めずに設定することが可能です。その場合の存続関係・消滅請求等は民法の規定に従います。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。継続的に行使され、かつ外形上認識できる地役権は、民法283条により時効取得することができます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。地上権者が地上建物等の所有権を第三者へ譲渡した場合、特段の事情がなければ建物所有に必要な地上権もこれに伴って移転すると解されます。『別段の合意がなければ移転しない』が逆です。","corrected":"","inferredBasis":[]}],"references":["民法604条（賃貸借の存続期間・学習用抜粋）賃貸借の存続期間は、五十年を超えることができない。これより長い期間を定めたときは、その期間は五十年とする。","民法283条（解説中参照・条文要旨） 継続的に行使され、かつ外形上認識できる地役権は、民法283条により時効取得することができます。"],"oldLawNote":"","referenceItems":[{"statuteRef":251},{"learningNote":"継続的に行使され、かつ外形上認識できる地役権は、民法283条により時効取得することができます。","statuteRef":107}]},{"id":147,"year":19,"sourceQuestion":13,"category":"民法その他","theme":"確定判決の効力に関する次","prompt":"確定判決の効力に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["所有権の確認請求を棄却する判決には、既判力も執行力も生じない。","所有権の確認請求を認容する判決には、既判力が生じるが、執行力は生じない。","金銭支払の給付請求を認容する判決には、既判力と執行力が生じる。","金銭支払の給付請求を棄却する判決には、既判力が生じるが、執行力は生じない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。所有権確認請求を棄却する判決にも、請求した所有権が存在しないとの判断について既判力が生じます。確認判決なので執行力はありませんが、『既判力も生じない』が誤りです。","corrected":"","inferredBasis":["民事訴訟法114条","民事訴訟法115条"]},{"mark":"○","explanation":"正しい。所有権確認請求の認容判決は権利関係の存在を確定する確認判決なので既判力は生じますが、給付を命じるものではないため執行力は生じません。","corrected":"","inferredBasis":["民事訴訟法114条","民事訴訟法115条"]},{"mark":"○","explanation":"正しい。金銭支払を命ずる給付判決が確定すれば、請求権の存否について既判力が生じ、強制執行の債務名義として執行力も生じます。","corrected":"","inferredBasis":["民事訴訟法114条","民事訴訟法115条"]},{"mark":"○","explanation":"正しい。金銭支払請求の棄却判決には請求権不存在について既判力が生じますが、被告に何ら給付を命じないため執行力は生じません。","corrected":"","inferredBasis":["民事訴訟法114条","民事訴訟法115条"]}],"references":["民事訴訟法114条1項確定判決は、主文に包含するものに限り、既判力を有する。","民事訴訟法115条1項（既判力等が及ぶ者の範囲・学習用抜粋）確定判決は、当事者、当事者が他人のために原告又は被告となった場合のその他人、口頭弁論終結後の承継人等に対して効力を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":268},{"statuteRef":269}]},{"id":148,"year":16,"sourceQuestion":10,"category":"民法その他","theme":"賃借権の対抗力に関する次","prompt":"賃借権の対抗力に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["建物の所有を目的とする土地の賃貸借において、賃借人は、その土地の上に建てた建物につき所有権の保存の登記をしたときは、その後に土地を譲り受け、その所有権の移転の登記を得た者に対して、その土地の賃借権を対抗することができる。","建物の賃借人が賃借物の引渡しを受けたときは、賃借人は、その後に賃借物の所有権を譲り受けた者に対して、その建物の賃借権を対抗することができる。","動産の賃借人が賃借物の引渡しを受けたときは、賃借人は、その後に賃借物の所有権を譲り受けた者に対して、その動産の賃借権を対抗することができる。","建物の所有を目的としない土地の賃貸借において、賃借人は、土地の賃借権の設定の登記をしたときは、その後に土地を譲り受け、その所有権の移転の登記を得た者に対して、その土地の賃借権を対抗することができる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。建物所有目的の土地賃借権は、土地賃借権の登記がなくても、借地人がその土地上の自己名義の登記建物を所有すれば借地借家法10条により第三者へ対抗できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。建物賃貸借は建物の引渡しが対抗要件となり、引渡しを受けた賃借人はその後の建物譲受人に賃借権を対抗できます（借地借家法31条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。動産賃借権には、不動産賃借権の登記や建物賃貸借の引渡しのような一般的な第三者対抗制度はありません。単に動産の引渡しを受けたからといって、その後の所有権取得者に賃借権を当然対抗できるわけではありません。","corrected":"","inferredBasis":["民法177条"]},{"mark":"○","explanation":"正しい。建物所有目的でない土地賃貸借でも、賃借権設定登記を備えれば民法605条により、その後の土地譲受人に賃借権を対抗できます。","corrected":"","inferredBasis":[]}],"references":["民法605条不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。","借地借家法10条1項借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","借地借家法31条1項建物の賃貸借は、その登記がなくても、建物の引渡しがあったときは、その後その建物について物権を取得した者に対し、その効力を生ずる。"],"oldLawNote":"","referenceItems":[{"statuteRef":254},{"statuteRef":255},{"statuteRef":270},{"learningNote":"建物所有目的の土地賃借権は、土地賃借権の登記がなくても、借地人がその土地上の自己名義の登記建物を所有すれば借地借家法10条により第三者へ対抗できます。","statuteRef":125},{"learningNote":"建物賃貸借は建物の引渡しが対抗要件となり、引渡しを受けた賃借人はその後の建物譲受人に賃借権を対抗できます（借地借家法31条）。","statuteRef":271},{"learningNote":"民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","statuteRef":104}]},{"id":149,"year":16,"sourceQuestion":6,"category":"民法その他","theme":"Ａが自己の所有する甲土地","prompt":"Ａが自己の所有する甲土地を売却した場合に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["Ａが甲土地をＢ、Ｃの順に二重に売却した場合、Ｃは、所有権の登記名義人であるＡに対して、所有権の移転の登記の手続を請求することができる。","Ａが甲土地をＢに譲渡して占有を移転した直後に、甲土地をＣにも譲渡して所有権の移転の登記をした場合、その後、取得時効に必要な期間占有を継続したＢは、登記がなくても、Ｃに対して甲土地の所有権の取得を主張することができる。","Ａが甲土地をＢに売却し、Ｂが甲土地をＣに売却した場合、Ｃは、登記がなくても、Ａに対して甲土地の所有権の取得を主張することができる。","Ａが甲土地をＢ、Ｃの順に二重に売却した場合、Ｂは、登記がなくても、Ｃに対して甲土地の所有権の取得を主張することができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。二重譲渡の後買主Cも、売主Aに対して売買契約に基づく所有権移転登記請求権を有します。Bとの優劣は登記の先後で決まりますが、Aに対する登記請求自体が消えるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。BがAから占有を取得後、Cが登記を取得しても、その後BがCとの関係で取得時効を完成すれば、Bは時効取得を登記なくCに対抗できるとする判例があります。時効完成後の第三者との関係とは区別します。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。A→B→Cという順次譲渡では、AはCに対して民法177条の第三者ではありません。Cは登記がなくてもAに所有権取得を主張できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。AからB・Cへの二重譲渡では、BとCは民法177条の対抗関係に立ちます。Bは登記を備えなければ、先に登記を備えたCに所有権取得を対抗できません。","corrected":"","inferredBasis":[]}],"references":["民法177条不動産に関する物権の得喪及び変更は、その登記をしなければ、第三者に対抗することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":124},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98}]},{"id":150,"year":20,"sourceQuestion":10,"category":"民法その他","theme":"ＡがＢに賃貸した甲建物を","prompt":"ＡがＢに賃貸した甲建物をＢがＣに転貸した場合に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["ＢがＡの承諾を得て甲建物をＣに転貸した場合、Ｃは、ＢのＡに対する賃料債務の範囲を限度として、Ａに対して転貸借に基づく賃料債務を直接履行する義務を負う。","ＢがＡの承諾を得て甲建物をＣに転貸した場合において、ＡがＢの賃料不払を理由にしてＡＢ間の賃貸借を解除し、Ｃに甲建物の明渡しを請求したときは、ＢＣ間の転貸借も終了する。","ＢがＡの承諾を得て甲建物をＣに転貸し、その後、ＡがＢとの間の賃貸借を合意により解除した場合、Ａは、その解除の当時、Ｂの債務不履行による解除権を有していたときであっても、その合意解除をもってＣに対抗することはできない。","ＢがＡの承諾を得ないで甲建物をＣに転貸した場合であっても、このＢの行為をＡに対する背信行為と認めるに足りない特段の事情があるときは、Ａは、Ｂとの間の賃貸借を解除することができない。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。適法な転貸では、転借人Cは賃貸人Aに対し、転貸借に基づく債務を直接履行する義務を負います。ただしAに対する責任は、原賃貸借・転貸借双方の賃料額等の範囲で調整されます（民法613条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。原賃貸借がBの債務不履行を理由に適法に解除されると、転借人Cは原則として賃貸人Aに転貸借を対抗できなくなり、Aから明渡しを求められます。","corrected":"","inferredBasis":["民法612条","民法613条"]},{"mark":"×","explanation":"誤り。原則として合意解除は適法な転借人Cに対抗できませんが、合意解除時にAがBの債務不履行による解除権を現に有していたなど、Cが保護されない事情がある場合には対抗できることがあります。『解除権を有していても対抗できない』が誤りです。","corrected":"","inferredBasis":["民法612条","民法613条"]},{"mark":"○","explanation":"正しい。無断転貸でも、賃貸人に対する背信行為と認めるに足りない特段の事情があれば、信頼関係破壊がないとして解除は認められません。","corrected":"","inferredBasis":["民法612条","民法613条"]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","民法613条1項（転貸の効果・学習用抜粋）適法な転貸がされた場合、転借人は、賃貸人と賃借人との間の賃貸借に基づく賃借人の債務の範囲を限度として、賃貸人に対して直接履行する義務を負う。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"statuteRef":272},{"learningNote":"ただしAに対する責任は、原賃貸借・転貸借双方の賃料額等の範囲で調整されます（民法613条）。","statuteRef":148}]}];
const STATUTES=[{"lawTitle":"日本国憲法","citationLabel":"憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。","statuteOriginal":"第二十九条　財産権は、これを侵してはならない。\n②　財産権の内容は、公共の福祉に適合するやうに、法律でこれを定める。\n③　私有財産は、正当な補償の下に、これを公共のために用ひることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法29条2項","statuteOriginal":"第二十九条　財産権は、これを侵してはならない。\n②　財産権の内容は、公共の福祉に適合するやうに、法律でこれを定める。\n③　私有財産は、正当な補償の下に、これを公共のために用ひることができる。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法29条3項","statuteOriginal":"第二十九条　財産権は、これを侵してはならない。\n②　財産権の内容は、公共の福祉に適合するやうに、法律でこれを定める。\n③　私有財産は、正当な補償の下に、これを公共のために用ひることができる。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法29条1項","statuteOriginal":"第二十九条　財産権は、これを侵してはならない。\n②　財産権の内容は、公共の福祉に適合するやうに、法律でこれを定める。\n③　私有財産は、正当な補償の下に、これを公共のために用ひることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法65条行政権は、内閣に属する。","statuteOriginal":"第六十五条　行政権は、内閣に属する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法66条3項内閣は、行政権の行使について、国会に対し連帯して責任を負う。","statuteOriginal":"第六十六条　内閣は、法律の定めるところにより、その首長たる内閣総理大臣及びその他の国務大臣でこれを組織する。\n②　内閣総理大臣その他の国務大臣は、文民でなければならない。\n③　内閣は、行政権の行使について、国会に対し連帯して責任を負ふ。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法69条内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、十日以内に衆議院が解散されない限り、総辞職をしなければならない。","statuteOriginal":"第六十九条　内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、十日以内に衆議院が解散されない限り、総辞職をしなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法75条","statuteOriginal":"第七十五条　国務大臣は、その在任中、内閣総理大臣の同意がなければ、訴追されない。但し、これがため、訴追の権利は、害されない。\n### 第六章　司法","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法68条第1項","statuteOriginal":"第六十八条　内閣総理大臣は、国務大臣を任命する。但し、その過半数は、国会議員の中から選ばれなければならない。\n②　内閣総理大臣は、任意に国務大臣を罷免することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法68条第2項","statuteOriginal":"第六十八条　内閣総理大臣は、国務大臣を任命する。但し、その過半数は、国会議員の中から選ばれなければならない。\n②　内閣総理大臣は、任意に国務大臣を罷免することができる。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法67条第1項","statuteOriginal":"第六十七条　内閣総理大臣は、国会議員の中から国会の議決で、これを指名する。この指名は、他のすべての案件に先だつて、これを行ふ。\n②　衆議院と参議院とが異なつた指名の議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は衆議院が指名の議決をした後、国会休会中の期間を除いて十日以内に、参議院が、指名の議決をしないときは、衆議院の議決を国会の議決とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法50条","statuteOriginal":"第五十条　両議院の議員は、法律の定める場合を除いては、国会の会期中逮捕されず、会期前に逮捕された議員は、その議院の要求があれば、会期中これを釈放しなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法13条すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。","statuteOriginal":"第十三条　すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法25条","statuteOriginal":"第二十五条　すべて国民は、健康で文化的な最低限度の生活を営む権利を有する。\n②　国は、すべての生活部面について、社会福祉、社会保障及び公衆衛生の向上及び増進に努めなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法21条","statuteOriginal":"第二十一条　集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。\n②　検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法76条","statuteOriginal":"第七十六条　すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。\n②　特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行ふことができない。\n③　すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法81条最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する権限を有する終審裁判所である。","statuteOriginal":"第八十一条　最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する権限を有する終審裁判所である。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法60条1項予算は、さきに衆議院に提出しなければならない。","statuteOriginal":"第六十条　予算は、さきに衆議院に提出しなければならない。\n②　予算について、参議院で衆議院と異なつた議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は参議院が、衆議院の可決した予算を受け取つた後、国会休会中の期間を除いて三十日以内に、議決しないときは、衆議院の議決を国会の議決とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法86条","statuteOriginal":"第八十六条　内閣は、毎会計年度の予算を作成し、国会に提出して、その審議を受け議決を経なければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法60条2項","statuteOriginal":"第六十条　予算は、さきに衆議院に提出しなければならない。\n②　予算について、参議院で衆議院と異なつた議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は参議院が、衆議院の可決した予算を受け取つた後、国会休会中の期間を除いて三十日以内に、議決しないときは、衆議院の議決を国会の議決とする。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法43条1項両議院は、全国民を代表する選挙された議員でこれを組織する。","statuteOriginal":"第四十三条　両議院は、全国民を代表する選挙された議員でこれを組織する。\n②　両議院の議員の定数は、法律でこれを定める。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法44条両議院の議員及びその選挙人の資格は、法律でこれを定める。","statuteOriginal":"第四十四条　両議院の議員及びその選挙人の資格は、法律でこれを定める。但し、人種、信条、性別、社会的身分、門地、教育、財産又は収入によつて差別してはならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法54条第1項","statuteOriginal":"第五十四条　衆議院が解散されたときは、解散の日から四十日以内に、衆議院議員の総選挙を行ひ、その選挙の日から三十日以内に、国会を召集しなければならない。\n②　衆議院が解散されたときは、参議院は、同時に閉会となる。但し、内閣は、国に緊急の必要があるときは、参議院の緊急集会を求めることができる。\n③　前項但書の緊急集会において採られた措置は、臨時のものであつて、次の国会開会の後十日以内に、衆議院の同意がない場合には、その効力を失ふ。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法43条","statuteOriginal":"第四十三条　両議院は、全国民を代表する選挙された議員でこれを組織する。\n②　両議院の議員の定数は、法律でこれを定める。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法90条","statuteOriginal":"第九十条（公序良俗）　公の秩序又は善良の風俗に反する法律行為は、無効とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法25条第1項","statuteOriginal":"第二十五条　すべて国民は、健康で文化的な最低限度の生活を営む権利を有する。\n②　国は、すべての生活部面について、社会福祉、社会保障及び公衆衛生の向上及び増進に努めなければならない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"日本国憲法前文","statuteOriginal":"日本国民は、正当に選挙された国会における代表者を通じて行動し、われらとわれらの子孫のために、諸国民との協和による成果と、わが国全土にわたつて自由のもたらす恵沢を確保し、政府の行為によつて再び戦争の惨禍が起ることのないやうにすることを決意し、ここに主権が国民に存することを宣言し、この憲法を確定する。そもそも国政は、国民の厳粛な信託によるものであつて、その権威は国民に由来し、その権力は国民の代表者がこれを行使し、その福利は国民がこれを享受する。これは人類普遍の原理であり、この憲法は、かかる原理に基くものである。われらは、これに反する一切の憲法、法令及び詔勅を排除する。\n\n日本国民は、恒久の平和を念願し、人間相互の関係を支配する崇高な理想を深く自覚するのであつて、平和を愛する諸国民の公正と信義に信頼して、われらの安全と生存を保持しようと決意した。われらは、平和を維持し、専制と隷従、圧迫と偏狭を地上から永遠に除去しようと努めてゐる国際社会において、名誉ある地位を占めたいと思ふ。われらは、全世界の国民が、ひとしく恐怖と欠乏から免かれ、平和のうちに生存する権利を有することを確認する。\n\nわれらは、いづれの国家も、自国のことのみに専念して他国を無視してはならないのであつて、政治道徳の法則は、普遍的なものであり、この法則に従ふことは、自国の主権を維持し、他国と対等関係に立たうとする各国の責務であると信ずる。\n\n日本国民は、国家の名誉にかけ、全力をあげてこの崇高な理想と目的を達成することを誓ふ。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法21条集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","statuteOriginal":"第二十一条　集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。\n②　検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法7条","statuteOriginal":"第七条　天皇は、内閣の助言と承認により、国民のために、左の国事に関する行為を行ふ。\n一　憲法改正、法律、政令及び条約を公布すること。\n二　国会を召集すること。\n三　衆議院を解散すること。\n四　国会議員の総選挙の施行を公示すること。\n五　国務大臣及び法律の定めるその他の官吏の任免並びに全権委任状及び大使及び公使の信任状を認証すること。\n六　大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。\n七　栄典を授与すること。\n八　批准書及び法律の定めるその他の外交文書を認証すること。\n九　外国の大使及び公使を接受すること。\n十　儀式を行ふこと。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法6条第2項","statuteOriginal":"第六条　天皇は、国会の指名に基いて、内閣総理大臣を任命する。\n②　天皇は、内閣の指名に基いて、最高裁判所の長たる裁判官を任命する。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法73条","statuteOriginal":"第七十三条　内閣は、他の一般行政事務の外、左の事務を行ふ。\n一　法律を誠実に執行し、国務を総理すること。\n二　外交関係を処理すること。\n三　条約を締結すること。但し、事前に、時宜によつては事後に、国会の承認を経ることを必要とする。\n四　法律の定める基準に従ひ、官吏に関する事務を掌理すること。\n五　予算を作成して国会に提出すること。\n六　この憲法及び法律の規定を実施するために、政令を制定すること。但し、政令には、特にその法律の委任がある場合を除いては、罰則を設けることができない。\n七　大赦、特赦、減刑、刑の執行の免除及び復権を決定すること。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法7条1号","statuteOriginal":"第七条　天皇は、内閣の助言と承認により、国民のために、左の国事に関する行為を行ふ。\n一　憲法改正、法律、政令及び条約を公布すること。\n二　国会を召集すること。\n三　衆議院を解散すること。\n四　国会議員の総選挙の施行を公示すること。\n五　国務大臣及び法律の定めるその他の官吏の任免並びに全権委任状及び大使及び公使の信任状を認証すること。\n六　大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。\n七　栄典を授与すること。\n八　批准書及び法律の定めるその他の外交文書を認証すること。\n九　外国の大使及び公使を接受すること。\n十　儀式を行ふこと。","targetParagraph":"","targetItem":"1","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法7条10号","statuteOriginal":"第七条　天皇は、内閣の助言と承認により、国民のために、左の国事に関する行為を行ふ。\n一　憲法改正、法律、政令及び条約を公布すること。\n二　国会を召集すること。\n三　衆議院を解散すること。\n四　国会議員の総選挙の施行を公示すること。\n五　国務大臣及び法律の定めるその他の官吏の任免並びに全権委任状及び大使及び公使の信任状を認証すること。\n六　大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。\n七　栄典を授与すること。\n八　批准書及び法律の定めるその他の外交文書を認証すること。\n九　外国の大使及び公使を接受すること。\n十　儀式を行ふこと。","targetParagraph":"","targetItem":"10","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法19条思想及び良心の自由は、これを侵してはならない。","statuteOriginal":"第十九条　思想及び良心の自由は、これを侵してはならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法20条","statuteOriginal":"第二十条　信教の自由は、何人に対してもこれを保障する。いかなる宗教団体も、国から特権を受け、又は政治上の権力を行使してはならない。\n②　何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。\n③　国及びその機関は、宗教教育その他いかなる宗教的活動もしてはならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法20条2項","statuteOriginal":"第二十条　信教の自由は、何人に対してもこれを保障する。いかなる宗教団体も、国から特権を受け、又は政治上の権力を行使してはならない。\n②　何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。\n③　国及びその機関は、宗教教育その他いかなる宗教的活動もしてはならない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法21条2項","statuteOriginal":"第二十一条　集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。\n②　検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法20条1項","statuteOriginal":"第二十条　信教の自由は、何人に対してもこれを保障する。いかなる宗教団体も、国から特権を受け、又は政治上の権力を行使してはならない。\n②　何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。\n③　国及びその機関は、宗教教育その他いかなる宗教的活動もしてはならない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法723条","statuteOriginal":"第七百二十三条（名誉毀損における原状回復）　他人の名誉を毀損した者に対しては、裁判所は、被害者の請求により、損害賠償に代えて、又は損害賠償とともに、名誉を回復するのに適当な処分を命ずることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法64条1項国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設ける。","statuteOriginal":"第六十四条　国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設ける。\n②　弾劾に関する事項は、法律でこれを定める。\n### 第五章　内閣","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法82条第2項","statuteOriginal":"第八十二条　裁判の対審及び判決は、公開法廷でこれを行ふ。\n②　裁判所が、裁判官の全員一致で、公の秩序又は善良の風俗を害する虞があると決した場合には、対審は、公開しないでこれを行ふことができる。但し、政治犯罪、出版に関する犯罪又はこの憲法第三章で保障する国民の権利が問題となつてゐる事件の対審は、常にこれを公開しなければならない。\n### 第七章　財政","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法78条","statuteOriginal":"第七十八条　裁判官は、裁判により、心身の故障のために職務を執ることができないと決定された場合を除いては、公の弾劾によらなければ罷免されない。裁判官の懲戒処分は、行政機関がこれを行ふことはできない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法64条","statuteOriginal":"第六十四条　国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設ける。\n②　弾劾に関する事項は、法律でこれを定める。\n### 第五章　内閣","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法5条1項","statuteOriginal":"第五条（未成年者の法律行為）　未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。\\n２　前項の規定に反する法律行為は、取り消すことができる。\\n３　第一項の規定にかかわらず、法定代理人が目的を定めて処分を許した財産は、その目的の範囲内において、未成年者が自由に処分することができる。目的を定めないで処分を許した財産を処分するときも、同様とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","statuteOriginal":"第九条（成年被後見人の法律行為）　成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法13条1項","statuteOriginal":"第十三条（保佐人の同意を要する行為等）　被保佐人が次に掲げる行為をするには、その保佐人の同意を得なければならない。ただし、第九条ただし書に規定する行為については、この限りでない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法20条","statuteOriginal":"第二十条（制限行為能力者の相手方の催告権）　制限行為能力者の相手方は、その制限行為能力者が行為能力者となった後、その者に対し、一箇月以上の期間を定めて、その期間内にその取り消すことができる行為を追認するかどうかを確答すべき旨の催告をすることができる。この場合において、その者がその期間内に確答を発しないときは、その行為を追認したものとみなす。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法5条2項","statuteOriginal":"第五条（未成年者の法律行為）　未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。\\n２　前項の規定に反する法律行為は、取り消すことができる。\\n３　第一項の規定にかかわらず、法定代理人が目的を定めて処分を許した財産は、その目的の範囲内において、未成年者が自由に処分することができる。目的を定めないで処分を許した財産を処分するときも、同様とする。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法24条","statuteOriginal":"第二十四条　婚姻は、両性の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。\n②　配偶者の選択、財産権、相続、住居の選定、離婚並びに婚姻及び家族に関するその他の事項に関しては、法律は、個人の尊厳と両性の本質的平等に立脚して、制定されなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法26条","statuteOriginal":"第二十六条　すべて国民は、法律の定めるところにより、その能力に応じて、ひとしく教育を受ける権利を有する。\n②　すべて国民は、法律の定めるところにより、その保護する子女に普通教育を受けさせる義務を負ふ。義務教育は、これを無償とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法900条","statuteOriginal":"第九百条（法定相続分）　同順位の相続人が数人あるときは、その相続分は、次の各号の定めるところによる。\n一　子及び配偶者が相続人であるときは、子の相続分及び配偶者の相続分は、各二分の一とする。\n二　配偶者及び直系尊属が相続人であるときは、配偶者の相続分は、三分の二とし、直系尊属の相続分は、三分の一とする。\n三　配偶者及び兄弟姉妹が相続人であるときは、配偶者の相続分は、四分の三とし、兄弟姉妹の相続分は、四分の一とする。\n四　子、直系尊属又は兄弟姉妹が数人あるときは、各自の相続分は、相等しいものとする。ただし、父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の相続分の二分の一とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法24条2項","statuteOriginal":"第二十四条　婚姻は、両性の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。\n②　配偶者の選択、財産権、相続、住居の選定、離婚並びに婚姻及び家族に関するその他の事項に関しては、法律は、個人の尊厳と両性の本質的平等に立脚して、制定されなければならない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法24条1項","statuteOriginal":"第二十四条　婚姻は、両性の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。\n②　配偶者の選択、財産権、相続、住居の選定、離婚並びに婚姻及び家族に関するその他の事項に関しては、法律は、個人の尊厳と両性の本質的平等に立脚して、制定されなければならない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法4条年齢十八歳をもって、成年とする。","statuteOriginal":"第四条（成年）　年齢十八歳をもって、成年とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法961条十五歳に達した者は、遺言をすることができる。","statuteOriginal":"第九百六十一条（遺言能力）　十五歳に達した者は、遺言をすることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法731条","statuteOriginal":"第七百三十一条（婚姻適齢）　婚姻は、十八歳にならなければ、することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法7条","statuteOriginal":"第七条（後見開始の審判）　精神上の障害により事理を弁識する能力を欠く常況にある者については、家庭裁判所は、本人、配偶者、四親等内の親族、未成年後見人、未成年後見監督人、保佐人、保佐監督人、補助人、補助監督人又は検察官の請求により、後見開始の審判をすることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法5条1項未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。","statuteOriginal":"第五条（未成年者の法律行為）　未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。\\n２　前項の規定に反する法律行為は、取り消すことができる。\\n３　第一項の規定にかかわらず、法定代理人が目的を定めて処分を許した財産は、その目的の範囲内において、未成年者が自由に処分することができる。目的を定めないで処分を許した財産を処分するときも、同様とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法31条","statuteOriginal":"第三十一条（未成年者及び成年被後見人の訴訟能力）　未成年者及び成年被後見人は、法定代理人によらなければ、訴訟行為をすることができない。ただし、未成年者が独立して法律行為をすることができる場合は、この限りでない。","targetParagrap
