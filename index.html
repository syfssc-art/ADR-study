h":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法34条","statuteOriginal":"第三十四条（訴訟能力等を欠く場合の措置等）　訴訟能力、法定代理権又は訴訟行為をするのに必要な授権を欠くときは、裁判所は、期間を定めて、その補正を命じなければならない。この場合において、遅滞のため損害を生ずるおそれがあるときは、裁判所は、一時訴訟行為をさせることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民法","citationLabel":"民法721条胎児は、損害賠償の請求権については、既に生まれたものとみなす。","statuteOriginal":"第七百二十一条（損害賠償請求権に関する胎児の権利能力）　胎児は、損害賠償の請求権については、既に生まれたものとみなす。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法28条管理人は、第百三条に規定する権限を超える行為を必要とするときは、家庭裁判所の許可を得て、その行為をすることができる。","statuteOriginal":"第二十八条（管理人の権限）　管理人は、第百三条に規定する権限を超える行為を必要とするときは、家庭裁判所の許可を得て、その行為をすることができる。不在者の生死が明らかでない場合において、その管理人が不在者が定めた権限を超える行為を必要とするときも、同様とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。","statuteOriginal":"第九十七条（意思表示の効力発生時期等）　意思表示は、その通知が相手方に到達した時からその効力を生ずる。\n２　相手方が正当な理由なく意思表示の通知が到達することを妨げたときは、その通知は、通常到達すべきであった時に到達したものとみなす。\n３　意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けたときであっても、そのためにその効力を妨げられない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法94条第2項","statuteOriginal":"第九十四条（虚偽表示）　相手方と通じてした虚偽の意思表示は、無効とする。\n２　前項の規定による意思表示の無効は、善意の第三者に対抗することができない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法93条","statuteOriginal":"第九十三条（心裡留保）　意思表示は、表意者がその真意ではないことを知ってしたときであっても、そのためにその効力を妨げられない。ただし、相手方がその意思表示が表意者の真意ではないことを知り、又は知ることができたときは、その意思表示は、無効とする。\n２　前項ただし書の規定による意思表示の無効は、善意の第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法97条3項","statuteOriginal":"第九十七条（意思表示の効力発生時期等）　意思表示は、その通知が相手方に到達した時からその効力を生ずる。\n２　相手方が正当な理由なく意思表示の通知が到達することを妨げたときは、その通知は、通常到達すべきであった時に到達したものとみなす。\n３　意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けたときであっても、そのためにその効力を妨げられない。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法96条","statuteOriginal":"第九十六条（詐欺又は強迫）　詐欺又は強迫による意思表示は、取り消すことができる。\n２　相手方に対する意思表示について第三者が詐欺を行った場合においては、相手方がその事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。\n３　前二項の規定による詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法95条1項意思表示は、錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。","statuteOriginal":"第九十五条（錯誤）　意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。\n一　意思表示に対応する意思を欠く錯誤\n二　表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤\n２　前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。\n３　錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。\n一　相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。\n二　相手方が表意者と同一の錯誤に陥っていたとき。\n４　第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法95条3項2号","statuteOriginal":"第九十五条（錯誤）　意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。\n一　意思表示に対応する意思を欠く錯誤\n二　表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤\n２　前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。\n３　錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。\n一　相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。\n二　相手方が表意者と同一の錯誤に陥っていたとき。\n４　第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","targetParagraph":"3","targetItem":"2","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法95条2項","statuteOriginal":"第九十五条（錯誤）　意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。\n一　意思表示に対応する意思を欠く錯誤\n二　表意者が法律行為の基礎とした事情についてのその認識 は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けたときであっても、そのためにその効力を妨げられない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法95条第2項","statuteOriginal":"第九十五条（錯誤）　意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。\n一　意思表示に対応する意思を欠く錯誤\n二　表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤\n２　前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。\n３　錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。\n一　相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。\n二　相手方が表意者と同一の錯誤に陥っていたとき。\n４　第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法98条","statuteOriginal":"第九十八条（公示による意思表示）　意思表示は、表意者が相手方を知ることができず、又はその所在を知ることができないときは、公示の方法によってすることができる。\n２　前項の公示は、公示送達に関する民事訴訟法（平成八年法律第百九号）の規定に従い、裁判所の掲示場に掲示し、かつ、その掲示があったことを官報に少なくとも一回掲載して行う。ただし、裁判所は、相当と認めるときは、官報への掲載に代えて、市役所、区役所、町村役場又はこれらに準ずる施設の掲示場に掲示すべきことを命ずることができる。\n３　公示による意思表示は、最後に官報に掲載した日又はその掲載に代わる掲示を始めた日から二週間を経過した時に、相手方に到達したものとみなす。ただし、表意者が相手方を知らないこと又はその所在を知らないことについて過失があったときは、到達の効力を生じない。\n４　公示に関する手続は、相手方を知ることができない場合には表意者の住所地の、相手方の所在を知ることができない場合には相手方の最後の住所地の簡易裁判所の管轄に属する。\n５　裁判所は、表意者に、公示に関する費用を予納させなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法95条","statuteOriginal":"第九十五条（錯誤）　意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。\n一　意思表示に対応する意思を欠く錯誤\n二　表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤\n２　前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。\n３　錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。\n一　相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。\n二　相手方が表意者と同一の錯誤に陥っていたとき。\n４　第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","statuteOriginal":"第百二条（代理人の行為能力）　制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。ただし、制限行為能力者が他の制限行為能力者の法定代理人としてした行為については、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法107条第2項","statuteOriginal":"第百七条（代理権の濫用）　代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法105条","statuteOriginal":"第百五条（法定代理人による復代理人の選任）　法定代理人は、自己の責任で復代理人を選任することができる。この場合において、やむを得ない事由があるときは、本人に対してその選任及び監督についての責任のみを負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法104条","statuteOriginal":"第百四条（任意代理人による復代理人の選任）　委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法110条","statuteOriginal":"第百十条（権限外の行為の表見代理）　前条第一項本文の規定は、代理人がその権限外の行為をした場合において、第三者が代理人の権限があると信ずべき正当な理由があるときについて準用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法112条","statuteOriginal":"第百十二条（代理権消滅後の表見代理等）　他人に代理権を与えた者は、代理権の消滅後にその代理権の範囲内においてその他人が第三者との間でした行為について、代理権の消滅の事実を知らなかった第三者に対してその責任を負う。ただし、第三者が過失によってその事実を知らなかったときは、この限りでない。\n２　他人に代理権を与えた者は、代理権の消滅後に、その代理権の範囲内においてその他人が第三者との間で行為をしたとすれば前項の規定によりその責任を負うべき場合において、その他人が第三者との間でその代理権の範囲外の行為をしたときは、第三者がその行為についてその他人の代理権があると信ずべき正当な理由があるときに限り、その行為についての責任を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法109条","statuteOriginal":"第百九条（代理権授与の表示による表見代理等）　第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。ただし、第三者が、その他人が代理権を与えられていないことを知り、又は過失によって知らなかったときは、この限りでない。\n２　第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間で行為をしたとすれば前項の規定によりその責任を負うべき場合において、その他人が第三者との間でその代理権の範囲外の行為をしたときは、第三者がその行為についてその他人の代理権があると信ずべき正当な理由があるときに限り、その行為についての責任を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法107条","statuteOriginal":"第百七条（代理権の濫用）　代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法117条","statuteOriginal":"第百十七条（無権代理人の責任）　他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。\n２　前項の規定は、次に掲げる場合には、適用しない。\n一　他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたとき。\n二　他人の代理人として契約をした者が代理権を有しないことを相手方が過失によって知らなかったとき。ただし、他人の代理人として契約をした者が自己に代理権がないことを知っていたときは、この限りでない。\n三　他人の代理人として契約をした者が行為能力の制限を受けていたとき。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法882条","statuteOriginal":"第八百八十二条（相続開始の原因）　相続は、死亡によって開始する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法101条","statuteOriginal":"第百一条（代理行為の瑕疵）　代理人が相手方に対してした意思表示の効力が意思の不存在、錯誤、詐欺、強迫又はある事情を知っていたこと若しくは知らなかったことにつき過失があったことによって影響を受けるべき場合には、その事実の有無は、代理人について決するものとする。\n２　相手方が代理人に対してした意思表示の効力が意思表示を受けた者がある事情を知っていたこと又は知らなかったことにつき過失があったことによって影響を受けるべき場合には、その事実の有無は、代理人について決するものとする。\n３　特定の法律行為をすることを委託された代理人がその行為をしたときは、本人は、自ら知っていた事情について代理人が知らなかったことを主張することができない。本人が過失によって知らなかった事情についても、同様とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法938条","statuteOriginal":"第九百三十八条（相続の放棄の方式）　相続の放棄をしようとする者は、その旨を家庭裁判所に申述しなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法186条占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定する。","statuteOriginal":"第百八十六条（占有の態様等に関する推定）　占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。\n２　前後の両時点において占有をした証拠があるときは、占有は、その間継続したものと推定する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法187条1項占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。","statuteOriginal":"第百八十七条（占有の承継）　占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。\n２　前の占有者の占有を併せて主張する場合には、その瑕疵をも承継する。\n#### 第二節　占有権の効力","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法189条第1項","statuteOriginal":"第百八十九条（善意の占有者による果実の取得等）　善意の占有者は、占有物から生ずる果実を取得する。\n２　善意の占有者が本権の訴えにおいて敗訴したときは、その訴えの提起の時から悪意の占有者とみなす。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法188条","statuteOriginal":"第百八十八条（占有物について行使する権利の適法の推定）　占有者が占有物について行使する権利は、適法に有するものと推定する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法186条1項","statuteOriginal":"第百八十六条（占有の態様等に関する推定）　占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。\n２　前後の両時点において占有をした証拠があるときは、占有は、その間継続したものと推定する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法181条","statuteOriginal":"第百八十一条（代理占有）　占有権は、代理人によって取得することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法180条","statuteOriginal":"第百八十条（占有権の取得）　占有権は、自己のためにする意思をもって物を所持することによって取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法186条2項","statuteOriginal":"第百八十六条（占有の態様等に関する推定）　占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。\n２　前後の両時点において占有をした証拠があるときは、占有は、その間継続したものと推定する。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法184条","statuteOriginal":"第百八十四条（指図による占有移転）　代理人によって占有をする場合において、本人がその代理人に対して以後第三者のためにその物を占有することを命じ、その第三者がこれを承諾したときは、その第三者は、占有権を取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法162条","statuteOriginal":"第百六十二条（所有権の取得時効）　二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。\\n２　十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法555条","statuteOriginal":"第五百五十五条（売買）　売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteOriginal":"第百六十二条（所有権の取得時効）　二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。\\n２　十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","statuteOriginal":"第百四十五条（時効の援用）　時効は、当事者（消滅時効にあっては、保証人、物上保証人、第三取得者その他権利の消滅について正当な利益を有する者を含む。）が援用しなければ、裁判所がこれによって裁判をすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法146条時効の利益は、あらかじめ放棄することができない。","statuteOriginal":"第百四十六条（時効の利益の放棄）　時効の利益は、あらかじめ放棄することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法203条","statuteOriginal":"第二百三条（占有権の消滅事由）　占有権は、占有者が占有の意思を放棄し、又は占有物の所持を失うことによって消滅する。ただし、占有者が占有回収の訴えを提起したときは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法177条","statuteOriginal":"第百七十七条（不動産に関する物権の変動の対抗要件）　不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法144条","statuteOriginal":"第百四十四条（時効の効力）　時効の効力は、その起算日にさかのぼる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法29条","statuteOriginal":"第二十九条　財産権は、これを侵してはならない。\n②　財産権の内容は、公共の福祉に適合するやうに、法律でこれを定める。\n③　私有財産は、正当な補償の下に、これを公共のために用ひることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法283条","statuteOriginal":"第二百八十三条（地役権の時効取得）　地役権は、継続的に行使され、かつ、外形上認識することができるものに限り、時効によって取得することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法167条","statuteOriginal":"第百六十七条（人の生命又は身体の侵害による損害賠償請求権の消滅時効）　人の生命又は身体の侵害による損害賠償請求権の消滅時効についての前条第一項第二号の規定の適用については、同号中「十年間」とあるのは、「二十年間」とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法166条","statuteOriginal":"第百六十六条（債権等の消滅時効）　債権は、次に掲げる場合には、時効によって消滅する。\n一　債権者が権利を行使することができることを知った時から五年間行使しないとき。\n二　権利を行使することができる時から十年間行使しないとき。\n２　債権又は所有権以外の財産権は、権利を行使することができる時から二十年間行使しないときは、時効によって消滅する。\n３　前二項の規定は、始期付権利又は停止条件付権利の目的物を占有する第三者のために、その占有の開始の時から取得時効が進行することを妨げない。ただし、権利者は、その時効を更新するため、いつでも占有者の承認を求めることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法169条","statuteOriginal":"第百六十九条（判決で確定した権利の消滅時効）　確定判決又は確定判決と同一の効力を有するものによって確定した権利については、十年より短い時効期間の定めがあるものであっても、その時効期間は、十年とする。\n２　前項の規定は、確定の時に弁済期の到来していない債権については、適用しない。\n第百七十条から第百七十四条まで　削除\n## 第二編　物権\n### 第一章　総則","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法709条","statuteOriginal":"第七百九条（不法行為による損害賠償）　故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","statuteOriginal":"第二百五十一条（共有物の変更）　各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。次項において同じ。）を加えることができない。\n２　共有者が他の共有者を知ることができず、又はその所在を知ることができないときは、裁判所は、共有者の請求により、当該他の共有者以外の他の共有者の同意を得て共有物に変更を加えることができる旨の裁判をすることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法252条1項共有物の管理に関する事項は、前条の場合を除き、各共有者の持分の価格に従い、その過半数で決する。","statuteOriginal":"第二百五十二条（共有物の管理）　共有物の管理に関する事項（次条第一項に規定する共有物の管理者の選任及び解任を含み、共有物に前条第一項に規定する変更を加えるものを除く。次項において同じ。）は、各共有者の持分の価格に従い、その過半数で決する。共有物を使用する共有者があるときも、同様とする。\n２　裁判所は、次の各号に掲げるときは、当該各号に規定する他の共有者以外の共有者の請求により、当該他の共有者以外の共有者の持分の価格に従い、その過半数で共有物の管理に関する事項を決することができる旨の裁判をすることができる。\n一　共有者が他の共有者を知ることができず、又はその所在を知ることができないとき。\n二　共有者が他の共有者に対し相当の期間を定めて共有物の管理に関する事項を決することについて賛否を明らかにすべき旨を催告した場合において、当該他の共有者がその期間内に賛否を明らかにしないとき。\n３　前二項の規定による決定が、共有者間の決定に基づいて共有物を使用する共有者に特別の影響を及ぼすべきときは、その承諾を得なければならない。\n４　共有者は、前三項の規定により、共有物に、次の各号に掲げる賃借権その他の使用及び収益を目的とする権利（以下この項において「賃借権等」という。）であって、当該各号に定める期間を超えないものを設定することができる。\n一　樹木の栽植又は伐採を目的とする山林の賃借権等十年\n二　前号に掲げる賃借権等以外の土地の賃借権等五年\n三　建物の賃借権等三年\n四　動産の賃借権等六箇月\n５　各共有者は、前各項の規定にかかわらず、保存行為をすることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法249条第3項","statuteOriginal":"第二百四十九条（共有物の使用）　各共有者は、共有物の全部について、その持分に応じた使用をすることができる。\n２　共有物を使用する共有者は、別段の合意がある場合を除き、他の共有者に対し、自己の持分を超える使用の対価を償還する義務を負う。\n３　共有者は、善良な管理者の注意をもって、共有物の使用をしなければならない。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法252条2項","statuteOriginal":"第二百五十二条（共有物の管理）　共有物の管理に関する事項（次条第一項に規定する共有物の管理者の選任及び解任を含み、共有物に前条第一項に規定する変更を加えるものを除く。次項において同じ。）は、各共有者の持分の価格に従い、その過半数で決する。共有物を使用する共有者があるときも、同様とする。\n２　裁判所は、次の各号に掲げるときは、当該各号に規定する他の共有者以外の共有者の請求により、当該他の共有者以外の共有者の持分の価格に従い、その過半数で共有物の管理に関する事項を決することができる旨の裁判をすることができる。\n一　共有者が他の共有者を知ることができず、又はその所在を知ることができないとき。\n二　共有者が他の共有者に対し相当の期間を定めて共有物の管理に関する事項を決することについて賛否を明らかにすべき旨を催告した場合において、当該他の共有者がその期間内に賛否を明らかにしないとき。\n３　前二項の規定による決定が、共有者間の決定に基づいて共有物を使用する共有者に特別の影響を及ぼすべきときは、その承諾を得なければならない。\n４　共有者は、前三項の規定により、共有物に、次の各号に掲げる賃借権その他の使用及び収益を目的とする権利（以下この項において「賃借権等」という。）であって、当該各号に定める期間を超えないものを設定することができる。\n一　樹木の栽植又は伐採を目的とする山林の賃借権等十年\n二　前号に掲げる賃借権等以外の土地の賃借権等五年\n三　建物の賃借権等三年\n四　動産の賃借権等六箇月\n５　各共有者は、前各項の規定にかかわらず、保存行為をすることができる。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法251条","statuteOriginal":"第二百五十一条（共有物の変更）　各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。次項において同じ。）を加えることができない。\n２　共有者が他の共有者を知ることができず、又はその所在を知ることができないときは、裁判所は、共有者の請求により、当該他の共有者以外の他の共有者の同意を得て共有物に変更を加えることができる旨の裁判をすることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法255条","statuteOriginal":"第二百五十五条（持分の放棄及び共有者の死亡）　共有者の一人が、その持分を放棄したとき、又は死亡して相続人がないときは、その持分は、他の共有者に帰属する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法258条","statuteOriginal":"第二百五十八条（裁判による共有物の分割）　共有物の分割について共有者間に協議が調わないとき、又は協議をすることができないときは、その分割を裁判所に請求することができる。\n２　裁判所は、次に掲げる方法により、共有物の分割を命ずることができる。\n一　共有物の現物を分割する方法\n二　共有者に債務を負担させて、他の共有者の持分の全部又は一部を取得させる方法\n３　前項に規定する方法により共有物を分割することができないとき、又は分割によってその価格を著しく減少させるおそれがあるときは、裁判所は、その競売を命ずることができる。\n４　裁判所は、共有物の分割の裁判において、当事者に対して、金銭の支払、物の引渡し、登記義務の履行その他の給付を命ずることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法369条1項抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。","statuteOriginal":"第三百六十九条（抵当権の内容）　抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。\n２　地上権及び永小作権も、抵当権の目的とすることができる。この場合においては、この章の規定を準用する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法562条","statuteOriginal":"第五百六十二条（買主の追完請求権）　引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。ただし、売主は、買主に不相当な負担を課するものでないときは、買主が請求した方法と異なる方法による履行の追完をすることができる。\n２　前項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、同項の規定による履行の追完の請求をすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法563条","statuteOriginal":"第五百六十三条（買主の代金減額請求権）　前条第一項本文に規定する場合において、買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、その不適合の程度に応じて代金の減額を請求することができる。\n２　前項の規定にかかわらず、次に掲げる場合には、買主は、同項の催告をすることなく、直ちに代金の減額を請求することができる。\n一　履行の追完が不能であるとき。\n二　売主が履行の追完を拒絶する意思を明確に表示したとき。\n三　契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、売主が履行の追完をしないでその時期を経過したとき。\n四　前三号に掲げる場合のほか、買主が前項の催告をしても履行の追完を受ける見込みがないことが明らかであるとき。\n３　第一項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、前二項の規定による代金の減額の請求をすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","statuteOriginal":"第百七十七条（不動産に関する物権の変動の対抗要件）　不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法176条物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる。","statuteOriginal":"第百七十六条（物権の設定及び移転）　物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法177条不動産に関する物権の得喪及び変更は、その登記をしなければ、第三者に対抗することができない。","statuteOriginal":"第百七十七条（不動産に関する物権の変動の対抗要件）　不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"借地借家法","citationLabel":"借地借家法10条","statuteOriginal":"第十条（借地権の対抗力）　借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/403AC0000000090"},{"lawTitle":"民法","citationLabel":"民法545条第1項","statuteOriginal":"第五百四十五条（解除の効果）　当事者の一方がその解除権を行使したときは、各当事者は、その相手方を原状に復させる義務を負う。ただし、第三者の権利を害することはできない。\n２　前項本文の場合において、金銭を返還するときは、その受領の時から利息を付さなければならない。\n３　第一項本文の場合において、金銭以外の物を返還するときは、その受領の時以後に生じた果実をも返還しなければならない。\n４　解除権の行使は、損害賠償の請求を妨げない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法233条1項土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。","statuteOriginal":"第二百三十三条（竹木の枝の切除及び根の切取り）　土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。\n２　前項の場合において、竹木が数人の共有に属するときは、各共有者は、その枝を切り取ることができる。\n３　第一項の場合において、次に掲げるときは、土地の所有者は、その枝を切り取ることができる。\n一　竹木の所有者に枝を切除するよう催告したにもかかわらず、竹木の所有者が相当の期間内に切除しないとき。\n二　竹木の所有者を知ることができず、又はその所在を知ることができないとき。\n三　急迫の事情があるとき。\n４　隣地の竹木の根が境界線を越えるときは、その根を切り取ることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法223条","statuteOriginal":"第二百二十三条（境界標の設置）　土地の所有者は、隣地の所有者と共同の費用で、境界標を設けることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法229条","statuteOriginal":"第二百二十九条（境界標等の共有の推定）　境界線上に設けた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法224条","statuteOriginal":"第二百二十四条（境界標の設置及び保存の費用）　境界標の設置及び保存の費用は、相隣者が等しい割合で負担する。ただし、測量の費用は、その土地の広狭に応じて分担する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法233条4項","statuteOriginal":"第二百三十三条（竹木の枝の切除及び根の切取り）　土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。\n２　前項の場合において、竹木が数人の共有に属するときは、各共有者は、その枝を切り取ることができる。\n３　第一項の場合において、次に掲げるときは、土地の所有者は、その枝を切り取ることができる。\n一　竹木の所有者に枝を切除するよう催告したにもかかわらず、竹木の所有者が相当の期間内に切除しないとき。\n二　竹木の所有者を知ることができず、又はその所在を知ることができないとき。\n三　急迫の事情があるとき。\n４　隣地の竹木の根が境界線を越えるときは、その根を切り取ることができる。","targetParagraph":"4","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法213条","statuteOriginal":"第二百十三条　分割によって公道に通じない土地が生じたときは、その土地の所有者は、公道に至るため、他の分割者の所有地のみを通行することができる。この場合においては、償金を支払うことを要しない。\n２　前項の規定は、土地の所有者がその土地の一部を譲り渡した場合について準用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法233条","statuteOriginal":"第二百三十三条（竹木の枝の切除及び根の切取り）　土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。\n２　前項の場合において、竹木が数人の共有に属するときは、各共有者は、その枝を切り取ることができる。\n３　第一項の場合において、次に掲げるときは、土地の所有者は、その枝を切り取ることができる。\n一　竹木の所有者に枝を切除するよう催告したにもかかわらず、竹木の所有者が相当の期間内に切除しないとき。\n二　竹木の所有者を知ることができず、又はその所在を知ることができないとき。\n三　急迫の事情があるとき。\n４　隣地の竹木の根が境界線を越えるときは、その根を切り取ることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法192条取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。","statuteOriginal":"第百九十二条（即時取得）　取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法193条前条の場合において、占有物が盗品又は遺失物であるときは、被害者又は遺失者は、盗難又は遺失の時から二年間、占有者に対してその物の回復を請求することができる。","statuteOriginal":"第百九十三条（盗品又は遺失物の回復）　前条の場合において、占有物が盗品又は遺失物であるときは、被害者又は遺失者は、盗難又は遺失の時から二年間、占有者に対してその物の回復を請求することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法85条この法律において「物」とは、有体物をいう。","statuteOriginal":"第八十五条（定義）　この法律において「物」とは、有体物をいう。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法86条土地及びその定着物は、不動産とする。不動産以外の物は、すべて動産とする。","statuteOriginal":"第八十六条（不動産及び動産）　土地及びその定着物は、不動産とする。\n２　不動産以外の物は、すべて動産とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法86条2項","statuteOriginal":"第八十六条（不動産及び動産）　土地及びその定着物は、不動産とする。\n２　不動産以外の物は、すべて動産とする。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法86条1項","statuteOriginal":"第八十六条（不動産及び動産）　土地及びその定着物は、不動産とする。\n２　不動産以外の物は、すべて動産とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","statuteOriginal":"第六百十二条（賃借権の譲渡及び転貸の制限）　賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。\n２　賃借人が前項の規定に違反して第三者に賃借物の使用又は収益をさせたときは、賃貸人は、契約の解除をすることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法611条第1項","statuteOriginal":"第六百十一条（賃借物の一部滅失等による賃料の減額等）　賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、賃料は、その使用及び収益をすることができなくなった部分の割合に応じて、減額される。\n２　賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、残存する部分のみでは賃借人が賃借をした目的を達することができないときは、賃借人は、契約の解除をすることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法608条第1項","statuteOriginal":"第六百八条（賃借人による費用の償還請求）　賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、賃貸人に対し、直ちにその償還を請求することができる。\n２　賃借人が賃借物について有益費を支出したときは、賃貸人は、賃貸借の終了の時に、第百九十六条第二項の規定に従い、その償還をしなければならない。ただし、裁判所は、賃貸人の請求により、その償還について相当の期限を許与することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法617条","statuteOriginal":"第六百十七条（期間の定めのない賃貸借の解約の申入れ）　当事者が賃貸借の期間を定めなかったときは、各当事者は、いつでも解約の申入れをすることができる。この場合においては、次の各号に掲げる賃貸借は、解約の申入れの日からそれぞれ当該各号に定める期間を経過することによって終了する。\n一　土地の賃貸借一年\n二　建物の賃貸借三箇月\n三　動産及び貸席の賃貸借一日\n２　収穫の季節がある土地の賃貸借については、その季節の後次の耕作に着手する前に、解約の申入れをしなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法622条","statuteOriginal":"第六百二十二条（使用貸借の規定の準用）　第五百九十七条第一項、第五百九十九条第一項及び第二項並びに第六百条の規定は、賃貸借について準用する。\n##### 第四款　敷金","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法621条","statuteOriginal":"第六百二十一条（賃借人の原状回復義務）　賃借人は、賃借物を受け取った後にこれに生じた損傷（通常の使用及び収益によって生じた賃借物の損耗並びに賃借物の経年変化を除く。以下この条において同じ。）がある場合において、賃貸借が終了したときは、その損傷を原状に復する義務を負う。ただし、その損傷が賃借人の責めに帰することができない事由によるものであるときは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法606条第1項","statuteOriginal":"第六百六条（賃貸人による修繕等）　賃貸人は、賃貸物の使用及び収益に必要な修繕をする義務を負う。ただし、賃借人の責めに帰すべき事由によってその修繕が必要となったときは、この限りでない。\n２　賃貸人が賃貸物の保存に必要な行為をしようとするときは、賃借人は、これを拒むことができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法612条","statuteOriginal":"第六百十二条（賃借権の譲渡及び転貸の制限）　賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。\n２　賃借人が前項の規定に違反して第三者に賃借物の使用又は収益をさせたときは、賃貸人は、契約の解除をすることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法613条","statuteOriginal":"第六百十三条（転貸の効果）　賃借人が適法に賃借物を転貸したときは、転借人は、賃貸人と賃借人との間の賃貸借に基づく賃借人の債務の範囲を限度として、賃貸人に対して転貸借に基づく債務を直接履行する義務を負う。この場合においては、賃料の前払をもって賃貸人に対抗することができない。\n２　前項の規定は、賃貸人が賃借人に対してその権利を行使することを妨げない。\n３　賃借人が適法に賃借物を転貸した場合には、賃貸人は、賃借人との間の賃貸借を合意により解除したことをもって転借人に対抗することができない。ただし、その解除の当時、賃貸人が賃借人の債務不履行による解除権を有していたときは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法614条","statuteOriginal":"第六百十四条（賃料の支払時期）　賃料は、動産、建物及び宅地については毎月末に、その他の土地については毎年末に、支払わなければならない。ただし、収穫の季節があるものについては、その季節の後に遅滞なく支払わなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法616条","statuteOriginal":"第六百十六条（賃借人による使用及び収益）　第五百九十四条第一項の規定は、賃貸借について準用する。\n##### 第三款　賃貸借の終了","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法644条受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","statuteOriginal":"第六百四十四条（受任者の注意義務）　受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法645条","statuteOriginal":"第六百四十五条（受任者による報告）　受任者は、委任者の請求があるときは、いつでも委任事務の処理の状況を報告し、委任が終了した後は、遅滞なくその経過及び結果を報告しなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法648条第1項","statuteOriginal":"第六百四十八条（受任者の報酬）　受任者は、特約がなければ、委任者に対して報酬を請求することができない。\n２　受任者は、報酬を受けるべき場合には、委任事務を履行した後でなければ、これを請求することができない。ただし、期間によって報酬を定めたときは、第六百二十四条第二項の規定を準用する。\n３　受任者は、次に掲げる場合には、既にした履行の割合に応じて報酬を請求することができる。\n一　委任者の責めに帰することができない事由によって委任事務の履行をすることができなくなったとき。\n二　委任が履行の中途で終了したとき。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法651条","statuteOriginal":"第六百五十一条（委任の解除）　委任は、各当事者がいつでもその解除をすることができる。\n２　前項の規定により委任の解除をした者は、次に掲げる場合には、相手方の損害を賠償しなければならない。ただし、やむを得ない事由があったときは、この限りでない。\n一　相手方に不利な時期に委任を解除したとき。\n二　委任者が受任者の利益（専ら報酬を得ることによるものを除く。）をも目的とする委任を解除したとき。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法90条公の秩序又は善良の風俗に反する法律行為は、無効とする。","statuteOriginal":"第九十条（公序良俗）　公の秩序又は善良の風俗に反する法律行為は、無効とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法521条","statuteOriginal":"第五百二十一条（契約の締結及び内容の自由）　何人も、法令に特別の定めがある場合を除き、契約をするかどうかを自由に決定することができる。\n２　契約の当事者は、法令の制限内において、契約の内容を自由に決定することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法522条2項契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。","statuteOriginal":"第五百二十二条（契約の成立と方式）　契約は、契約の内容を示してその締結を申し入れる意思表示（以下「申込み」という。）に対して相手方が承諾をしたときに成立する。\n２　契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法94条","statuteOriginal":"第九十四条（虚偽表示）　相手方と通じてした虚偽の意思表示は、無効とする。\n２　前項の規定による意思表示の無効は、善意の第三者に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法591条1項当事者が返還の時期を定めなかったときは、貸主は、相当の期間を定めて返還の催告をすることができる。","statuteOriginal":"第五百九十一条（返還の時期）　当事者が返還の時期を定めなかったときは、貸主は、相当の期間を定めて返還の催告をすることができる。\n２　借主は、返還の時期の定めの有無にかかわらず、いつでも返還をすることができる。\n３　当事者が返還の時期を定めた場合において、貸主は、借主がその時期の前に返還をしたことによって損害を受けたときは、借主に対し、その賠償を請求することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法655条","statuteOriginal":"第六百五十五条（委任の終了の対抗要件）　委任の終了事由は、これを相手方に通知したとき、又は相手方がこれを知っていたときでなければ、これをもってその相手方に対抗することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法555条売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","statuteOriginal":"第五百五十五条（売買）　売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法557条1項","statuteOriginal":"第五百五十七条（手付）　買主が売主に手付を交付したときは、買主はその手付を放棄し、売主はその倍額を現実に提供して、契約の解除をすることができる。ただし、その相手方が契約の履行に着手した後は、この限りでない。\n２　第五百四十五条第四項の規定は、前項の場合には、適用しない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法562条1項","statuteOriginal":"第五百六十二条（買主の追完請求権）　引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。ただし、売主は、買主に不相当な負担を課するものでないときは、買主が請求した方法と異なる方法による履行の追完をすることができる。\n２　前項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、同項の規定による履行の追完の請求をすることができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法557条","statuteOriginal":"第五百五十七条（手付）　買主が売主に手付を交付したときは、買主はその手付を放棄し、売主はその倍額を現実に提供して、契約の解除をすることができる。ただし、その相手方が契約の履行に着手した後は、この限りでない。\n２　第五百四十五条第四項の規定は、前項の場合には、適用しない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法561条","statuteOriginal":"第五百六十一条（他人の権利の売買における売主の義務）　他人の権利（権利の一部が他人に属する場合におけるその権利の一部を含む。）を売買の目的としたときは、売主は、その権利を取得して買主に移転する義務を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法572条","statuteOriginal":"第五百七十二条（担保責任を負わない旨の特約）　売主は、第五百六十二条第一項本文又は第五百六十五条に規定する場合における担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実及び自ら第三者のために設定し又は第三者に譲り渡した権利については、その責任を免れることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法563条2項","statuteOriginal":"第五百六十三条（買主の代金減額請求権）　前条第一項本文に規定する場合において、買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、その不適合の程度に応じて代金の減額を請求することができる。\n２　前項の規定にかかわらず、次に掲げる場合には、買主は、同項の催告をすることなく、直ちに代金の減額を請求することができる。\n一　履行の追完が不能であるとき。\n二　売主が履行の追完を拒絶する意思を明確に表示したとき。\n三　契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、売主が履行の追完をしないでその時期を経過したとき。\n四　前三号に掲げる場合のほか、買主が前項の催告をしても履行の追完を受ける見込みがないことが明らかであるとき。\n３　第一項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、前二項の規定による代金の減額の請求をすることができない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法545条2項","statuteOriginal":"第五百四十五条（解除の効果）　当事者の一方がその解除権を行使したときは、各当事者は、その相手方を原状に復させる義務を負う。ただし、第三者の権利を害することはできない。\n２　前項本文の場合において、金銭を返還するときは、その受領の時から利息を付さなければならない。\n３　第一項本文の場合において、金銭以外の物を返還するときは、その受領の時以後に生じた果実をも返還しなければならない。\n４　解除権の行使は、損害賠償の請求を妨げない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法446条1項保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。","statuteOriginal":"第四百四十六条（保証人の責任等）　保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。\n２　保証契約は、書面でしなければ、その効力を生じない。\n３　保証契約がその内容を記録した電磁的記録によってされたときは、その保証契約は、書面によってされたものとみなして、前項の規定を適用する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法447条","statuteOriginal":"第四百四十七条（保証債務の範囲）　保証債務は、主たる債務に関する利息、違約金、損害賠償その他その債務に従たるすべてのものを包含する。\n２　保証人は、その保証債務についてのみ、違約金又は損害賠償の額を約定することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法454条","statuteOriginal":"第四百五十四条（連帯保証の場合の特則）　保証人は、主たる債務者と連帯して債務を負担したときは、前二条の権利を有しない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法446条2項","statuteOriginal":"第四百四十六条（保証人の責任等）　保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。\n２　保証契約は、書面でしなければ、その効力を生じない。\n３　保証契約がその内容を記録した電磁的記録によってされたときは、その保証契約は、書面によってされたものとみなして、前項の規定を適用する。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法446条","statuteOriginal":"第四百四十六条（保証人の責任等）　保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。\n２　保証契約は、書面でしなければ、その効力を生じない。\n３　保証契約がその内容を記録した電磁的記録によってされたときは、その保証契約は、書面によってされたものとみなして、前項の規定を適用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法423条1項","statuteOriginal":"第四百二十三条（債権者代位権の要件）　債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（以下「被代位権利」という。）を行使することができる。ただし、債務者の一身に専属する権利及び差押えを禁じられた権利は、この限りでない。\n２　債権者は、その債権の期限が到来しない間は、被代位権利を行使することができない。ただし、保存行為は、この限りでない。\n３　債権者は、その債権が強制執行により実現することのできないものであるときは、被代位権利を行使することができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法423条","statuteOriginal":"第四百二十三条（債権者代位権の要件）　債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（以下「被代位権利」という。）を行使することができる。ただし、債務者の一身に専属する権利及び差押えを禁じられた権利は、この限りでない。\n２　債権者は、その債権の期限が到来しない間は、被代位権利を行使することができない。ただし、保存行為は、この限りでない。\n３　債権者は、その債権が強制執行により実現することのできないものであるときは、被代位権利を行使することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法424条","statuteOriginal":"第四百二十四条（詐害行為取消請求）　債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求することができる。ただし、その行為によって利益を受けた者（以下この款において「受益者」という。）がその行為の時において債権者を害することを知らなかったときは、この限りでない。\n２　前項の規定は、財産権を目的としない行為については、適用しない。\n３　債権者は、その債権が第一項に規定する行為の前の原因に基づいて生じたものである場合に限り、同項の規定による請求（以下「詐害行為取消請求」という。）をすることができる。\n４　債権者は、その債権が強制執行により実現することのできないものであるときは、詐害行為取消請求をすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法466条1項債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。","statuteOriginal":"第四百六十六条（債権の譲渡性）　債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。\n２　当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（以下「譲渡制限の意思表示」という。）をしたときであっても、債権の譲渡は、その効力を妨げられない。\n３　前項に規定する場合には、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる。\n４　前項の規定は、債務者が債務を履行しない場合において、同項に規定する第三者が相当の期間を定めて譲渡人への履行の催告をし、その期間内に履行がないときは、その債務者については、適用しない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法466条","statuteOriginal":"第四百六十六条（債権の譲渡性）　債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。\n２　当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（以下「譲渡制限の意思表示」という。）をしたときであっても、債権の譲渡は、その効力を妨げられない。\n３　前項に規定する場合には、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる。\n４　前項の規定は、債務者が債務を履行しない場合において、同項に規定する第三者が相当の期間を定めて譲渡人への履行の催告をし、その期間内に履行がないときは、その債務者については、適用しない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法466条2項","statuteOriginal":"第四百六十六条（債権の譲渡性）　債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。\n２　当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（以下「譲渡制限の意思表示」という。）をしたときであっても、債権の譲渡は、その効力を妨げられない。\n３　前項に規定する場合には、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる。\n４　前項の規定は、債務者が債務を履行しない場合において、同項に規定する第三者が相当の期間を定めて譲渡人への履行の催告をし、その期間内に履行がないときは、その債務者については、適用しない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法649条","statuteOriginal":"第六百四十九条（受任者による費用の前払請求）　委任事務を処理するについて費用を要するときは、委任者は、受任者の請求により、その前払をしなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法646条","statuteOriginal":"第六百四十六条（受任者による受取物の引渡し等）　受任者は、委任事務を処理するに当たって受け取った金銭その他の物を委任者に引き渡さなければならない。その収取した果実についても、同様とする。\n２　受任者は、委任者のために自己の名で取得した権利を委任者に移転しなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法436条","statuteOriginal":"第四百三十六条（連帯債務者に対する履行の請求）　債務の目的がその性質上可分である場合において、法令の規定又は当事者の意思表示によって数人が連帯して債務を負担するときは、債権者は、その連帯債務者の一人に対し、又は同時に若しくは順次に全ての連帯債務者に対し、全部又は一部の履行を請求することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法424条1項","statuteOriginal":"第四百二十四条（詐害行為取消請求）　債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求することができる。ただし、その行為によって利益を受けた者（以下この款において「受益者」という。）がその行為の時において債権者を害することを知らなかったときは、この限りでない。\n２　前項の規定は、財産権を目的としない行為については、適用しない。\n３　債権者は、その債権が第一項に規定する行為の前の原因に基づいて生じたものである場合に限り、同項の規定による請求（以下「詐害行為取消請求」という。）をすることができる。\n４　債権者は、その債権が強制執行により実現することのできないものであるときは、詐害行為取消請求をすることができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法426条","statuteOriginal":"第四百二十六条　詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から二年を経過したときは、提起することができない。行為の時から十年を経過したときも、同様とする。\n#### 第三節　多数当事者の債権及び債務\n##### 第一款　総則","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法140条日、週、月又は年によって期間を定めたときは、期間の初日は、算入しない。ただし、その期間が午前零時から始まるときは、この限りでない。","statuteOriginal":"第百四十条　日、週、月又は年によって期間を定めたときは、期間の初日は、算入しない。ただし、その期間が午前零時から始まるときは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法141条前条の場合には、期間は、その末日の終了をもって満了する。","statuteOriginal":"第百四十一条（期間の満了）　前条の場合には、期間は、その末日の終了をもって満了する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","statuteOriginal":"第七百九条（不法行為による損害賠償）　故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法711条他人の生命を侵害した者は、被害者の父母、配偶者及び子に対しては、その財産権が侵害されなかった場合においても、損害の賠償をしなければならない。","statuteOriginal":"第七百十一条（近親者に対する損害の賠償）　他人の生命を侵害した者は、被害者の父母、配偶者及び子に対しては、その財産権が侵害されなかった場合においても、損害の賠償をしなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法712条","statuteOriginal":"第七百十二条（責任能力）　未成年者は、他人に損害を加えた場合において、自己の行為の責任を弁識するに足りる知能を備えていなかったときは、その行為について賠償の責任を負わない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法724条","statuteOriginal":"第七百二十四条（不法行為による損害賠償請求権の消滅時効）　不法行為による損害賠償の請求権は、次に掲げる場合には、時効によって消滅する。\n一　被害者又はその法定代理人が損害及び加害者を知った時から三年間行使しないとき。\n二　不法行為の時から二十年間行使しないとき。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法710条","statuteOriginal":"第七百十条（財産以外の損害の賠償）　他人の身体、自由若しくは名誉を侵害した場合又は他人の財産権を侵害した場合のいずれであるかを問わず、前条の規定により損害賠償の責任を負う者は、財産以外の損害に対しても、その賠償をしなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法717条1項土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。","statuteOriginal":"第七百十七条（土地の工作物等の占有者及び所有者の責任）　土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。\n２　前項の規定は、竹木の栽植又は支持に瑕疵がある場合について準用する。\n３　前二項の場合において、損害の原因について他にその責任を負う者があるときは、占有者又は所有者は、その者に対して求償権を行使することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法716条","statuteOriginal":"第七百十六条（注文者の責任）　注文者は、請負人がその仕事について第三者に加えた損害を賠償する責任を負わない。ただし、注文又は指図についてその注文者に過失があったときは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法719条","statuteOriginal":"第七百十九条（共同不法行為者の責任）　数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。共同行為者のうちいずれの者がその損害を加えたかを知ることができないときも、同様とする。\n２　行為者を教唆した者及び幇助した者は、共同行為者とみなして、前項の規定を適用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法715条","statuteOriginal":"第七百十五条（使用者等の責任）　ある事業のために他人を使用する者は、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。ただし、使用者が被用者の選任及びその事業の監督について相当の注意をしたとき、又は相当の注意をしても損害が生ずべきであったときは、この限りでない。\n２　使用者に代わって事業を監督する者も、前項の責任を負う。\n３　前二項の規定は、使用者又は監督者から被用者に対する求償権の行使を妨げない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法718条第1項","statuteOriginal":"第七百十八条（動物の占有者等の責任）　動物の占有者は、その動物が他人に加えた損害を賠償する責任を負う。ただし、動物の種類及び性質に従い相当の注意をもってその管理をしたときは、この限りでない。\n２　占有者に代わって動物を管理する者も、前項の責任を負う。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法717条第1項","statuteOriginal":"第七百十七条（土地の工作物等の占有者及び所有者の責任）　土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。\n２　前項の規定は、竹木の栽植又は支持に瑕疵がある場合について準用する。\n３　前二項の場合において、損害の原因について他にその責任を負う者があるときは、占有者又は所有者は、その者に対して求償権を行使することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法717条1項","statuteOriginal":"第七百十七条（土地の工作物等の占有者及び所有者の責任）　土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。\n２　前項の規定は、竹木の栽植又は支持に瑕疵がある場合について準用する。\n３　前二項の場合において、損害の原因について他にその責任を負う者があるときは、占有者又は所有者は、その者に対して求償権を行使することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法717条3項","statuteOriginal":"第七百十七条（土地の工作物等の占有者及び所有者の責任）　土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。\n２　前項の規定は、竹木の栽植又は支持に瑕疵がある場合について準用する。\n３　前二項の場合において、損害の原因について他にその責任を負う者があるときは、占有者又は所有者は、その者に対して求償権を行使することができる。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法717条","statuteOriginal":"第七百十七条（土地の工作物等の占有者及び所有者の責任）　土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。\n２　前項の規定は、竹木の栽植又は支持に瑕疵がある場合について準用する。\n３　前二項の場合において、損害の原因について他にその責任を負う者があるときは、占有者又は所有者は、その者に対して求償権を行使することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法882条相続は、死亡によって開始する。","statuteOriginal":"第八百八十二条（相続開始の原因）　相続は、死亡によって開始する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。","statuteOriginal":"第八百九十六条（相続の一般的効力）　相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法653条","statuteOriginal":"第六百五十三条（委任の終了事由）　委任は、次に掲げる事由によって終了する。\n一　委任者又は受任者の死亡\n二　委任者又は受任者が破産手続開始の決定を受けたこと。\n三　受任者が後見開始の審判を受けたこと。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法897条","statuteOriginal":"第八百九十七条（祭祀に関する権利の承継）　系譜、祭具及び墳墓の所有権は、前条の規定にかかわらず、慣習に従って祖先の祭祀を主宰すべき者が承継する。ただし、被相続人の指定に従って祖先の祭祀を主宰すべき者があるときは、その者が承継する。\n２　前項本文の場合において慣習が明らかでないときは、同項の権利を承継すべき者は、家庭裁判所が定める。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法921条","statuteOriginal":"第九百二十一条（法定単純承認）　次に掲げる場合には、相続人は、単純承認をしたものとみなす。\n一　相続人が相続財産の全部又は一部を処分したとき。ただし、保存行為及び第六百二条に定める期間を超えない賃貸をすることは、この限りでない。\n二　相続人が第九百十五条第一項の期間内に限定承認又は相続の放棄をしなかったとき。\n三　相続人が、限定承認又は相続の放棄をした後であっても、相続財産の全部若しくは一部を隠匿し、私にこれを消費し、又は悪意でこれを相続財産の目録中に記載しなかったとき。ただし、その相続人が相続の放棄をしたことによって相続人となった者が相続の承認をした後は、この限りでない。\n##### 第二款　限定承認","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法32条","statuteOriginal":"第三十二条（失踪の宣告の取消し）　失踪者が生存すること又は前条に規定する時と異なる時に死亡したことの証明があったときは、家庭裁判所は、本人又は利害関係人の請求により、失踪の宣告を取り消さなければならない。この場合において、その取消しは、失踪の宣告後その取消し前に善意でした行為の効力に影響を及ぼさない。\\n２　失踪の宣告によって財産を得た者は、その取消しによって権利を失う。ただし、現に利益を受けている限度においてのみ、その財産を返還する義務を負う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1042条","statuteOriginal":"第千四十二条（遺留分の帰属及びその割合）　兄弟姉妹以外の相続人は、遺留分として、次条第一項に規定する遺留分を算定するための財産の価額に、次の各号に掲げる区分に応じてそれぞれ当該各号に定める割合を乗じた額を受ける。\n一　直系尊属のみが相続人である場合三分の一\n二　前号に掲げる場合以外の場合二分の一\n２　相続人が数人ある場合には、前項各号に定める割合は、これらに第九百条及び第九百一条の規定により算定したその各自の相続分を乗じた割合とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1046条","statuteOriginal":"第千四十六条（遺留分侵害額の請求）　遺留分権利者及びその承継人は、受遺者（特定財産承継遺言により財産を承継し又は相続分の指定を受けた相続人を含む。以下この章において同じ。）又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。\n２　遺留分侵害額は、第千四十二条の規定による遺留分から第一号及び第二号に掲げる額を控除し、これに第三号に掲げる額を加算して算定する。\n一　遺留分権利者が受けた遺贈又は第九百三条第一項に規定する贈与の価額\n二　第九百条から第九百二条まで、第九百三条及び第九百四条の規定により算定した相続分に応じて遺留分権利者が取得すべき遺産の価額\n三　被相続人が相続開始の時において有した債務のうち、第八百九十九条の規定により遺留分権利者が承継する債務（次条第三項において「遺留分権利者承継債務」という。）の額","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1042条1項兄弟姉妹以外の相続人は、遺留分として、所定の割合に相当する額を受ける。","statuteOriginal":"第千四十二条（遺留分の帰属及びその割合）　兄弟姉妹以外の相続人は、遺留分として、次条第一項に規定する遺留分を算定するための財産の価額に、次の各号に掲げる区分に応じてそれぞれ当該各号に定める割合を乗じた額を受ける。\n一　直系尊属のみが相続人である場合三分の一\n二　前号に掲げる場合以外の場合二分の一\n２　相続人が数人ある場合には、前項各号に定める割合は、これらに第九百条及び第九百一条の規定により算定したその各自の相続分を乗じた割合とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1046条1項遺留分権利者及びその承継人は、受遺者又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","statuteOriginal":"第千四十六条（遺留分侵害額の請求）　遺留分権利者及びその承継人は、受遺者（特定財産承継遺言により財産を承継し又は相続分の指定を受けた相続人を含む。以下この章において同じ。）又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。\n２　遺留分侵害額は、第千四十二条の規定による遺留分から第一号及び第二号に掲げる額を控除し、これに第三号に掲げる額を加算して算定する。\n一　遺留分権利者が受けた遺贈又は第九百三条第一項に規定する贈与の価額\n二　第九百条から第九百二条まで、第九百三条及び第九百四条の規定により算定した相続分に応じて遺留分権利者が取得すべき遺産の価額\n三　被相続人が相続開始の時において有した債務のうち、第八百九十九条の規定により遺留分権利者が承継する債務（次条第三項において「遺留分権利者承継債務」という。）の額","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1049条第1項","statuteOriginal":"第千四十九条（遺留分の放棄）　相続の開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生ずる。\n２　共同相続人の一人のした遺留分の放棄は、他の各共同相続人の遺留分に影響を及ぼさない。\n### 第十章　特別の寄与","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法1049条第2項","statuteOriginal":"第千四十九条（遺留分の放棄）　相続の開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生ずる。\n２　共同相続人の一人のした遺留分の放棄は、他の各共同相続人の遺留分に影響を及ぼさない。\n### 第十章　特別の寄与","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法975条","statuteOriginal":"第九百七十五条（共同遺言の禁止）　遺言は、二人以上の者が同一の証書ですることができない。\n##### 第二款　特別の方式","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法990条","statuteOriginal":"第九百九十条（包括受遺者の権利義務）　包括受遺者は、相続人と同一の権利義務を有する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法246条裁判所は、当事者が申し立てていない事項について、判決をすることができない。","statuteOriginal":"第二百四十六条（判決事項）　裁判所は、当事者が申し立てていない事項について、判決をすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法4条1項","statuteOriginal":"第四条（普通裁判籍による管轄）　訴えは、被告の普通裁判籍の所在地を管轄する裁判所の管轄に属する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法5条","statuteOriginal":"第五条（財産権上の訴え等についての管轄）　次の各号に掲げる訴えは、それぞれ当該各号に定める地を管轄する裁判所に提起することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法11条","statuteOriginal":"第十一条（管轄の合意）　当事者は、第一審に限り、合意により管轄裁判所を定めることができる。\\n２　前項の合意は、一定の法律関係に基づく訴えに関し、かつ、書面でしなければ、その効力を生じない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法12条被告が第一審裁判所において管轄違いの抗弁を提出しないで本案について弁論等をしたときは、その裁判所は管轄権を有する。","statuteOriginal":"第十二条（応訴管轄）　被告が第一審裁判所において管轄違いの抗弁を提出しないで本案について弁論をし、又は弁論準備手続において申述をしたときは、その裁判所は、管轄権を有する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法29条法人でない社団又は財団で代表者又は管理人の定めがあるものは、その名において訴え、又は訴えられることができる。","statuteOriginal":"第二十九条（法人でない社団等の当事者能力）　法人でない社団又は財団で代表者又は管理人の定めがあるものは、その名において訴え、又は訴えられることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法124条","statuteOriginal":"第百二十四条（訴訟手続の中断及び受継）　次の各号に掲げる事由があるときは、訴訟手続は、中断する。この場合においては、それぞれ当該各号に定める者は、訴訟手続を受け継がなければならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民訴法179条裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。民訴法181条1項裁判所は、当事者が申し出た証拠で必要でないと認めるものは、取り調べることを要しない。","statuteOriginal":"第百七十九条（証明することを要しない事実）　裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法92条","statuteOriginal":"第九十二条（秘密保護のための閲覧等の制限）　次に掲げる事由につき疎明があった場合には、裁判所は、当該当事者の申立てにより、決定で、当該訴訟記録中当該秘密が記載され、又は記録された部分に係る訴訟記録の閲覧等（非電磁的訴訟記録の閲覧等又は電磁的訴訟記録の閲覧等をいう。第百三十三条第三項において同じ。）（以下この条において「秘密記載部分の閲覧等」という。）の請求をすることができる者を当事者に限ることができる。\n一　訴訟記録中に当事者の私生活についての重大な秘密が記載され、又は記録されており、かつ、第三者が秘密記載部分の閲覧等を行うことにより、その当事者が社会生活を営むのに著しい支障を生ずるおそれがあること。\n二　訴訟記録中に当事者が保有する営業秘密（不正競争防止法第二条第六項に規定する営業秘密をいう。以下同じ。）が記載され、又は記録されていること。\n２　前項の申立てがあったときは、その申立てについての裁判が確定するまで、第三者は、秘密記載部分の閲覧等の請求をすることができない。\n３　秘密記載部分の閲覧等の請求をしようとする第三者は、訴訟記録の存する裁判所に対し、第一項に規定する要件を欠くこと又はこれを欠くに至ったことを理由として、同項の決定の取消しの申立てをすることができる。\n４　第一項の申立てを却下した裁判及び前項の申立てについての裁判に対しては、即時抗告をすることができる。\n５　第一項の決定を取り消す裁判は、確定しなければその効力を生じない。\n６　第一項の申立て（同項第一号に掲げる事由があることを理由とするものに限る。次項及び第八項において同じ。）があった場合において、当該申立て後に第三者がその訴訟への参加をしたときは、裁判所書記官は、当該申立てをした当事者に対し、その参加後直ちに、その参加があった旨を通知しなければならない。ただし、当該申立てを却下する裁判が確定したときは、この限りでない。\n７　前項本文の場合において、裁判所書記官は、同項の規定による通知があった日から二週間を経過する日までの間、その参加をした者に第一項の申立てに係る秘密記載部分の閲覧等をさせてはならない。ただし、第百三十三条の二第二項の申立てがされたときは、この限りでない。\n８　前二項の規定は、第六項の参加をした者に第一項の申立てに係る秘密記載部分の閲覧等をさせることについて同項の申立てをした当事者の全ての同意があるときは、適用しない。\n９　裁判所は、第一項の申立て（同項第二号に掲げる事由があることを理由とするものに限る。次項において同じ。）があった場合において、当該申立てに係る営業秘密がその訴訟の追行の目的以外の目的で使用され、又は当該営業秘密が開示されることにより、当該営業秘密に基づく当事者の事業活動に支障を生ずるおそれがあり、これを防止するため特に必要があると認めるときは、電磁的訴訟記録中当該営業秘密が記録された部分につき、その内容を書面に出力し、又はこれを他の記録媒体に記録するとともに、当該部分を電磁的訴訟記録から消去する措置その他の当該営業秘密の安全管理のために必要かつ適切なものとして最高裁判所規則で定める措置を講ずることができる。\n１０　前項の規定による電磁的訴訟記録から消去する措置が講じられた場合において、その後に第一項の申立てを却下する裁判が確定したとき、又は当該申立てに係る決定を取り消す裁判が確定したときは、裁判所書記官は、当該営業秘密が記載され、又は記録された部分をファイルに記録しなければならない。\n#### 第二節　専門委員等\n##### 第一款　専門委員","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民訴法224条1項当事者が文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。","statuteOriginal":"第二百二十四条（当事者が文書提出命令に従わない場合等の効果）　当事者が文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。\n２　当事者が相手方の使用を妨げる目的で提出の義務がある文書を滅失させ、その他これを使用することができないようにしたときも、前項と同様とする。\n３　前二項に規定する場合において、相手方が、当該文書の記載に関して具体的な主張をすること及び当該文書により証明すべき事実を他の証拠により証明することが著しく困難であるときは、裁判所は、その事実に関する相手方の主張を真実と認めることができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法225条","statuteOriginal":"第二百二十五条（第三者が文書提出命令に従わない場合の過料）　第三者が文書提出命令に従わないときは、裁判所は、決定で、二十万円以下の過料に処する。\n２　前項の決定に対しては、即時抗告をすることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法224条","statuteOriginal":"第二百二十四条（当事者が文書提出命令に従わない場合等の効果）　当事者が文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。\n２　当事者が相手方の使用を妨げる目的で提出の義務がある文書を滅失させ、その他これを使用することができないようにしたときも、前項と同様とする。\n３　前二項に規定する場合において、相手方が、当該文書の記載に関して具体的な主張をすること及び当該文書により証明すべき事実を他の証拠により証明することが著しく困難であるときは、裁判所は、その事実に関する相手方の主張を真実と認めることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法267条和解又は請求の放棄若しくは認諾を調書に記載したときは、その記載は、確定判決と同一の効力を有する。","statuteOriginal":"第二百六十七条（和解等に係る電子調書の効力）　裁判所書記官が、和解又は請求の放棄若しくは認諾について電子調書を作成し、これをファイルに記録したときは、その記録は、確定判決と同一の効力を有する。\n２　前項の規定によりファイルに記録された電子調書は、当事者に送達しなければならない。この場合においては、第二百五十五条第二項の規定を準用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法261条1項訴えは、判決が確定するまで、その全部又は一部を取り下げることができる。","statuteOriginal":"第二百六十一条（訴えの取下げ）　訴えは、判決が確定するまで、その全部又は一部を取り下げることができる。\n２　訴えの取下げは、相手方が本案について準備書面を提出し、弁論準備手続において申述をし、又は口頭弁論をした後にあっては、相手方の同意を得なければ、その効力を生じない。ただし、本訴の取下げがあった場合における反訴の取下げについては、この限りでない。\n３　訴えの取下げは、書面でしなければならない。\n４　前項の規定にかかわらず、口頭弁論、弁論準備手続又は和解の期日（以下この章において「口頭弁論等の期日」という。）において訴えの取下げをするときは、口頭ですることを妨げない。この場合において、裁判所書記官は、その期日の電子調書に訴えの取下げがされた旨を記録しなければならない。\n５　第二項本文の場合において、訴えの取下げが書面でされたときはその書面を、訴えの取下げが口頭弁論等の期日において口頭でされたとき（相手方がその期日に出頭したときを除く。）は前項の規定により訴えの取下げがされた旨が記録された電子調書を相手方に送達しなければならない。\n６　訴えの取下げの書面の送達を受けた日から二週間以内に相手方が異議を述べないときは、訴えの取下げに同意したものとみなす。訴えの取下げが口頭弁論等の期日において口頭でされた場合において、相手方がその期日に出頭したときは訴えの取下げがあった日から、相手方がその期日に出頭しなかったときは前項の規定による送達があった日から二週間以内に相手方が異議を述べないときも、同様とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法262条第1項","statuteOriginal":"第二百六十二条（訴えの取下げの効果）　訴訟は、訴えの取下げがあった部分については、初めから係属していなかったものとみなす。\n２　本案について終局判決があった後に訴えを取り下げた者は、同一の訴えを提起することができない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法111条","statuteOriginal":"第百十一条（公示送達の方法）　公示送達は、次の各号に掲げる区分に応じ、それぞれ当該各号に定める事項を最高裁判所規則で定める方法により不特定多数の者が閲覧することができる状態に置く措置をとるとともに、当該事項が記載された書面を裁判所の掲示場に掲示し、又は当該事項を裁判所に設置した電子計算機の映像面に表示したものの閲覧をすることができる状態に置く措置をとることによってする。\n一　書類の公示送達裁判所書記官が送達すべき書類を保管し、いつでも送達を受けるべき者に交付すべきこと。\n二　電磁的記録の公示送達裁判所書記官が、送達すべき電磁的記録に記録された事項につき、いつでも送達を受けるべき者に第百九条の書面を交付し、又は第百九条の二第一項本文の規定による措置をとるとともに、同項本文の通知を発すべきこと。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法112条","statuteOriginal":"第百十二条（公示送達の効力発生の時期）　公示送達は、前条の規定による措置を開始した日から二週間を経過することによって、その効力を生ずる。ただし、第百十条第三項の公示送達は、前条の規定による措置を開始した日の翌日にその効力を生ずる。\n２　外国においてすべき送達についてした公示送達にあっては、前項の期間は、六週間とする。\n３　前二項の期間は、短縮することができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法98条第2項","statuteOriginal":"第九十八条（職権送達の原則等）　送達は、特別の定めがある場合を除き、職権でする。\n２　送達に関する事務は、裁判所書記官が取り扱う。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法99条","statuteOriginal":"第九十九条（訴訟無能力者等に対する送達）　訴訟無能力者に対する送達は、その法定代理人にする。\n２　数人が共同して代理権を行うべき場合には、送達は、その一人にすれば足りる。\n３　刑事施設に収容されている者に対する送達は、刑事施設の長にする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法133条1項訴えの提起は、訴状を裁判所に提出してしなければならない。","statuteOriginal":"第百三十三条（申立人の住所、氏名等の秘匿）　申立て等をする者又はその法定代理人の住所、居所その他その通常所在する場所（以下この項及び次項において「住所等」という。）の全部又は一部が当事者に知られることによって当該申立て等をする者又は当該法定代理人が社会生活を営むのに著しい支障を生ずるおそれがあることにつき疎明があった場合には、裁判所は、申立てにより、決定で、住所等の全部又は一部を秘匿する旨の裁判をすることができる。申立て等をする者又はその法定代理人の氏名その他当該者を特定するに足りる事項（次項において「氏名等」という。）についても、同様とする。\n２　前項の申立てをするときは、同項の申立て等をする者又はその法定代理人（以下この章において「秘匿対象者」という。）の住所等又は氏名等（次条第二項において「秘匿事項」という。）その他最高裁判所規則で定める事項を書面その他最高裁判所規則で定める方法により届け出なければならない。\n３　第一項の申立てがあったときは、その申立てについての裁判が確定するまで、当該申立てに係る秘匿対象者以外の者は、訴訟記録等（訴訟記録又は第百三十二条の四第一項の処分の申立てに係る事件の記録をいう。以下この章において同じ。）中前項の規定による届出に係る部分（次条において「秘匿事項届出部分」という。）について訴訟記録等の閲覧等（訴訟記録の閲覧等、非電磁的証拠収集処分記録の閲覧等又は電磁的証拠収集処分記録の閲覧等をいう。以下この章において同じ。）の請求をすることができない。\n４　第一項の申立てを却下した裁判に対しては、即時抗告をすることができる。\n５　裁判所は、秘匿対象者の住所又は氏名について第一項の決定（以下この章において「秘匿決定」という。）をする場合には、当該秘匿決定において、当該秘匿対象者の住所又は氏名に代わる事項を定めなければならない。この場合において、その事項を当該事件並びにその事件についての反訴、参加、強制執行、仮差押え及び仮処分に関する手続において記載し、又は記録したときは、この法律その他の法令の規定の適用については、当該秘匿対象者の住所又は氏名を記載し、又は記録したものとみなす。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法140条","statuteOriginal":"第百四十条（口頭弁論を経ない訴えの却下）　訴えが不適法でその不備を補正することができないときは、裁判所は、口頭弁論を経ないで、判決で、訴えを却下することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"土地家屋調査士法","citationLabel":"土地家屋調査士法3条2項前項第七号及び第八号に規定する業務は、法務大臣が指定する研修の課程を修了し、考査に合格して認定を受けた土地家屋調査士に限り、行うことができる。","statuteOriginal":"第三条（業務）　調査士は、他人の依頼を受けて、次に掲げる事務を行うことを業とする。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/325AC1000000228"},{"lawTitle":"土地家屋調査士法","citationLabel":"土地家屋調査士法22条","statuteOriginal":"第二十二条（依頼に応ずる義務）　調査士は、正当な事由がある場合でなければ、依頼（第三条第一項第四号及び第六号（第四号に関する部分に限る。）に規定する業務並びに民間紛争解決手続代理関係業務に関するものを除く。）を拒んではならない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/325AC1000000228"},{"lawTitle":"土地家屋調査士法","citationLabel":"土地家屋調査士法3条1項","statuteOriginal":"第三条（業務）　調査士は、他人の依頼を受けて、次に掲げる事務を行うことを業とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/325AC1000000228"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法261条","statuteOriginal":"第二百六十一条（訴えの取下げ）　訴えは、判決が確定するまで、その全部又は一部を取り下げることができる。\n２　訴えの取下げは、相手方が本案について準備書面を提出し、弁論準備手続において申述をし、又は口頭弁論をした後にあっては、相手方の同意を得なければ、その効力を生じない。ただし、本訴の取下げがあった場合における反訴の取下げについては、この限りでない。\n３　訴えの取下げは、書面でしなければならない。\n４　前項の規定にかかわらず、口頭弁論、弁論準備手続又は和解の期日（以下この章において「口頭弁論等の期日」という。）において訴えの取下げをするときは、口頭ですることを妨げない。この場合において、裁判所書記官は、その期日の電子調書に訴えの取下げがされた旨を記録しなければならない。\n５　第二項本文の場合において、訴えの取下げが書面でされたときはその書面を、訴えの取下げが口頭弁論等の期日において口頭でされたとき（相手方がその期日に出頭したときを除く。）は前項の規定により訴えの取下げがされた旨が記録された電子調書を相手方に送達しなければならない。\n６　訴えの取下げの書面の送達を受けた日から二週間以内に相手方が異議を述べないときは、訴えの取下げに同意したものとみなす。訴えの取下げが口頭弁論等の期日において口頭でされた場合において、相手方がその期日に出頭したときは訴えの取下げがあった日から、相手方がその期日に出頭しなかったときは前項の規定による送達があった日から二週間以内に相手方が異議を述べないときも、同様とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法267条","statuteOriginal":"第二百六十七条（和解等に係る電子調書の効力）　裁判所書記官が、和解又は請求の放棄若しくは認諾について電子調書を作成し、これをファイルに記録したときは、その記録は、確定判決と同一の効力を有する。\n２　前項の規定によりファイルに記録された電子調書は、当事者に送達しなければならない。この場合においては、第二百五十五条第二項の規定を準用する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"日本国憲法","citationLabel":"憲法76条2項特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行うことができない。","statuteOriginal":"第七十六条　すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。\n②　特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行ふことができない。\n③　すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法82条1項裁判の対審及び判決は、公開法廷でこれを行う。","statuteOriginal":"第八十二条　裁判の対審及び判決は、公開法廷でこれを行ふ。\n②　裁判所が、裁判官の全員一致で、公の秩序又は善良の風俗を害する虞があると決した場合には、対審は、公開しないでこれを行ふことができる。但し、政治犯罪、出版に関する犯罪又はこの憲法第三章で保障する国民の権利が問題となつてゐる事件の対審は、常にこれを公開しなければならない。\n### 第七章　財政","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"日本国憲法","citationLabel":"憲法76条3項","statuteOriginal":"第七十六条　すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。\n②　特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行ふことができない。\n③　すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。","targetParagraph":"3","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民法","citationLabel":"民法572条売主は、担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実等については、その責任を免れることができない。","statuteOriginal":"第五百七十二条（担保責任を負わない旨の特約）　売主は、第五百六十二条第一項本文又は第五百六十五条に規定する場合における担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実及び自ら第三者のために設定し又は第三者に譲り渡した権利については、その責任を免れることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法562条2項","statuteOriginal":"第五百六十二条（買主の追完請求権）　引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。ただし、売主は、買主に不相当な負担を課するものでないときは、買主が請求した方法と異なる方法による履行の追完をすることができる。\n２　前項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、同項の規定による履行の追完の請求をすることができない。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法419条","statuteOriginal":"第四百十九条（金銭債務の特則）　金銭の給付を目的とする債務の不履行については、その損害賠償の額は、債務者が遅滞の責任を負った最初の時点における法定利率によって定める。ただし、約定利率が法定利率を超えるときは、約定利率による。\n２　前項の損害賠償については、債権者は、損害の証明をすることを要しない。\n３　第一項の損害賠償については、債務者は、不可抗力をもって抗弁とすることができない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法405条","statuteOriginal":"第四百五条（利息の元本への組入れ）　利息の支払が一年分以上延滞した場合において、債権者が催告をしても、債務者がその利息を支払わないときは、債権者は、これを元本に組み入れることができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法404条","statuteOriginal":"第四百四条（法定利率）　利息を生ずべき債権について別段の意思表示がないときは、その利率は、その利息が生じた最初の時点における法定利率による。\n２　法定利率は、年三パーセントとする。\n３　前項の規定にかかわらず、法定利率は、法務省令で定めるところにより、三年を一期とし、一期ごとに、次項の規定により変動するものとする。\n４　各期における法定利率は、この項の規定により法定利率に変動があった期のうち直近のもの（以下この項において「直近変動期」という。）における基準割合と当期における基準割合との差に相当する割合（その割合に一パーセント未満の端数があるときは、これを切り捨てる。）を直近変動期における法定利率に加算し、又は減算した割合とする。\n５　前項に規定する「基準割合」とは、法務省令で定めるところにより、各期の初日の属する年の六年前の年の一月から前々年の十二月までの各月における短期貸付けの平均利率（当該各月において銀行が新たに行った貸付け（貸付期間が一年未満のものに限る。）に係る利率の平均をいう。）の合計を六十で除して計算した割合（その割合に〇・一パーセント未満の端数があるときは、これを切り捨てる。）として法務大臣が告示するものをいう。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法157条1項","statuteOriginal":"第百五十七条（時機に後れた攻撃防御方法の却下等）　当事者が故意又は重大な過失により時機に後れて提出した攻撃又は防御の方法については、これにより訴訟の完結を遅延させることとなると認めたときは、裁判所は、申立てにより又は職権で、却下の決定をすることができる。\n２　攻撃又は防御の方法でその趣旨が明瞭でないものについて当事者が必要な釈明をせず、又は釈明をすべき期日に出頭しないときも、前項と同様とする。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法133条","statuteOriginal":"第百三十三条（申立人の住所、氏名等の秘匿）　申立て等をする者又はその法定代理人の住所、居所その他その通常所在する場所（以下この項及び次項において「住所等」という。）の全部又は一部が当事者に知られることによって当該申立て等をする者又は当該法定代理人が社会生活を営むのに著しい支障を生ずるおそれがあることにつき疎明があった場合には、裁判所は、申立てにより、決定で、住所等の全部又は一部を秘匿する旨の裁判をすることができる。申立て等をする者又はその法定代理人の氏名その他当該者を特定するに足りる事項（次項において「氏名等」という。）についても、同様とする。\n２　前項の申立てをするときは、同項の申立て等をする者又はその法定代理人（以下この章において「秘匿対象者」という。）の住所等又は氏名等（次条第二項において「秘匿事項」という。）その他最高裁判所規則で定める事項を書面その他最高裁判所規則で定める方法により届け出なければならない。\n３　第一項の申立てがあったときは、その申立てについての裁判が確定するまで、当該申立てに係る秘匿対象者以外の者は、訴訟記録等（訴訟記録又は第百三十二条の四第一項の処分の申立てに係る事件の記録をいう。以下この章において同じ。）中前項の規定による届出に係る部分（次条において「秘匿事項届出部分」という。）について訴訟記録等の閲覧等（訴訟記録の閲覧等、非電磁的証拠収集処分記録の閲覧等又は電磁的証拠収集処分記録の閲覧等をいう。以下この章において同じ。）の請求をすることができない。\n４　第一項の申立てを却下した裁判に対しては、即時抗告をすることができる。\n５　裁判所は、秘匿対象者の住所又は氏名について第一項の決定（以下この章において「秘匿決定」という。）をする場合には、当該秘匿決定において、当該秘匿対象者の住所又は氏名に代わる事項を定めなければならない。この場合において、その事項を当該事件並びにその事件についての反訴、参加、強制執行、仮差押え及び仮処分に関する手続において記載し、又は記録したときは、この法律その他の法令の規定の適用については、当該秘匿対象者の住所又は氏名を記載し、又は記録したものとみなす。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民法","citationLabel":"民法604条","statuteOriginal":"第六百四条（賃貸借の存続期間）　賃貸借の存続期間は、五十年を超えることができない。契約でこれより長い期間を定めたときであっても、その期間は、五十年とする。\n２　賃貸借の存続期間は、更新することができる。ただし、その期間は、更新の時から五十年を超えることができない。\n##### 第二款　賃貸借の効力","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法269条","statuteOriginal":"第二百六十九条（工作物等の収去等）　地上権者は、その権利が消滅した時に、土地を原状に復してその工作物及び竹木を収去することができる。ただし、土地の所有者が時価相当額を提供してこれを買い取る旨を通知したときは、地上権者は、正当な理由がなければ、これを拒むことができない。\n２　前項の規定と異なる慣習があるときは、その慣習に従う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法369条第2項","statuteOriginal":"第三百六十九条（抵当権の内容）　抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。\n２　地上権及び永小作権も、抵当権の目的とすることができる。この場合においては、この章の規定を準用する。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法605条不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。","statuteOriginal":"第六百五条（不動産賃貸借の対抗力）　不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"借地借家法","citationLabel":"借地借家法10条1項借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","statuteOriginal":"第十条（借地権の対抗力）　借地権は、その登記がなくても、土地の上に借地権者が登記されている建物を所有するときは、これをもって第三者に対抗することができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/403AC0000000090"},{"lawTitle":"借地借家法","citationLabel":"借地借家法19条1項","statuteOriginal":"第十九条（土地の賃借権の譲渡又は転貸の許可）　借地権者が賃借権の目的である土地の上の建物を第三者に譲渡しようとする場合において、その第三者が賃借権を取得し、又は転借をしても借地権設定者に不利となるおそれがないにもかかわらず、借地権設定者がその賃借権の譲渡又は転貸を承諾しないときは、裁判所は、借地権者の申立てにより、借地権設定者の承諾に代わる許可を与えることができる。この場合において、当事者間の利益の衡平を図るため必要があるときは、賃借権の譲渡若しくは転貸を条件とする借地条件の変更を命じ、又はその許可を財産上の給付に係らしめることができる。\n２　裁判所は、前項の裁判をするには、賃借権の残存期間、借地に関する従前の経過、賃借権の譲渡又は転貸を必要とする事情その他一切の事情を考慮しなければならない。\n３　第一項の申立てがあった場合において、裁判所が定める期間内に借地権設定者が自ら建物の譲渡及び賃借権の譲渡又は転貸を受ける旨の申立てをしたときは、裁判所は、同項の規定にかかわらず、相当の対価及び転貸の条件を定めて、これを命ずることができる。この裁判においては、当事者双方に対し、その義務を同時に履行すべきことを命ずることができる。\n４　前項の申立ては、第一項の申立てが取り下げられたとき、又は不適法として却下されたときは、その効力を失う。\n５　第三項の裁判があった後は、第一項又は第三項の申立ては、当事者の合意がある場合でなければ取り下げることができない。\n６　裁判所は、特に必要がないと認める場合を除き、第一項又は第三項の裁判をする前に鑑定委員会の意見を聴かなければならない。\n７　前各項の規定は、転借地権が設定されている場合における転借地権者と借地権設定者との間について準用する。ただし、借地権設定者が第三項の申立てをするには、借地権者の承諾を得なければならない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/403AC0000000090"},{"lawTitle":"民法","citationLabel":"民法239条","statuteOriginal":"第二百三十九条（無主物の帰属）　所有者のない動産は、所有の意思をもって占有することによって、その所有権を取得する。\n２　所有者のない不動産は、国庫に帰属する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法242条不動産の所有者は、その不動産に従として付合した物の所有権を取得する。ただし、権原によってその物を附属させた他人の権利を妨げない。","statuteOriginal":"第二百四十二条（不動産の付合）　不動産の所有者は、その不動産に従として付合した物の所有権を取得する。ただし、権原によってその物を附属させた他人の権利を妨げない。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法246条","statuteOriginal":"第二百四十六条（加工）　他人の動産に工作を加えた者（以下この条において「加工者」という。）があるときは、その加工物の所有権は、材料の所有者に帰属する。ただし、工作によって生じた価格が材料の価格を著しく超えるときは、加工者がその加工物の所有権を取得する。\n２　前項に規定する場合において、加工者が材料の一部を供したときは、その価格に工作によって生じた価格を加えたものが他人の材料の価格を超えるときに限り、加工者がその加工物の所有権を取得する。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法622条の2第1項","statuteOriginal":"第六百二十二条（使用貸借の規定の準用）　第五百九十七条第一項、第五百九十九条第一項及び第二項並びに第六百条の規定は、賃貸借について準用する。\n##### 第四款　敷金","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法622条1項","statuteOriginal":"第六百二十二条（使用貸借の規定の準用）　第五百九十七条第一項、第五百九十九条第一項及び第二項並びに第六百条の規定は、賃貸借について準用する。\n##### 第四款　敷金","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法127条","statuteOriginal":"第百二十七条（条件が成就した場合の効果）　停止条件付法律行為は、停止条件が成就した時からその効力を生ずる。\n２　解除条件付法律行為は、解除条件が成就した時からその効力を失う。\n３　当事者が条件が成就した場合の効果をその成就した時以前にさかのぼらせる意思を表示したときは、その意思に従う。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法130条","statuteOriginal":"第百三十条（条件の成就の妨害等）　条件が成就することによって不利益を受ける当事者が故意にその条件の成就を妨げたときは、相手方は、その条件が成就したものとみなすことができる。\n２　条件が成就することによって利益を受ける当事者が不正にその条件を成就させたときは、相手方は、その条件が成就しなかったものとみなすことができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法134条","statuteOriginal":"第百三十四条（随意条件）　停止条件付法律行為は、その条件が単に債務者の意思のみに係るときは、無効とする。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法129条","statuteOriginal":"第百二十九条（条件の成否未定の間における権利の処分等）　条件の成否が未定である間における当事者の権利義務は、一般の規定に従い、処分し、相続し、若しくは保存し、又はそのために担保を供することができる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"民法","citationLabel":"民法130条1項","statuteOriginal":"第百三十条（条件の成就の妨害等）　条件が成就することによって不利益を受ける当事者が故意にその条件の成就を妨げたときは、相手方は、その条件が成就したものとみなすことができる。\n２　条件が成就することによって利益を受ける当事者が不正にその条件を成就させたときは、相手方は、その条件が成就しなかったものとみなすことができる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"},{"lawTitle":"日本国憲法","citationLabel":"憲法59条2項衆議院で可決し、参議院でこれと異なった議決をした法律案は、衆議院で出席議員の三分の二以上の多数で再び可決したときは、法律となる。","statuteOriginal":"第五十九条　法律案は、この憲法に特別の定のある場合を除いては、両議院で可決したとき法律となる。\n②　衆議院で可決し、参議院でこれと異なつた議決をした法律案は、衆議院で出席議員の三分の二以上の多数で再び可決したときは、法律となる。\n③　前項の規定は、法律の定めるところにより、衆議院が、両議院の協議会を開くことを求めることを妨げない。\n④　参議院が、衆議院の可決した法律案を受け取つた後、国会休会中の期間を除いて六十日以内に、議決しないときは、衆議院は、参議院がその法律案を否決したものとみなすことができる。","targetParagraph":"2","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/321CONSTITUTION"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法114条1項確定判決は、主文に包含するものに限り、既判力を有する。","statuteOriginal":"第百十四条（既判力の範囲）　確定判決は、主文に包含するものに限り、既判力を有する。\n２　相殺のために主張した請求の成立又は不成立の判断は、相殺をもって対抗した額について既判力を有する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"民事訴訟法","citationLabel":"民事訴訟法115条1項","statuteOriginal":"第百十五条（確定判決等の効力が及ぶ者の範囲）　確定判決は、次に掲げる者に対してその効力を有する。\n一　当事者\n二　当事者が他人のために原告又は被告となった場合のその他人\n三　前二号に掲げる者の口頭弁論終結後の承継人\n四　前三号に掲げる者のために請求の目的物を所持する者\n２　前項の規定は、仮執行の宣言について準用する。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/408AC0000000109"},{"lawTitle":"借地借家法","citationLabel":"借地借家法31条1項建物の賃貸借は、その登記がなくても、建物の引渡しがあったときは、その後その建物について物権を取得した者に対し、その効力を生ずる。","statuteOriginal":"第三十一条（建物賃貸借の対抗力）　建物の賃貸借は、その登記がなくても、建物の引渡しがあったときは、その後その建物について物権を取得した者に対し、その効力を生ずる。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/403AC0000000090"},{"lawTitle":"借地借家法","citationLabel":"借地借家法31条","statuteOriginal":"第三十一条（建物賃貸借の対抗力）　建物の賃貸借は、その登記がなくても、建物の引渡しがあったときは、その後その建物について物権を取得した者に対し、その効力を生ずる。","targetParagraph":"","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/403AC0000000090"},{"lawTitle":"民法","citationLabel":"民法613条1項","statuteOriginal":"第六百十三条（転貸の効果）　賃借人が適法に賃借物を転貸したときは、転借人は、賃貸人と賃借人との間の賃貸借に基づく賃借人の債務の範囲を限度として、賃貸人に対して転貸借に基づく債務を直接履行する義務を負う。この場合においては、賃料の前払をもって賃貸人に対抗することができない。\n２　前項の規定は、賃貸人が賃借人に対してその権利を行使することを妨げない。\n３　賃借人が適法に賃借物を転貸した場合には、賃貸人は、賃借人との間の賃貸借を合意により解除したことをもって転借人に対抗することができない。ただし、その解除の当時、賃貸人が賃借人の債務不履行による解除権を有していたときは、この限りでない。","targetParagraph":"1","targetItem":"","lawTopUrl":"https://laws.e-gov.go.jp/law/129AC0000000089"}];
const KEY="adr_exam_app_v1";
const state=JSON.parse(localStorage.getItem(KEY)||'{"answers":{},"review":[],"settings":{"shuffle":false},"session":null,"rewards":{"points":0,"badges":[],"mockPasses":0,"streak":0,"lastPassDate":""}}');
state.rewards=state.rewards||{points:0,badges:[],mockPasses:0,streak:0,lastPassDate:""};
const cats=[...new Set(QUESTIONS.map(q=>q.category))];
const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
let currentView="home";

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1200)}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function answered(q){return state.answers[q.id]}
function statsFor(list){
 let a=list.filter(q=>answered(q)), ok=a.filter(q=>answered(q).correct);
 return {done:a.length,correct:ok.length,rate:a.length?Math.round(ok.length/a.length*100):0}
}
function nav(v){currentView=v; state.session=null; save(); render()}
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));

function home(){
 const s=statsFor(QUESTIONS), rev=state.review.length;
 return `<div class="card"><h1>ADR認定考査 学習アプリ</h1><div class="muted">第11回〜第20回・150問。進捗はこの端末に保存されます。</div></div>
 <div class="grid">
  <div class="card stat"><span class="muted">回答済み</span><b>${s.done}/150</b></div>
  <div class="card stat"><span class="muted">正答率</span><b>${s.rate}%</b></div>
  <div class="card stat"><span class="muted">要復習</span><b>${rev}</b></div>
  <div class="card stat"><span class="muted">未回答</span><b>${150-s.done}</b></div>
 </div>
 <div class="card"><h2>ご褒美ステータス</h2>
  <div class="grid">
   <div class="stat"><span class="muted">ご褒美ポイント</span><b>${state.rewards.points||0}</b></div>
   <div class="stat"><span class="muted">模試60%以上</span><b>${state.rewards.mockPasses||0}回</b></div>
  </div>
  <div class="muted">模擬試験で60％以上なら、点数に応じてポイントとご褒美カードを獲得します。</div>
 </div><div class="card"><h2>すぐ始める</h2>
  <button class="primary" onclick="startSession('all')">全分野から学習</button>
  <button class="secondary" onclick="startMock()">本試験型 模擬試験15問（10回抽出）</button>
  <button class="secondary" onclick="startSession('wrong')">間違えた問題だけ</button>
 </div>
 <div class="card"><h2>年度別</h2><button class="secondary" onclick="openYears()">第11回〜第20回から選ぶ</button></div>
 <div class="card"><h2>分野別</h2>${cats.map(c=>{let z=statsFor(QUESTIONS.filter(q=>q.category===c));return `<button class="category" onclick='startCategory(${JSON.stringify(c)})'><span class="name">${esc(c)}</span><span class="badge">${z.done}/${QUESTIONS.filter(q=>q.category===c).length}・${z.rate}%</span></button>`}).join("")}</div>`;
}
function study(){
 return `<div class="card"><h1>学習モード</h1>
 <button class="primary" onclick="startSession('unanswered')">未回答を優先</button>
 <button class="secondary" onclick="startSession('all')">全150問</button>
 <button class="secondary" onclick="startSession('wrong')">誤答のみ</button>
 <button class="secondary" onclick="startMock()">本試験型15問模擬試験（10回抽出）</button>
 <button class="secondary" onclick="openYears()">年度別に選ぶ</button></div>
 <div class="card"><h2>分野を選ぶ</h2>${cats.map(c=>`<button class="category" onclick='startCategory(${JSON.stringify(c)})'><span class="name">${esc(c)}</span><span class="badge">${QUESTIONS.filter(q=>q.category===c).length}問</span></button>`).join("")}</div>`;
}
function openYears(){currentView="years";state.session=null;save();render()}
function yearsView(){
 let years=[];for(let y=11;y<=20;y++)years.push(y);
 return `<div class="card"><h1>年度別</h1><div class="muted">回を選ぶと、第1問〜第15問を直接開けます。</div></div>
