<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263238">
<title>ADR認定考査 学習アプリ</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f6f7;--card:#fff;--fg:#172025;--muted:#66747c;--line:#dfe4e7;
  --accent:#263238;--accent2:#455a64;--ok:#207a4b;--ng:#b33a3a;--warn:#9a6a00;
  --shadow:0 2px 10px rgba(0,0,0,.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111619;--card:#1b2226;--fg:#eef3f5;--muted:#9aabb4;--line:#344047;
        --accent:#cfd8dc;--accent2:#90a4ae;--ok:#5fd18e;--ng:#ff8b8b;--warn:#e5bd5b;
        --shadow:0 2px 12px rgba(0,0,0,.28)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
button,select,input{font:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:760px;margin:auto;padding:11px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px}
main{max-width:760px;margin:auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 13px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0 0 7px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.strong{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:22px}
.primary,.secondary,.danger{width:100%;border:none;border-radius:13px;padding:12px 14px;font-weight:800;margin:5px 0}
.primary{background:var(--accent);color:var(--bg)}.secondary{background:var(--card);color:var(--fg);border:1px solid var(--line)}.danger{background:var(--ng);color:white}
.category{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:12px;border-radius:12px;margin:7px 0}
.category .name{flex:1;font-weight:700}.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent2) 13%,transparent);color:var(--fg)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent2)}
.qmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.pill{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted)}
.prompt{font-size:17px;font-weight:700;line-height:1.75;margin:10px 0 14px}
.choice{width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 0;line-height:1.65}
.choice.selected{border:2px solid var(--accent2);padding:11px 12px}.choice.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}.choice.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 7%,var(--card))}
.num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;border:1px solid var(--line);margin-right:8px;font-weight:800}
.answerbox{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.detail{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:8px 0}
.detail.ok{border-left:4px solid var(--ok)}.detail.ng{border-left:4px solid var(--ng)}
.detail .mark{font-weight:900}.ok .mark{color:var(--ok)}.ng .mark{color:var(--ng)}
.corrected{margin-top:6px;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--ok) 8%,transparent)}
.refs{font-size:12.5px}.ref{border-left:3px solid var(--accent2);padding:7px 9px;margin:7px 0;background:color-mix(in srgb,var(--accent2) 7%,transparent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--line);padding:max(8px,env(safe-area-inset-bottom)) 10px 8px;z-index:30}
.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navbtn{border:none;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}.navbtn b{display:block;font-size:18px;color:var(--fg)}
.hidden{display:none!important}
.listrow{border-bottom:1px solid var(--line);padding:10px 0}.listrow:last-child{border-bottom:none}
.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0}
input[type=checkbox]{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#222;color:white;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
@media(max-width:420px){.prompt{font-size:16px}.card{padding:14px}.grid{gap:7px}.stat b{font-size:19px}}

.rewardbox{border:2px solid var(--warn);border-radius:16px;padding:15px;margin:14px 0;background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.rewardtitle{font-weight:900;font-size:18px;margin-bottom:7px}
.rewardbig{font-size:28px;font-weight:900}
.confetti{font-size:28px;letter-spacing:4px;text-align:center;margin:8px 0}
</style>

<header><div class="head"><div class="brand">ADR認定考査</div><button class="iconbtn" id="installBtn" style="display:none">インストール</button><button class="iconbtn" id="bookmarkTop" title="要復習">☆</button></div></header>
<main id="app"><div style="margin:10px 0;padding:10px;border:1px solid #aaa;border-radius:10px;font-size:.9rem"><b>軽量完成版：</b>内容・条文原文・解釈・模擬試験・ご褒美機能はそのままに、重複していた条文原文を共通データ化してファイルサイズを削減しています。</div></main>
<div class="bottom"><div class="bottomin">
<button class="navbtn" data-nav="home"><b>⌂</b>ホーム</button>
<button class="navbtn" data-nav="study"><b>▶</b>学習</button>
<button class="navbtn" data-nav="review"><b>↻</b>復習</button>
<button class="navbtn" data-nav="stats"><b>▥</b>成績</button>
</div></div>

<script>
const QUESTIONS=[{"id":1,"year":19,"sourceQuestion":1,"category":"憲法","theme":"財産権","prompt":"財産権に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["政令によって財産権を制限することは、憲法第29条第２項に違反する。","法律に損失補償に関する規定が欠けている場合に、憲法第29条第３項は、補償請求をする直接の根拠にはならない。","憲法第29条第１項は、私有財産制度を保障するものではない。","憲法第29条第３項にいう「私有財産は、正当な補償の下に、これを公共のために用ひることができる。」には、特定の個人が受益者となる場合は含まれない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。憲法29条2項は財産権の内容を公共の福祉に適合するよう『法律で』定めるとしています。政令だけで独自に財産権の内容を制限することはできず、法律上の根拠・委任が必要です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『法律に補償規定がなければ憲法29条3項を直接根拠に請求できない』という部分が誤りです。判例は、特別の犠牲を課す財産権制限について、補償規定がなくても憲法29条3項を根拠に補償請求を認め得るとしています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。憲法29条1項は、個々人の具体的財産権だけでなく、私有財産制度そのものも制度的に保障すると解されています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『特定の個人が受益者となる場合は含まれない』という限定はありません。公共目的のための財産権制限・収用であれば、結果として特定人が利益を受ける場合でも29条3項の問題となり得ます。","corrected":"","inferredBasis":["憲法29条"]}],"references":["憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":0},{"learningNote":"憲法29条2項は財産権の内容を公共の福祉に適合するよう『法律で』定めるとしています。","statuteRef":1},{"learningNote":"『法律に補償規定がなければ憲法29条3項を直接根拠に請求できない』という部分が誤りです。","statuteRef":2},{"learningNote":"憲法29条1項は、個々人の具体的財産権だけでなく、私有財産制度そのものも制度的に保障すると解されています。","statuteRef":3}]},{"id":2,"year":16,"sourceQuestion":1,"category":"憲法","theme":"財産権","prompt":"財産権の保障に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["財産権の内容を条例によって制限することはできない。","私有財産が制限された場合、その補償を定めた法律がなければ、補償請求をすることはできない。","法令により財産権を制約された場合、たとえそれが財産権に内在する社会的制約であったとしても、補償を要しないものとすることはできない。","財産権は、個人が有する具体的な財産上の権利を保障するとともに、私有財産制を保障するものである。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。財産権の内容は法律で定めるのが原則ですが、法律の具体的授権の範囲内で条例が財産権を制限することまで一律に禁止されるわけではありません。","corrected":"","inferredBasis":["憲法29条"]},{"mark":"×","explanation":"誤り。補償規定が法律にないことだけで補償請求が当然に否定されるわけではありません。特別の犠牲を課す場合には憲法29条3項を直接根拠として補償請求が認められ得ます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。財産権に内在する一般的・社会的制約については、補償を要しない場合があります。すべての財産権制約が必ず損失補償を要するわけではありません。","corrected":"","inferredBasis":["憲法29条"]},{"mark":"○","explanation":"正しい。憲法29条1項は、個人が有する具体的な財産上の権利とともに、私有財産制度そのものを保障すると解されています。","corrected":"","inferredBasis":[]}],"references":["憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":0},{"learningNote":"特別の犠牲を課す場合には憲法29条3項を直接根拠として補償請求が認められ得ます。","statuteRef":2},{"learningNote":"憲法29条1項は、個人が有する具体的な財産上の権利とともに、私有財産制度そのものを保障すると解されています。","statuteRef":3}]},{"id":3,"year":11,"sourceQuestion":2,"category":"憲法","theme":"財産権","prompt":"財産権に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["憲法第２９条第２項は，財産権の内容が法律によって一般的に制限されるものであるという趣旨を明らかにした規定であるが，法律の範囲内であれば，条例による財産権の制限も許される。","憲法第２９条第３項は，個人の具体的な補償請求権まで保障したものではないから，補償請求には法令上の具体的規定が必要である。","憲法第２９条第１項は，私有財産制度のみならず，個人の具体的な財産権も保障するものである。","憲法第２９条第３項は，公共のために私有財産を収用又は制限することができること及びその場合に正当な補償が必要であることを定めるものである。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。憲法29条2項は財産権の内容を法律で定めるとしますが、地方自治の権能に基づき、法律の範囲内で条例が財産権を合理的に制限することはあり得ます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『補償請求には必ず法令上の具体的規定が必要』という部分が誤りです。判例は、特別の犠牲を課す財産権制限について、補償規定がなくても憲法29条3項を直接根拠として補償請求を認め得るとしています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法29条1項は、私有財産制度そのものと、個人の具体的な財産上の権利の双方を保障すると解されています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法29条3項は、私有財産を公共のために用いる場合に正当な補償を要求する規定です。特別の犠牲を課す収用・制限では補償の要否が問題となります。","corrected":"","inferredBasis":[]}],"references":["憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":0},{"learningNote":"憲法29条2項は財産権の内容を法律で定めるとしますが、地方自治の権能に基づき、法律の範囲内で条例が財産権を合理的に制限することはあり得ます。","statuteRef":1},{"learningNote":"判例は、特別の犠牲を課す財産権制限について、補償規定がなくても憲法29条3項を直接根拠として補償請求を認め得るとしています。","statuteRef":2},{"learningNote":"憲法29条1項は、私有財産制度そのものと、個人の具体的な財産上の権利の双方を保障すると解されています。","statuteRef":3}]},{"id":4,"year":20,"sourceQuestion":2,"category":"憲法","theme":"内閣","prompt":"内閣に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["内閣は、衆議院で不信任の決議案を可決したときは、１０日以内に衆議院が解散されない限り、総辞職をしなければならない。","国務大臣は、その在任中、内閣総理大臣の同意がなければ、訴追されない。","内閣は、行政権の行使について、国会に対し連帯して責任を負う。","国務大臣の過半数は、衆議院議員の中から選ばれなければならない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。憲法69条により、衆議院で内閣不信任決議案が可決された場合、10日以内に衆議院が解散されない限り、内閣は総辞職しなければなりません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法75条により、国務大臣は在任中、内閣総理大臣の同意がなければ訴追されません。ただし、訴追の権利そのものが失われるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法66条3項は、内閣が行政権の行使について国会に対し連帯して責任を負うと定めています。議院内閣制の基本原則です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『過半数は衆議院議員から』が誤りです。憲法68条1項は、国務大臣の過半数を『国会議員の中から』選ばなければならないと定めており、衆議院議員に限定していません。","corrected":"","inferredBasis":[]}],"references":["憲法65条行政権は、内閣に属する。","憲法66条3項内閣は、行政権の行使について、国会に対し連帯して責任を負う。","憲法69条内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、十日以内に衆議院が解散されない限り、総辞職をしなければならない。","憲法75条（解説中参照・条文要旨） 憲法75条により、国務大臣は在任中、内閣総理大臣の同意がなければ訴追されません。","憲法68条第1項（解説中参照・条文要旨） 憲法68条1項は、国務大臣の過半数を『国会議員の中から』選ばなければならないと定めており、衆議院議員に限定していません。"],"oldLawNote":"","referenceItems":[{"statuteRef":4},{"statuteRef":5},{"statuteRef":6},{"learningNote":"憲法75条により、国務大臣は在任中、内閣総理大臣の同意がなければ訴追されません。","statuteRef":7},{"learningNote":"憲法68条1項は、国務大臣の過半数を『国会議員の中から』選ばなければならないと定めており、衆議院議員に限定していません。","statuteRef":8}]},{"id":5,"year":13,"sourceQuestion":2,"category":"憲法","theme":"内閣","prompt":"内閣総理大臣に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["内閣総理大臣は，任意に国務大臣を罷免することができる。","内閣総理大臣は，衆議院議員の中から選ばなければならない。","内閣総理大臣は，法律の定める場合を除いては，国会の会期中逮捕されない。","内閣総理大臣は，その在任中，国務大臣の過半数の同意があっても訴追されない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。憲法68条2項により、内閣総理大臣は任意に国務大臣を罷免することができます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『衆議院議員の中から』という部分が誤りです。憲法67条1項は、内閣総理大臣を『国会議員の中から』国会の議決で指名するとしており、参議院議員も資格を有します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。内閣総理大臣も国会議員であるため、憲法50条の不逮捕特権が及び、法律の定める場合を除き国会の会期中は逮捕されません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法75条により、国務大臣である内閣総理大臣は在任中、自らの同意がなければ訴追されません。国務大臣の過半数の同意でこれを代替する制度はありません。","corrected":"","inferredBasis":[]}],"references":["憲法65条行政権は、内閣に属する。","憲法66条3項内閣は、行政権の行使について、国会に対し連帯して責任を負う。","憲法69条内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、十日以内に衆議院が解散されない限り、総辞職をしなければならない。","憲法68条第2項（解説中参照・条文要旨） 憲法68条2項により、内閣総理大臣は任意に国務大臣を罷免することができます。","憲法67条第1項（解説中参照・条文要旨） 憲法67条1項は、内閣総理大臣を『国会議員の中から』国会の議決で指名するとしており、参議院議員も資格を有します。","憲法50条（解説中参照・条文要旨） 内閣総理大臣も国会議員であるため、憲法50条の不逮捕特権が及び、法律の定める場合を除き国会の会期中は逮捕されません。","憲法75条（解説中参照・条文要旨） 憲法75条により、国務大臣である内閣総理大臣は在任中、自らの同意がなければ訴追されません。"],"oldLawNote":"","referenceItems":[{"statuteRef":4},{"statuteRef":5},{"statuteRef":6},{"learningNote":"憲法68条2項により、内閣総理大臣は任意に国務大臣を罷免することができます。","statuteRef":9},{"learningNote":"憲法67条1項は、内閣総理大臣を『国会議員の中から』国会の議決で指名するとしており、参議院議員も資格を有します。","statuteRef":10},{"learningNote":"内閣総理大臣も国会議員であるため、憲法50条の不逮捕特権が及び、法律の定める場合を除き国会の会期中は逮捕されません。","statuteRef":11},{"learningNote":"憲法75条により、国務大臣である内閣総理大臣は在任中、自らの同意がなければ訴追されません。","statuteRef":7}]},{"id":6,"year":18,"sourceQuestion":1,"category":"憲法","theme":"人権","prompt":"人権に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["私人の私生活上の自由の一つとして、何人も、その承諾なしに、みだりにその容ぼう・姿態を撮影されない自由を有する。","「すべて国民は、健康で文化的な最低限の生活を営む権利を有する」旨の憲法の規定は、個々の国民に対し生活扶助を請求する具体的権利を付与したものである。","表現行為に対する事前抑制は、表現の自由を保障し検閲を禁止する憲法の規定の趣旨に照らし、厳格かつ明確な要件のもとにおいてのみ許容される。","日本に在留する外国人は、政治活動の自由についても、外国人の地位に鑑みこれを認めることが相当でないと解されるものを除き、その保障が及ぶ。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。判例は憲法13条を根拠に、何人もその承諾なしにみだりに容ぼう・姿態を撮影されない自由を有するとしています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『憲法25条が個々の国民に具体的な生活扶助請求権を直接付与する』という部分が誤りです。具体的給付請求権は生活保護法等によって具体化されます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。表現行為への事前抑制は、表現の自由に対する重大な制約であるため、判例上、厳格かつ明確な要件の下でのみ例外的に許されます。","corrected":"","inferredBasis":["憲法21条"]},{"mark":"○","explanation":"正しい。外国人にも、権利の性質上日本国民のみを対象とするものを除き基本的人権の保障が及びます。政治活動も、外国人の地位に照らし相当でないものを除いて保障され得ます。","corrected":"","inferredBasis":[]}],"references":["憲法13条すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。","憲法25条（解説中参照・条文要旨） 『憲法25条が個々の国民に具体的な生活扶助請求権を直接付与する』という部分が誤りです。"],"oldLawNote":"","referenceItems":[{"statuteRef":12},{"learningNote":"『憲法25条が個々の国民に具体的な生活扶助請求権を直接付与する』という部分が誤りです。","statuteRef":13},{"learningNote":"憲法21条集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","statuteRef":14}]},{"id":7,"year":14,"sourceQuestion":2,"category":"憲法","theme":"司法審査権に関する次の１","prompt":"司法審査権に関する次の１から４までの記述のうち，判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["具体的な権利義務ないし法律関係の存否に関する紛争が生じていなくても，法令の解釈又は効力は司法審査の対象となる。","国会の両院における法律制定の議事手続が適正に行われたか否かは，司法審査の対象となる。","単なる事実の存否や学問上，技術上の論争は，司法審査の対象となる。","宗教上の教義に関する判断が必要不可欠である紛争は，司法審査の対象とならない。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。司法権が扱うのは原則として具体的な権利義務・法律関係の存否に関する争訟です。具体的事件を離れて、抽象的に法令の解釈・効力だけを判断することはできません。","corrected":"","inferredBasis":["憲法76条","憲法81条"]},{"mark":"×","explanation":"誤り。国会の議事手続には議院の自律権があり、判例は、法律制定の議事手続が適正に行われたかという内部手続の問題を司法審査の対象としない立場を採っています。","corrected":"","inferredBasis":["憲法76条","憲法81条"]},{"mark":"×","explanation":"誤り。単なる事実の存否や学問上・技術上の論争は、法律上の争訟に当たらず、司法審査の対象とはなりません。","corrected":"","inferredBasis":["憲法76条","憲法81条"]},{"mark":"○","explanation":"正しい。宗教上の教義そのものの判断が紛争解決に必要不可欠で、法令の適用によって終局的に解決できない場合、法律上の争訟に当たらず司法審査の対象外となります。","corrected":"","inferredBasis":["憲法76条","憲法81条"]}],"references":["憲法76条（学習用抜粋）すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。特別裁判所は設置できず、行政機関は終審として裁判を行うことができない。","憲法81条最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する権限を有する終審裁判所である。"],"oldLawNote":"","referenceItems":[{"statuteRef":15},{"statuteRef":16}]},{"id":8,"year":12,"sourceQuestion":2,"category":"憲法","theme":"国の予算に関する次の１か","prompt":"国の予算に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["衆議院と参議院が，予算について異なった議決をした場合，衆議院の議決が優先するので，両院協議会を開く必要はない。","予算の作成及び提出権は，内閣のみに属する。","予算は，衆議院に先に提出しなければならない。","予算につき，参議院が，衆議院の可決した予算を受け取った後，国会休会中の期間を除いて３０日以内に議決しないときは，衆議院の議決が国会の議決となる。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。両院の議決が異なる場合、憲法60条2項により、まず両院協議会を開いても意見が一致しないとき、又は参議院が30日以内に議決しないときに衆議院の議決が国会の議決となります。『両院協議会を開く必要はない』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法86条により、内閣は毎会計年度の予算を作成し国会に提出して審議・議決を受けます。予算案の作成・提出権は内閣に属します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法60条1項により、予算は先に衆議院に提出しなければなりません。予算には衆議院の先議権があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。参議院が衆議院から予算を受け取った後、国会休会中の期間を除き30日以内に議決しないときは、衆議院の議決が国会の議決となります（憲法60条2項）。","corrected":"","inferredBasis":[]}],"references":["憲法60条1項予算は、さきに衆議院に提出しなければならない。","憲法86条（解説中参照・条文要旨） 憲法86条により、内閣は毎会計年度の予算を作成し国会に提出して審議・議決を受けます。"],"oldLawNote":"","referenceItems":[{"statuteRef":17},{"learningNote":"憲法86条により、内閣は毎会計年度の予算を作成し国会に提出して審議・議決を受けます。","statuteRef":18},{"learningNote":"両院の議決が異なる場合、憲法60条2項により、まず両院協議会を開いても意見が一致しないとき、又は参議院が30日以内に議決しないときに衆議院の議決が国会の議決となります。","statuteRef":19}]},{"id":9,"year":17,"sourceQuestion":2,"category":"憲法","theme":"国会","prompt":"国会議員に関する次の１から４までの記述のうち、正しいものを1つ選びなさい。","choices":["衆議院が解散されたときは、解散の日から４０日以内に衆議院議員の総選挙を行い、その選挙の日から３０日以内に、特別国会を召集しなければならない。","衆議院が解散されたときは、参議院議員のうち任期の残期間が３年未満の議員の任期も同時に終了する。","衆議院は全国民を代表する選挙された議員で構成され、参議院は都道府県を代表する選挙された議員で構成される。","両議院の議員及びその選挙人の資格は、法律でこれを定める。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。憲法54条1項は、解散の日から40日以内に総選挙を行い、その選挙の日から30日以内に『国会を召集』すると定めます。特別国会という呼称自体は実務上用いられますが、条文上の表現は『国会を召集』です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。衆議院の解散によって任期が終了するのは衆議院議員です。参議院議員は解散されず、任期6年・3年ごとの半数改選という制度が維持されます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。憲法43条は両議院とも『全国民を代表する選挙された議員』で組織すると定めています。参議院議員を都道府県代表と位置付ける規定ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法44条は、両議院の議員及びその選挙人の資格を法律で定めるとしています。ただし、人種、信条、性別、社会的身分、門地、教育、財産又は収入による差別は禁止されます。","corrected":"","inferredBasis":[]}],"references":["憲法43条1項両議院は、全国民を代表する選挙された議員でこれを組織する。","憲法44条両議院の議員及びその選挙人の資格は、法律でこれを定める。","憲法54条第1項（解説中参照・条文要旨） 憲法54条1項は、解散の日から40日以内に総選挙を行い、その選挙の日から30日以内に『国会を召集』すると定めます。"],"oldLawNote":"","referenceItems":[{"statuteRef":20},{"statuteRef":21},{"learningNote":"憲法54条1項は、解散の日から40日以内に総選挙を行い、その選挙の日から30日以内に『国会を召集』すると定めます。","statuteRef":22},{"learningNote":"憲法43条は両議院とも『全国民を代表する選挙された議員』で組織すると定めています。","statuteRef":23}]},{"id":10,"year":20,"sourceQuestion":1,"category":"憲法","theme":"基本的人権","prompt":"基本的人権の保障に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["憲法は、公権力との関係で国民の権利や自由を保護するものであって、私人相互の関係を直接規律することを予定するものではないから、私人間の権利関係に関する訴訟において憲法が直接又は間接に適用又は参照されることはない。","許可を受けないで貨物を輸出入する罪で被告人を懲役刑に処すと同時に、輸出入にかかる貨物を没収する場合、被告人以外の貨物の所有者に告知、弁解、防御の機会を与えなかったとしても、その没収が憲法に違反するものではない。","憲法は、国民に健康で文化的な最低限度の生活を営む権利を保障するが、生活に困窮した国民に対して、生活扶助費などの給付を求める具体的な権利を保障するものではない。","憲法は、国民に対し、承諾なしに、みだりにその容ぼう等を撮影されない自由までを保障するものではない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。『私人間の訴訟では憲法が直接又は間接に適用・参照されることはない』という部分が誤りです。憲法の人権規定は原則として国家権力を拘束しますが、私人間でも民法90条などの一般条項の解釈を通じて憲法上の価値が間接的に反映されます（いわゆる間接適用説）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。第三者所有物を没収する場合、その所有者に告知・弁解・防御の機会を与えないまま所有権を奪うことは、適正手続の保障に反します。正しくは、被告人以外の所有者にも手続保障を及ぼす必要があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法25条1項は生存権を保障しますが、判例は同項から個々の国民に具体的な生活扶助給付請求権が直接発生するとは解していません。具体的給付は生活保護法等の立法によって内容が具体化されます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『みだりに容ぼう等を撮影されない自由まで保障しない』という部分が誤りです。判例は、憲法13条を根拠に、何人もその承諾なしにみだりに容ぼう・姿態を撮影されない自由を有するとしています。","corrected":"","inferredBasis":[]}],"references":["憲法13条すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。","民法90条（解説中参照・条文要旨） 憲法の人権規定は原則として国家権力を拘束しますが、私人間でも民法90条などの一般条項の解釈を通じて憲法上の価値が間接的に反映されます（いわゆる間接適用説）。","憲法25条第1項（解説中参照・条文要旨） 憲法25条1項は生存権を保障しますが、判例は同項から個々の国民に具体的な生活扶助給付請求権が直接発生するとは解していません。"],"oldLawNote":"","referenceItems":[{"statuteRef":12},{"learningNote":"憲法の人権規定は原則として国家権力を拘束しますが、私人間でも民法90条などの一般条項の解釈を通じて憲法上の価値が間接的に反映されます（いわゆる間接適用説）。","statuteRef":24},{"learningNote":"憲法25条1項は生存権を保障しますが、判例は同項から個々の国民に具体的な生活扶助給付請求権が直接発生するとは解していません。","statuteRef":25}]},{"id":11,"year":13,"sourceQuestion":1,"category":"憲法","theme":"憲法に関する次の１から４","prompt":"憲法に関する次の１から４までの記述のうち，日本国憲法前文の内容にないものを１つ選びなさい。","choices":["日本国民は，平和を愛する諸国民の公正と信義に信頼して，われらの安全と生存を保持しようと決意する。","全世界の国民が，ひとしく恐怖と欠乏から免れ，平和のうちに生存する権利を有することを確認する。","日本国民は，政府の行為によって再び戦争の惨禍が起こることのないようにすることを決意する。","日本国民は，国内の平穏を保障し，国民の福祉を増進し，われらとわれらの子孫のうえに自由をもたらす恵沢を確保する目的をもって，この憲法を制定する。"],"answer":4,"details":[{"mark":"×","explanation":"前文にあります。日本国民が平和を愛する諸国民の公正と信義に信頼して安全と生存を保持しようと決意する旨が記載されています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"前文にあります。全世界の国民がひとしく恐怖と欠乏から免れ、平和のうちに生存する権利を有することを確認する旨が記載されています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"前文にあります。政府の行為によって再び戦争の惨禍が起こることのないようにするとの決意が記載されています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"日本国民は，国内の平穏を保障し，国民の福祉を増進し，われらとわれらの子孫のうえに自由をもたらす恵沢を確保する目的をもって，この憲法を制定する。前文にはありません。この表現は憲法前文の文言ではなく、前文にあるのは『自由のもたらす恵沢を確保し、政府の行為によって再び戦争の惨禍が起ることのないやうにする』等の内容です。","corrected":"","inferredBasis":[]}],"references":["日本国憲法前文（学習用抜粋）日本国民は、政府の行為によって再び戦争の惨禍が起こることのないようにすることを決意し、平和を愛する諸国民の公正と信義に信頼して安全と生存を保持しようと決意し、全世界の国民が恐怖と欠乏から免れ平和のうちに生存する権利を有することを確認している。"],"oldLawNote":"","referenceItems":[{"statuteRef":26}]},{"id":12,"year":14,"sourceQuestion":1,"category":"憲法","theme":"憲法１３条に関する次の１","prompt":"憲法１３条に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["個人の私生活上の自由の一つとして，何人もみだりに指紋の押捺を強制されない自由を有し，その自由の保障は日本在留の外国人にも及ぶ。","前科及び犯罪経歴は人の名誉，信用に直接関わる事項であり，これをみだりに公開されない利益は法律上の保護に値する。","個人の私生活上の自由の一つとして，何人も，その承諾なしに，みだりにその容ぼう，姿態を撮影されない自由を有する。","大学が，その主催する講演会に参加を希望する者の氏名及び住所をその者に無断で警備担当の警察に開示することは，プライバシーの侵害に当たらない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。判例は、憲法13条の趣旨から、何人もみだりに指紋の押捺を強制されない自由を有し、その保障は日本に在留する外国人にも及ぶとしています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。前科・犯罪経歴は名誉・信用に直接関わる情報であり、これをみだりに公開されない利益は法的保護に値すると判例は認めています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法13条の趣旨から、承諾なしにみだりに容ぼう・姿態を撮影されない自由が保障されるとするのが判例です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『無断で警察に開示してもプライバシー侵害にならない』という部分が誤りです。大学が講演会参加者の氏名・住所等を本人の同意なく警察へ提供した行為について、判例はプライバシーを侵害するものと評価しています。","corrected":"","inferredBasis":[]}],"references":["憲法13条すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。"],"oldLawNote":"","referenceItems":[{"statuteRef":12}]},{"id":13,"year":19,"sourceQuestion":2,"category":"憲法","theme":"政党に関する次の１から４","prompt":"政党に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["政党を結成することは、憲法が規定する集会結社の自由に含まれない。","選挙人が政党を選択して投票し、各政党の得票数の多寡に応じて、政党があらかじめ定めた名簿の順位に従って当選人を決定する方式は、憲法の要請する直接選挙に当たらない。","憲法は、議会制民主主義を支える不可欠な要素として政党の存在を承認している。","国の存立を危うくする政党は、憲法において明文をもって結成を禁じられている。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。政党の結成は憲法21条の結社の自由の保障対象に含まれます。政党は国民の政治的意思形成を担う重要な結社です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。比例代表制で、有権者が政党を選択し、得票に応じて名簿順位に従い当選者を決定する方式も、憲法上の直接選挙の要請に反するものではないと解されています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。判例は、政党を議会制民主主義を支える不可欠な要素として位置付け、その政治的自由・自主性を尊重しています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。日本国憲法には『国の存立を危うくする政党の結成を明文で禁止する』規定はありません。政党に対する規制は、結社の自由との関係で慎重に考える必要があります。","corrected":"","inferredBasis":[]}],"references":["憲法21条集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。","憲法43条1項両議院は、全国民を代表する選挙された議員でこれを組織する。"],"oldLawNote":"","referenceItems":[{"statuteRef":27},{"statuteRef":20}]},{"id":14,"year":15,"sourceQuestion":1,"category":"憲法","theme":"次の１から４までのうち，","prompt":"次の１から４までのうち，天皇の国事行為でないものを１つ選びなさい。","choices":["最高裁判所の長たる裁判官を任命すること","政令を公布すること","条約を締結すること","儀式を行うこと"],"answer":3,"details":[{"mark":"×","explanation":"国事行為です。憲法6条2項により、天皇は内閣の指名に基づいて最高裁判所の長たる裁判官を任命します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"国事行為です。憲法7条1号により、天皇は憲法改正、法律、政令及び条約を公布します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"国事行為ではありません。条約を締結する権限は内閣に属し、国会の承認を要します（憲法73条3号）。天皇が行うのは条約の『公布』であって『締結』ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"国事行為です。憲法7条10号に『儀式を行ふこと』が定められています。","corrected":"","inferredBasis":[]}],"references":["憲法7条（天皇の国事行為・学習用抜粋）天皇は、内閣の助言と承認により、憲法改正・法律・政令・条約の公布、国会の召集、衆議院の解散、総選挙施行の公示、認証、栄典の授与、批准書等の認証、外国大使等の接受、儀式を行うこと等の国事行為を行う。","憲法6条第2項（解説中参照・条文要旨） 憲法6条2項により、天皇は内閣の指名に基づいて最高裁判所の長たる裁判官を任命します。","憲法73条（解説中参照・条文要旨） 条約を締結する権限は内閣に属し、国会の承認を要します（憲法73条3号）。"],"oldLawNote":"","referenceItems":[{"statuteRef":28},{"learningNote":"憲法6条2項により、天皇は内閣の指名に基づいて最高裁判所の長たる裁判官を任命します。","statuteRef":29},{"learningNote":"条約を締結する権限は内閣に属し、国会の承認を要します（憲法73条3号）。","statuteRef":30},{"learningNote":"憲法7条1号により、天皇は憲法改正、法律、政令及び条約を公布します。","statuteRef":31},{"learningNote":"憲法7条10号に『儀式を行ふこと』が定められています。","statuteRef":32}]},{"id":15,"year":15,"sourceQuestion":2,"category":"憲法","theme":"精神の自由に関する次の１","prompt":"精神の自由に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["何人も，宗教上の行事に参加することを強制されない。","通信の秘密は，これを侵してはならない。","いかなる宗教団体も，政治上の権力を行使してはならない。","公務員は，内心にとどまるとしても，法律の定めるところにより，思想及び良心の自由を制限される。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。憲法20条2項は、何人も宗教上の行為、祝典、儀式又は行事に参加することを強制されないと定めています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法21条2項後段は『通信の秘密は、これを侵してはならない』と明記しています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法20条1項後段は、いかなる宗教団体も国から特権を受け、又は政治上の権力を行使してはならないと定めています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『公務員であれば内心の思想・良心まで法律で制限できる』という部分が誤りです。憲法19条が保障する思想及び良心の自由は内心の自由であり、公務員であることを理由にその内心そのものを制約することは許されません。","corrected":"","inferredBasis":[]}],"references":["憲法19条思想及び良心の自由は、これを侵してはならない。","憲法20条（学習用抜粋）信教の自由は、何人に対してもこれを保障する。何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。","憲法21条集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。"],"oldLawNote":"","referenceItems":[{"statuteRef":33},{"statuteRef":34},{"statuteRef":27},{"learningNote":"憲法20条2項は、何人も宗教上の行為、祝典、儀式又は行事に参加することを強制されないと定めています。","statuteRef":35},{"learningNote":"憲法21条2項後段は『通信の秘密は、これを侵してはならない』と明記しています。","statuteRef":36},{"learningNote":"憲法20条1項後段は、いかなる宗教団体も国から特権を受け、又は政治上の権力を行使してはならないと定めています。","statuteRef":37}]},{"id":16,"year":12,"sourceQuestion":1,"category":"憲法","theme":"表現の自由に関する次の１","prompt":"表現の自由に関する次の１から４までの記述のうち，判例の趣旨に照らして誤っているものを１つ選びなさい。","choices":["表現の自由には，個人が自らの思想や意見を発表することの自由のみならず，他で発せられた情報を受領したり収集する自由も含まれる。","表現の事前規制は，その表現内容が真実でなく，又はそれが専ら公益を図る目的のものでないことが明白であって，かつ，被害者が重大にして著しく回復困難な損害を被るおそれがあるときにのみ許される。","商品広告は，経済活動として行われるものであるから，表現の自由が問題とされることはない。","表現の自由としての政治活動の自由は，民主主義社会を基礎付ける重要な権利であるので，公務員に対する政治活動の禁止は，必要やむを得ない限度の範囲にとどめるべきである。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。表現の自由は情報を発信する自由だけでなく、情報を受領し、必要な情報を収集する自由も含むと解されています。","corrected":"","inferredBasis":["憲法21条"]},{"mark":"○","explanation":"正しい。名誉・プライバシーを侵害する出版物等の事前差止めは原則として厳格に制限され、判例は真実でないこと又は公益目的でないことが明白で、重大かつ著しく回復困難な損害のおそれがある場合などに例外的に許されるとしています。","corrected":"","inferredBasis":["民法723条"]},{"mark":"×","explanation":"誤り。『商品広告には表現の自由が問題とならない』という部分が誤りです。営利広告・商品広告も情報伝達活動であり、憲法21条の表現の自由の保障と無関係ではありません。ただし政治的表現とは異なる規制が許容され得ます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。公務員にも政治活動の自由はありますが、職務の中立性等のため一定の制約が認められます。判例は制約が合理的で必要な範囲にとどまることを求めています。","corrected":"","inferredBasis":["憲法21条"]}],"references":["憲法21条集会、結社及び言論、出版その他一切の表現の自由は、これを保障する。検閲は、これをしてはならない。通信の秘密は、これを侵してはならない。"],"oldLawNote":"","referenceItems":[{"statuteRef":27},{"learningNote":"民法723条（解説中参照・学習用要点） 民法723条により、名誉毀損の場合、裁判所は被害者の請求により、損害賠償に代えて又はこれとともに名誉を回復するのに適当な処分を命ずることができます。","statuteRef":38}]},{"id":17,"year":16,"sourceQuestion":2,"category":"憲法","theme":"裁判","prompt":"裁判及び裁判官に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["政治犯罪が問題となる事件では、裁判の対審は常に公開しなければならない。","裁判所は、裁判官の全員の一致で公の秩序又は善良の風俗を害する虞があると決した場合には、裁判の対審を公開しないで行うことができる。","行政機関は、裁判官を懲戒することができる。","裁判官は、国会議員で組織する弾劾裁判所により罷免されることがある。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。憲法82条2項は、政治犯罪、出版に関する犯罪、憲法第三章で保障する国民の権利が問題となる事件については、対審を常に公開しなければならないとしています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法82条2項により、裁判所が裁判官全員一致で公の秩序又は善良の風俗を害するおそれがあると決した場合、対審を非公開にできることがあります。ただし判決は公開されます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『行政機関は裁判官を懲戒できる』という部分が誤りです。憲法78条は、裁判官の懲戒処分を行政機関が行うことを禁止しています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法64条に基づく弾劾裁判所によって裁判官が罷免されることがあります。","corrected":"","inferredBasis":[]}],"references":["憲法64条1項国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設ける。","憲法82条第2項（解説中参照・条文要旨） 憲法82条2項は、政治犯罪、出版に関する犯罪、憲法第三章で保障する国民の権利が問題となる事件については、対審を常に公開しなければならないとしています。","憲法78条（解説中参照・条文要旨） 憲法78条は、裁判官の懲戒処分を行政機関が行うことを禁止しています。"],"oldLawNote":"","referenceItems":[{"statuteRef":39},{"learningNote":"憲法82条2項は、政治犯罪、出版に関する犯罪、憲法第三章で保障する国民の権利が問題となる事件については、対審を常に公開しなければならないとしています。","statuteRef":40},{"learningNote":"憲法78条は、裁判官の懲戒処分を行政機関が行うことを禁止しています。","statuteRef":41},{"learningNote":"憲法64条に基づく弾劾裁判所によって裁判官が罷免されることがあります。","statuteRef":42}]},{"id":18,"year":13,"sourceQuestion":3,"category":"家族法・行為能力","theme":"制限行為能力者に関する次","prompt":"制限行為能力者に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["被保佐人が保佐人の同意を得ることを要する行為をその同意を得ないでした場合，保佐人は，その行為を追認することはできるが，その行為を取り消すことはできない。","未成年者のした契約について，未成年者が取消権を行使しないときは，契約の相手方は，当該契約を取り消すことができる。","未成年の子が婚姻をするには，父母の同意を得なければならないが，成年被後見人が婚姻をするには，その成年後見人の同意を要しない。","成年被後見人Ａとの間でＡの所有する不動産を購入する契約を締結したＢが，Ａの成年後見人Ｃに対し，１か月以上の期間を定めて，その期間内に当該売買契約を追認するかどうか確答すべき旨の催告をした場合，Ｃがその期間内に何ら回答をしなかったときは，当該売買契約を取り消したものとみなされる。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。被保佐人が同意を要する行為を無同意でした場合、その行為は取消しの対象となります。保佐人等は追認だけでなく取消しも可能です。","corrected":"","inferredBasis":["民法13条"]},{"mark":"×","explanation":"誤り。未成年者の契約を取り消せるのは未成年者本人や法定代理人等の取消権者です。相手方には取消権はなく、一定の場合に催告権があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"未成年の子が婚姻をするには，父母の同意を得なければならないが，成年被後見人が婚姻をするには，その成年後見人の同意を要しない。正しい（出題当時）。当時の民法では未成年者の婚姻に父母の同意が必要でしたが、成年被後見人の婚姻には成年後見人の同意は不要です。なお、2022年改正で成年年齢・婚姻年齢が18歳に統一され、この未成年者婚姻の前提自体が現在は変わっています。","corrected":"","inferredBasis":["民法9条"]},{"mark":"×","explanation":"誤り。制限行為能力者の相手方の催告に対し、成年後見人が期間内に確答しない場合は、追認したものとみなされる場合があります。『取り消したものとみなす』という効果が誤りです。現行法メモ・現行法では婚姻年齢は男女とも18歳です。旧法の「男18歳・女16歳」は現在のルールではありません。","corrected":"","inferredBasis":["民法9条","民法20条"]}],"references":["民法5条1項（学習用抜粋）未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。","民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","民法13条1項（学習用抜粋）被保佐人が一定の重要な財産上の行為をするには、その保佐人の同意を得なければならない。","民法20条（制限行為能力者の相手方の催告権・学習用抜粋）制限行為能力者の相手方は、法定の期間を定め、追認するかどうかを確答すべき旨を催告することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":43},{"statuteRef":44},{"statuteRef":45},{"statuteRef":46}]},{"id":19,"year":14,"sourceQuestion":3,"category":"家族法・行為能力","theme":"制限行為能力者の法律行為","prompt":"制限行為能力者の法律行為に関する次の１から４までの記述うち，正しいものを１つ選びなさい。","choices":["被補助人がする法律行為は，補助人が代理して行わなければならない。","被保佐人は，日用品の購入その他日常生活に関する法律行為について,保佐人の同意を得ずに単独ですることができる。","未成年者が法定代理人の同意を得ないでした法律行為は，当然に無効となる。","成年被後見人が単独でした法律行為について，成年後見人以外の者は取り消すことができない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。被補助人は原則として自ら法律行為を行います。家庭裁判所の審判で特定の行為について補助人に同意権・代理権が付与されることはありますが、すべての法律行為を補助人が代理しなければならないわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。被保佐人についても、日用品の購入その他日常生活に関する行為は保佐人の同意を要しません。","corrected":"","inferredBasis":["民法13条"]},{"mark":"×","explanation":"誤り。未成年者が法定代理人の同意を得ずにした法律行為は『当然無効』ではなく、原則として取り消すことができる行為です（民法5条2項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。成年被後見人本人や成年後見人のほか、一定の取消権者が法律上定められています。『成年後見人以外は取り消せない』という限定が誤りです。","corrected":"","inferredBasis":["民法9条"]}],"references":["民法5条1項（学習用抜粋）未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。","民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","民法13条1項（学習用抜粋）被保佐人が一定の重要な財産上の行為をするには、その保佐人の同意を得なければならない。","民法20条（制限行為能力者の相手方の催告権・学習用抜粋）制限行為能力者の相手方は、法定の期間を定め、追認するかどうかを確答すべき旨を催告することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":43},{"statuteRef":44},{"statuteRef":45},{"statuteRef":46},{"learningNote":"未成年者が法定代理人の同意を得ずにした法律行為は『当然無効』ではなく、原則として取り消すことができる行為です（民法5条2項）。","statuteRef":47}]},{"id":20,"year":17,"sourceQuestion":1,"category":"家族法・行為能力","theme":"夫婦又は親子に関する次の","prompt":"夫婦又は親子に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを1つ選びなさい。","choices":["子が嫡出であるか否かによって、その相続分に法律上の差異を設けることは許されない。","離婚に関する法律は、個人の尊厳と両性の本質的平等に立脚して制定されなければならない。","親は、その保護する子にひとしく高等教育を受けさせる義務を負う。","婚姻は両性の合意のみに基づいて成立し、相互の協力により維持されなければならない。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。嫡出子と嫡出でない子の法定相続分に差を設けていた旧規定は、最高裁大法廷決定を受けて改正され、現在は相続分に差はありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法24条2項は、配偶者の選択、財産権、相続、住居の選定、離婚その他婚姻・家族に関する事項について、個人の尊厳と両性の本質的平等に立脚して法律を制定すべきことを定めます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。憲法26条が保障する教育を受ける権利・普通教育を受けさせる義務は、高等教育までを親に一律に義務付けるものではありません。『ひとしく高等教育を受けさせる義務』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。憲法24条1項は、婚姻が両性の合意のみに基づいて成立し、夫婦が同等の権利を有することを基本として相互の協力により維持されなければならないと定めています。","corrected":"","inferredBasis":[]}],"references":["憲法24条（学習用抜粋）婚姻は、両性の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により維持されなければならない。家族に関する法律は、個人の尊厳と両性の本質的平等に立脚して制定されなければならない。","憲法26条（学習用抜粋）すべて国民は、法律の定めるところにより、その能力に応じて、ひとしく教育を受ける権利を有する。すべて国民は、その保護する子女に普通教育を受けさせる義務を負う。","民法900条（法定相続分・学習用抜粋）同順位の相続人が数人ある場合の相続分を定める。子は嫡出・非嫡出による相続分の差を設けない。"],"oldLawNote":"","referenceItems":[{"statuteRef":48},{"statuteRef":49},{"statuteRef":50},{"learningNote":"憲法24条2項は、配偶者の選択、財産権、相続、住居の選定、離婚その他婚姻・家族に関する事項について、個人の尊厳と両性の本質的平等に立脚して法律を制定すべきことを定めます。","statuteRef":51},{"learningNote":"憲法24条1項は、婚姻が両性の合意のみに基づいて成立し、夫婦が同等の権利を有することを基本として相互の協力により維持されなければならないと定めています。","statuteRef":52}]},{"id":21,"year":18,"sourceQuestion":3,"category":"家族法・行為能力","theme":"年齢に関する次の１から４","prompt":"年齢に関する次の１から４までの記述のうち、誤っているものを1つ選びなさい。","choices":["１５歳に達した者は、遺言をすることができる。","男は、１８歳に、女は、１６歳にならなければ、婚姻をすることができない。","年齢１８歳をもって、成年とする。","２０歳に達した者は、普通養子をすることができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。民法961条により、15歳に達した者は遺言をすることができます。遺言能力について成年年齢18歳は基準ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現在は男女とも18歳でなければ婚姻できません（民法731条）。本問の『男18歳・女16歳』は旧法の婚姻年齢で、2022年4月1日施行の改正により統一されました。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。2022年4月1日以降、民法4条により成年年齢は18歳です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。普通養子の養親となるには原則として20歳に達していることが必要です。ただし、成年に達した者は20歳未満でも養親となり得るという現行法上の特則があるため、条文の現行文言も併せて確認してください。","corrected":"","inferredBasis":[]}],"references":["民法4条年齢十八歳をもって、成年とする。","民法961条十五歳に達した者は、遺言をすることができる。","民法731条（解説中参照・条文要旨） 現在は男女とも18歳でなければ婚姻できません（民法731条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":53},{"statuteRef":54},{"learningNote":"現在は男女とも18歳でなければ婚姻できません（民法731条）。","statuteRef":55}]},{"id":22,"year":20,"sourceQuestion":3,"category":"家族法・行為能力","theme":"成年後見に関する次の１か","prompt":"成年後見に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["後見開始の審判は、精神上の障害により事理を弁識する能力が著しく不十分である者を対象とする。","後見開始の審判が取り消されたときは、それ以前に被後見人がした法律行為は取り消すことができなくなる。","被後見人が一時的に事理弁識能力を回復している時にした法律行為は、取り消すことができない。","被後見人は、後見人の同意を得てした法律行為であっても、日用品の購入その他日常生活に関する行為を除き、これを取り消すことができる。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。『著しく不十分』は保佐開始の基準です。成年後見の対象は、精神上の障害により事理を弁識する能力を『欠く常況にある者』です（民法7条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。後見開始の審判が取り消されたからといって、取消し前に成年被後見人がした法律行為について既に存在する取消権が当然に消滅するわけではありません。行為時の制度適用を基準に判断します。","corrected":"","inferredBasis":["民法9条"]},{"mark":"×","explanation":"誤り。一時的に事理弁識能力を回復していたとしても、成年被後見人がした法律行為は、日用品の購入その他日常生活に関する行為を除き、原則として取り消すことができます。","corrected":"","inferredBasis":["民法9条"]},{"mark":"○","explanation":"正しい。成年被後見人の法律行為は、成年後見人が同意していても原則として取消し可能です。成年後見人には一般的な『同意によって取消しを防ぐ権限』はなく、日用品購入等の日常生活行為だけが取消しの対象外です。","corrected":"","inferredBasis":["民法9条"]}],"references":["民法4条年齢十八歳をもって、成年とする。","民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","民法7条（解説中参照・条文要旨） 成年後見の対象は、精神上の障害により事理を弁識する能力を『欠く常況にある者』です（民法7条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":53},{"statuteRef":44},{"learningNote":"成年後見の対象は、精神上の障害により事理を弁識する能力を『欠く常況にある者』です（民法7条）。","statuteRef":56}]},{"id":23,"year":12,"sourceQuestion":13,"category":"家族法・行為能力","theme":"未成年者の訴訟行為に関す","prompt":"未成年者の訴訟行為に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["未成年者本人は，独立して法律行為をすることができる場合であっても，法定代理人によらなければ，訴えを提起することができない。","未成年者本人が訴えを提起した場合，裁判所はただちに訴えを却下しなければならない。","未成年者本人が法定代理人の同意なく行った訴訟行為は，取り消すことができる。","未成年者の法定代理人は，未成年者本人がした訴訟行為を追認することができる。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。未成年者でも、民法上独立して法律行為をすることができる場合には、その法律行為に関する訴訟について自ら訴訟行為をすることができる場合があります。『常に法定代理人によらなければならない』は言い過ぎです。","corrected":"","inferredBasis":["民事訴訟法31条","民事訴訟法34条"]},{"mark":"×","explanation":"誤り。訴訟能力を欠く未成年者本人が訴えを提起しても、裁判所は直ちに却下するのではなく、法定代理人による追認など瑕疵を補正する機会を与えるのが原則です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。訴訟能力を欠く者の訴訟行為は、民法上の取消し得る法律行為と同じ『取消し』の構造ではありません。訴訟法上の効力・追認の問題として処理されます。","corrected":"","inferredBasis":["民法5条","民事訴訟法31条"]},{"mark":"○","explanation":"正しい。未成年者本人がした訴訟行為について、法定代理人が追認することにより、その訴訟行為の瑕疵を治癒することができます。","corrected":"","inferredBasis":["民事訴訟法31条","民事訴訟法34条"]}],"references":["民法4条年齢十八歳をもって、成年とする。","民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","民法5条1項未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。"],"oldLawNote":"","referenceItems":[{"statuteRef":53},{"statuteRef":44},{"statuteRef":57},{"learningNote":"","statuteRef":58},{"learningNote":"","statuteRef":59}]},{"id":24,"year":11,"sourceQuestion":3,"category":"家族法・行為能力","theme":"権利能力又は行為能力に関","prompt":"権利能力又は行為能力に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["Ａが胎児であった当時に，Ａの父親が加害者Ｂとの交通事故により死亡した。この場合，母親Ｃが胎児であるＡを代理してＢとの間で行った損害賠償についての和解契約は無効であり，Ａは，出生後，Ｂに対し改めて損害賠償を請求することができる。","成年被後見人Ｈは，成年後見人Ｊの同意を得ないで，金銭の贈与を受諾する意思表示をした。この場合，Ｊは，この意思表示を取り消すことができる。","未成年者Ｄは，単独親権者Ｅの同意を得ないで携帯電話の利用契約を締結した。携帯電話がＤの日常生活で使用するものであった場合でも，Ｅは，この利用契約を取り消すことができる。","成年被後見人Ｆは，成年後見人Ｇの同意を得て不動産の売買契約を締結した。この場合，Ｇは，この売買契約を取り消すことができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。胎児は損害賠償請求権について既に生まれたものとみなされますが、胎児中に母が法定代理人として確定的に和解することはできないと解され、出生後に本人が請求できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。成年被後見人の法律行為は、日常生活行為を除き、単に利益を得る贈与の受諾であっても取消しの対象となり得ます。成年後見人の同意制度で有効化する仕組みではありません。","corrected":"","inferredBasis":["民法9条"]},{"mark":"○","explanation":"正しい。未成年者の日常生活上の契約であっても、法定代理人の同意を要しない『処分を許された財産』等の例外に該当しない限り、無同意の契約は取り消し得ます。成年被後見人の日常生活行為の特則と混同しないことが重要です。","corrected":"","inferredBasis":["民法9条","民法5条"]},{"mark":"×","explanation":"誤り。成年後見人が同意していても、成年被後見人の不動産売買は原則として取り消すことができます。成年後見制度には、同意により行為を確定的に有効にする一般的制度はありません。","corrected":"","inferredBasis":["民法9条"]}],"references":["民法5条1項（学習用抜粋）未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。","民法9条成年被後見人の法律行為は、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りでない。","民法721条胎児は、損害賠償の請求権については、既に生まれたものとみなす。"],"oldLawNote":"","referenceItems":[{"statuteRef":43},{"statuteRef":44},{"statuteRef":60}]},{"id":25,"year":17,"sourceQuestion":3,"category":"家族法・行為能力","theme":"裁判","prompt":"Ａがその財産の管理人を置かないで行方不明となったことから、家庭裁判所はＢを不在者Ａの財産の管理人として選任した。この場合に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["Ａの所有する現金が発見された場合、ＢがＡを代理してその現金をＡ名義の銀行預金口座に預け入れるためには、家庭裁判所の許可を得る必要がない。","Ａが甲土地を所有している場合、ＢがＡを代理して甲土地をＣに売却するためには、家庭裁判所の許可を得る必要がある。","ＡがＥに対して借入金債務を負っており、その債務が弁済期にある場合、ＢがＡのためにＥに対してその債務の弁済をするためには、家庭裁判所の許可を得る必要がある。","Ａが被相続人Ｆの共同相続人の一人である場合、ＢがＡを代理してＦの他の共同相続人との間でＦの遺産について協議による遺産分割をするためには、家庭裁判所の許可を得る必要がある。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。発見された現金を本人名義の預金口座に預ける行為は、通常、不在者財産の保存・管理の範囲内であり、権限外行為の許可は不要です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。土地の売却は通常の保存・管理の範囲を超える処分行為です。不在者財産管理人が行うには、民法28条に基づく家庭裁判所の権限外行為許可が必要です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。弁済期が到来した債務を弁済することは、本人の財産を適切に管理する行為であり、原則として権限外行為許可を要しません。『許可が必要』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。遺産分割協議は相続財産の処分・権利関係を確定させる重要な行為であり、通常の管理権限を超えるため家庭裁判所の許可を要します。","corrected":"","inferredBasis":[]}],"references":["民法28条管理人は、第百三条に規定する権限を超える行為を必要とするときは、家庭裁判所の許可を得て、その行為をすることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":61}]},{"id":26,"year":20,"sourceQuestion":4,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["ＡとＢが意思を通じて虚偽の土地売買契約を締結し、その後買主Ｂが死亡した場合、Ｂの相続人Ｃが虚偽であることを知らなかったとしても、売主Ａは、Ｃに対して、当該売買契約の無効を主張することができる。","表意者がその真意ではないことを知ってした意思表示は、その意思表示が表意者の真意ではないことを相手方が知り、又は知ることができたときは、取り消すことができる。","第三者の強迫によって意思表示をした者は、相手方が強迫の事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。","隔地者に対する契約の解除の意思表示は、表意者が通知を発した後に死亡したときは効力を生じない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。通謀虚偽表示は当事者間では無効です。Bの相続人CはBの包括承継人であって民法94条2項の『第三者』ではないため、Cが善意でもAは無効を主張できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。心裡留保は、相手方が真意でないことを知り又は知ることができたときは『無効』となります。『取り消すことができる』ではありません（民法93条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。第三者による『詐欺』では相手方の悪意・有過失が要件ですが、第三者による『強迫』についてはその限定がありません。強迫された表意者は相手方の善意・無過失にかかわらず取り消し得ます。","corrected":"","inferredBasis":["民法96条"]},{"mark":"×","explanation":"誤り。意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し又は行為能力の制限を受けても、そのために効力を妨げられません（民法97条3項）。解除通知も同様です。","corrected":"","inferredBasis":[]}],"references":["民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。","民法94条第2項（解説中参照・条文要旨） Bの相続人CはBの包括承継人であって民法94条2項の『第三者』ではないため、Cが善意でもAは無効を主張できます。","民法93条（解説中参照・条文要旨） 『取り消すことができる』ではありません（民法93条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":62},{"learningNote":"Bの相続人CはBの包括承継人であって民法94条2項の『第三者』ではないため、Cが善意でもAは無効を主張できます。","statuteRef":63},{"learningNote":"『取り消すことができる』ではありません（民法93条）。","statuteRef":64},{"learningNote":"意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し又は行為能力の制限を受けても、そのために効力を妨げられません（民法97条3項）。","statuteRef":65},{"learningNote":"","statuteRef":66}]},{"id":27,"year":19,"sourceQuestion":3,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示の錯誤に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["錯誤が表意者の重大な過失によるものであった場合であっても、相手方が表意者と同一の錯誤に陥っていたときは、錯誤に基づく意思表示の取消しをすることができる。","表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤に基づいてした意思表示を取り消すためには、その事情が法律行為の基礎とされていることが表示されていなければならない。","錯誤に基づく意思表示は、その錯誤が法律行為の目的及び取引上の社会通念に照らして軽微なものであるときは、取り消すことができない。","錯誤に基づく意思表示の取消しは、過失があっても善意である第三者に対抗することはできない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。表意者に重大な過失があっても、相手方が表意者と同一の錯誤に陥っていた場合には、民法95条3項2号により表意者は取消しを主張できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。動機・基礎事情の錯誤による取消しには、その事情が法律行為の基礎とされていることが表示されている必要があります（民法95条2項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。錯誤が法律行為の目的及び取引上の社会通念に照らして重要でなければ取消しは認められません。軽微な錯誤では足りません。","corrected":"","inferredBasis":["民法95条"]},{"mark":"×","explanation":"誤り。錯誤取消しを対抗できない第三者は『善意かつ無過失』である必要があります（民法95条4項）。善意でも過失がある第三者には取消しを対抗できます。","corrected":"","inferredBasis":[]}],"references":["民法95条1項意思表示は、錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。","民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。"],"oldLawNote":"","referenceItems":[{"statuteRef":67},{"statuteRef":62},{"learningNote":"表意者に重大な過失があっても、相手方が表意者と同一の錯誤に陥っていた場合には、民法95条3項2号により表意者は取消しを主張できます。","statuteRef":68},{"learningNote":"動機・基礎事情の錯誤による取消しには、その事情が法律行為の基礎とされていることが表示されている必要があります（民法95条2項）。","statuteRef":69},{"learningNote":"錯誤取消しを対抗できない第三者は『善意かつ無過失』である必要があります（民法95条4項）。","statuteRef":70}]},{"id":28,"year":18,"sourceQuestion":5,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["相手方と通じてした虚偽の意思表示の無効は、善意の第三者に対抗することができない。","錯誤による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","意思表示は、相手方がその意思表示が表意者の真意ではないことを知り、又は知ることができたときは、無効とする。","強迫による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。通謀虚偽表示の無効は、善意の第三者に対抗できません（民法94条2項）。第三者に無過失までは要求されません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。錯誤による取消しは、善意かつ無過失の第三者に対抗できません（民法95条4項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。心裡留保は原則有効ですが、相手方が表意者の真意でないことを知り、又は知ることができたときは無効です（民法93条1項ただし書）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。強迫による取消しについては、詐欺や錯誤のような善意無過失第三者保護規定はありません。したがって、強迫による意思表示の取消しは善意無過失の第三者にも対抗できます。","corrected":"","inferredBasis":["民法95条","民法96条"]}],"references":["民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。","民法94条第2項（解説中参照・条文要旨） 通謀虚偽表示の無効は、善意の第三者に対抗できません（民法94条2項）。","民法95条第4項（解説中参照・条文要旨） 錯誤による取消しは、善意かつ無過失の第三者に対抗できません（民法95条4項）。","民法93条第1項（解説中参照・条文要旨） 心裡留保は原則有効ですが、相手方が表意者の真意でないことを知り、又は知ることができたときは無効です（民法93条1項ただし書）。"],"oldLawNote":"","referenceItems":[{"statuteRef":62},{"learningNote":"通謀虚偽表示の無効は、善意の第三者に対抗できません（民法94条2項）。","statuteRef":63},{"learningNote":"錯誤による取消しは、善意かつ無過失の第三者に対抗できません（民法95条4項）。","statuteRef":71},{"learningNote":"心裡留保は原則有効ですが、相手方が表意者の真意でないことを知り、又は知ることができたときは無効です（民法93条1項ただし書）。","statuteRef":72},{"learningNote":"","statuteRef":66}]},{"id":29,"year":15,"sourceQuestion":3,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示の効力発生に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["意思表示は，表意者が通知を発した後に死亡し，意思能力を喪失し，又は行為能力の制限を受けたときは，その効力を生じない。","相手方が正当な理由なく意思表示の通知が到達することを妨げたときは，その通知は，通常到達すべきであった時に到達したものとみなす。","意思表示は，相手方に到達するまでは，撤回することができる。","意思表示は，その通知が相手方に到達した時からその効力を生ずる。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けても、そのために効力を妨げられません（民法97条3項）。『効力を生じない』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。相手方が正当な理由なく到達を妨げたときは、民法97条2項により、通常到達すべきであった時に到達したものとみなされます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。到達主義の下では、意思表示は相手方に到達する前であれば原則として撤回することが可能です。ただし申込み等について撤回の可否に別段の規律がある場合はそちらを確認します。","corrected":"","inferredBasis":["民法97条1項"]},{"mark":"○","explanation":"正しい。民法97条1項により、相手方のある意思表示は、その通知が相手方に到達した時から効力を生じます。","corrected":"","inferredBasis":[]}],"references":["民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。"],"oldLawNote":"","referenceItems":[{"statuteRef":62},{"learningNote":"意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けても、そのために効力を妨げられません（民法97条3項）。","statuteRef":65},{"learningNote":"相手方が正当な理由なく到達を妨げたときは、民法97条2項により、通常到達すべきであった時に到達したものとみなされます。","statuteRef":73}]},{"id":30,"year":12,"sourceQuestion":3,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["第三者の強迫によって意思表示をした場合，相手方が強迫の事実を知っているか，知らなかったことについて過失があったときに限り，表意者は，強迫を理由としてその意思表示を取り消すことができる。","表示と内心の意思とが異なることを表意者自身が知りながら意思表示をした場合，相手方が表示と内心の意思が異なることを知らなかったことにつき過失があったときでも，相手方は，表意者に対して意思表示の有効を主張することができる。","意思表示の動機の錯誤は，その動機が相手方に表示されて法律行為の内容となり，もしその錯誤がなかったならばその意思表示をしなかったであろうと認められる場合に，要素の錯誤となる。","売主と買主が相談の上で仮装の売買契約を締結した場合，買主の相続人が仮装であることを知らなかったときは，売主は当該相続人に対して意思表示の無効を主張することができない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。第三者による『詐欺』では相手方の悪意・有過失が必要ですが、第三者による『強迫』では相手方が知らなくても取消しが可能です。本肢は詐欺と強迫の要件を混同しています。","corrected":"","inferredBasis":["民法96条"]},{"mark":"×","explanation":"誤り。心裡留保は、相手方が表意者の真意でないことを知り又は知ることができたときは無効です。相手方に過失があるのに『有効を主張できる』という部分が誤りです。","corrected":"","inferredBasis":["民法93条"]},{"mark":"○","explanation":"意思表示の動機の錯誤は，その動機が相手方に表示されて法律行為の内容となり，もしその錯誤がなかったならばその意思表示をしなかったであろうと認められる場合に，要素の錯誤となる。正しい（出題当時の旧民法の表現）。動機の錯誤が要素の錯誤となるためには、動機が相手方に表示され法律行為の内容となっていることが必要とされました。現行民法95条2項でも、基礎事情の錯誤についてその事情が法律行為の基礎とされていることが表示されていることを要求します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。通謀虚偽表示の当事者Bの相続人は、Bの包括承継人であって民法94条2項の『第三者』ではありません。相続人が善意でも、売主は虚偽表示の無効を主張できます。現行法メモ・2020年4月1日施行の改正民法では、錯誤の効果は「無効」から「取消し」に改められています。出題当時の法令基準と現行法を分けてください。","corrected":"","inferredBasis":[]}],"references":["民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。","民法95条第2項（解説中参照・条文要旨） 現行民法95条2項でも、基礎事情の錯誤についてその事情が法律行為の基礎とされていることが表示されていることを要求します。","民法94条第2項（解説中参照・条文要旨） 通謀虚偽表示の当事者Bの相続人は、Bの包括承継人であって民法94条2項の『第三者』ではありません。"],"oldLawNote":"","referenceItems":[{"statuteRef":62},{"learningNote":"現行民法95条2項でも、基礎事情の錯誤についてその事情が法律行為の基礎とされていることが表示されていることを要求します。","statuteRef":74},{"learningNote":"通謀虚偽表示の当事者Bの相続人は、Bの包括承継人であって民法94条2項の『第三者』ではありません。","statuteRef":63},{"learningNote":"","statuteRef":66},{"learningNote":"民法93条（解説中参照・学習用要点） 『取り消すことができる』ではありません（民法93条）。","statuteRef":64}]},{"id":31,"year":11,"sourceQuestion":4,"category":"意思表示・代理","theme":"意思表示","prompt":"意思表示に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["意思表示は，表意者が相手方の所在を知ることができないときは，公示の方法によってすることができる。","隔地者に対する契約申込みの意思表示は，その通知を発した後に申込者が死亡したときであっても，申込者が反対の意思を表示した場合又は相手方が申込者の死亡の事実を知っていた場合を除き，その通知が相手方に到達した時から効力を生じる。","錯誤により意思表示をした者に重過失があることによって，表意者が意思表示の無効を主張することができない場合，相手方及び第三者も，当該意思表示の無効を主張することができない。","表意者は，相手方に対する意思表示が第三者の強迫に基づきされた場合，相手方が強迫の事実を知っていたときに限り，その意思表示を取り消すことができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。相手方の所在を知ることができない場合等には、民法98条により公示の方法による意思表示が認められます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"隔地者に対する契約申込みの意思表示は，その通知を発した後に申込者が死亡したときであっても，申込者が反対の意思を表示した場合又は相手方が申込者の死亡の事実を知っていた場合を除き，その通知が相手方に到達した時から効力を生じる。正しい（出題当時の規律）。隔地者に対する申込みは到達によって効力を生じ、通知後に申込者が死亡しても原則として効力は妨げられません。ただし申込者が反対の意思を表示していた場合や相手方が死亡等を知った場合の特則があります。","corrected":"","inferredBasis":["民法97条1項"]},{"mark":"○","explanation":"錯誤により意思表示をした者に重過失があることによって，表意者が意思表示の無効を主張することができない場合，相手方及び第三者も，当該意思表示の無効を主張することができない。正しい（旧民法下）。表意者に重大な過失があり本人が錯誤無効を主張できない場合、その無効を相手方・第三者が本人に代わって主張することもできないと解されていました。現行法では錯誤は『取消し』制度に改められています。","corrected":"","inferredBasis":["民法95条"]},{"mark":"×","explanation":"誤り。第三者による強迫では、相手方が強迫の事実を知っていたかどうかにかかわらず、表意者は意思表示を取り消すことができます。相手方の悪意等を要件とするのは第三者による詐欺です。現行法メモ・2020年4月1日施行の改正民法では、錯誤の効果は「無効」から「取消し」に改められています。出題当時の法令基準と現行法を分けてください。","corrected":"","inferredBasis":["民法95条","民法96条"]}],"references":["民法97条1項意思表示は、その通知が相手方に到達した時からその効力を生ずる。","民法98条（解説中参照・条文要旨） 相手方の所在を知ることができない場合等には、民法98条により公示の方法による意思表示が認められます。"],"oldLawNote":"","referenceItems":[{"statuteRef":62},{"learningNote":"相手方の所在を知ることができない場合等には、民法98条により公示の方法による意思表示が認められます。","statuteRef":75},{"learningNote":"","statuteRef":76},{"learningNote":"","statuteRef":66}]},{"id":32,"year":20,"sourceQuestion":5,"category":"意思表示・代理","theme":"代理","prompt":"復代理に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["本人の許諾を得て復代理人を選任した任意代理人は、当該復代理人の過失により本人に損害が生じた場合であっても、本人に対して、その選任及び監督についての責任のみを負う。","復代理人は、本人及び第三者に対して、その権限の範囲内において、代理人と同一の権利を有し、義務を負う。","法定代理人は、自己の責任で復代理人を選任することができる。","任意代理人は、やむを得ない事由があるときは、本人の許諾を得ずに復代理人を選任することができる。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。現行民法では、任意代理人が本人の許諾を得て復代理人を選任した場合でも、当然に『選任・監督についての責任のみ』に限定されるという旧法上の規定は削除されています。任意代理人の債務不履行責任の一般原則で判断します。","corrected":"","inferredBasis":["民法104条","民法105条"]},{"mark":"○","explanation":"正しい。民法107条2項により、復代理人はその権限内の行為について本人を代表し、本人及び第三者に対して代理人と同一の権利を有し義務を負います。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。法定代理人は自己の責任で復代理人を選任できます（民法105条）。ただしやむを得ない事由がある場合の責任範囲には特則があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。任意代理人は本人の許諾を得たとき、又はやむを得ない事由があるときに復代理人を選任できます（民法104条）。","corrected":"","inferredBasis":[]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","民法107条第2項（解説中参照・条文要旨） 民法107条2項により、復代理人はその権限内の行為について本人を代表し、本人及び第三者に対して代理人と同一の権利を有し義務を負います。","民法105条（解説中参照・条文要旨） 法定代理人は自己の責任で復代理人を選任できます（民法105条）。","民法104条（解説中参照・条文要旨） 任意代理人は本人の許諾を得たとき、又はやむを得ない事由があるときに復代理人を選任できます（民法104条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"learningNote":"民法107条2項により、復代理人はその権限内の行為について本人を代表し、本人及び第三者に対して代理人と同一の権利を有し義務を負います。","statuteRef":78},{"learningNote":"法定代理人は自己の責任で復代理人を選任できます（民法105条）。","statuteRef":79},{"learningNote":"任意代理人は本人の許諾を得たとき、又はやむを得ない事由があるときに復代理人を選任できます（民法104条）。","statuteRef":80}]},{"id":33,"year":19,"sourceQuestion":4,"category":"意思表示・代理","theme":"代理","prompt":"ＡがＢの代理人と称してＢ所有の甲土地をＣに売却する契約（以下「本件契約」という。）をＣとの間で締結した場合に関する次の１から４までの記述のうち、判例の趣旨に照らして表見代理が成立し得ないものを1つ選びなさい。","choices":["Ｂが登記申請手続の代理をＡに委任したところ、Ａが、その際にＢから預かった実印を用いて本件契約を締結した場合","Ｂは、甲土地を賃貸する権限をＡに与えていたが、本件契約の締結の前に、甲土地の賃貸に関するＡの権限がＢによって消滅させられていた場合","Ｂは、自己の名義を使用して取引することをＡに許していたが、甲土地を売却する権限をＡに与えていなかった場合","Ｂは、自己所有の甲土地につき売却する権限をＡに与えていたが、Ａが、自己の利益を図る目的で本件契約を締結した場合"],"answer":4,"details":[{"mark":"○","explanation":"Ｂが登記申請手続の代理をＡに委任したところ、Ａが、その際にＢから預かった実印を用いて本件契約を締結した場合成立し得ます。登記申請手続を委任し実印を預けたという本人Bの行為が、売買権限があるとの外観形成に寄与したとして、基本代理権・正当理由等を満たせば民法110条の表見代理が成立する余地があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"Ｂは、甲土地を賃貸する権限をＡに与えていたが、本件契約の締結の前に、甲土地の賃貸に関するＡの権限がＢによって消滅させられていた場合成立し得ます。過去に賃貸権限という代理権が存在し、その後消滅した場合には、民法112条の代理権消滅後の表見代理が問題となります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"成立し得ます。本人BがAに自己名義で取引することを許した事情は、代理権授与表示による表見代理（民法109条）の成立を基礎付ける可能性があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"Ｂは、自己所有の甲土地につき売却する権限をＡに与えていたが、Ａが、自己の利益を図る目的で本件契約を締結した場合成立し得ない類型です。Aには実際に甲土地を売却する代理権があり、問題はAが自己利益目的で権限を濫用した点です。これは無権代理の外観を保護する表見代理ではなく、代理権濫用（民法107条）の問題です。","corrected":"","inferredBasis":[]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","民法110条（解説中参照・条文要旨） 登記申請手続を委任し実印を預けたという本人Bの行為が、売買権限があるとの外観形成に寄与したとして、基本代理権・正当理由等を満たせば民法110条の表見代理が成立する余地があります。","民法112条（解説中参照・条文要旨） 過去に賃貸権限という代理権が存在し、その後消滅した場合には、民法112条の代理権消滅後の表見代理が問題となります。","民法109条（解説中参照・条文要旨） 本人BがAに自己名義で取引することを許した事情は、代理権授与表示による表見代理（民法109条）の成立を基礎付ける可能性があります。","民法107条（解説中参照・条文要旨） これは無権代理の外観を保護する表見代理ではなく、代理権濫用（民法107条）の問題です。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"learningNote":"登記申請手続を委任し実印を預けたという本人Bの行為が、売買権限があるとの外観形成に寄与したとして、基本代理権・正当理由等を満たせば民法110条の表見代理が成立する余地があります。","statuteRef":81},{"learningNote":"過去に賃貸権限という代理権が存在し、その後消滅した場合には、民法112条の代理権消滅後の表見代理が問題となります。","statuteRef":82},{"learningNote":"本人BがAに自己名義で取引することを許した事情は、代理権授与表示による表見代理（民法109条）の成立を基礎付ける可能性があります。","statuteRef":83},{"learningNote":"これは無権代理の外観を保護する表見代理ではなく、代理権濫用（民法107条）の問題です。","statuteRef":84}]},{"id":34,"year":17,"sourceQuestion":4,"category":"意思表示・代理","theme":"代理","prompt":"Ａは、その父であるＢから何ら代理権を与えられていないにもかかわらず、Ｂの代理人として、Ｃとの間で、Ｂ所有の土地の売買契約を締結した。この場合に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["Ｃは、契約時にＡが代理権を有しないことを知らなかったときは、ＢがＡの無権代理行為の追認をした後であっても、売買契約を取り消すことができる。","Ｃは、契約時にＡが代理権を有しないことを知っていたときは、Ａに対して無権代理人の責任を追及することができない。","Ａが死亡し、ＢがＡを単独相続したときは、Ｂは、Ａの無権代理行為の追認を拒絶できる地位にあったことを理由として、Ｃに対する無権代理人の責任を免れることができる。","ＢがＣに対してＡの無権代理行為の追認を拒絶した後にＢが死亡し、ＡがＢを単独相続したときは、売買契約は有効となる。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。本人Bが無権代理行為を追認すれば契約は遡って有効となり、相手方Cはその後、無権代理を理由として契約を取り消すことはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法117条は無権代理人の責任を定めますが、相手方が契約時に代理権がないことを知っていた場合には無権代理人の履行・損害賠償責任を追及できません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。無権代理人Aを本人Bが相続した場合、Bは本人として追認拒絶できる一方、Aの無権代理人としての責任も相続します。本人として追認拒絶できることだけを理由に117条責任まで免れるわけではありません。","corrected":"","inferredBasis":["民法117条","民法882条"]},{"mark":"×","explanation":"誤り。本人Bが生前に追認を拒絶した後に無権代理人AがBを相続しても、既に確定した追認拒絶の効果が覆り、契約が当然に有効になるわけではありません。","corrected":"","inferredBasis":["民法117条","民法882条"]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","民法117条（解説中参照・条文要旨） 民法117条は無権代理人の責任を定めますが、相手方が契約時に代理権がないことを知っていた場合には無権代理人の履行・損害賠償責任を追及できません。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"learningNote":"民法117条は無権代理人の責任を定めますが、相手方が契約時に代理権がないことを知っていた場合には無権代理人の履行・損害賠償責任を追及できません。","statuteRef":85},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":35,"year":16,"sourceQuestion":4,"category":"意思表示・代理","theme":"代理","prompt":"Ａは、自己の所有する甲土地を売却することについてＢに代理権を与え、Ｂは、Ａを代理して、Ｃとの間で甲土地の売買契約を締結した。この場合に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["この契約の締結当時Ｂが未成年者であった場合、Ａは、Ｂが未成年者であったことを理由として、この契約を取り消すことができる。","この契約がＣのＢに対する強迫によって締結されたものであった場合、Ａは、自らが強迫を受けていなかったとしても、Ｂがした意思表示を取り消すことができる。","この契約がＣの心裡留保に基づいて締結されたものであった場合、Ｃの意思表示がＣの真意ではないことについてＢが知り得なかったとしても、Ａが知っていたときは、Ｃがした意思表示は無効とならない。","この契約がＣの心裡留保に基づいて締結されたものであった場合、Ｃの意思表示がＣの真意ではないことについてＡが知り得なかったとしても、Ｂが知っていたときは、Ｃがした意思表示は無効とならない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。代理人は行為能力者であることを要しません（民法102条）。代理人Bが未成年であることを理由に、本人Aが代理行為を取り消すことはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。代理行為の瑕疵は原則として代理人を基準に判断します（民法101条）。Cが代理人Bを強迫してBが意思表示をした場合、本人A自身が強迫されていなくても、その代理行為を取り消すことができます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。相手方Cの心裡留保について、真意でないことを知る・知り得るかの判断対象は、Cの意思表示を受領した代理人Bです。本人Aが知っていたかどうかではありません。","corrected":"","inferredBasis":["民法93条"]},{"mark":"×","explanation":"誤り。代理人BがCの心裡留保を知り、又は知ることができたなら、民法93条1項ただし書によりCの意思表示は無効となり得ます。『無効とならない』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。","民法101条（解説中参照・条文要旨） 代理行為の瑕疵は原則として代理人を基準に判断します（民法101条）。","民法93条第1項（解説中参照・条文要旨） 代理人BがCの心裡留保を知り、又は知ることができたなら、民法93条1項ただし書によりCの意思表示は無効となり得ます。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"learningNote":"代理行為の瑕疵は原則として代理人を基準に判断します（民法101条）。","statuteRef":87},{"learningNote":"代理人BがCの心裡留保を知り、又は知ることができたなら、民法93条1項ただし書によりCの意思表示は無効となり得ます。","statuteRef":72}]},{"id":36,"year":12,"sourceQuestion":4,"category":"意思表示・代理","theme":"代理","prompt":"双方代理又は利益相反行為に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["一般社団法人の代表理事が，当該法人の社員総会又は理事会の承認を得ることなく，当該代表理事個人の債務を担保するために当該法人が所有する不動産に担保設定することは，利益相反行為に当たる。","親権者が未成年の子を代理して当該子の所有する不動産を第三者の債務の担保に供する行為は，当該親権者と当該子の間における利益相反行為に当たる。","不動産の売買契約に基づく所有権の移転の登記手続について，司法書士が売主及び買主の双方を代理することは，双方代理の禁止に関する規定に違反しない。","共同相続人の一人が他の共同相続人の後見人である場合において，後見人が自ら相続の放棄をした後に，後見人が被後見人を代理してする相続の放棄は，利益相反行為に当たらない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。法人代表者が自己の債務を担保するため法人所有不動産に担保を設定することは、法人と代表者の利益が対立する典型的な利益相反取引です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。親権者が子の不動産を『第三者の債務』の担保に供するだけでは、親権者自身と子の利益が直接対立するとは限りません。利益相反行為かどうかは行為の外形から親権者自身と子の利害が対立するかで判断します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。売買契約が既に成立し、登記申請が債務の履行にすぎない場合、司法書士が売主・買主双方から登記手続の委任を受けることは、実体法上の双方代理禁止に抵触しないと解されます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。後見人自身が先に相続放棄して共同相続関係から離脱した後、被後見人を代理して相続放棄する場合、後見人自身との利益対立が解消しているため利益相反行為には当たりません。","corrected":"","inferredBasis":["民法938条"]}],"references":["民法102条制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":77},{"learningNote":"","statuteRef":88}]},{"id":37,"year":16,"sourceQuestion":3,"category":"意思表示・代理","theme":"錯誤","prompt":"錯誤に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["錯誤に基づく意思表示は、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものでなければ、取り消すことができない。","錯誤に基づく意思表示の取消しは、善意であるが過失のある第三者には対抗することができる。","意思表示に対応する意思を欠く錯誤に基づく意思表示は、その法律行為の基礎とした事情が表示されていなければ、取り消すことができない。","錯誤に基づく意思表示は、相手方が表意者と同一の錯誤に陥っていたときは、その錯誤が表意者の重大な過失によるものであったとしても、取り消すことができる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。現行民法95条1項は、錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものである場合に限り、意思表示を取り消すことができるとしています。軽微な錯誤では取消しは認められません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法95条4項が保護する第三者は『善意かつ無過失』の第三者です。したがって、善意でも過失がある第三者には錯誤取消しを対抗できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『意思表示に対応する意思を欠く錯誤』は表示錯誤であり、基礎事情が表示されていることは取消しの要件ではありません。基礎事情の表示が必要なのは、法律行為の基礎とした事情について認識が真実に反する動機・基礎事情の錯誤です。","corrected":"","inferredBasis":["民法95条"]},{"mark":"○","explanation":"正しい。表意者に重大な過失があっても、相手方が表意者と同一の錯誤に陥っていた場合は、民法95条3項2号により取消しが認められます。","corrected":"","inferredBasis":[]}],"references":["民法95条1項意思表示は、錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":67},{"learningNote":"民法95条4項が保護する第三者は『善意かつ無過失』の第三者です。","statuteRef":70},{"learningNote":"表意者に重大な過失があっても、相手方が表意者と同一の錯誤に陥っていた場合は、民法95条3項2号により取消しが認められます。","statuteRef":68}]},{"id":38,"year":20,"sourceQuestion":7,"category":"時効・占有","theme":"占有","prompt":"以下の文中の（）内に入る語の組み合わせとして、正しいものを１つ選びなさい。民法の定める担保物権のうち、一定の条件を満たせば当事者の意思にかかわらず法律上当然に成立するものを法定担保物権とよび、（a）、（b）がこれに属する。他方、当事者の契約によって発生するものを約定担保物権とよび、（c）、（d）がこれに属する。（a）、（c）は、担保目的物を債権者が占有し、債権の弁済があるまでその返還を拒むことによって弁済を促すのに対し、（d）は目的物の占有を担保権設定者のもとにとどめるところに特徴がある。（b）、（c）、（d）の権利者は、目的物が競売された場合に優先的に配当を受けることができるが、（a）にはそのような効力は認められていない。","choices":["a＝先取特権b＝留置権c＝質権d＝抵当権","a＝先取特権b＝留置権c＝抵当権d＝質権","a＝留置権b＝先取特権c＝抵当権d＝質権","a＝留置権b＝先取特権c＝質権d＝抵当権"],"answer":4,"details":[{"mark":"×","explanation":"誤り。aは留置権でなければなりません。留置権は法定担保物権で目的物を占有して返還を拒む効力を持ちますが、原則として優先弁済効はありません。先取特権は優先弁済効を持つ法定担保物権です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。aとbが逆です。法定担保物権は留置権・先取特権で、a＝留置権、b＝先取特権となります。さらにc・dは質権・抵当権の順でなければ本文の占有関係と一致しません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。cとdが逆です。質権は担保目的物を債権者が占有する約定担保物権、抵当権は目的物の占有を設定者に残したまま優先弁済を受ける約定担保物権です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。a＝留置権、b＝先取特権、c＝質権、d＝抵当権です。留置権・先取特権は法定担保物権、質権・抵当権は約定担保物権で、留置権のみ原則として優先弁済効を持ちません。","corrected":"","inferredBasis":[]}],"references":["民法186条占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定する。","民法187条1項占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":89},{"statuteRef":90}]},{"id":39,"year":18,"sourceQuestion":7,"category":"時効・占有","theme":"占有","prompt":"占有に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["占有者は、平穏、かつ、公然と占有をするものと推定されるが、善意無過失で占有をするものとは推定されない。","占有者の承継人は、その選択に従い、自己の占有のみを主張することも、自己の占有に前の占有者の占有を併せて主張することもできる。","善意の占有者は、占有物から生ずる果実を取得する。","占有者が占有物について行使する権利は、適法に有するものと推定される。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。民法186条1項により、占有者は平穏・公然だけでなく善意で占有するものとも推定されます。推定されないのは『無過失』です。『善意無過失の両方が推定されない』という書き方が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法187条1項により、占有の承継人は自己の占有のみを主張するか、自己の占有に前主の占有を併せて主張するかを選択できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法189条1項により、善意の占有者は占有物から生ずる果実を取得します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法188条により、占有者が占有物について行使する権利は適法に有するものと推定されます。","corrected":"","inferredBasis":[]}],"references":["民法186条占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定する。","民法187条1項占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。","民法189条第1項（解説中参照・条文要旨） 民法189条1項により、善意の占有者は占有物から生ずる果実を取得します。","民法188条（解説中参照・条文要旨） 民法188条により、占有者が占有物について行使する権利は適法に有するものと推定されます。"],"oldLawNote":"","referenceItems":[{"statuteRef":89},{"statuteRef":90},{"learningNote":"民法189条1項により、善意の占有者は占有物から生ずる果実を取得します。","statuteRef":91},{"learningNote":"民法188条により、占有者が占有物について行使する権利は適法に有するものと推定されます。","statuteRef":92},{"learningNote":"民法186条1項により、占有者は平穏・公然だけでなく善意で占有するものとも推定されます。","statuteRef":93}]},{"id":40,"year":16,"sourceQuestion":7,"category":"時効・占有","theme":"占有","prompt":"占有に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["占有権は、代理人によって取得することができる。","前後の両時点において占有をした証拠があるときは、占有は、その間継続したものと推定される。","占有権は、自己のためにする意思をもって物を所持することによって取得する。","占有者は、所有の意思をもって、平穏かつ公然に占有するものと推定されるが、善意で開始した占有であることは推定されない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。民法181条により、占有権は代理人によって取得することができます。自ら直接物を所持する場合に限られません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法186条2項により、前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定されます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法180条は、占有権が『自己のためにする意思をもって物を所持すること』によって取得されると定めています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法186条1項は、占有者について所有の意思、善意、平穏、公然をすべて推定します。『善意であることは推定されない』という部分が誤りです。ただし『無過失』までは同条で推定されません。","corrected":"","inferredBasis":[]}],"references":["民法186条占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定する。","民法187条1項占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。","民法181条（解説中参照・条文要旨） 民法181条により、占有権は代理人によって取得することができます。","民法180条（解説中参照・条文要旨） 民法180条は、占有権が『自己のためにする意思をもって物を所持すること』によって取得されると定めています。"],"oldLawNote":"","referenceItems":[{"statuteRef":89},{"statuteRef":90},{"learningNote":"民法181条により、占有権は代理人によって取得することができます。","statuteRef":94},{"learningNote":"民法180条は、占有権が『自己のためにする意思をもって物を所持すること』によって取得されると定めています。","statuteRef":95},{"learningNote":"民法186条2項により、前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定されます。","statuteRef":96},{"learningNote":"民法186条1項は、占有者について所有の意思、善意、平穏、公然をすべて推定します。","statuteRef":93}]},{"id":41,"year":13,"sourceQuestion":7,"category":"時効・占有","theme":"占有","prompt":"占有に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["ＡがＢに保管させているＡ所有の動産をＣに売却した場合において，ＡがＢに対して以後Ｃのために動産を保管することを命じ，Ｃがこれを承諾したときは，Ｃは，動産の占有権を取得する。","甲土地を賃借して占有していたＡを相続したＢは，Ｂ独自の占有に基づく甲土地の取得時効の成立を主張する場合，自らの占有が所有の意思に基づくものであるというために，その事実的支配が外形的客観的にみて独自の所有の意思に基づくものといえる事情を主張立証しなければならない。","動産の所有者であって自ら動産を占有するＡが，Ｂとの間で売買契約を締結し，同時にＢを貸主，Ａを借主とする使用貸借契約を締結した場合，以後Ｂのために占有する旨のＡの意思表示によって，Ｂは動産の占有権を取得する。","Ａが所有する甲土地をＢから買い受けその占有を開始したＣが，売買契約当時，他人の物の売買であるため甲土地の所有権を直ちに取得するものでないと知っていた場合には，Ｃの甲土地の占有は，初めから所有の意思がなかったものとみなされる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。占有代理人Bが物を所持している場合、AがBに対して以後Cのために占有するよう命じ、Cが承諾すれば、民法184条の指図による占有移転によりCは占有権を取得します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。賃借人Aから相続したBが、自分独自の自主占有を起算点として取得時効を主張するには、単なる相続だけで他主占有が自主占有へ当然転換するわけではないため、新権原や外形的に独自の所有意思を示す事情を主張立証する必要があります。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。所有者Aが動産をBへ売却し、同時にAがBから借りる形にして以後Bのために占有する意思を表示すれば、占有改定によりBへ占有が移転します。","corrected":"","inferredBasis":["民法555条"]},{"mark":"×","explanation":"誤り。他人物売買であることを買主Cが知っていても、売買は所有権取得を目的とする権原ですから、Cの占有は通常『所有の意思』をもつ自主占有です。所有権を直ちに取得できないことを知っていることと、所有の意思の有無は別問題です。","corrected":"","inferredBasis":["民法555条"]}],"references":["民法186条占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。前後の両時点において占有をした証拠があるときは、その間占有を継続したものと推定する。","民法187条1項占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。","民法184条（解説中参照・条文要旨） 占有代理人Bが物を所持している場合、AがBに対して以後Cのために占有するよう命じ、Cが承諾すれば、民法184条の指図による占有移転によりCは占有権を取得します。"],"oldLawNote":"","referenceItems":[{"statuteRef":89},{"statuteRef":90},{"learningNote":"占有代理人Bが物を所持している場合、AがBに対して以後Cのために占有するよう命じ、Cが承諾すれば、民法184条の指図による占有移転によりCは占有権を取得します。","statuteRef":97},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98},{"learningNote":"民法555条売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","statuteRef":99}]},{"id":42,"year":17,"sourceQuestion":5,"category":"時効・占有","theme":"取得時効","prompt":"取得時効に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["自己の所有物を占有する者は、その物について取得時効を援用することができる。","所有の意思の有無は、占有者の内心の意思のいかんを問わず、外形的客観的事情により判断される。","不動産の所有権を時効により取得した者は、その取得時効の期間の進行中に原権利者からその不動産を譲り受け、その旨の登記をした者に対して、登記をしなくてもその所有権の取得を対抗することができる。","不動産を占有する者が、第三者の侵奪行為によってその占有を失い、その後占有回収の訴えによってその占有を現実に回復した場合、取得時効は、不動産の占有を現実に回復した時から新たに進行する。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。自己の所有物であっても、取得時効を援用する法律上の利益がある場合には取得時効を援用できるとするのが判例です。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。自主占有か他主占有かは占有者の主観的内心だけで決めず、占有取得の原因たる事実や外形的客観的事情から判断します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。時効進行中に原権利者から譲り受け登記した者は、時効完成時点では時効取得者との関係で後発第三者ではなく、時効取得者は登記なく所有権取得を対抗できます。","corrected":"","inferredBasis":["民法162条","民法177条"]},{"mark":"×","explanation":"誤り。第三者に一時占有を侵奪されても、占有回収の訴えにより占有を回復した場合、民法203条ただし書等により占有は継続していたものとして扱われます。『回復時から時効が新たに進行する』という部分が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法203条（解説中参照・条文要旨） 第三者に一時占有を侵奪されても、占有回収の訴えにより占有を回復した場合、民法203条ただし書等により占有は継続していたものとして扱われます。"],"oldLawNote":"","referenceItems":[{"statuteRef":100},{"statuteRef":101},{"statuteRef":102},{"learningNote":"第三者に一時占有を侵奪されても、占有回収の訴えにより占有を回復した場合、民法203条ただし書等により占有は継続していたものとして扱われます。","statuteRef":103},{"learningNote":"民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","statuteRef":104}]},{"id":43,"year":16,"sourceQuestion":5,"category":"時効・占有","theme":"取得時効","prompt":"取得時効に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["所有権の時効取得の効力は、占有を開始した時に遡る。","所有権以外の財産権は取得時効の対象とならない。","時効期間が経過しても、当事者がその利益を享受する旨の意思表示をしなければ、裁判所は、時効の効力が発生したことを前提として裁判をすることができない。","当事者は、時効が完成したことを知った上で時効の利益を放棄することができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。民法144条により、時効の効力はその起算日にさかのぼります。所有権の取得時効も、占有開始時にさかのぼって所有権を取得したものとして扱われます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。『所有権以外は取得時効の対象とならない』という部分が誤りです。所有権以外でも、地上権、地役権、賃借権など、一定の財産権は性質上可能な限り取得時効の対象となり得ます。","corrected":"","inferredBasis":["憲法29条","民法162条"]},{"mark":"○","explanation":"正しい。民法145条により、時効は当事者が援用しなければ、裁判所がこれによって裁判することができません。単に期間が経過しただけで裁判所が職権適用する制度ではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。時効完成後であれば、当事者は時効完成を知った上で時効の利益を放棄できます。これに対し、時効完成前にあらかじめ時効の利益を放棄することはできません。","corrected":"","inferredBasis":["民法146条"]}],"references":["民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法144条（解説中参照・条文要旨） 民法144条により、時効の効力はその起算日にさかのぼります。"],"oldLawNote":"","referenceItems":[{"statuteRef":100},{"statuteRef":101},{"statuteRef":102},{"learningNote":"民法144条により、時効の効力はその起算日にさかのぼります。","statuteRef":105},{"learningNote":"憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。","statuteRef":106}]},{"id":44,"year":13,"sourceQuestion":6,"category":"時効・占有","theme":"取得時効","prompt":"取得時効に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["土地の継続的な用益という外形的事実が存在し，かつ，それが賃借の意思に基づくことが客観的に表現されているときは，土地賃借権を時効取得することができる。","Ａが所有する不動産について，Ｂが占有を継続したことにより取得時効が完成した場合，Ｂは，Ｂの時効完成後にＡからその不動産を譲り受けたＣに対して，登記なくして時効による権利の取得を対抗することができる。","甲建物の敷地である乙土地の所有権の帰属につき争いがある場合において，甲建物を所有するＡから建物を賃借したＢは，Ａが乙土地の所有権を時効取得しなければ自らの建物賃借権を失うときであっても，Ａによる乙土地の取得時効を援用することはできない。","不動産の時効取得を主張する援用権者は，取得時効の起算点として，占有を開始した日以後の任意の時点を選択して主張することはできない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。土地賃借権のような所有権以外の財産権も、継続的用益という外形的事実と賃借意思が客観的に表現されている等の要件を満たせば時効取得し得ます。","corrected":"","inferredBasis":["憲法29条"]},{"mark":"×","explanation":"誤り。時効完成『後』に原所有者AからCが譲り受けた場合、BとCは対抗関係に立ち、Bは時効取得の登記を備えなければCに対抗できないのが判例です。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。時効を援用できるのは時効によって直接利益を受ける者等に限られます。建物賃借人Bは、建物所有者Aが敷地所有権を取得しなければ賃借権を失う立場でも、原則としてAの敷地取得時効を援用する地位にはありません。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。取得時効の起算点は実際の占有開始時であり、援用者が時効完成に都合のよい任意の日を選んで起算点をずらすことはできません。","corrected":"","inferredBasis":["民法162条"]}],"references":["民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":100},{"statuteRef":101},{"statuteRef":102},{"learningNote":"憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。","statuteRef":106}]},{"id":45,"year":12,"sourceQuestion":5,"category":"時効・占有","theme":"取得時効","prompt":"次の１から４までのうち，取得時効ができない権利を１つ選びなさい。","choices":["地上権","通行地役権","不動産賃借権","留置権"],"answer":4,"details":[{"mark":"×","explanation":"取得時効できます。地上権は継続的に行使される財産権であり、要件を満たせば時効取得が可能です。","corrected":"","inferredBasis":["憲法29条","民法162条"]},{"mark":"×","explanation":"取得時効できます。通行地役権は、継続的に行使され、かつ外形上認識できる場合に時効取得が可能です（民法283条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"取得時効できます。土地・建物の賃借権も、継続的な用益と賃借意思の客観的表現等の要件を満たせば判例上時効取得が認められます。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"取得時効できません。留置権は法定担保物権であり、被担保債権と目的物との牽連性等の法律上の要件により当然に成立する権利で、占有継続によって時効取得する性質の権利ではありません。","corrected":"","inferredBasis":["民法162条"]}],"references":["民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法283条（解説中参照・条文要旨） 通行地役権は、継続的に行使され、かつ外形上認識できる場合に時効取得が可能です（民法283条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":100},{"statuteRef":101},{"statuteRef":102},{"learningNote":"通行地役権は、継続的に行使され、かつ外形上認識できる場合に時効取得が可能です（民法283条）。","statuteRef":107},{"learningNote":"憲法29条財産権は、これを侵してはならない。財産権の内容は、公共の福祉に適合するように、法律でこれを定める。私有財産は、正当な補償の下に、これを公共のために用いることができる。","statuteRef":106}]},{"id":46,"year":18,"sourceQuestion":4,"category":"時効・占有","theme":"消滅時効","prompt":"消滅時効に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["時効は、裁判上の請求があったときは、その時から新たにその進行を始める。","債務者が消滅時効の完成後に債権者に対して債務を承認した場合であっても、その後更に消滅時効の期間が経過したときは、債務者は、時効を援用することができる。","人の生命又は身体の侵害による損害賠償請求権は、権利を行使することができる時から２０年間行使しないときには、時効によって消滅する。","消滅時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。裁判上の請求があっただけで、その時から直ちに時効が『新たに進行』するわけではありません。現行民法では裁判上の請求により完成が猶予され、確定判決等で権利が確定した時に時効が更新され、その時から新たに進行します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。時効完成後に債務を承認して一度は援用できなくなっても、その後さらに新たな消滅時効期間が完成すれば、その新たな時効を援用することができます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。人の生命又は身体の侵害による損害賠償請求権は、権利を行使することができる時から20年間行使しないときに時効消滅します（民法167条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。消滅時効も民法145条の援用を要し、裁判所が当事者の援用なしに職権で適用することはできません。","corrected":"","inferredBasis":[]}],"references":["民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法167条（解説中参照・条文要旨） 人の生命又は身体の侵害による損害賠償請求権は、権利を行使することができる時から20年間行使しないときに時効消滅します（民法167条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":101},{"statuteRef":102},{"learningNote":"人の生命又は身体の侵害による損害賠償請求権は、権利を行使することができる時から20年間行使しないときに時効消滅します（民法167条）。","statuteRef":108}]},{"id":47,"year":17,"sourceQuestion":6,"category":"時効・占有","theme":"消滅時効","prompt":"消滅時効に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["貸金債権は、債権者が権利を行使することができる時から５年間行使しないときは、時効によって消滅する。","債務者は、消滅時効の完成前に時効の利益を放棄することができる。","確定判決によって確定した権利であって、確定の時に弁済期の到来している債権については、１０年より短い時効期間の定めがあるものであっても、その時効期間は、１０年となる。","契約解除に基づく原状回復義務が履行不能になった場合は、その履行不能による損害賠償請求権の消滅時効は、原状回復義務が履行不能になった時から進行を開始する。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。通常の貸金債権について、権利を行使できる時からの客観的期間は10年です。現行民法166条は、債権者が権利を行使できることを知った時から5年、権利を行使できる時から10年のいずれか早い方で消滅すると定めます。『権利行使可能時から5年』ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。時効の利益は完成前にあらかじめ放棄できません（民法146条）。完成後に時効完成を知った上で放棄することは可能です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。確定判決等によって確定した権利について、その確定時に弁済期が到来している場合、元の時効期間が10年より短くても時効期間は10年となります（民法169条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。解除に基づく原状回復義務が履行不能となった場合の損害賠償請求権の時効起算点は、単純に履行不能となった時だけで決まるとは限りません。債権者が権利を行使できることを知った時等、民法166条の主観的・客観的起算点で判断します。","corrected":"","inferredBasis":[]}],"references":["民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法166条（解説中参照・条文要旨） 現行民法166条は、債権者が権利を行使できることを知った時から5年、権利を行使できる時から10年のいずれか早い方で消滅すると定めます。","民法169条（解説中参照・条文要旨） 確定判決等によって確定した権利について、その確定時に弁済期が到来している場合、元の時効期間が10年より短くても時効期間は10年となります（民法169条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":101},{"statuteRef":102},{"learningNote":"現行民法166条は、債権者が権利を行使できることを知った時から5年、権利を行使できる時から10年のいずれか早い方で消滅すると定めます。","statuteRef":109},{"learningNote":"確定判決等によって確定した権利について、その確定時に弁済期が到来している場合、元の時効期間が10年より短くても時効期間は10年となります（民法169条）。","statuteRef":110}]},{"id":48,"year":12,"sourceQuestion":6,"category":"時効・占有","theme":"消滅時効","prompt":"消滅時効に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["不法行為に基づく損害賠償の支払義務が訴訟上の和解によって確定し，その弁済期が和解の時から１年後とされた場合であっても，その請求権は和解成立の時から１０年の消滅時効にかかる。","債務者が消滅時効の完成後に債権者に対して債務を承認した場合において，その後さらに消滅時効の期間が経過したときは，債務者は，その完成した消滅時効を援用することができる。","催告による時効の中断は，最初の催告の日からから６か月以内に再度催告すれば，さらに６か月間時効を中断することができる。","不確定期限の定めのある債権の消滅時効は，債務者が期限の到来を知った時から進行する。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。訴訟上の和解で確定した請求権でも、弁済期が将来に定められているなら、時効は権利を行使できる弁済期から進行します。和解成立時から一律に10年進行するわけではありません。","corrected":"","inferredBasis":["民法709条"]},{"mark":"○","explanation":"正しい。完成した時効を承認により援用できなくなった後でも、その後新たに時効期間が経過すれば、新たに完成した時効を援用できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。催告による完成猶予は、同一の時効期間について再度催告を重ねて6か月ずつ無限に延長することはできません。再催告だけで更に6か月延長されるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不確定期限付債権は期限が客観的に到来すれば権利行使可能となるので、時効は原則として期限到来時から進行します。債務者が期限到来を知った時が起算点ではありません。現行法メモ・2020年改正後の現行民法では、旧法の「時効の中断」は「完成猶予」と「更新」に整理されています。","corrected":"","inferredBasis":[]}],"references":["民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":101},{"statuteRef":102},{"learningNote":"民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","statuteRef":111}]},{"id":49,"year":19,"sourceQuestion":5,"category":"時効・占有","theme":"時効","prompt":"時効に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["他人の物を賃借した者は、民法所定の期間、占有を続けることによって、その物の所有権を時効により取得することができる。","時効が完成したとしても、当事者が援用しなければ、裁判所は、時効の効力が発生したことを前提として裁判をすることができない。","当事者は、時効の完成前であっても、時効の利益を享受しない旨の意思表示をすることができる。","時効は、時効の期間が満了した日の翌日にその効力が生ずる。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。賃借人として占有を開始した者の占有は他主占有であり、20年等の期間が経過しただけで所有権を時効取得するわけではありません。所有の意思をもつ自主占有への転換が必要です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法145条により、時効は当事者が援用しなければ裁判所がこれによって裁判することができません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法146条により、時効の利益はあらかじめ放棄することができません。時効完成後に完成を知った上で放棄することは可能です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法144条により、時効の効力は期間満了日の翌日からではなく、起算日にさかのぼります。","corrected":"","inferredBasis":[]}],"references":["民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。","民法144条（解説中参照・条文要旨） 民法144条により、時効の効力は期間満了日の翌日からではなく、起算日にさかのぼります。"],"oldLawNote":"","referenceItems":[{"statuteRef":101},{"statuteRef":102},{"learningNote":"民法144条により、時効の効力は期間満了日の翌日からではなく、起算日にさかのぼります。","statuteRef":105}]},{"id":50,"year":11,"sourceQuestion":5,"category":"時効・占有","theme":"時効","prompt":"時効に関する次の１から４までの記述のうち，正しいものを一つ選びなさい。","choices":["相続財産管理人が選任された時は，相続財産に関して時効が中断し，管理人が選任された時から６か月を経過した時に新たに進行を始める。","当事者は，時効の完成前であっても，時効の利益を享受しない旨の意思表示をすることができる。","他人の物を賃借して２０年間占有を継続した者は，その物の所有権を時効により取得することができる。","時効が完成しても，当事者が援用しなければ，裁判所は，時効の効力が発生したことを前提として裁判をすることができない。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。相続財産管理人（現行法では相続財産清算人）の選任だけで、相続財産に関する時効が一律に中断し6か月後から新たに進行するという制度ではありません。時効の完成猶予・更新は法定事由ごとに判断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。時効の利益は完成前にあらかじめ放棄できません（民法146条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。賃借人の占有は原則として他主占有です。20年間賃借占有しただけでは所有の意思を欠くため所有権を取得時効できません。自主占有への転換が必要です。","corrected":"","inferredBasis":["民法162条"]},{"mark":"○","explanation":"正しい。民法145条により、時効は当事者の援用がなければ裁判所がこれを前提に裁判することはできません。現行法メモ・2020年改正後の現行民法では、旧法の「時効の中断」は「完成猶予」と「更新」に整理されています。","corrected":"","inferredBasis":[]}],"references":["民法145条時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","民法146条時効の利益は、あらかじめ放棄することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":101},{"statuteRef":102},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98}]},{"id":51,"year":19,"sourceQuestion":7,"category":"物権・登記・共有・相隣","theme":"共有","prompt":"共有に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["共有物の形状又は効用の著しい変更を伴わない変更は、各共有者の持分の価格に従い、その過半数で決することができる。","共有物を使用する共有者は、別段の合意がある場合を除き、他の共有者に対し、自己の持分を超える使用の対価を償還する義務を負う。","共有者は、自己の財産に対するのと同一の注意をもって、共有物の使用をしなければならない。","共有者の中に所在不明の者がいる場合には、裁判所は、所在不明の者以外の共有者の請求により、所在不明の者以外の共有者の持分の価格に従い、その過半
