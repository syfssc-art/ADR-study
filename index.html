 ${years.map(y=>{let qs=QUESTIONS.filter(q=>q.year===y).sort((a,b)=>a.sourceQuestion-b.sourceQuestion);return `<div class="card"><h2>第${y}回</h2>${qs.map(q=>{let a=answered(q);let st=a?(a.correct?"○":"×"):"未回答";return `<button class="category" onclick="startYearQuestion(${q.id})"><span class="name">第${q.sourceQuestion}問　${esc(q.theme||q.category)}</span><span class="badge">${st}</span></button>`}).join("")}</div>`}).join("")}`;
}
function startYearQuestion(id){begin([id],`第${byId[id].year}回 第${byId[id].sourceQuestion}問`)}
function review(){
 const list=state.review.map(id=>byId[id]).filter(Boolean);
 if(!list.length)return `<div class="card"><h1>要復習</h1><p>まだ登録されていません。問題画面の ☆ を押すとここに追加できます。</p></div>`;
 return `<div class="card"><h1>要復習 ${list.length}問</h1><button class="primary" onclick="startSession('review')">要復習だけ解く</button></div>
 <div class="card">${list.map(q=>`<div class="listrow"><b>問${q.id}</b> <span class="pill">${esc(q.category)}</span><div class="small">${esc(q.prompt.slice(0,90))}${q.prompt.length>90?"…":""}</div></div>`).join("")}</div>`;
}
function stats(){
 let rows=cats.map(c=>{let l=QUESTIONS.filter(q=>q.category===c),s=statsFor(l);return `<div class="listrow"><div style="display:flex;justify-content:space-between"><b>${esc(c)}</b><span>${s.rate}%</span></div><div class="progress"><span style="width:${s.rate}%"></span></div><div class="muted">${s.done}/${l.length}問回答・正解${s.correct}問</div></div>`}).join("");
 return `<div class="card"><h1>成績</h1>${rows}</div><div class="card"><h2>設定</h2>
 <label class="toggle"><span>選択肢を毎回シャッフル</span><input type="checkbox" ${state.settings.shuffle?"checked":""} onchange="state.settings.shuffle=this.checked;save()"></label>
 <button class="danger" onclick="resetProgress()">学習履歴をリセット</button></div>`;
}
function startCategory(c){let ids=QUESTIONS.filter(q=>q.category===c).map(q=>q.id);begin(ids,c)}
function startSession(mode){
 let list=QUESTIONS;
 if(mode==="wrong") list=QUESTIONS.filter(q=>answered(q)&&!answered(q).correct);
 if(mode==="review") list=state.review.map(id=>byId[id]).filter(Boolean);
 if(mode==="unanswered"){let u=QUESTIONS.filter(q=>!answered(q));list=u.length?u:QUESTIONS}
 if(!list.length){toast("対象の問題がありません");return}
 begin(list.map(q=>q.id),mode==="all"?"全分野":mode);
}
function startMock(){
 let ids=[];
 for(let slot=1;slot<=15;slot++){
   let pool=QUESTIONS.filter(q=>q.year>=11&&q.year<=20&&q.sourceQuestion===slot);
   let pick=pool[Math.floor(Math.random()*pool.length)];
   ids.push(pick.id);
 }
 begin(ids,"本試験配分模擬（第11〜20回・10回抽出）");
}
function begin(ids,title){
 state.session={ids,index:0,title,selected:null,revealed:false,order:{}};
 save();currentView="question";render()
}
function shuffledIndices(q){
 if(!state.settings.shuffle)return [0,1,2,3];
 let saved=state.session.order[q.id]; if(saved)return saved;
 let a=[0,1,2,3]; for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 state.session.order[q.id]=a;save();return a
}
function selectChoice(displayIndex,origIndex){
 if(state.session.revealed)return;
 state.session.selected={displayIndex,origIndex};save();render()
}
function reveal(){
 if(!state.session.selected){toast("選択肢を選んでください");return}
 let q=byId[state.session.ids[state.session.index]];
 let correct=state.session.selected.origIndex===q.answer-1;
 state.session.revealed=true;
 state.answers[q.id]={correct,chosen:state.session.selected.origIndex+1,time:Date.now()};
 save();render()
}
function toggleReview(id){
 let i=state.review.indexOf(id); if(i>=0)state.review.splice(i,1);else state.review.push(id);
 save();render();toast(i>=0?"要復習から解除":"要復習に追加")
}
function nextQ(){
 if(state.session.index>=state.session.ids.length-1){currentView="sessionEnd";render();return}
 state.session.index++;state.session.selected=null;state.session.revealed=false;save();render()
}
function prevQ(){if(state.session.index>0){state.session.index--;state.session.selected=null;state.session.revealed=false;save();render()}}
function questionView(){
 let ss=state.session;if(!ss)return home();
 let q=byId[ss.ids[ss.index]], order=shuffledIndices(q), sel=ss.selected, rev=ss.revealed;
 let isReview=state.review.includes(q.id);
 document.getElementById("bookmarkTop").textContent=isReview?"★":"☆";
 document.getElementById("bookmarkTop").onclick=()=>toggleReview(q.id);
 let choices=order.map((orig,di)=>{
   let cls="choice";
   if(sel&&sel.displayIndex===di)cls+=" selected";
   if(rev){if(orig===q.answer-1)cls+=" correct";else if(sel&&sel.displayIndex===di)cls+=" wrong"}
   return `<button class="${cls}" onclick="selectChoice(${di},${orig})"><span class="num">${di+1}</span>${esc(q.choices[orig])}</button>`;
 }).join("");
 let answerHtml="";
 if(rev){
   answerHtml=`<div class="answerbox"><h2>${answered(q).correct?"正解":"不正解"}　正解：${order.indexOf(q.answer-1)+1}</h2>
   ${order.map((orig,di)=>{let d=q.details[orig], ok=(orig===q.answer-1);
      return `<div class="detail ${ok?"ok":"ng"}"><div class="mark">${di+1}　${d.mark|| (ok?"○":"×")}</div>
      ${d.explanation?`<div style="margin-top:6px">${esc(d.explanation)}</div>`:""}
      ${d.inferredBasis&&d.inferredBasis.length?`<div class="muted" style="margin-top:6px"><b>推定根拠条文（高確度）：</b>${d.inferredBasis.map(x=>esc(x)).join("、")}<br>※解説内容・論点からの推定。判例のみで結論が決まる場合は条文だけで完結しません。</div>`:""}
      ${d.corrected?`<div class="corrected"><b>正しい文言：</b>${esc(d.corrected)}</div>`:""}</div>`}).join("")}
   ${q.referenceItems&&q.referenceItems.length?`<h3>参考条文</h3><div class="refs">${q.referenceItems.map(x=>{const s=STATUTES[x.statuteRef]||{};return `<div class="ref">
  <div style="font-weight:900">${esc(s.citationLabel||"")}</div>
  ${s.statuteOriginal?`<div style="margin-top:7px;white-space:pre-wrap;line-height:1.75"><b>条文原文</b><br>${esc(s.statuteOriginal)}</div>`:""}
  ${(s.targetParagraph||s.targetItem)?`<div class="muted" style="margin-top:5px">参照箇所：${s.targetParagraph?`第${esc(s.targetParagraph)}項`:""}${s.targetItem?`第${esc(s.targetItem)}号`:""}（原文は条全体を掲載）</div>`:""}
  ${x.learningNote?`<div class="corrected" style="margin-top:8px"><b>解釈・論点：</b>${esc(x.learningNote)}</div>`:""}
  ${s.lawTopUrl?`<div style="margin-top:8px"><a href="${s.lawTopUrl}" target="_blank" rel="noopener">${esc(s.lawTitle)}の見出し（e-Gov）</a></div>`:""}
</div>`}).join("")}</div>`:""}
   ${q.oldLawNote?`<div class="ref"><b>旧法注意：</b>${esc(q.oldLawNote)}</div>`:""}
   <div class="actions"><button class="secondary" onclick="toggleReview(${q.id})">${isReview?"★ 要復習済み":"☆ 要復習"}</button><button class="primary" onclick="nextQ()">次の問題</button></div></div>`;
 }
 return `<div class="card">
   <div class="qmeta"><span class="pill">${esc(ss.title)}</span><span class="pill">${ss.index+1}/${ss.ids.length}</span><span class="pill">第${q.year}回 第${q.sourceQuestion}問</span><span class="pill">${esc(q.category)}</span></div>
   <div class="progress"><span style="width:${Math.round((ss.index+1)/ss.ids.length*100)}%"></span></div>
   <div class="prompt">${esc(q.prompt)}</div>${choices}
   ${!rev?`<button class="primary" onclick="reveal()">回答する</button>`:""}${answerHtml}
   <div class="actions"><button class="secondary" onclick="prevQ()" ${ss.index===0?"disabled":""}>前へ</button><button class="secondary" onclick="toggleReview(${q.id})">${isReview?"★ 要復習":"☆ 要復習"}</button></div>
 </div>`;
}

function mockReward(rate){
 let pts=0, label="", reward="", badge="";
 if(rate>=100){pts=50;label="満点ボーナス";reward="今日は好きなご褒美を1つ解禁";badge="満点"}
 else if(rate>=87){pts=30;label="かなり仕上がっています";reward="好きなおやつ＋20分自由時間";badge="87%以上"}
 else if(rate>=74){pts=20;label="合格圏をしっかり突破";reward="コーヒー・お茶＋15分自由時間";badge="74%以上"}
 else if(rate>=60){pts=10;label="合格ライン突破";reward="小さなおやつ＋10分休憩";badge="60%以上"}
 else return null;
 state.rewards.points=(state.rewards.points||0)+pts;
 state.rewards.mockPasses=(state.rewards.mockPasses||0)+1;
 if(!state.rewards.badges.includes(badge))state.rewards.badges.push(badge);
 let today=new Date().toISOString().slice(0,10);
 if(state.rewards.lastPassDate!==today){
   state.rewards.streak=(state.rewards.streak||0)+1;
   state.rewards.lastPassDate=today;
 }
 save();
 return {pts,label,reward,badge};
}

function sessionEnd(){
 let ids=state.session?.ids||[], list=ids.map(id=>byId[id]), s=statsFor(list);
 let mock=(state.session?.title||"").includes("模擬");
 let rewardHtml="";
 if(mock&&s.done===ids.length){
   if(!state.session.rewardGranted){
     let r=mockReward(s.rate);
     state.session.rewardGranted=true;
     state.session.rewardResult=r;
     save();
   }
   let r=state.session.rewardResult;
   if(r){
     rewardHtml=`<div class="rewardbox"><div class="confetti">🎉 ⭐ 🎉</div>
       <div class="rewardtitle">${r.label}</div>
       <div class="rewardbig">+${r.pts} pt</div>
       <div><b>今回のご褒美：</b>${r.reward}</div>
       <div class="muted">獲得バッジ：${r.badge} ／ 合格ライン突破 ${state.rewards.mockPasses}回</div></div>`;
   }else{
     rewardHtml=`<div class="card"><b>今回は60％未満</b><div class="muted">ご褒美獲得まであと${Math.max(0,60-s.rate)}ポイント。誤答復習からもう一度狙えます。</div></div>`;
   }
 }
 return `<div class="card"><h1>お疲れさまでした</h1><div class="grid"><div class="stat"><span class="muted">回答</span><b>${s.done}</b></div><div class="stat"><span class="muted">正答率</span><b>${s.rate}%</b></div></div>
 ${rewardHtml}
 <button class="primary" onclick="nav('home')">ホームへ</button><button class="secondary" onclick="startSession('wrong')">誤答を復習</button></div>`;
}
function resetProgress(){if(confirm("正答履歴・要復習をすべて削除しますか？")){state.answers={};state.review=[];state.session=null;save();toast("リセットしました");render()}}
function render(){
 document.getElementById("bookmarkTop").style.visibility=currentView==="question"?"visible":"hidden";
 let out=currentView==="home"?home():currentView==="study"?study():currentView==="years"?yearsView():currentView==="review"?review():currentView==="stats"?stats():currentView==="question"?questionView():sessionEnd();
 document.getElementById("app").innerHTML=out;
 window.scrollTo({top:0,behavior:"instant"})
}

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const b=document.getElementById("installBtn");
  if(b)b.style.display="inline-block";
});
document.addEventListener("click",async(e)=>{
  if(e.target && e.target.id==="installBtn" && deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice;}catch(_){}
    deferredInstallPrompt=null;
    e.target.style.display="none";
  }
});
window.addEventListener("appinstalled",()=>{
  const b=document.getElementById("installBtn");
  if(b)b.style.display="none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}

render();
</script>
</body></html>
