数で共有物の管理に関する事項を決することができる旨の裁判をすることができる。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。2023年施行の共有制度改正後、共有物の形状・効用の著しい変更を伴わない変更は、持分価格の過半数で決することができます（民法251条1項ただし書）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共有物を使用する共有者は、別段の合意がなければ、自己の持分を超える使用について他の共有者へ対価を償還する義務を負います。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共有物を使用する共有者に求められる注意義務は『自己の財産に対するのと同一の注意』ではありません。共有関係では他の共有者の利益にも配慮した使用が求められ、現行民法249条3項は善良な管理者の注意義務を定めています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。所在等不明共有者がいる場合、裁判所の関与により、その者を除外して共有物の管理事項を決定できる制度が設けられています（民法252条2項等）。","corrected":"","inferredBasis":[]}],"references":["民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","民法252条1項共有物の管理に関する事項は、前条の場合を除き、各共有者の持分の価格に従い、その過半数で決する。","民法249条第3項（解説中参照・条文要旨） 共有関係では他の共有者の利益にも配慮した使用が求められ、現行民法249条3項は善良な管理者の注意義務を定めています。"],"oldLawNote":"","referenceItems":[{"statuteRef":112},{"statuteRef":113},{"learningNote":"共有関係では他の共有者の利益にも配慮した使用が求められ、現行民法249条3項は善良な管理者の注意義務を定めています。","statuteRef":114},{"learningNote":"所在等不明共有者がいる場合、裁判所の関与により、その者を除外して共有物の管理事項を決定できる制度が設けられています（民法252条2項等）。","statuteRef":115},{"learningNote":"民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","statuteRef":116}]},{"id":52,"year":17,"sourceQuestion":7,"category":"物権・登記・共有・相隣","theme":"共有","prompt":"Ａ、Ｂ及びＣは甲土地を持分各３分の１の割合で共有している。この場合に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["Ａは、甲土地を不法に占有するＤに対して、単独で甲土地の明渡しを請求することができる。","Ａが死亡して相続人も特別縁故者もいないときは、甲土地のＡの共有持分は国庫に帰属する。","Ａが、Ｂ及びＣに無断で甲土地の全部を単独で占有している場合、Ｂ及びＣは、両者の持分の価格の合計が過半数を超えていることを理由として、Ａに対して、甲土地の全部の明渡しを請求することができる。","Ａ、Ｂ及びＣが共同して甲土地をＤに賃貸している場合、Ｄの賃料不払を理由に賃貸借契約を解除するには、Ａ、Ｂ及びＣの全員で解除権を行使しなければならない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。不法占有者Dに対する明渡請求は共有物の保存行為として、各共有者が単独で行うことができます。Aは持分3分の1でも甲土地全部の明渡しを求め得ます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共有者の一人が死亡し相続人がなくても、その持分が直ちに国庫に帰属するわけではありません。特別縁故者への財産分与の可能性を経たうえで、なお残る共有持分は他の共有者に帰属します（民法255条と相続財産清算の関係）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共有者Aも持分に基づく使用権を有するため、B・Cが持分過半数を有するというだけで、Aに土地全部の明渡しを当然に求めることはできません。共有者間の使用関係は単なる多数決だけでは決まりません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共有物の賃貸借解除は管理行為に当たり得るため、常に共有者全員の一致を必要とするわけではありません。持分価格の過半数で決することができる場合があります。","corrected":"","inferredBasis":["民法252条"]}],"references":["民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","民法252条1項共有物の管理に関する事項は、前条の場合を除き、各共有者の持分の価格に従い、その過半数で決する。","民法255条（解説中参照・条文要旨） 特別縁故者への財産分与の可能性を経たうえで、なお残る共有持分は他の共有者に帰属します（民法255条と相続財産清算の関係）。"],"oldLawNote":"","referenceItems":[{"statuteRef":112},{"statuteRef":113},{"learningNote":"特別縁故者への財産分与の可能性を経たうえで、なお残る共有持分は他の共有者に帰属します（民法255条と相続財産清算の関係）。","statuteRef":117},{"learningNote":"民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","statuteRef":116}]},{"id":53,"year":14,"sourceQuestion":5,"category":"物権・登記・共有・相隣","theme":"共有","prompt":"共有に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["各共有者には，法律上，共有物分割請求権が認められているが，５年を超えない期間内は分割をしない旨の契約をすることができる。","共有者の一人が死亡し，その者に相続人がないときは，その共有持分については，他の共有者への帰属よりも特別縁故者への財産分与が優先する。","土地の共有者の一人は，当該土地の不法占拠者に対し，単独で妨害排除請求をすることができる。","共有建物を目的とする賃貸借契約を解除するには，当該建物の共有者全員でこれをしなければならない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。各共有者はいつでも共有物分割を請求できますが、5年を超えない期間について分割禁止の契約をすることができます。更新も可能ですが各更新期間も5年以内です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共有者に相続人がいない場合、まず特別縁故者への財産分与制度が優先し、その対象とならなかった共有持分が民法255条により他の共有者へ帰属します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。不法占拠者への妨害排除・明渡請求は共有物の保存行為として、共有者一人でも単独で行えます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共有物の賃貸借解除は常に全員一致を要するわけではありません。賃貸借の性質・期間等に応じ管理行為として持分価格の過半数で決することができる場合があります。","corrected":"","inferredBasis":["民法252条"]}],"references":["民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","民法252条1項共有物の管理に関する事項は、前条の場合を除き、各共有者の持分の価格に従い、その過半数で決する。","民法255条（解説中参照・条文要旨） 共有者に相続人がいない場合、まず特別縁故者への財産分与制度が優先し、その対象とならなかった共有持分が民法255条により他の共有者へ帰属します。"],"oldLawNote":"","referenceItems":[{"statuteRef":112},{"statuteRef":113},{"learningNote":"共有者に相続人がいない場合、まず特別縁故者への財産分与制度が優先し、その対象とならなかった共有持分が民法255条により他の共有者へ帰属します。","statuteRef":117},{"learningNote":"民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","statuteRef":116}]},{"id":54,"year":11,"sourceQuestion":7,"category":"物権・登記・共有・相隣","theme":"共有","prompt":"共有に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["Ｄ及びＥは，乙不動産を共有していたところ，Ｄが死亡し，相続人も特別縁故者もいないことが確定した。この場合，Ｄの持分は，国庫に帰属する。","Ａ，Ｂ及びＣは，甲不動産をそれぞれ等しい持分で共有している。この場合，Ａは，甲不動産を権限なく占有している者に対し，単独で，その明渡しを請求することができる。","共有物の分割について共有者間で協議が調わないときは，その分割を裁判所に請求することができる。","共有物が分割されたとき，各共有者は，他の共有者が分割によって取得した物について，その持分に応じて担保責任を負う。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。共有者Dが死亡し相続人がいない場合、その共有持分が直ちに国庫へ帰属するわけではありません。特別縁故者への財産分与の可能性を経て、残余の共有持分は原則として他の共有者に帰属します。","corrected":"","inferredBasis":["民法255条","民法882条"]},{"mark":"○","explanation":"正しい。不法占有者に対する共有物の明渡請求は保存行為として各共有者が単独で行うことができます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共有物分割の協議が調わないときは、各共有者は裁判所に分割を請求できます（民法258条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共有物分割では、各共有者は他の共有者が分割によって取得した物について、売主と同様にその持分に応じた担保責任を負います。","corrected":"","inferredBasis":[]}],"references":["民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","民法252条1項共有物の管理に関する事項は、前条の場合を除き、各共有者の持分の価格に従い、その過半数で決する。","民法258条（解説中参照・条文要旨） 共有物分割の協議が調わないときは、各共有者は裁判所に分割を請求できます（民法258条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":112},{"statuteRef":113},{"learningNote":"共有物分割の協議が調わないときは、各共有者は裁判所に分割を請求できます（民法258条）。","statuteRef":118},{"learningNote":"民法251条1項各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。","statuteRef":116},{"learningNote":"民法255条（解説中参照・学習用要点） 特別縁故者への財産分与の可能性を経たうえで、なお残る共有持分は他の共有者に帰属します（民法255条と相続財産清算の関係）。","statuteRef":117},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":55,"year":15,"sourceQuestion":7,"category":"物権・登記・共有・相隣","theme":"抵当権","prompt":"抵当権に関する次の１から４までの記述のうち，判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["抵当権の目的である建物が第三者の行為により滅失し，抵当権設定者がその第三者に対し不法行為に基づく損害賠償請求権を取得した場合，抵当権者は，当該損害賠償金から優先弁済を受けることができる。","抵当権の目的である建物が天災のため崩壊して動産となった場合，抵当権の効力はその動産に及ぶ。","抵当権設定者が抵当権の目的である土地を第三者に賃貸していた場合，その担保する債権について不履行がなくても，抵当権の効力はその賃料に及ぶ。","債務者が所有する不動産に抵当権が設定された場合，その設定の登記が存続している間は，当該抵当権の被担保債権の消滅時効は完成しない。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。抵当目的物が滅失し、設定者が第三者に対する損害賠償請求権を取得した場合、抵当権の物上代位により、差押え等の要件を満たせば抵当権者はその損害賠償金から優先弁済を受けられます。","corrected":"","inferredBasis":["民法709条"]},{"mark":"×","explanation":"誤り。建物が天災で崩壊し単なる動産となった残骸に、建物抵当権がそのまま追及して及ぶわけではありません。抵当権は不動産としての建物を目的とする権利です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。抵当権の効力が賃料債権へ物上代位するには、被担保債権の弁済期到来や差押え等の要件が問題となります。債務不履行もない段階で当然に賃料へ及ぶわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。抵当権設定登記が存続しているだけで被担保債権の消滅時効が停止するわけではありません。被担保債権は一般の時効規定に従って消滅し得ます。","corrected":"","inferredBasis":[]}],"references":["民法369条1項抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":119},{"learningNote":"民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","statuteRef":111}]},{"id":56,"year":11,"sourceQuestion":8,"category":"物権・登記・共有・相隣","theme":"抵当権","prompt":"根抵当権に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["根抵当権者は，確定した元本の額が極度額の範囲内であれば，元本に対する利息や損害金については，極度額を超えていても優先弁済を受けることができる。","根抵当権を設定するには，被担保債権の範囲，債務者及び極度額を必ず定めなければならないが，元本確定期日を定める必要はない。","根抵当権は，元本確定前に被担保債権が全て消滅しても，消滅しない。","根抵当権の被担保債権となる個々の債権を元本確定前に譲り受けた者は，譲受債権について根抵当権を行使することができない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。根抵当権者が優先弁済を受けられるのは、元本・利息・損害金等を合わせて極度額の範囲内に限られます。通常抵当権の最後2年分利息の扱いとは異なり、極度額を超えて優先弁済を受けることはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。根抵当権設定には被担保債権の範囲、債務者、極度額を定める必要がありますが、元本確定期日は任意的事項であり必ず定める必要はありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。根抵当権は一定範囲の不特定債権を担保するため、元本確定前に一時的に被担保債権がゼロになっても根抵当権自体は消滅しません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。元本確定前に個々の被担保債権を譲り受けても、その債権に根抵当権は随伴せず、譲受人は根抵当権を行使できません。","corrected":"","inferredBasis":[]}],"references":["民法369条1項抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":119}]},{"id":57,"year":11,"sourceQuestion":10,"category":"物権・登記・共有・相隣","theme":"抵当権","prompt":"Ａは，Ｂに対し，Ａ所有の甲土地を売却する契約を締結した。甲土地には，ＡがＣ銀行から融資を受けた際に自ら設定した抵当権が付されていた。この場合に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["Ｂは，甲土地の抵当権の実行としての競売による差押えの効力発生後においては，抵当権消滅請求をすることができない。","ＡＢ間の甲土地の売買契約において，Ａは一切の担保責任を負わない旨の特約が付されていた場合には，Ｃ銀行の抵当権実行によってＢが甲土地の所有権を失い，損害が生じたとしても，Ａは，Ｂに生じた損害を賠償する責めを負わない。","甲土地について抵当権が実行され，競売がされた結果，Ｂが甲土地の所有権を失った場合，Ｂは，Ａとの売買契約を解除し，Ｂに発生した損害の賠償請求をすることができる。","Ｂは，甲土地の所有権移転登記も引渡しも受けたが，抵当権の登記があるときは，抵当権消滅請求の手続が終わるまで売買代金の支払を拒むことができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。抵当不動産の第三取得者による抵当権消滅請求は、抵当権実行としての競売による差押えの効力が生じた後は行えません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。売主の担保責任を免除する特約があっても、売主が権利の負担等について知りながら買主に告げなかった事実についてまで免責されるわけではありません。また強行的・信義則上特約の効力が制限される場合があります。『一切責任を負わない』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"甲土地について抵当権が実行され，競売がされた結果，Ｂが甲土地の所有権を失った場合，Ｂは，Ａとの売買契約を解除し，Ｂに発生した損害の賠償請求をすることができる。正しい（出題当時の担保責任規律）。売買目的不動産が抵当権実行により買主から失われた場合、買主は契約解除や損害賠償を求め得ます。現行法では契約不適合責任等の一般体系で整理します。","corrected":"","inferredBasis":["民法562条","民法563条"]},{"mark":"○","explanation":"Ｂは，甲土地の所有権移転登記も引渡しも受けたが，抵当権の登記があるときは，抵当権消滅請求の手続が終わるまで売買代金の支払を拒むことができる。正しい（出題当時の規律）。抵当権の存在により買主が所有権を失うおそれがある場合、買主には代金支払拒絶の制度が認められます。現行民法の条文位置・要件も併せて確認してください。","corrected":"","inferredBasis":[]}],"references":["民法369条1項抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"],"oldLawNote":"","referenceItems":[{"statuteRef":119},{"learningNote":"民法562条（解説で参照する該当箇所・学習用要点） 現行法では数量に関する契約不適合として民法562条以下で整理します。","statuteRef":120},{"learningNote":"民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。","statuteRef":121}]},{"id":58,"year":19,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"物権変動","prompt":"不動産の物権変動に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["ＡがＢ所有の不動産を占有し、取得時効が完成した場合において、その取得時効完成前にＣがＢから当該不動産を購入し、その所有権移転登記を備えたときは、Ａは、Ｃに対し、当該不動産の所有権を時効取得したことを対抗することができない。","Ａ所有の不動産がＡからＢ、ＢからＣに順次売買されたものの、その所有権の登記名義人がＡのままである場合には、Ｃは、Ａに対し、当該不動産の所有権の取得を対抗することができない。","所有者Ａから不動産を購入したＢは、その後にＡから当該不動産を購入したＣに対し、所有権移転登記を備えなくても、当該不動産の所有権の取得を対抗することができる。","売主Ａがその所有する不動産について買主Ｂとの間で締結した売買契約をＢの詐欺により取り消した場合には、Ａは、当該売買を原因とするＡからＢへの所有権移転登記を抹消しなければ、その取消し後にＢから当該不動産を購入したＣに対し、当該不動産の所有権の取得を対抗することができない。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。取得時効完成前に第三者Cが所有者Bから譲り受け登記した場合、Cは時効完成時の権利関係における第三者ではなく、時効取得者Aは登記なくCに時効取得を対抗できます。","corrected":"","inferredBasis":["民法162条","民法177条"]},{"mark":"×","explanation":"誤り。A→B→Cと順次売買された場合、AはCにとって前主の前主であり、民法177条の『第三者』ではありません。Cは登記がなくてもAに所有権取得を主張できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。Aが同一不動産をB、Cに二重譲渡した場合、BとCは対抗関係に立ち、原則として先に登記を備えた者が優先します。Bは登記なしにCへ対抗できません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。取消し後にBからCへ譲渡された場合、AとCは復帰的物権変動について対抗関係に立ち、Aは取消しによる所有権復帰の登記を備えなければCに対抗できないとするのが判例です。","corrected":"","inferredBasis":["民法96条"]}],"references":["民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":122},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98},{"learningNote":"","statuteRef":66}]},{"id":59,"year":18,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"物権変動","prompt":"不動産の物権変動に関する次の１から４までの記述のうち、判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["Ａ所有の土地をＡから買い受けたＢは、Ａが死亡後、Ａの相続人であるＣに対して、登記なくして所有権の取得を対抗することができる。","Ａ所有の土地をＡから買い受けたＢは、当該土地について不法に占有を開始したＣに対して、登記をしなければ当該土地の所有権の取得を対抗することができない。","Ａ所有の土地をＡから買い受けたＢは、それ以前に当該土地について時効により所有権を取得したＣに対して、登記なくして時効取得を対抗することができる。","Ａ所有の土地をＡから買い受けたＢは、当該土地についてその後Ａから二重に譲渡を受けたＣに対して、登記なくして当該土地の所有権の取得を対抗することができる。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。売主Aの相続人CはAの包括承継人であり、買主Bに対して民法177条の第三者として登記欠缺を主張する立場ではありません。Bは登記なくCに所有権取得を主張できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不法占拠者Cは正当な権原を持たず、民法177条の登記欠缺を主張する正当な利益を有する第三者ではありません。Bは登記がなくても所有権に基づきCへ対抗できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。CがBの購入以前にすでに取得時効を完成させていた場合、BとCの関係は時効完成後の第三者関係として登記の先後が問題となります。Bが登記なく当然にCへ対抗できるわけではありません。","corrected":"","inferredBasis":["民法162条"]},{"mark":"×","explanation":"誤り。AからB・Cへの二重譲渡ではBとCは対抗関係に立つため、Bは登記を備えなければCに所有権取得を対抗できません。","corrected":"","inferredBasis":[]}],"references":["民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":122},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98}]},{"id":60,"year":15,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"物権変動","prompt":"不動産物権変動に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["ＡはＢが所有する甲土地の所有権を時効取得したが，その後，ＢがＣに甲土地を売却し，ＢからＣへの所有権の移転の登記がされた。この場合，Ａは，Ｃに対し，甲土地の所有権の時効取得を対抗することができる。","Ａが自己所有の甲建物をＢに売却し，さらにＢがＣにこれを売却した場合，Ｃは，Ａに対し，所有権の移転の登記がなくても売買による甲建物の所有権の取得を対抗することができる。","Ａが自己所有の甲土地をＢに売却し，その後，ＡがＣに甲土地について竹木所有目的の地上権を設定して引き渡した場合において，Ｂへの所有権の移転の登記もＣへの地上権の設定の登記もないときは，Ｂは，Ｃに対し，所有権に基づいて甲土地の引渡しを請求することができない。","Ａは，自己所有の甲土地をＢに売却し，Ｂへの所有権の移転の登記がされた後，Ｂの詐欺を理由に売買契約を取り消した。その後，ＢがＣに甲土地を売却し，ＢからＣへの所有権の移転の登記がされたときは，ＡはＣに対し，取消しの効果を対抗することができない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。時効完成『後』に原所有者BからCへの譲渡・登記がされた場合、AとCは時効取得による所有権変動について対抗関係に立ち、Aは登記を備えなければCに対抗できないのが判例です。本肢は登記不要としている点が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。A→B→Cと順次譲渡された場合、AはCにとって前主の前主であり、民法177条の第三者ではありません。Cは登記がなくてもAに所有権取得を主張できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。Bの所有権とCの地上権は、同一のAから両立しない権利を取得した対抗関係にあり、双方未登記ならBはCに登記なく所有権を対抗して引渡しを求めることはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。詐欺取消しによるAへの所有権復帰後にBからCへ譲渡され登記された場合、AとCは復帰的物権変動について対抗関係に立ちます。Aは取消しによる復帰登記を備えなければCに対抗できません。","corrected":"","inferredBasis":["民法96条"]}],"references":["民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":122},{"learningNote":"","statuteRef":66}]},{"id":61,"year":15,"sourceQuestion":5,"category":"物権・登記・共有・相隣","theme":"登記","prompt":"登記請求権及び物権的請求権に関する次の１から４までの記述のうち，判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["建物の賃貸借契約が終了した場合，建物の所有者である賃貸人Ａは，賃借人Ｂに対し，賃貸借契約の終了に基づいて建物の返還を請求することはできるが，建物の所有権に基づいてその返還を請求することはできない。","ＡがＢ所有の甲土地をＢから買い受け，ＢからＡへの所有権の移転の登記がされた後に，ＡＢ間の売買契約が解除された。この場合，Ｂは，Ａに対し，甲土地の所有権に基づき，ＢからＡへの所有権の移転の登記の抹消登記手続を請求することができる。","Ａが新築して所有する未登記の甲建物をＢが不法に占有している場合，Ａは，所有権の保存の登記をしなければ，Ｂに対し，甲建物の明渡しを請求することができない。","ＡがＢとの間の売買契約に基づき買い受けた甲土地がＢの所有でなかった場合，Ａは，Ｂに対し，甲土地の所有権の移転の登記手続を請求することができない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。賃貸借終了後、所有者である賃貸人Aは契約終了に基づく返還請求だけでなく、所有権に基づく物権的返還請求も行い得ます。請求原因が併存し得るため『所有権に基づいては請求できない』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。売買解除により所有権がBへ復帰した場合、Bは所有権に基づく妨害排除請求として、A名義の所有権移転登記の抹消登記手続を請求できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。未登記建物でも所有権は成立します。所有者Aは保存登記を備えていなくても、不法占有者Bに対し所有権に基づいて明渡しを請求できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。他人物売買も有効であり、売主Bは目的物の所有権を取得して買主Aへ移転する義務を負います。直ちに『移転登記手続を請求できない』とはいえず、契約上の履行請求・債務不履行責任が問題となります。","corrected":"","inferredBasis":[]}],"references":["民法176条物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる。","民法177条不動産に関する物権の得喪及び変更は、その登記をしなければ、第三者に対抗することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":123},{"statuteRef":124}]},{"id":62,"year":14,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"登記","prompt":"不動産の登記に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["表題登記のない建物の所有者の債権者は，強制競売のために，その所有者に代位して当該建物の表題登記及び所有権の保存の登記を申請することができる。","建物は，所有権の保存の登記をしなくても，独立の所有権の対象となり得る。","不動産について，所有権の移転の登記手続をすべきことを命ずる判決が確定したときは，登記権利者は，単独で所有権の移転の登記を申請することができる。","建物の所有を目的とする土地の賃借権は，賃借権の設定の登記によらなければ，第三者に対抗することができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。強制競売のため必要な場合、債権者は債務者に代位して未登記建物の表題登記や所有権保存登記を申請することができます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。建物の所有権は登記によって初めて発生するのではありません。新築等により独立した不動産として所有権の客体となり、保存登記は主として公示・対抗のための制度です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。登記手続を命ずる確定判決がある場合、登記権利者は不動産登記法上、登記義務者の共同申請を要せず単独で登記申請できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。建物所有目的の土地賃借権は、土地賃借権自体の登記がなくても、土地上の自己名義の登記建物を所有すれば借地借家法10条により第三者に対抗できます。『賃借権設定登記によらなければ対抗できない』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","借地借家法10条（解説中参照・条文要旨） 建物所有目的の土地賃借権は、土地賃借権自体の登記がなくても、土地上の自己名義の登記建物を所有すれば借地借家法10条により第三者に対抗できます。"],"oldLawNote":"","referenceItems":[{"statuteRef":122},{"learningNote":"建物所有目的の土地賃借権は、土地賃借権自体の登記がなくても、土地上の自己名義の登記建物を所有すれば借地借家法10条により第三者に対抗できます。","statuteRef":125}]},{"id":63,"year":12,"sourceQuestion":7,"category":"物権・登記・共有・相隣","theme":"登記","prompt":"不動産の登記に関する次の１から４までの記述のうち，判例の趣旨に照らして誤っているものを１つ選びなさい。","choices":["賃貸中の建物の買主は，たとえ代金全額を支払ったときでも，当該売買の目的である建物の所有権の移転の登記を行わなければ，賃借人に対して賃料の支払を請求することができない。","時効取得者は，取得時効完成前に所有者から不動産を譲り受けて所有権の移転の登記を受けた者に対し，登記なくして時効完成による所有権の取得を対抗することができる。","ＡがＢに対して甲建物を売却し，Ｂが所有権の移転の登記を受けた後に，ＡがＡＢ間の売買契約を解除した場合において，Ａによる解除の前にＢがＣに対して甲建物を売却し，Ｃが所有権の移転の登記を受けていたときは，ＡはＣに対して解除の効果を主張できない。","ＡがＢに対して甲土地を売却した後，甲土地のＢに対する所有権の移転の登記の前に，ＣがＡから甲土地を購入した場合において，ＣがＢを強迫して登記の申請を妨げたときであっても，Ｃは，所有権の移転の登記を先に備えれば，甲土地の所有権の取得をＢに対抗することができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。賃貸建物の買主が賃貸人たる地位を賃借人に主張し賃料請求するためには、原則として所有権移転登記を備える必要があります。登記は賃貸人たる地位の対抗要件として機能します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。取得時効完成前に原所有者から譲り受け登記した第三者は、時効完成時には時効取得者と対抗関係に立たず、時効取得者は登記なくその者に時効取得を主張できます。","corrected":"","inferredBasis":["民法162条","民法177条"]},{"mark":"○","explanation":"正しい。解除前に買主Bから第三者Cへ譲渡されCが登記を備えた場合、民法545条1項ただし書により解除は第三者Cの権利を害することができません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。CがBを強迫して登記申請を妨げたような背信的悪意者に当たる場合、Cは民法177条の『第三者』として保護されず、たとえ先に登記を得てもBに対抗できない場合があります。『強迫しても登記さえ先なら対抗できる』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法177条不動産に関する物権の得喪及び変更は、不動産登記法その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。","民法545条第1項（解説中参照・条文要旨） 解除前に買主Bから第三者Cへ譲渡されCが登記を備えた場合、民法545条1項ただし書により解除は第三者Cの権利を害することができません。"],"oldLawNote":"","referenceItems":[{"statuteRef":122},{"learningNote":"解除前に買主Bから第三者Cへ譲渡されCが登記を備えた場合、民法545条1項ただし書により解除は第三者Cの権利を害することができません。","statuteRef":126},{"learningNote":"民法162条二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その占有の開始の時に、善意であり、かつ、過失がなかったときは、その所有権を取得する。","statuteRef":98}]},{"id":64,"year":18,"sourceQuestion":8,"category":"物権・登記・共有・相隣","theme":"相隣","prompt":"相隣関係に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["隣地の竹木の根が境界線を越えて伸びてきたときは、土地の所有者はその根を切り取ることができる。","土地の所有者は、隣地の所有者と共同の費用で、境界標を設けることができる。","境界線上に設けた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定される。","境界標の設置のための測量の費用は、相隣者が等しい割合で負担する。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。隣地の竹木の根が境界線を越えるときは、土地所有者は原則として自らその根を切り取ることができます（民法233条4項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。境界標は、隣地所有者と共同の費用で設置することができます（民法223条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。境界線上に設けられた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定されます（民法229条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。境界標設置のための『測量費用』は、土地の広狭に応じて負担します。境界標の設置・保存費用は等分ですが、測量費用まで常に等分ではありません（民法224条）。","corrected":"","inferredBasis":[]}],"references":["民法233条1項土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。","民法223条（解説中参照・条文要旨） 境界標は、隣地所有者と共同の費用で設置することができます（民法223条）。","民法229条（解説中参照・条文要旨） 境界線上に設けられた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定されます（民法229条）。","民法224条（解説中参照・条文要旨） 境界標の設置・保存費用は等分ですが、測量費用まで常に等分ではありません（民法224条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":127},{"learningNote":"境界標は、隣地所有者と共同の費用で設置することができます（民法223条）。","statuteRef":128},{"learningNote":"境界線上に設けられた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定されます（民法229条）。","statuteRef":129},{"learningNote":"境界標の設置・保存費用は等分ですが、測量費用まで常に等分ではありません（民法224条）。","statuteRef":130},{"learningNote":"隣地の竹木の根が境界線を越えるときは、土地所有者は原則として自らその根を切り取ることができます（民法233条4項）。","statuteRef":131}]},{"id":65,"year":16,"sourceQuestion":8,"category":"物権・登記・共有・相隣","theme":"相隣","prompt":"相隣関係に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["土地の所有者は、境界又はその付近において障壁又は建物を築造し又は修繕するため必要な範囲で、隣地の使用を請求することができる。","土地の所有者は、隣地の所有者と共同の費用で、境界標を設けることができる。","境界線上に設けた境界標、囲障、障壁、溝及び堀は、相隣者の共有に属するものと推定する。","境界標の設置及び保存の費用並びに測量の費用は、相隣者が等しい割合で負担する。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。土地所有者は、境界又はその付近で障壁・建物の築造・修繕等をするため必要な範囲で隣地使用を請求できます。現行法では目的・方法・時期等について隣地所有者への配慮が必要です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。隣地所有者と共同費用で境界標を設置できます。","corrected":"","inferredBasis":["民法223条","民法224条"]},{"mark":"○","explanation":"正しい。境界線上の境界標等は相隣者共有と推定されます。","corrected":"","inferredBasis":["民法223条","民法224条"]},{"mark":"×","explanation":"誤り。境界標の設置・保存費用は等分ですが、測量費用は土地の広狭に応じて負担します。『測量費用も等しい割合』とする部分が誤りです。","corrected":"","inferredBasis":["民法223条","民法224条"]}],"references":["民法233条1項土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":127},{"learningNote":"民法223条（解説中参照・学習用要点） 境界標は、隣地所有者と共同の費用で設置することができます（民法223条）。","statuteRef":128},{"learningNote":"民法224条（解説中参照・学習用要点） 境界標の設置・保存費用は等分ですが、測量費用まで常に等分ではありません（民法224条）。","statuteRef":130}]},{"id":66,"year":13,"sourceQuestion":8,"category":"物権・登記・共有・相隣","theme":"相隣","prompt":"相隣関係に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["土地の分割によって公道に通じない土地が生じた場合，その土地の所有者は，公道に至るため，他の分割者の所有地のみを通行することができ，その通行について償金を支払う必要はない。","二棟の建物がその所有者を異にし，かつ，その間に空地があるときは，各所有者は，他の所有者と共同の費用で，その境界に囲障を設けることができる。","土地の所有者は，隣地との境界付近において建物を修繕するため必要な範囲内で，隣地の使用を請求することができるが，隣地所有者がこれにより損害を受けたときは，その償金を支払わなければならない。","土地の所有者は，隣地の竹木の枝が境界線を越えるときは，自らその枝を切り取ることができ，隣地の竹木の根が境界線を越えるときは，その竹木の所有者に，その根を切除するよう求めることができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。分割によって袋地が生じた場合、その所有者は分割に関係する他方土地のみを通行でき、その通行について償金を支払う必要はありません（民法213条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。建物所有者を異にし、その間に空地がある場合、各所有者は共同費用で境界に囲障を設けることを請求できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。建物修繕等のため必要な範囲で隣地使用を請求できますが、それによって隣地所有者に損害が生じた場合は償金を支払う必要があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"土地の所有者は，隣地の竹木の枝が境界線を越えるときは，自らその枝を切り取ることができ，隣地の竹木の根が境界線を越えるときは，その竹木の所有者に，その根を切除するよう求めることができる。誤り（出題当時の法）。当時の民法233条は、枝については原則として竹木所有者に切除を請求し、根については越境を受けた土地所有者が自ら切り取れるという規律でした。本肢は枝と根を逆にしています。なお2023年改正後は一定の場合に枝も自ら切除できます。","corrected":"","inferredBasis":[]}],"references":["民法233条1項土地の所有者は、隣地の竹木の枝が境界線を越えるときは、その竹木の所有者に、その枝を切除させることができる。","民法213条（解説中参照・条文要旨） 分割によって袋地が生じた場合、その所有者は分割に関係する他方土地のみを通行でき、その通行について償金を支払う必要はありません（民法213条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":127},{"learningNote":"分割によって袋地が生じた場合、その所有者は分割に関係する他方土地のみを通行でき、その通行について償金を支払う必要はありません（民法213条）。","statuteRef":132},{"learningNote":"当時の民法233条は、枝については原則として竹木所有者に切除を請求し、根については越境を受けた土地所有者が自ら切り取れるという規律でした。","statuteRef":133}]},{"id":67,"year":11,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"即時取得に関する次の１か","prompt":"即時取得に関する次の１から４までの記述のうち，正しいものを一つ選びなさい。","choices":["未成年者Ｃから動産を買い受けたＤは，Ｃが成年であると過失なく信じてその占有を取得した。この場合，その動産につき即時取得が成立する。","相続人Ａは，被相続人Ｂの占有していた動産をＢの所有物であると過失なく信じて相続した。この場合，その動産につき即時取得が成立する。","Ｇは，Ｈが占有していた動産を，Ｈの所有物であると過失なく信じてＨから買い受け，占有を始めたが，その動産は，ＨがＪから５年前に盗んだものであった。この場合，その動産につき即時取得は成立しない。","Ｅは，Ｆが占有していた動産を，Ｆの所有物であると過失なく信じてＦから買い受けたが，その後も，その動産をそのままＦに預けていた。この場合，その動産につき即時取得は成立しない。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。即時取得は前主に所有権がない等の『権利の瑕疵』を治癒する制度で、前主が未成年であるという『行為能力の瑕疵』を治癒する制度ではありません。","corrected":"","inferredBasis":["民法192条"]},{"mark":"×","explanation":"誤り。即時取得には取引行為による占有取得が必要です。相続は包括承継であり取引行為ではないため、相続によって即時取得は成立しません。","corrected":"","inferredBasis":["民法192条"]},{"mark":"×","explanation":"誤り。盗品・遺失物でも善意無過失の買主に即時取得自体は成立し得ます。ただし被害者・遺失者は盗難・遺失時から2年間、民法193条により回復請求できます。5年前の盗品ならこの回復請求期間も経過しています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。即時取得には占有の取得が必要であり、売買後も動産を売主Fの手元に置いたままの占有改定では、判例上、即時取得の要件を満たしません。","corrected":"","inferredBasis":["民法192条"]}],"references":["民法192条取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。","民法193条前条の場合において、占有物が盗品又は遺失物であるときは、被害者又は遺失者は、盗難又は遺失の時から二年間、占有者に対してその物の回復を請求することができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":134},{"statuteRef":135}]},{"id":68,"year":20,"sourceQuestion":6,"category":"物権・登記・共有・相隣","theme":"権利の客体に関する次の１","prompt":"権利の客体に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["みかんの樹木が植栽されている土地が売買された場合、収穫前のみかんの果実の所有権を売主にとどめることはできない。","借地上の建物に設定された抵当権に基づく競売により、建物の所有権が買受人に移転したとき、借地権が買受人に移転することはない。","一筆の土地に生育する樹木の集団は、その土地から独立した所有権の客体とはなりえない。","有体物のうち土地及びその定着物以外の物は、民法上すべて動産とされている。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。土地売買時に未分離果実について売主に所有権を留保する特約をすることは可能です。果実を土地所有権と別個に扱うことが一律に禁止されるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。借地上建物に設定された抵当権の効力は、原則として建物所有に必要な借地権にも及ぶと解され、競売で建物を取得した買受人には借地権も随伴して移転するのが通常です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。立木法による登記や明認方法等の要件を満たせば、樹木の集団（立木）は土地から独立した所有権の客体となり得ます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法86条は、土地及びその定着物を不動産とし、それ以外の物を動産とします。","corrected":"","inferredBasis":[]}],"references":["民法85条この法律において「物」とは、有体物をいう。","民法86条土地及びその定着物は、不動産とする。不動産以外の物は、すべて動産とする。"],"oldLawNote":"","referenceItems":[{"statuteRef":136},{"statuteRef":137}]},{"id":69,"year":13,"sourceQuestion":4,"category":"物権・登記・共有・相隣","theme":"物に関する次の１から４ま","prompt":"物に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["ある土地上に石灯籠が設置されているとき，当該石灯籠は土地の従物であるから，土地の所有者は，当該石灯籠を土地と別個独立して処分することはできない。","民法上，不動産以外の有体物は，全て動産である。","未成熟の果実がついた樹木を購入し，自らが所有する土地に移植した買主が，その後に成熟した果実を収穫したときは，買主は，売主及び買主がそれぞれ当該果実を成熟させるために樹木を育成していた期間に応じて，売主との間で，収穫した果実の価値を清算しなければならない。","民法上，不動産とは，土地及び建物をいう。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。従物であっても主物と物理的に一体不可分でなければ、当事者間で別個に処分すること自体が常に不可能なわけではありません。従物は主物の処分に従うのが原則ですが、別段の意思表示も可能です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法86条2項により、不動産以外の物はすべて動産です。民法上の『物』は有体物をいいます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。果実の帰属について、樹木の育成期間に応じて旧所有者と新所有者が当然に価値を按分清算する制度はありません。果実の帰属は所有権・果実収取権の所在や分離時点等で判断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法86条1項の不動産は『土地及びその定着物』です。建物は代表的な定着物ですが、『土地及び建物だけ』と限定する表現は条文より狭すぎます。","corrected":"","inferredBasis":[]}],"references":["民法85条この法律において「物」とは、有体物をいう。","民法86条土地及びその定着物は、不動産とする。不動産以外の物は、すべて動産とする。"],"oldLawNote":"","referenceItems":[{"statuteRef":136},{"statuteRef":137},{"learningNote":"民法86条2項により、不動産以外の物はすべて動産です。","statuteRef":138},{"learningNote":"民法86条1項の不動産は『土地及びその定着物』です。","statuteRef":139}]},{"id":70,"year":19,"sourceQuestion":10,"category":"契約・債権","theme":"賃貸借","prompt":"建物の賃貸借に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["賃借人において賃料不払があった場合には、賃貸人は、敷金を未払賃料に充当した上でなければ、不足額を請求することができない。","賃借物の一部が滅失したことにより使用収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、賃料は、その使用収益をすることができなくなった部分の割合に応じて、減額される。","賃貸人が修繕すべき雨漏りを賃借人が自らの費用で修繕したときは、賃借人は、賃貸人に対して、賃貸借の終了の時でなければ、修繕費用全額の償還を請求することができない。","賃貸借が期間の定めのないものであった場合において、賃貸人が解約の申入れをしたときは、賃貸借は、直ちに終了する。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。敷金を未払賃料へ充当するかは賃貸人側が判断でき、賃借人から『まず敷金を充当せよ』と強制することはできません。賃貸人は敷金を充当せず未払賃料全額を請求できます。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"○","explanation":"正しい。賃借物の一部が賃借人の責めに帰せない事由で使用収益不能となった場合、賃料はその不能部分の割合に応じて当然に減額されます（民法611条1項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。賃借人が賃貸人の負担すべき必要費を支出したときは、直ちに償還請求できます（民法608条1項）。賃貸借終了時まで待つ必要はありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。期間の定めのない賃貸借でも、解約申入れで直ちに終了するわけではありません。民法617条等が定める予告期間を経て終了し、建物賃貸借には借地借家法の正当事由等も問題となります。","corrected":"","inferredBasis":[]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","民法611条第1項（解説中参照・条文要旨） 賃借物の一部が賃借人の責めに帰せない事由で使用収益不能となった場合、賃料はその不能部分の割合に応じて当然に減額されます（民法611条1項）。","民法608条第1項（解説中参照・条文要旨） 賃借人が賃貸人の負担すべき必要費を支出したときは、直ちに償還請求できます（民法608条1項）。","民法617条（解説中参照・条文要旨） 民法617条等が定める予告期間を経て終了し、建物賃貸借には借地借家法の正当事由等も問題となります。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"learningNote":"賃借物の一部が賃借人の責めに帰せない事由で使用収益不能となった場合、賃料はその不能部分の割合に応じて当然に減額されます（民法611条1項）。","statuteRef":141},{"learningNote":"賃借人が賃貸人の負担すべき必要費を支出したときは、直ちに償還請求できます（民法608条1項）。","statuteRef":142},{"learningNote":"民法617条等が定める予告期間を経て終了し、建物賃貸借には借地借家法の正当事由等も問題となります。","statuteRef":143},{"learningNote":"の2（推定根拠条文・高確度） 民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。","statuteRef":144}]},{"id":71,"year":17,"sourceQuestion":11,"category":"契約・債権","theme":"賃貸借","prompt":"不動産の賃貸借に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["賃貸借が終了した場合、賃借人は、通常の使用及び収益によって生じた賃借物の損耗については、原状に復する義務を負わない。","賃貸人は、賃借人の責めに帰すべき事由によって賃貸物の使用及び収益のために修繕が必要となったときであっても、その修繕をする義務を負う。","賃貸物が譲渡され、賃貸人たる地位がその譲受人に移転したときは、譲渡人が負っていた賃借人に対する費用の償還に係る債務は、譲受人が承継する。","賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、その使用及び収益をすることができなくなった部分の割合に応じて、賃料は減額される。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。賃借人の原状回復義務から、通常の使用・収益によって生じた通常損耗や経年変化は除外されます（民法621条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。修繕が必要になった原因が賃借人の責めに帰すべき事由である場合、賃貸人はその修繕義務を負いません（民法606条1項ただし書）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。賃貸人たる地位が不動産譲受人へ移転すると、敷金返還債務や必要費・有益費償還に関する賃貸人の地位も原則として譲受人へ承継されます。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"○","explanation":"正しい。賃借物の一部が賃借人の責めに帰せない事由で使用収益不能となった場合、その割合に応じて賃料は当然に減額されます。","corrected":"","inferredBasis":[]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","民法621条（解説中参照・条文要旨） 賃借人の原状回復義務から、通常の使用・収益によって生じた通常損耗や経年変化は除外されます（民法621条）。","民法606条第1項（解説中参照・条文要旨） 修繕が必要になった原因が賃借人の責めに帰すべき事由である場合、賃貸人はその修繕義務を負いません（民法606条1項ただし書）。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"learningNote":"賃借人の原状回復義務から、通常の使用・収益によって生じた通常損耗や経年変化は除外されます（民法621条）。","statuteRef":145},{"learningNote":"修繕が必要になった原因が賃借人の責めに帰すべき事由である場合、賃貸人はその修繕義務を負いません（民法606条1項ただし書）。","statuteRef":146},{"learningNote":"の2（推定根拠条文・高確度） 民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。","statuteRef":144}]},{"id":72,"year":15,"sourceQuestion":11,"category":"契約・債権","theme":"賃貸借","prompt":"不動産の賃貸借に関する次の１から４までの記述のうち，判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["対抗力のある賃借権が設定された土地を所有者から譲り受けた者は，当該土地について所有権の移転の登記をしなければ，賃貸人たる地位の移転について，土地賃借人に対抗することができない。","対抗力のある賃借権を有する賃借人は，賃貸人の承諾を得ずに賃借権を第三者に譲り渡し，又は賃借物を第三者に転貸することができる。","建物の賃貸借契約が終了し，賃貸人から建物の明渡しを求められた賃借人は，当該賃貸借契約に基づき差し入れた敷金の返還があるまで，当該建物の明渡しを拒むことができる。","Ａの所有する甲土地を建物所有を目的として賃借したＢが，甲土地上に建物を建築した後，Ａの承諾を得ずに当該建物をＣに賃貸した場合，Ａは，Ｂに対し，甲土地の無断転貸を理由として土地の賃貸借契約を解除することができる。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。対抗力ある賃貸借の目的不動産が譲渡されると賃貸人たる地位は譲受人へ移転しますが、譲受人が賃借人に賃貸人たる地位を対抗するには所有権移転登記を備える必要があります。","corrected":"","inferredBasis":["民法612条"]},{"mark":"×","explanation":"誤り。賃借権の譲渡・転貸には原則として賃貸人の承諾が必要です（民法612条）。対抗力のある賃借権だから自由に譲渡・転貸できるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。敷金返還請求権は、賃貸借終了だけでなく目的物の明渡し後に、未払賃料等を控除した残額について具体化します。建物明渡債務と敷金返還債務は同時履行関係にないため、敷金返還まで明渡しを拒めません。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"×","explanation":"誤り。BがAから借りた土地上の自己所有建物をCに賃貸することは、土地そのものの転貸ではありません。土地賃借権をCに譲渡・転貸していないので、Aは土地の無断転貸を理由に解除できません。","corrected":"","inferredBasis":["民法612条","民法613条"]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"learningNote":"賃借権の譲渡・転貸には原則として賃貸人の承諾が必要です（民法612条）。","statuteRef":147},{"learningNote":"の2（推定根拠条文・高確度） 民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。","statuteRef":144},{"learningNote":"民法613条（解説で参照する該当箇所・学習用要点） ただしAに対する責任は、原賃貸借・転貸借双方の賃料額等の範囲で調整されます（民法613条）。","statuteRef":148}]},{"id":73,"year":14,"sourceQuestion":9,"category":"契約・債権","theme":"賃貸借","prompt":"賃貸借契約に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["賃貸借契約に伴って差し入れられた敷金の返還請求権が，当該賃貸借契約の終了前に第三者に譲渡された場合でも，貸主は，正当な原状回復費用を敷金から控除することができる。","賃貸借契約の借主は，特約がなくても賃料を前払しなければならない。","建物の賃借人が賃貸借契約期間中に建物に付加した造作は，賃貸借契約終了に伴って当然に賃貸人の所有物となる。","賃貸借契約が成立したときは，目的物の使用又は収益を開始する前であっても，賃貸借契約が成立したときから賃料の支払義務が生ずる。"],"answer":1,"details":[{"mark":"○","explanation":"正しい。敷金返還請求権を第三者へ譲渡しても、敷金の担保機能は失われません。賃貸人は明渡し時に未払賃料・正当な原状回復費用等を控除し、残額について譲受人へ返還義務を負います。","corrected":"","inferredBasis":["民法622条の2"]},{"mark":"×","explanation":"誤り。賃料の支払時期は民法614条に定めがあり、特約がなければ一律に前払いではありません。原則として動産・建物・宅地は毎月末、その他の土地は毎年末等の後払いです。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。賃借人が付加した造作が賃貸借終了によって当然に賃貸人の所有物になるわけではありません。付合の成否、造作買取請求権、原状回復義務などを個別に判断します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。賃貸借契約が成立しても、賃貸人が目的物を使用収益させることができないのに当然に賃料が発生するわけではありません。賃料は使用収益の対価であり、引渡し・使用可能性との関係で判断されます。","corrected":"","inferredBasis":[]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","民法614条（解説中参照・条文要旨） 賃料の支払時期は民法614条に定めがあり、特約がなければ一律に前払いではありません。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"learningNote":"賃料の支払時期は民法614条に定めがあり、特約がなければ一律に前払いではありません。","statuteRef":149},{"learningNote":"の2（推定根拠条文・高確度） 民法622条の2第1項（敷金・学習用抜粋）賃貸人は、賃貸借が終了し、かつ賃貸物の返還を受けたとき等に、受け取った敷金から賃貸借に基づく金銭債務の額を控除した残額を賃借人に返還しなければならない。","statuteRef":144}]},{"id":74,"year":12,"sourceQuestion":10,"category":"契約・債権","theme":"賃貸借","prompt":"賃貸借契約に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["建物所有を目的とする土地の賃借人が，当該土地の賃貸人の承諾を得ずに建物を第三者に賃貸した場合，当該土地の賃貸人は，土地の無断転貸を理由として賃貸借契約を解除することができる。","賃貸借契約の目的物である建物の全部が，契約成立後に不可抗力によって滅失したときであっても，賃借人がその賃貸借契約を解除するまでは，当該賃貸借契約は終了しない。","建物の賃借人が，賃貸人が修繕すべき屋根からの雨漏りを自ら費用を出して修繕したときは，賃貸人に対して，直ちに修繕費用の全額の償還を請求することができる。","賃貸借契約は諾成契約であるから，目的物の引渡しがなくても，賃貸人は賃借人に対して，賃料の支払を請求することができる。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。土地賃借人Bが自分の所有する建物を第三者へ賃貸することは、土地賃借権そのものの転貸ではありません。土地所有者Aは『土地の無断転貸』を理由に解除できません。","corrected":"","inferredBasis":["民法612条","民法613条"]},{"mark":"×","explanation":"誤り。賃借物の全部が滅失その他により使用収益不能となれば、賃貸借は当然に終了します。賃借人の解除意思を待つ必要はありません（民法616条の2）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。賃貸人が負担すべき修繕を賃借人が行い必要費を支出した場合、賃借人は民法608条1項により直ちにその償還を請求できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。賃貸借は諾成契約でも、賃料は目的物の使用収益の対価です。賃貸人が目的物を引き渡さず使用収益させていない段階で、当然に賃料請求できるわけではありません。","corrected":"","inferredBasis":[]}],"references":["民法612条1項賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。","民法616条（解説中参照・条文要旨） 賃借人の解除意思を待つ必要はありません（民法616条の2）。","民法608条第1項（解説中参照・条文要旨） 賃貸人が負担すべき修繕を賃借人が行い必要費を支出した場合、賃借人は民法608条1項により直ちにその償還を請求できます。"],"oldLawNote":"","referenceItems":[{"statuteRef":140},{"learningNote":"賃借人の解除意思を待つ必要はありません（民法616条の2）。","statuteRef":150},{"learningNote":"賃貸人が負担すべき修繕を賃借人が行い必要費を支出した場合、賃借人は民法608条1項により直ちにその償還を請求できます。","statuteRef":142},{"learningNote":"民法613条（解説で参照する該当箇所・学習用要点） ただしAに対する責任は、原賃貸借・転貸借双方の賃料額等の範囲で調整されます（民法613条）。","statuteRef":148}]},{"id":75,"year":18,"sourceQuestion":10,"category":"契約・債権","theme":"契約","prompt":"委任契約に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["受任者は、委任者の請求があるときは、いつでも委任事務の処理の状況を報告しなければならない。","受任者は、特約がなければ、委任者に対して報酬を請求することができない。","受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","受任者は、委任者に不利な時期に委任契約を解除することができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。民法645条により、受任者は委任者から請求があればいつでも委任事務の処理状況を報告し、委任終了後は遅滞なく経過・結果を報告しなければなりません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。委任は原則無償で、特約がなければ受任者は報酬を請求できません（民法648条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。受任者は委任の本旨に従い、善良な管理者の注意をもって委任事務を処理する義務を負います（民法644条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。委任は各当事者がいつでも解除できます（民法651条）。ただし相手方に不利な時期に解除した場合などには、やむを得ない事由がない限り損害賠償責任を負うことがあります。『解除できない』ではなく『解除はできるが賠償問題が生じる』が正しい整理です。","corrected":"","inferredBasis":[]}],"references":["民法644条受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","民法645条（解説中参照・条文要旨） 民法645条により、受任者は委任者から請求があればいつでも委任事務の処理状況を報告し、委任終了後は遅滞なく経過・結果を報告しなければなりません。","民法648条第1項（解説中参照・条文要旨） 委任は原則無償で、特約がなければ受任者は報酬を請求できません（民法648条1項）。","民法651条（解説中参照・条文要旨） 委任は各当事者がいつでも解除できます（民法651条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":151},{"learningNote":"民法645条により、受任者は委任者から請求があればいつでも委任事務の処理状況を報告し、委任終了後は遅滞なく経過・結果を報告しなければなりません。","statuteRef":152},{"learningNote":"委任は原則無償で、特約がなければ受任者は報酬を請求できません（民法648条1項）。","statuteRef":153},{"learningNote":"委任は各当事者がいつでも解除できます（民法651条）。","statuteRef":154}]},{"id":76,"year":14,"sourceQuestion":4,"category":"契約・債権","theme":"契約","prompt":"契約の効力に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["法律の規定に反する内容の契約は，当該規定がどのような内容のものであっても有効である。","法律に定められた典型契約以外の類型の契約を締結することは妨げられない。","契約は，その内容が公序良俗に反していない限り，無効とはならない。","書面によらない限り，契約は有効とならない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。法律に反する契約でも、その法規が任意規定なら当事者の合意が優先することがありますが、強行規定に反する契約は無効となり得ます。『どのような法律規定に反しても有効』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。契約自由の原則により、民法が名称を付けた典型契約以外の無名契約・混合契約も、強行法規や公序良俗に反しない限り締結できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。公序良俗に反しなくても、強行法規違反、意思能力欠如、通謀虚偽表示など他の無効原因があり得ます。『公序良俗に反しなければ絶対に無効にならない』という断定が誤りです。","corrected":"","inferredBasis":["民法94条"]},{"mark":"×","explanation":"誤り。契約は原則として当事者の意思表示の合致だけで成立する諾成契約です。保証契約など法律が書面を要求する例外はありますが、すべての契約に書面が必要なわけではありません。","corrected":"","inferredBasis":[]}],"references":["民法90条公の秩序又は善良の風俗に反する法律行為は、無効とする。","民法521条（契約自由の原則・学習用抜粋）何人も、法令に特別の定めがある場合を除き、契約をするかどうかを自由に決定することができ、契約の内容を自由に決定することができる。","民法522条2項契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。"],"oldLawNote":"","referenceItems":[{"statuteRef":155},{"statuteRef":156},{"statuteRef":157},{"learningNote":"","statuteRef":158}]},{"id":77,"year":14,"sourceQuestion":8,"category":"契約・債権","theme":"契約","prompt":"民法上の消費貸借契約に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["金銭その他の物を給付する義務を負う者がある場合において，当事者がその物を消費貸借の目的とすることを約したときは，消費貸借が成立したものとみなされる。","金銭消費貸借において，貸主は，利息の定めがない場合であっても返還期日までの利息を請求することができる。","消費貸借において返還期日の定めがないときは，貸主は，いつでも相当の期間を定めて返還の催告をすることができる。","金銭消費貸借の借主は，利息の定めがある場合であっても，貸主から金銭を受け取らない限り，利息を支払うべき義務を負わない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。既存の給付義務の目的物を消費貸借の目的とする合意があれば、実際の物の交付に代えて消費貸借が成立したものとする制度（準消費貸借）が認められます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。消費貸借は当然に有利息ではありません。利息を支払う特約がなければ、貸主は通常、返還期までの利息を請求できません（商事等の特則を除く）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。返還時期を定めなかった消費貸借では、貸主は相当の期間を定めて返還の催告をすることができます（民法591条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。利息は元本を実際に受け取って利用できることを前提に発生するため、借主が貸主から金銭等を受け取っていない段階で利息支払義務は生じません。","corrected":"","inferredBasis":[]}],"references":["民法591条1項当事者が返還の時期を定めなかったときは、貸主は、相当の期間を定めて返還の催告をすることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":159}]},{"id":78,"year":14,"sourceQuestion":10,"category":"契約・債権","theme":"契約","prompt":"委任契約に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["委任の終了事由は，これを相手方に通知したとき，又は相手方がこれを知っていたときでなければ，相手方に対抗することができない。","委任者が，やむを得ない事由がないにもかかわらず受任者に不利な時期に委任の解除をしたときは，委任者は，受任者の損害を賠償する義務を負う。","無報酬の受任者は，委任事務を処理するに当たって，善管注意義務を負わない。","受任者は，委任者の請求があるときは，いつでも委任事務の処理の状況を報告し，委任が終了した後は，遅滞なくその経過及び結果を報告する義務を負う。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。委任の終了事由は、それを相手方に通知したとき、又は相手方が既に知っていたときでなければ相手方に対抗できません（民法655条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。委任はいつでも解除できますが、相手方に不利な時期にやむを得ない事由なく解除したときは、原則として相手方の損害を賠償する義務があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。無報酬であることと注意義務の程度は別問題です。受任者は有償・無償を問わず、委任の本旨に従い善良な管理者の注意をもって事務を処理する義務を負います（民法644条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。受任者には委任者の請求に応じた処理状況報告義務と、委任終了後の経過・結果報告義務があります（民法645条）。","corrected":"","inferredBasis":[]}],"references":["民法644条受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","民法655条（解説中参照・条文要旨） 委任の終了事由は、それを相手方に通知したとき、又は相手方が既に知っていたときでなければ相手方に対抗できません（民法655条）。","民法645条（解説中参照・条文要旨） 受任者には委任者の請求に応じた処理状況報告義務と、委任終了後の経過・結果報告義務があります（民法645条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":151},{"learningNote":"委任の終了事由は、それを相手方に通知したとき、又は相手方が既に知っていたときでなければ相手方に対抗できません（民法655条）。","statuteRef":160},{"learningNote":"受任者には委任者の請求に応じた処理状況報告義務と、委任終了後の経過・結果報告義務があります（民法645条）。","statuteRef":152}]},{"id":79,"year":18,"sourceQuestion":9,"category":"契約・債権","theme":"売買","prompt":"Ａ所有の甲土地の売買に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["Ａは、Ｂと売買契約を締結することにより、Ｂに対し、甲土地の所有権移転についての対抗要件を備えさせる義務を負う。","ＡとＢの間で、Ｂが甲土地を１０００万円で買い受ける旨が合意されたとしても、書面によるのでなければ、売買契約は効力を生じない。","甲土地について、Ｂを売主、Ｃを買主として売買契約が締結された場合、Ｂは、Ａから甲土地の所有権を取得してＣに移転する義務を負う。","ＡとＢの売買契約において、ＢがＡに対し、解約手付として手付金を交付したときは、Ａが売買契約の履行に着手する前であれば、Ｂは、手付金を放棄することにより、売買契約を解除することができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。売主は買主に対し、所有権を移転するだけでなく、登記など買主が権利を第三者に対抗するために必要な手続へ協力する義務を負います。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不動産売買契約は原則として諾成契約であり、書面を作成しなくても当事者の意思が合致すれば成立・効力発生します。『書面でなければ効力を生じない』が誤りです。","corrected":"","inferredBasis":["民法555条"]},{"mark":"○","explanation":"正しい。他人物売買も有効です。売主Bは目的物の所有権をAから取得して買主Cへ移転する義務を負います。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。解約手付が交付されている場合、相手方が履行に着手するまでは、買主は手付を放棄して契約を解除できます（民法557条）。","corrected":"","inferredBasis":[]}],"references":["民法555条売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","民法557条1項（手付による解除・学習用抜粋）買主が売主に手付を交付したときは、相手方が契約の履行に着手するまでは、買主は手付を放棄し、売主はその倍額を現実に提供して契約を解除することができる。","民法562条1項（履行の追完請求・学習用抜粋）引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないときは、買主は修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。","民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。"],"oldLawNote":"","referenceItems":[{"statuteRef":161},{"statuteRef":162},{"statuteRef":163},{"statuteRef":121},{"learningNote":"解約手付が交付されている場合、相手方が履行に着手するまでは、買主は手付を放棄して契約を解除できます（民法557条）。","statuteRef":164}]},{"id":80,"year":16,"sourceQuestion":9,"category":"契約・債権","theme":"売買","prompt":"売買に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["他人の権利を売買の目的としたときは、売主は、その権利を取得して買主に移転する義務を負う。","買主は、売主に手付を交付したときは、売主が契約の履行に着手するまでは、買主はその手付を放棄して、契約の解除をすることができる。","売主は、引き渡された目的物の品質が契約の内容に適合しない場合の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実については、その責任を免れることができない。","引き渡された目的物の品質が契約の内容に適合しないものである場合、売主が履行の追完を拒絶する意思を明確に表示したときであっても、買主は履行の追完の催告をした後でなければ、代金の減額を請求することができない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。他人物売買は有効であり、売主はその権利を取得して買主へ移転する義務を負います（民法561条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。解約手付が交付された場合、相手方が履行に着手するまでは、買主は手付を放棄して解除できます。","corrected":"","inferredBasis":["民法557条"]},{"mark":"○","explanation":"正しい。契約不適合責任を免除する特約があっても、売主が不適合を知りながら告げなかった事実についてまで免責されません（民法572条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。売主が履行の追完を拒絶する意思を明確に表示した場合など、催告をしても追完が見込めない類型では、買主は追完催告をせず直ちに代金減額請求できる場合があります（民法563条2項）。『必ず催告後でなければならない』が誤りです。","corrected":"","inferredBasis":[]}],"references":["民法555条売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","民法557条1項（手付による解除・学習用抜粋）買主が売主に手付を交付したときは、相手方が契約の履行に着手するまでは、買主は手付を放棄し、売主はその倍額を現実に提供して契約を解除することができる。","民法562条1項（履行の追完請求・学習用抜粋）引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないときは、買主は修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。","民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。","民法561条（解説中参照・条文要旨） 他人物売買は有効であり、売主はその権利を取得して買主へ移転する義務を負います（民法561条）。","民法572条（解説中参照・条文要旨） 契約不適合責任を免除する特約があっても、売主が不適合を知りながら告げなかった事実についてまで免責されません（民法572条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":161},{"statuteRef":162},{"statuteRef":163},{"statuteRef":121},{"learningNote":"他人物売買は有効であり、売主はその権利を取得して買主へ移転する義務を負います（民法561条）。","statuteRef":165},{"learningNote":"契約不適合責任を免除する特約があっても、売主が不適合を知りながら告げなかった事実についてまで免責されません（民法572条）。","statuteRef":166},{"learningNote":"売主が履行の追完を拒絶する意思を明確に表示した場合など、催告をしても追完が見込めない類型では、買主は追完催告をせず直ちに代金減額請求できる場合があります（民法563条2項）。","statuteRef":167}]},{"id":81,"year":14,"sourceQuestion":7,"category":"契約・債権","theme":"売買","prompt":"売買契約の解除に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["動産の売買契約が解除される前に，買主から転売を受けて目的物の引渡しを受けた者は，解除した売主に対して，目的物の所有権の取得を対抗することができる。","売買契約において，目的物の引渡しを代金支払より先に履行すべき旨が合意されていた場合であっても，買主は，代金支払時期を徒過したときは，代金債務の履行の提供をしない限り，引渡しの不履行を理由として当該売買契約を解除することはできない。","不動産の売買契約に基づき代金の支払を受けた売主は，当該売買契約が解除された場合には，買主に対し，その支払を受けた時から利息を付して当該代金を返還しなければならない。","売買契約の買主が約定の代金支払時期に売買代金を支払わないときは，売主は，引渡債務の履行の提供をする前であっても，直ちにその売買契約を解除することができる。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。解除前に目的動産を買主から取得し引渡しを受けた第三者は、民法545条1項ただし書の第三者として保護され、解除した売主はその所有権取得を害することができません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。目的物引渡しが先履行でも、買主が自己の代金支払債務について履行遅滞に陥っている場合、自己の履行を提供せず売主の不履行だけを理由に解除することは信義則・同時履行関係との調整上認められません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。解除により受領した金銭を返還する者は、受領時から利息を付して返還しなければなりません（民法545条2項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。双務契約で売主にも引渡債務がある場合、買主が代金支払期を徒過しただけで直ちに解除できるとは限りません。売主が自己の反対給付を提供し、相当期間を定めて催告する等、解除要件を満たす必要があります。","corrected":"","inferredBasis":[]}],"references":["民法555条売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。","民法557条1項（手付による解除・学習用抜粋）買主が売主に手付を交付したときは、相手方が契約の履行に着手するまでは、買主は手付を放棄し、売主はその倍額を現実に提供して契約を解除することができる。","民法562条1項（履行の追完請求・学習用抜粋）引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないときは、買主は修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。","民法563条（代金減額請求・学習用抜粋）契約不適合について、相当期間を定めて履行の追完を催告し、その期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求することができる。催告を要しない場合もある。","民法545条第1項（解説中参照・条文要旨） 解除前に目的動産を買主から取得し引渡しを受けた第三者は、民法545条1項ただし書の第三者として保護され、解除した売主はその所有権取得を害することができません。"],"oldLawNote":"","referenceItems":[{"statuteRef":161},{"statuteRef":162},{"statuteRef":163},{"statuteRef":121},{"learningNote":"解除前に目的動産を買主から取得し引渡しを受けた第三者は、民法545条1項ただし書の第三者として保護され、解除した売主はその所有権取得を害することができません。","statuteRef":126},{"learningNote":"解除により受領した金銭を返還する者は、受領時から利息を付して返還しなければなりません（民法545条2項）。","statuteRef":168}]},{"id":82,"year":19,"sourceQuestion":9,"category":"契約・債権","theme":"保証","prompt":"保証に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["保証債務は、主たる債務に関する損害賠償を包含しない。","主たる債務者がした債務承認による時効の更新は、保証人に対しても、その効力が及ぶ。","連帯保証人は、債権者から債務の履行の請求を受けたときは、まず主たる債務者に催告をすべき旨を請求することができる。","保証契約は、口頭でも有効に成立し、書面による必要はない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。保証債務は主債務に附従し、主債務に関する利息、違約金、損害賠償その他その債務に従たるすべてのものを包含します（民法447条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。主債務者による債務承認は主債務の時効更新事由となり、保証債務の附従性により保証人にも影響が及ぶと解されます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。連帯保証人には催告の抗弁権・検索の抗弁権がありません（民法454条）。債権者は主債務者へ先に請求せず連帯保証人へ請求できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。保証契約は書面又は電磁的記録でしなければ効力を生じません（民法446条2項・3項）。口頭だけでは有効に成立しません。","corrected":"","inferredBasis":[]}],"references":["民法446条1項保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。","民法447条（解説中参照・条文要旨） 保証債務は主債務に附従し、主債務に関する利息、違約金、損害賠償その他その債務に従たるすべてのものを包含します（民法447条）。","民法454条（解説中参照・条文要旨） 連帯保証人には催告の抗弁権・検索の抗弁権がありません（民法454条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":169},{"learningNote":"保証債務は主債務に附従し、主債務に関する利息、違約金、損害賠償その他その債務に従たるすべてのものを包含します（民法447条）。","statuteRef":170},{"learningNote":"連帯保証人には催告の抗弁権・検索の抗弁権がありません（民法454条）。","statuteRef":171},{"learningNote":"保証契約は書面又は電磁的記録でしなければ効力を生じません（民法446条2項・3項）。","statuteRef":172}]},{"id":83,"year":11,"sourceQuestion":9,"category":"契約・債権","theme":"保証","prompt":"保証に関する次の１から４までの記述のうち，正しいものを一つ選びなさい。","choices":["連帯保証人は，債権者から債務の履行の請求を受けたとき，まず主債務者に催告するよう請求することができる。","保証債務の範囲には，主債務に関する利息，違約金，損害賠償その他主債務に従たる債務すべてが含まれる。","主債務者の所有不動産に仮差押えがされた場合，仮差押えによる時効中断の効力は，保証人には及ばない。","債権者と保証人の間の保証契約は，口頭でも有効に成立し，必ずしも書面による必要はない。"],"answer":2,"details":[{"mark":"×","explanation":"誤り。連帯保証人には催告の抗弁権がありません。債権者は主債務者へ先に請求することなく連帯保証人へ請求できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法447条により、保証債務は主債務に関する利息・違約金・損害賠償その他従たるすべてのものを包含します。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。主債務者に対する時効完成猶予・更新事由は、保証債務の附従性との関係で保証人にも一定の影響を及ぼします。『仮差押えの効果は保証人に一切及ばない』という断定は不正確です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。保証契約は書面でしなければ効力を生じず、電磁的記録による場合も書面と同様に扱われます。口頭保証は原則無効です（民法446条）。現行法メモ・2020年改正後の現行民法では、旧法の「時効の中断」は「完成猶予」と「更新」に整理されています。","corrected":"","inferredBasis":[]}],"references":["民法446条1項保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。","民法447条（解説中参照・条文要旨） 民法447条により、保証債務は主債務に関する利息・違約金・損害賠償その他従たるすべてのものを包含します。"],"oldLawNote":"","referenceItems":[{"statuteRef":169},{"learningNote":"民法447条により、保証債務は主債務に関する利息・違約金・損害賠償その他従たるすべてのものを包含します。","statuteRef":170},{"learningNote":"口頭保証は原則無効です（民法446条）。","statuteRef":173}]},{"id":84,"year":15,"sourceQuestion":8,"category":"契約・債権","theme":"債権者代位権に関する次の","prompt":"債権者代位権に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["債権者代位権を行使するためには，被保全債権が代位行使される権利よりも先に成立している必要はない。","債権者が，債務者の第三債務者に対する金銭債権を代位行使した場合，債務者は，第三債務者に対して自ら取立てを行うことはできない。","不動産が，ＡからＢ，ＢからＣに順次譲渡された場合において，ＢがＡに対して有する所有権移転登記手続請求権を行使しないときは，Ｃは，その権利を行使することができる。","債権者Ａが，債務者Ｂに対する金銭債権を被保全債権として，Ｂの第三債務者Ｃに対する金銭債権を代位行使する場合，Ａは，自己の債権額の範囲内においてのみ，ＢのＣに対する金銭債権を行使することができる。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。債権者代位権について、被保全債権が代位対象権利より先に成立していることは一般的な要件ではありません。詐害行為取消権の成立時期要件と混同しないよう注意します。","corrected":"","inferredBasis":["民法423条","民法424条"]},{"mark":"×","explanation":"誤り。現行民法423条の5により、債権者が代位行使しても、債務者自身が第三債務者に対して権利を行使することは妨げられません。旧判例理論から明文化の際に整理された点です。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。A→B→Cと順次譲渡された不動産で、BがAに対する移転登記請求権を行使しない場合、Cは自己のBに対する登記請求権を保全するため、Bに代位してAに対する登記請求権を行使できます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。被保全債権が金銭債権で、代位対象も可分な金銭債権である場合、債権者は原則として自己の債権額の範囲内で代位行使します。","corrected":"","inferredBasis":[]}],"references":["民法423条1項（債権者代位権・学習用抜粋）債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利を行使することができる。ただし、債務者の一身に専属する権利等は除く。"],"oldLawNote":"","referenceItems":[{"statuteRef":174},{"learningNote":"現行民法423条の5により、債権者が代位行使しても、債務者自身が第三債務者に対して権利を行使することは妨げられません。","statuteRef":175},{"learningNote":"","statuteRef":176}]},{"id":85,"year":13,"sourceQuestion":10,"category":"契約・債権","theme":"債権者代位権に関する次の","prompt":"債権者代位権に関する次の１から４までの記述のうち，判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["債権者が債務者に代位して，債務者が第三債務者に対して有する所有権移転登記請求権を行使する場合，債権者は，第三債務者から直接自己へ登記を移転する旨の登記手続を求めることができない。","債務者が既に自ら権利を行使している場合には，その行使の方法又は結果の良否にかかわらず，債権者は，その権利について債権者代位権を行使することができない。","債権者が債務者に代位して，債務者の第三債務者に対する債権を行使した場合において，第三債務者が債務者に対する同時履行の抗弁権を有しているときであっても，第三債務者は，債権者に対しては，同時履行の抗弁を主張することができない。","債権者代位権を行使するためには，被保全債権が代位行使される権利よりも先に成立している必要はない。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。債権者代位権は債務者の権利を『債務者に代わって』行使する制度です。BのAに対する移転登記請求を代位しても、原則としてAから債権者自身へ直接所有権移転登記を求めることはできず、B名義への登記を求めます。","corrected":"","inferredBasis":["民法423条"]},{"mark":"○","explanation":"債務者が既に自ら権利を行使している場合には，その行使の方法又は結果の良否にかかわらず，債権者は，その権利について債権者代位権を行使することができない。正しい（旧判例理論）。債務者が既に自ら権利を行使している場合、債権者がその方法・結果が不十分だとして重ねて代位行使することはできないとされていました。現行民法では債務者自身の権利行使と代位行使の関係が明文化されているため最新条文も確認してください。","corrected":"","inferredBasis":["民法423条"]},{"mark":"×","explanation":"誤り。債権者代位は債務者の権利をそのまま行使するものなので、第三債務者は債務者に対して有する同時履行の抗弁その他の抗弁を代位債権者に対しても主張できます。","corrected":"","inferredBasis":["民法423条"]},{"mark":"○","explanation":"正しい。債権者代位権の被保全債権は、原則として代位対象権利より先に成立している必要はありません。","corrected":"","inferredBasis":["民法423条"]}],"references":["民法423条1項（債権者代位権・学習用抜粋）債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利を行使することができる。ただし、債務者の一身に専属する権利等は除く。"],"oldLawNote":"","referenceItems":[{"statuteRef":174}]},{"id":86,"year":15,"sourceQuestion":9,"category":"契約・債権","theme":"債権の譲渡に関する次の１","prompt":"債権の譲渡に関する次の１から４までの記述のうち，判例の趣旨に照らし正しいものを１つ選びなさい。","choices":["将来発生する債権を発生前に譲渡することはできない。","債権の譲渡は，譲渡人が債務者に対し，確定日付のある証書によって通知をしなければ，その効力を生じない。","債権の譲受人は，譲渡人に代位して，債務者に対し債権譲渡の通知をすることはできない。","譲渡制限特約が定められた債権の譲渡は，その効力を生じない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。将来債権でも、発生可能性があり内容を特定できる範囲で、発生前に譲渡することができます。現行民法466条の6は将来債権譲渡を明文で認めています。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。債権譲渡は譲渡人と譲受人の合意で効力を生じます。債務者への通知・承諾は対抗要件であり、通知に確定日付が必要なのは第三者対抗要件の問題です。","corrected":"","inferredBasis":["民法466条"]},{"mark":"○","explanation":"正しい。債権譲渡の通知は譲渡人から債務者にする必要があり、譲受人が譲渡人に代位して自ら通知することはできないとするのが判例です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現行民法では譲渡制限特約があっても債権譲渡自体は原則として有効です（民法466条2項）。ただし譲受人の悪意・重過失等に応じて債務者保護の規定があります。","corrected":"","inferredBasis":[]}],"references":["民法466条1項債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。"],"oldLawNote":"","referenceItems":[{"statuteRef":177},{"learningNote":"現行民法466条の6は将来債権譲渡を明文で認めています。","statuteRef":178},{"learningNote":"現行民法では譲渡制限特約があっても債権譲渡自体は原則として有効です（民法466条2項）。","statuteRef":179}]},{"id":87,"year":11,"sourceQuestion":11,"category":"契約・債権","theme":"委任に関する次の１から４","prompt":"委任に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["受任者は，委任者の請求があるときは，いつでも委任事務の処理の状況を報告し，委任終了後は，遅滞なく経過と結果を報告する義務を負う。","受任者は，委任事務処理に必要な費用を支出したときは，その費用と支出日以後の利息の償還を委任者に請求することができるが，実際に費用を支出する前にあっては，費用の前払を請求することができない。","受任者は，委任事務処理の過程において，金銭その他の物を受け取った場合には，委任者に引き渡す義務を負う。","受任者は，無償委任の場合においても，委任者の許諾を得た場合又はやむを得ない事由がある場合を除き，自ら委任事務を処理しなければならない。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。受任者は委任者の請求に応じていつでも事務処理状況を報告し、委任終了後は遅滞なく経過と結果を報告する義務があります。","corrected":"","inferredBasis":["民法645条"]},{"mark":"×","explanation":"誤り。受任者が委任事務を処理するのに費用を要する場合、委任者に対して費用の前払を請求できます（民法649条）。支出後は費用と支出日以後の利息の償還を請求できます。『前払請求できない』が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。委任事務処理に当たって受任者が受領した金銭その他の物や収取した果実は、委任者に引き渡す義務があります（民法646条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。受任者は原則として自ら委任事務を処理し、復受任者を選任できるのは委任者の許諾がある場合又はやむを得ない事由がある場合等に限られます。","corrected":"","inferredBasis":[]}],"references":["民法644条受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う。","民法649条（解説中参照・条文要旨） 受任者が委任事務を処理するのに費用を要する場合、委任者に対して費用の前払を請求できます（民法649条）。","民法646条（解説中参照・条文要旨） 委任事務処理に当たって受任者が受領した金銭その他の物や収取した果実は、委任者に引き渡す義務があります（民法646条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":151},{"learningNote":"受任者が委任事務を処理するのに費用を要する場合、委任者に対して費用の前払を請求できます（民法649条）。","statuteRef":180},{"learningNote":"委任事務処理に当たって受任者が受領した金銭その他の物や収取した果実は、委任者に引き渡す義務があります（民法646条）。","statuteRef":181},{"learningNote":"民法645条（解説中参照・学習用要点） 民法645条により、受任者は委任者から請求があればいつでも委任事務の処理状況を報告し、委任終了後は遅滞なく経過・結果を報告しなければなりません。","statuteRef":152}]},{"id":88,"year":20,"sourceQuestion":9,"category":"契約・債権","theme":"連帯債務に関する次の１か","prompt":"連帯債務に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["債務の一部を弁済した連帯債務者は、自己の負担部分を超えて弁済した場合に限り、他の連帯債務者に対して求償をすることができる。","債権者が連帯債務者の１人に対して債務の全部を免除する旨の意思表示をしたときは、他の連帯債務者の債務も消滅する。","連帯債務者の１人が債務の全部を弁済したときは、他の連帯債務者の債務も消滅する。","数人が共同して一棟の建物の買主となった場合、売買代金債務は連帯債務となる。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。連帯債務者が共同の免責を得るため弁済等をした場合、自己の負担部分を超えたか否かにかかわらず、他の連帯債務者に対し各自の負担部分に応じて求償できます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。現行民法では、債権者が一人の連帯債務者を免除しても、原則として他の連帯債務者の債務には影響しません。免除を受けた者の負担部分について他の者も当然免れるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。一人の連帯債務者が債務全額を弁済すれば債権は満足して消滅するため、他の連帯債務者も債権者に対する債務を免れます。内部的には求償関係が残ります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。数人が共同して売買契約の買主となっただけで、売買代金債務が当然に連帯債務になるわけではありません。連帯の合意や法律上の根拠が必要です。","corrected":"","inferredBasis":[]}],"references":["民法436条（連帯債務者に対する履行請求・学習用抜粋）債務の目的がその性質上可分である場合でも、法令又は当事者の意思表示により数人が連帯して債務を負担するときは、債権者は連帯債務者の一人又は数人に全部又は一部の履行を請求できる。"],"oldLawNote":"","referenceItems":[{"statuteRef":182}]},{"id":89,"year":17,"sourceQuestion":10,"category":"契約・債権","theme":"Ａは、その債権者を害する","prompt":"Ａは、その債権者を害することを知りながら、所有する骨董品甲をＢに贈与し、その際、Ｂも、甲の贈与がＡの債権者を害することを知っていた。この場合におけるＡの債権者Ｃによる詐害行為取消権行使に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["Ｃが詐害行為取消訴訟を提起する場合には、Ａを被告としなければならない。","Ｃは、ＡのＢに対する甲の贈与があった時から２年を経過したときは、Ｃがこの贈与の事実を知らなかったとしても、詐害行為取消訴訟を提起することができない。","Ｃによる詐害行為取消請求を認容する確定判決は、Ａ及びＡの全ての債権者に対してその効力を有する。","Ｂが、甲の贈与がＡの債権者を害することを知っていたＤに甲を売却した場合、Ｃは、Ｄに対して詐害行為取消訴訟を提起することができない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。詐害行為取消訴訟の被告は、原則として受益者B又は転得者であり、債務者Aではありません。Aは訴訟告知等の対象となります。","corrected":"","inferredBasis":["民法424条"]},{"mark":"×","explanation":"誤り。現行民法426条の期間制限は、債権者が取消原因を知った時から2年、行為の時から10年です。行為から2年経過しただけで、知らなかった債権者の請求権が当然に消滅するわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。詐害行為取消請求を認容する確定判決の効力は、債務者A及びすべての債権者に及びます。責任財産を共同担保として回復する制度だからです。","corrected":"","inferredBasis":["民法424条"]},{"mark":"×","explanation":"誤り。受益者Bから悪意の転得者Dへ目的物が移転した場合、法定要件を満たせば債権者Cは転得者Dに対しても詐害行為取消請求をすることができます。","corrected":"","inferredBasis":["民法424条"]}],"references":["民法424条1項（詐害行為取消請求・学習用抜粋）債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求することができる。","民法426条（解説中参照・条文要旨） 現行民法426条の期間制限は、債権者が取消原因を知った時から2年、行為の時から10年です。"],"oldLawNote":"","referenceItems":[{"statuteRef":183},{"learningNote":"現行民法426条の期間制限は、債権者が取消原因を知った時から2年、行為の時から10年です。","statuteRef":184}]},{"id":90,"year":15,"sourceQuestion":4,"category":"契約・債権","theme":"ＡはＢから，８月１日の午","prompt":"ＡはＢから，８月１日の午前１０時に，期間を１０日間と定めて車を借りた。民法上，Ａはいつまで車を借りていることができるか。次の１から４までのうち，正しいものを１つ選びなさい。","choices":["８月１１日の午前１０時","８月１０日の終了時","８月１０日の午前１０時","８月１１日の終了時"],"answer":4,"details":[{"mark":"×","explanation":"誤り。期間を日で定め、初日が午前0時から始まらない場合、民法140条により初日は算入しません。8月1日は数えず、8月2日から10日間を数えます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。初日不算入のため8月10日終了時ではまだ9日分です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。8月11日の午前10時で区切るのではなく、日単位の期間は末日の終了時に満了します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。8月1日は初日不算入で、8月2日を第1日として数え、第10日の8月11日の終了時に期間が満了します（民法140条・141条）。","corrected":"","inferredBasis":[]}],"references":["民法140条日、週、月又は年によって期間を定めたときは、期間の初日は、算入しない。ただし、その期間が午前零時から始まるときは、この限りでない。","民法141条前条の場合には、期間は、その末日の終了をもって満了する。"],"oldLawNote":"","referenceItems":[{"statuteRef":185},{"statuteRef":186}]},{"id":91,"year":20,"sourceQuestion":11,"category":"不法行為","theme":"不法行為","prompt":"不法行為の要件に関する以下の記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["不法行為の成立要件としての因果関係の立証とは、特定の事実が特定の結果発生を招来した関係を是認しうる高度の蓋然性を証明することである。","名誉毀損の行為者は、摘示された事実を真実と信じるについて相当の理由があったとしても、当該行為が真実であることが証明されない限り、不法行為の責任を負う。","不法行為による生命侵害の慰謝料請求は、被害者が生前に請求する意思を表明していなくても、これを相続人においてすることができる。","他人の生命を侵害した者は、被害者の父母、配偶者及び子に対しては、その財産権が侵害されなかった場合においても、損害賠償の責任を負う。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。判例上、因果関係の証明は自然科学的な完全証明を要求するものではなく、経験則に照らして特定の事実が特定の結果を招来した関係を是認し得る高度の蓋然性を証明することで足ります。","corrected":"","inferredBasis":["民法709条"]},{"mark":"×","explanation":"誤り。『真実であることが証明されない限り必ず責任を負う』という部分が誤りです。公共の利害に関する事実について公益目的で摘示し、真実と信じるについて相当の理由があれば、真実性の証明ができなくても故意・過失が否定され、不法行為責任を負わない場合があります。","corrected":"","inferredBasis":["民法709条"]},{"mark":"○","explanation":"正しい。生命侵害による本人の慰謝料請求権は、被害者が生前に請求意思を表明していなくても発生し、相続の対象となるとするのが判例です。相続人はその権利を承継して請求できます。","corrected":"","inferredBasis":["民法709条"]},{"mark":"○","explanation":"正しい。民法711条は、他人の生命を侵害した者について、被害者の父母・配偶者・子に対し、財産権侵害がなくても損害賠償責任を負うと定めています。近親者固有の精神的損害を保護する規定です。","corrected":"","inferredBasis":[]}],"references":["民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","民法711条他人の生命を侵害した者は、被害者の父母、配偶者及び子に対しては、その財産権が侵害されなかった場合においても、損害の賠償をしなければならない。"],"oldLawNote":"","referenceItems":[{"statuteRef":187},{"statuteRef":188}]},{"id":92,"year":19,"sourceQuestion":11,"category":"不法行為","theme":"不法行為","prompt":"不法行為に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["未成年者は、他人に損害を加えたときであっても、その行為について損害賠償責任を負うことはない。","不法行為による損害賠償請求権の消滅時効は、被害者又はその法定代理人が損害又は加害者のいずれかを知った時から進行する。","被害者に財産上の損害が生じなければ、不法行為は成立しない。","名誉毀損の不法行為については、裁判所は、加害者に対し、損害賠償以外にも名誉を回復するのに適当な処分を命ずることができる。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。未成年者でも、自己の行為の責任を弁識するに足りる知能（責任能力）があれば不法行為責任を負います。年齢だけで一律に免責されるわけではありません（民法712条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。一般の不法行為による損害賠償請求権の短期消滅時効は、被害者又は法定代理人が『損害及び加害者』を知った時から進行します。どちらか一方を知っただけでは足りません（民法724条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。不法行為による損害には精神的損害も含まれます。財産上の損害がなくても、名誉侵害や身体・生命侵害等で慰謝料請求が認められ得ます（民法710条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法723条により、名誉毀損の場合、裁判所は被害者の請求により、損害賠償に代えて又はこれとともに名誉を回復するのに適当な処分を命ずることができます。","corrected":"","inferredBasis":[]}],"references":["民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","民法712条（解説中参照・条文要旨） 年齢だけで一律に免責されるわけではありません（民法712条）。","民法724条（解説中参照・条文要旨） どちらか一方を知っただけでは足りません（民法724条）。","民法710条（解説中参照・条文要旨） 財産上の損害がなくても、名誉侵害や身体・生命侵害等で慰謝料請求が認められ得ます（民法710条）。","民法723条（解説中参照・条文要旨） 民法723条により、名誉毀損の場合、裁判所は被害者の請求により、損害賠償に代えて又はこれとともに名誉を回復するのに適当な処分を命ずることができます。"],"oldLawNote":"","referenceItems":[{"statuteRef":187},{"learningNote":"年齢だけで一律に免責されるわけではありません（民法712条）。","statuteRef":189},{"learningNote":"どちらか一方を知っただけでは足りません（民法724条）。","statuteRef":190},{"learningNote":"財産上の損害がなくても、名誉侵害や身体・生命侵害等で慰謝料請求が認められ得ます（民法710条）。","statuteRef":191},{"learningNote":"民法723条により、名誉毀損の場合、裁判所は被害者の請求により、損害賠償に代えて又はこれとともに名誉を回復するのに適当な処分を命ずることができます。","statuteRef":38}]},{"id":93,"year":14,"sourceQuestion":11,"category":"不法行為","theme":"不法行為","prompt":"不法行為に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["土地の工作物の設置又は保存の瑕疵により他人に損害が生じた場合において，その工作物の占有者が損害の発生を防止するのに必要な注意をしたときは，所有者がその損害を賠償する責任を負う。","自己の行為の責任を弁識するに足りる知能を備えていない未成年者は，その行為により他人に加えた損害を賠償する責任を負わない。","注文者は，請負人がその仕事について第三者に加えた損害を賠償する責任を負わないが，当該請負人の選任又は監督について過失があったときは，損害を賠償する責任を負う。かし","数人が共同の不法行為によって他人に損害を加えた場合において，いずれの者がその損害を加えたかを知ることができないときは，各行為者は連帯してその賠償をする責任を負う。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。民法717条1項ただし書により、工作物の占有者が損害発生防止に必要な注意をした場合、所有者が賠償責任を負います。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民法712条により、自己の行為の責任を弁識するに足りる知能を備えていない未成年者は、その行為について不法行為責任を負いません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法716条では、注文者は原則として請負人が第三者に加えた損害の責任を負いませんが、注文又は指図について過失があった場合には責任を負います。『請負人の選任又は監督について過失』という表現は使用者責任の考え方と混同しています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共同不法行為者のうち誰の行為が損害を生じさせたか特定できない場合でも、民法719条により各行為者は連帯して賠償責任を負います。","corrected":"","inferredBasis":[]}],"references":["民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","民法717条1項土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。","民法712条（解説中参照・条文要旨） 民法712条により、自己の行為の責任を弁識するに足りる知能を備えていない未成年者は、その行為について不法行為責任を負いません。","民法716条（解説中参照・条文要旨） 民法716条では、注文者は原則として請負人が第三者に加えた損害の責任を負いませんが、注文又は指図について過失があった場合には責任を負います。","民法719条（解説中参照・条文要旨） 共同不法行為者のうち誰の行為が損害を生じさせたか特定できない場合でも、民法719条により各行為者は連帯して賠償責任を負います。"],"oldLawNote":"","referenceItems":[{"statuteRef":187},{"statuteRef":192},{"learningNote":"民法712条により、自己の行為の責任を弁識するに足りる知能を備えていない未成年者は、その行為について不法行為責任を負いません。","statuteRef":189},{"learningNote":"民法716条では、注文者は原則として請負人が第三者に加えた損害の責任を負いませんが、注文又は指図について過失があった場合には責任を負います。","statuteRef":193},{"learningNote":"共同不法行為者のうち誰の行為が損害を生じさせたか特定できない場合でも、民法719条により各行為者は連帯して賠償責任を負います。","statuteRef":194}]},{"id":94,"year":12,"sourceQuestion":11,"category":"不法行為","theme":"不法行為","prompt":"不法行為責任に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["使用者責任の要件としての職務の執行については，その加害行為が外形からしてあたかも被用者の職務の範囲内とみられる場合を含む。","共謀のうえ共同して暴行を加えた結果，被害者が死亡した場合，共同して暴行に加わった者は，致命傷となる傷害を与えていなかったとしても，被害者の相続人に対して，死亡により生じた損害全額を賠償すべき責任を負う。","飼い犬に噛まれて通行人が怪我をした場合，その犬の飼い主は，過失がないことを立証しても賠償責任を免れることはできない。","建物の外壁が剥落して通行人が怪我をした場合，設置又は保存の瑕疵のある建物の所有者は，当該建物の占有者に過失がないときは，無過失であっても損害賠償責任を負う。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。民法715条の『事業の執行について』は、被用者の行為が外形上職務の範囲内に見える場合も含むという外形標準説が判例上採用されています。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共謀して共同暴行を加えた者は共同不法行為者となり、誰の一撃が致命傷か特定できなくても、死亡損害全体について連帯して責任を負います。","corrected":"","inferredBasis":["民法709条","民法882条"]},{"mark":"×","explanation":"誤り。動物占有者の責任は絶対的無過失責任ではありません。民法718条1項ただし書により、動物の種類・性質に従い相当の注意をもって管理したことを立証すれば免責され得ます。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。工作物の占有者に過失がなく必要な注意を尽くした場合、所有者が民法717条1項ただし書により無過失責任を負います。","corrected":"","inferredBasis":[]}],"references":["民法709条故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","民法715条（解説中参照・条文要旨） 民法715条の『事業の執行について』は、被用者の行為が外形上職務の範囲内に見える場合も含むという外形標準説が判例上採用されています。","民法718条第1項（解説中参照・条文要旨） 民法718条1項ただし書により、動物の種類・性質に従い相当の注意をもって管理したことを立証すれば免責され得ます。","民法717条第1項（解説中参照・条文要旨） 工作物の占有者に過失がなく必要な注意を尽くした場合、所有者が民法717条1項ただし書により無過失責任を負います。"],"oldLawNote":"","referenceItems":[{"statuteRef":187},{"learningNote":"民法715条の『事業の執行について』は、被用者の行為が外形上職務の範囲内に見える場合も含むという外形標準説が判例上採用されています。","statuteRef":195},{"learningNote":"民法718条1項ただし書により、動物の種類・性質に従い相当の注意をもって管理したことを立証すれば免責され得ます。","statuteRef":196},{"learningNote":"工作物の占有者に過失がなく必要な注意を尽くした場合、所有者が民法717条1項ただし書により無過失責任を負います。","statuteRef":197},{"learningNote":"民法882条相続は、死亡によって開始する。","statuteRef":86}]},{"id":95,"year":18,"sourceQuestion":11,"category":"不法行為","theme":"土地工作物責任に関する次","prompt":"土地工作物責任に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["土地工作物責任を負う者が、土地工作物の設置又は保存に瑕疵があることによって生じた損害を賠償したときは、損害の原因について他にその責任を負う者に対し、求償権を行使することができる。","土地工作物の所有者は、損害の発生を防止するのに必要な注意をしたときは、土地工作物責任を免れる。","踏切道の軌道施設について、本来備えるべき保安設備を欠く場合、土地工作物の設置の瑕疵に該当する。","土地工作物の所有者は、その設置又は保存による瑕疵が前所有者の所有していた際に生じた場合であっても、土地工作物責任を負う。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。工作物責任により損害を賠償した占有者・所有者は、設計者・施工者など損害原因について別に責任を負う者がいる場合、その者へ求償できます（民法717条3項）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。所有者の責任は占有者と異なり無過失責任です。占有者が必要な注意をしたため免責される場合、所有者は自ら無過失であっても責任を負い、『必要な注意をした』ことによる免責はありません。","corrected":"","inferredBasis":["民法717条"]},{"mark":"○","explanation":"正しい。踏切道も土地の工作物に含まれ、本来備えるべき保安設備を欠き通常有すべき安全性を欠く場合、設置の瑕疵に当たり得ます。","corrected":"","inferredBasis":["民法717条"]},{"mark":"○","explanation":"正しい。所有者責任は現在の所有者に課されるため、瑕疵が前所有者の時代に生じたとしても、事故時の所有者は民法717条上の責任を負い得ます。前所有者等への求償は別問題です。","corrected":"","inferredBasis":[]}],"references":["民法717条1項（工作物責任・学習用抜粋）土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者が責任を負い、占有者が損害発生防止に必要な注意をしたときは所有者が責任を負う。"],"oldLawNote":"","referenceItems":[{"statuteRef":198},{"learningNote":"工作物責任により損害を賠償した占有者・所有者は、設計者・施工者など損害原因について別に責任を負う者がいる場合、その者へ求償できます（民法717条3項）。","statuteRef":199},{"learningNote":"所有者責任は現在の所有者に課されるため、瑕疵が前所有者の時代に生じたとしても、事故時の所有者は民法717条上の責任を負い得ます。","statuteRef":200}]},{"id":96,"year":20,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"相続人が複数いる場合における遺産分割前の法律関係に関する次の１から４までの記述のうち、判例の趣旨に照らし誤っているものを１つ選びなさい。","choices":["被相続人が負担していた借入金債務は、共同相続人が連帯して負担する。","被相続人が所有していた賃貸マンションから生じる賃料債権は、遺産分割を経ることなく当然に相続分に応じて分割され、各共同相続人に帰属する。","各共同相続人は、自らの相続分を第三者に譲渡することができる。","相続財産に含まれる金銭を共同相続人の１人が保管している場合、他の共同相続人は、遺産分割前に相続分相当額の金銭の交付を求めることができない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。被相続人の金銭債務のような可分債務は、原則として相続開始と同時に各共同相続人へ法定相続分に応じて分割承継されます。共同相続人が債権者に対して当然に連帯債務を負うわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。相続開始後、遺産分割までに賃貸不動産から生じる賃料債権は、判例上、各共同相続人が相続分に応じて分割単独債権として取得します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。共同相続人は自己の相続分（遺産全体に対する包括的持分）を第三者へ譲渡できます。これに対し他の共同相続人には相続分取戻権があります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。遺産に含まれる現金は遺産分割の対象であり、共同相続人の一人が保管していても、他の相続人は分割前に自己の相続分相当額を当然に個別請求できません。","corrected":"","inferredBasis":[]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202}]},{"id":97,"year":19,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"Ａが3900万円の現金のみを残して死亡した。Ａには、妻Ｂ、Ｂとの間の子Ｃ、Ｄ及びＥがおり、他に相続人はいない。Ｃには400万円の寄与分が認められており、ＥはＡが死亡する２年前に100万円の特別受益を受けている。この場合におけるＢ、Ｃ、Ｄ及びＥの具体的相続分の額に関する次の１から４までの記述のうち、正しいものを１つ選びなさい。","choices":["Ｂが1950万円、Ｃが1050万円、Ｄが650万円、Ｅが250万円","Ｂが1800万円、Ｃが800万円、Ｄが700万円、Ｅが600万円","Ｂが1950万円、Ｃが950万円、Ｄが650万円、Ｅが350万円","Ｂが1800万円、Ｃが1000万円、Ｄが600万円、Ｅが500万円"],"answer":4,"details":[{"mark":"×","explanation":"誤り。具体的相続分の計算では、まず特別受益100万円を持戻し、寄与分400万円を控除してみなし相続財産を3600万円とします。配偶者Bは2分の1＝1800万円、子3人の基礎相続分は各600万円。Cには寄与分400万円を加えて1000万円、Eから特別受益100万円を控除して500万円、Dは600万円です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。Cの寄与分400万円の加算、Eの特別受益100万円の控除を正しく反映すると、B1800万円、C1000万円、D600万円、E500万円となります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。配偶者Bの具体的相続分は、みなし相続財産3600万円の2分の1で1800万円です。1950万円にはなりません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。計算は、3900万円＋特別受益100万円－寄与分400万円＝3600万円。Bは1800万円、各子の基礎は600万円、Cは＋寄与分400万円で1000万円、D600万円、Eは－特別受益100万円で500万円です。","corrected":"","inferredBasis":[]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202}]},{"id":98,"year":16,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"相続による権利義務の承継に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["被相続人が委任契約の当事者であったとき、その委任契約は、被相続人の死亡により終了する。","被相続人が負っていた貸金返還債務は、相続の開始により相続人に承継される。","被相続人が有していた扶養請求権は、相続の開始により相続人に承継される。","被相続人が所有していた墳墓は、被相続人の指定に従って祖先の祭祀を主宰すべき者があるときは、その者がその所有権を承継する。"],"answer":3,"details":[{"mark":"○","explanation":"正しい。委任は当事者間の信頼関係を基礎とする契約なので、民法653条により、原則として委任者又は受任者の死亡によって終了します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。貸金返還債務は一身専属的な債務ではないため、相続開始により相続人へ承継されます。共同相続の場合は原則として法定相続分に応じて分割承継されます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。扶養請求権は身分関係に密接に結び付いた一身専属的権利であり、相続の対象となりません。『相続人に承継される』という部分が誤りです。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。墳墓・祭具等の祭祀財産は通常の相続財産とは別に、被相続人の指定等に従って祖先の祭祀を主宰すべき者が承継します（民法897条）。","corrected":"","inferredBasis":[]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。","民法653条（解説中参照・条文要旨） 委任は当事者間の信頼関係を基礎とする契約なので、民法653条により、原則として委任者又は受任者の死亡によって終了します。","民法897条（解説中参照・条文要旨） 墳墓・祭具等の祭祀財産は通常の相続財産とは別に、被相続人の指定等に従って祖先の祭祀を主宰すべき者が承継します（民法897条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202},{"learningNote":"委任は当事者間の信頼関係を基礎とする契約なので、民法653条により、原則として委任者又は受任者の死亡によって終了します。","statuteRef":203},{"learningNote":"墳墓・祭具等の祭祀財産は通常の相続財産とは別に、被相続人の指定等に従って祖先の祭祀を主宰すべき者が承継します（民法897条）。","statuteRef":204}]},{"id":99,"year":15,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"相続の承認及び放棄に関する次の１から４までの記述のうち，誤っているものを１つ選びなさい。","choices":["相続人は，相続財産の一部を隠匿したときは，単純承認をしたものとみなされる。","相続人は，単純承認をしたときは，無限に被相続人の権利義務を承継する。","相続人が自己のために相続の開始があったことを知った時から３か月以内に，限定承認，相続の放棄のいずれをもしなかったときは，単純承認をしたものとみなされる。","相続人が数人あるときは，限定承認及び相続の放棄は，共同相続人の全員が共同してしなければならない。"],"answer":4,"details":[{"mark":"○","explanation":"正しい。相続財産の全部又は一部を隠匿し、私に消費し、悪意で財産目録に記載しなかった場合等には法定単純承認となります（民法921条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。単純承認をすると、相続人は被相続人の権利義務を無限に承継し、相続財産だけでなく自己財産でも債務を弁済する責任を負います。","corrected":"","inferredBasis":["民法896条"]},{"mark":"○","explanation":"正しい。自己のために相続開始があったことを知った時から原則3か月の熟慮期間内に限定承認・放棄をしなければ、単純承認したものとみなされます。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。共同相続人が数人いる場合、限定承認は全員共同でしなければなりませんが、相続放棄は各相続人が単独でできます。『放棄も全員共同』が誤りです。","corrected":"","inferredBasis":["民法938条"]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。","民法921条（解説中参照・条文要旨） 相続財産の全部又は一部を隠匿し、私に消費し、悪意で財産目録に記載しなかった場合等には法定単純承認となります（民法921条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202},{"learningNote":"相続財産の全部又は一部を隠匿し、私に消費し、悪意で財産目録に記載しなかった場合等には法定単純承認となります（民法921条）。","statuteRef":205},{"learningNote":"","statuteRef":88}]},{"id":100,"year":12,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"Ａには，亡Ｂとの間に子Ｃがおり，Ｂの死後，Ｄとの間に子Ｅが生まれたが，ＡとＤは婚姻していない。また，Ｅには配偶者Ｆがいる。平成２８年１２月ころ，ＡとＥは自動車に同乗して外出したまま行方不明となり，後にいずれも死亡していることが確認されたが，正確な死亡時刻やどちらが先に死亡したかは明らかとならなかった。Ａの相続財産が現金１２００万円だけであった場合において，他にＡの相続人が存在せず，かつ，Ａの遺言もないときに，Ａの相続財産についてＣが取得すべき金額を，次の１から４までのうち，正しいものを１つ選びなさい。","choices":["１２００万円","８００万円","６００万円","３００万円"],"answer":1,"details":[{"mark":"○","explanation":"正しい。AとEの死亡の先後が不明なので民法32条の2により同時死亡と推定され、EはAを相続しません。Aの子はCとEですが、Eの死亡によりEの直系卑属もいないため、CがAの全財産1200万円を取得します。Eの配偶者FはAの相続人ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。800万円とする根拠はありません。同時死亡推定によりEはAを相続しないため、Aの相続についてCとEで分けた後にEの持分をFが取得するという計算はしません。","corrected":"","inferredBasis":["民法882条"]},{"mark":"×","explanation":"誤り。600万円とするのはCとEが各2分の1を相続する前提ですが、AとEは同時死亡と推定されるのでEはAの相続人として相続しません。","corrected":"","inferredBasis":["民法882条"]},{"mark":"×","explanation":"誤り。300万円となる法定相続構成はありません。Eの配偶者Fは、Aとの関係では相続人ではありません。現行法メモ・現行法では婚姻年齢は男女とも18歳です。旧法の「男18歳・女16歳」は現在のルールではありません。","corrected":"","inferredBasis":[]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。","民法961条十五歳に達した者は、遺言をすることができる。","民法32条（解説中参照・条文要旨） AとEの死亡の先後が不明なので民法32条の2により同時死亡と推定され、EはAを相続しません。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202},{"statuteRef":54},{"learningNote":"AとEの死亡の先後が不明なので民法32条の2により同時死亡と推定され、EはAを相続しません。","statuteRef":206}]},{"id":101,"year":11,"sourceQuestion":12,"category":"相続","theme":"相続","prompt":"相続に関する次の１から４までの記述のうち，誤っているものを一つ選びなさい。","choices":["被相続人Ａは，その妻Ｂに全ての財産を相続させる旨の遺言をしていた。Ａの相続人である弟Ｃは，Ｂに対して遺留分減殺請求権を行使することができる。","相続人が相続財産の一部を処分したときは，当該相続人は，単純承認をしたものとみなされる。","複数の相続人中，一人が単純承認をしたときは，他の相続人は限定承認をすることができない。","Ｄは，友人Ｅに５００万円を貸していたところ，全く返済がされないままＥが死亡した。Ｅの相続人が妻Ｆ，長男Ｇ及び次男Ｈの３名である場合，Ｄが返済の請求をすることができる金額は，Ｆに対し２５０万円，ＧとＨに対し各１２５万円である。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。兄弟姉妹には遺留分がありません。Aの弟Cが相続人となり得る場合でも、妻Bに全財産を相続させる遺言に対し遺留分減殺請求（現行法では侵害額請求）をすることはできません。","corrected":"","inferredBasis":["民法1042条","民法1046条"]},{"mark":"○","explanation":"正しい。相続人が相続財産の全部又は一部を処分すると、原則として法定単純承認となります（保存行為等の例外を除く）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。限定承認は共同相続人全員で共同して行う必要があります。一人が単純承認した以上、全員共同という要件を満たせず、他の相続人だけで限定承認することはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。金銭債務は相続開始とともに法定相続分に応じて分割承継されます。配偶者Fが2分の1＝250万円、子G・Hが各4分の1＝125万円ずつ負担します。現行法メモ・2019年7月1日施行の改正後は、遺留分侵害額請求は原則として金銭請求です。旧法の遺留分減殺請求とは効果が異なります。","corrected":"","inferredBasis":["民法882条","民法1042条"]}],"references":["民法882条相続は、死亡によって開始する。","民法896条相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。ただし、被相続人の一身に専属したものは、この限りでない。"],"oldLawNote":"","referenceItems":[{"statuteRef":201},{"statuteRef":202},{"learningNote":"民法1042条（解説で参照する該当箇所・学習用要点） 兄弟姉妹は法定相続人になることはありますが、遺留分権利者ではありません（民法1042条）。","statuteRef":207},{"learningNote":"民法1046条（解説で参照する該当箇所・学習用要点） 現行民法では遺留分侵害に対する救済は原則として金銭債権化されており、遺留分権利者は受遺者・受贈者に侵害額相当の金銭支払を請求します（民法1046条）。","statuteRef":208}]},{"id":102,"year":18,"sourceQuestion":12,"category":"相続","theme":"遺留分","prompt":"遺留分に関する次の１から４までの記述のうち、誤っているものを1つ選びなさい。","choices":["遺留分侵害額の請求権は、相続の開始から１年間行使しないときは、時効によって消滅する。","相続の開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生ずる。","遺留分権利者は、受遺者又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","被相続人の兄弟姉妹は、相続人となったときにも遺留分権利者とならない。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。遺留分侵害額請求権の短期消滅時効は、単に『相続開始から1年』ではありません。遺留分権利者が相続開始及び遺留分を侵害する贈与・遺贈があったことを知った時から1年間です。相続開始から10年の除斥期間もあります。","corrected":"","inferredBasis":["民法1042条","民法1046条"]},{"mark":"○","explanation":"正しい。相続開始前の遺留分放棄は、家庭裁判所の許可を受けた場合に限り効力を生じます（民法1049条1項）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。現行民法では遺留分侵害に対する救済は原則として金銭債権化されており、遺留分権利者は受遺者・受贈者に侵害額相当の金銭支払を請求します（民法1046条）。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。兄弟姉妹は法定相続人になることはありますが、遺留分権利者ではありません（民法1042条）。","corrected":"","inferredBasis":[]}],"references":["民法1042条1項兄弟姉妹以外の相続人は、遺留分として、所定の割合に相当する額を受ける。","民法1046条1項遺留分権利者及びその承継人は、受遺者又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","民法1049条第1項（解説中参照・条文要旨） 相続開始前の遺留分放棄は、家庭裁判所の許可を受けた場合に限り効力を生じます（民法1049条1項）。"],"oldLawNote":"","referenceItems":[{"statuteRef":209},{"statuteRef":210},{"learningNote":"相続開始前の遺留分放棄は、家庭裁判所の許可を受けた場合に限り効力を生じます（民法1049条1項）。","statuteRef":211},{"learningNote":"現行民法では遺留分侵害に対する救済は原則として金銭債権化されており、遺留分権利者は受遺者・受贈者に侵害額相当の金銭支払を請求します（民法1046条）。","statuteRef":208},{"learningNote":"兄弟姉妹は法定相続人になることはありますが、遺留分権利者ではありません（民法1042条）。","statuteRef":207}]},{"id":103,"year":17,"sourceQuestion":12,"category":"相続","theme":"遺留分","prompt":"遺留分に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["遺留分権利者は、受遺者又は受贈者に対して、遺留分侵害額に相当する金銭の支払を請求することができる。","共同相続人の一人が遺留分を放棄したときは、他の各共同相続人の遺留分が増加する。","相続の開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生ずる。","遺留分を算定するための財産の価額は、被相続人が相続開始の時において有した財産の価額にその贈与した財産の価額を加えた額から債務の全額を控除した額である。"],"answer":2,"details":[{"mark":"○","explanation":"正しい。現行法の遺留分侵害額請求は金銭請求であり、遺留分権利者は受遺者・受贈者に侵害額相当の金銭支払を請求します。","corrected":"","inferredBasis":["民法1042条","民法1046条"]},{"mark":"×","explanation":"誤り。共同相続人の一人が遺留分を放棄しても、他の共同相続人の遺留分がその分増えることはありません（民法1049条2項）。放棄分は他の遺留分権利者へ移転しません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。相続開始前の遺留分放棄は家庭裁判所の許可を受けた場合に限り有効です。相続開始後は自由に放棄できます。","corrected":"","inferredBasis":["民法1042条","民法1046条"]},{"mark":"○","explanation":"正しい。遺留分算定の基礎財産は、相続開始時の積極財産に一定の贈与財産を加え、債務全額を控除して算定します。","corrected":"","inferredBasis":["民法1042条","民法1046条"]}],"references":["民法1042条1項兄弟姉妹以外の相続人は、遺留分として、所定の割合に相当する額を受ける。","民法1046条1項遺留分権利者及びその承継人は、受遺者又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","民法1049条第2項（解説中参照・条文要旨） 共同相続人の一人が遺留分を放棄しても、他の共同相続人の遺留分がその分増えることはありません（民法1049条2項）。"],"oldLawNote":"","referenceItems":[{"statuteRef":209},{"statuteRef":210},{"learningNote":"共同相続人の一人が遺留分を放棄しても、他の共同相続人の遺留分がその分増えることはありません（民法1049条2項）。","statuteRef":212}]},{"id":104,"year":13,"sourceQuestion":12,"category":"相続","theme":"遺言に関する次の１から４","prompt":"遺言に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["受遺者が遺贈を承諾したときは，遺贈者の相続人と受遺者との間で贈与契約が成立したものとみなされる。","夫婦は，同一の証書で遺言をすることができる。","包括遺贈を受けた者は，相続財産に属する債務を承継する。","自筆証書遺言をするには，２人以上の証人の立会いがなければならない。"],"answer":3,"details":[{"mark":"×","explanation":"誤り。遺贈は遺言という単独行為によって効力を生じ、受遺者の承諾によって相続人との間に贈与契約が成立するものではありません。受遺者には放棄の制度があります。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。民法975条は共同遺言を禁止しており、夫婦であっても同一の証書で共同して遺言することはできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。包括受遺者は相続人と同一の権利義務を有するため、遺贈の割合に応じて相続財産に属する債務も承継します（民法990条）。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。自筆証書遺言に証人の立会いは不要です。証人2人以上の立会いが必要なのは公正証書遺言などです。","corrected":"","inferredBasis":[]}],"references":["民法961条十五歳に達した者は、遺言をすることができる。","民法975条（解説中参照・条文要旨） 民法975条は共同遺言を禁止しており、夫婦であっても同一の証書で共同して遺言することはできません。","民法990条（解説中参照・条文要旨） 包括受遺者は相続人と同一の権利義務を有するため、遺贈の割合に応じて相続財産に属する債務も承継します（民法990条）。"],"oldLawNote":"","referenceItems":[{"statuteRef":54},{"learningNote":"民法975条は共同遺言を禁止しており、夫婦であっても同一の証書で共同して遺言することはできません。","statuteRef":213},{"learningNote":"包括受遺者は相続人と同一の権利義務を有するため、遺贈の割合に応じて相続財産に属する債務も承継します（民法990条）。","statuteRef":214}]},{"id":105,"year":14,"sourceQuestion":12,"category":"相続","theme":"遺言の効力に関する次の１","prompt":"遺言の効力に関する次の１から４までの記述のうち，正しいものを１つ選びなさい。","choices":["遺言は，公正証書により作成されたものであれば，常に有効である。","遺言書において遺言執行者として指定された者は，当然に，当該遺言を執行する義務を負う。","秘密証書遺言は，公証人立会いの上で開封しなければ無効になる。","有効な自筆証書遺言を作成するためには，遺言者は，少なくとも日付と氏名を自署し，押印する必要がある。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。公正証書遺言であっても、遺言能力がない、内容が公序良俗に反する、方式上重大な瑕疵がある等の理由で無効となる可能性があります。『公正証書なら常に有効』ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。遺言執行者に指定された者は、就職を承諾するか辞退するかを選べます。指定されたことだけで当然に執行義務を負うわけではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。秘密証書遺言は家庭裁判所の検認手続前に勝手に開封すると過料等の問題が生じますが、公証人立会いで開封しなければ遺言自体が当然無効になるわけではありません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい（出題当時）。自筆証書遺言は、遺言者が全文・日付・氏名を自書し押印するのが原則でした。現行法では財産目録は自書不要とする特則がありますが、日付・氏名の自書と押印は引き続き必要です。","corrected":"","inferredBasis":[]}],"references":["民法961条十五歳に達した者は、遺言をすることができる。"],"oldLawNote":"","referenceItems":[{"statuteRef":54}]},{"id":106,"year":18,"sourceQuestion":14,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟の判決に関する次の１から４の記述のうち、正しいものを1つ選びなさい。","choices":["筆界確定訴訟において、裁判所は、原告が主張している筆界が真の筆界であると確信することができないときは、原告の請求を棄却しなければならない。","原告が２００万円の損害賠償を請求した場合には、裁判所は、審理の結果明らかになった適切な賠償金額として２５０万円の支払を命ずることができる。","原告が土地所有権の確認を請求した場合には、裁判所は、土地の明渡しを命ずることができる。","原告が売買代金の支払を請求した場合には、被告から同時履行の抗弁権が行使され、それが認められるときは、裁判所は、売買目的物の引渡しと引換えに売買代金を支払うことを命ずることができる。"],"answer":4,"details":[{"mark":"×","explanation":"誤り。筆界確定訴訟では、原告主張の線が真の筆界だと証明できなくても、裁判所は証拠全体から客観的な筆界を自ら確定すべきで、単に請求棄却する性質の訴訟ではありません。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。処分権主義により、裁判所は原告が請求した200万円を超えて250万円の支払を命ずることはできません。請求の範囲が裁判所の審判上限です。","corrected":"","inferredBasis":[]},{"mark":"×","explanation":"誤り。所有権確認請求に対して、裁判所が原告の申立てのない土地明渡しまで命ずることはできません。確認請求と給付請求は訴訟物・判決内容が異なります。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。同時履行の抗弁が認められる場合、裁判所は原告の給付と引換えに被告が給付すべき旨の引換給付判決をすることができます。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法246条裁判所は、当事者が申し立てていない事項について、判決をすることができない。"],"oldLawNote":"","referenceItems":[{"statuteRef":215}]},{"id":107,"year":16,"sourceQuestion":13,"category":"民事訴訟・筆界確定訴訟","theme":"民事訴訟","prompt":"民事訴訟における処分権主義と弁論主義に関する次の１から４までの記述のうち、誤っているものを１つ選びなさい。","choices":["被告は、原告の同意がなければ、請求の認諾をすることができない。","裁判所は、職権で証人尋問をすることができない。","裁判所は、原告の請求を直接基礎付ける主要事実について、当事者が主張しない場合、その事実を判決の基礎としてはならない。","裁判所は、訴えの請求の対象（訴訟物）についてのみ判断をすることができる。"],"answer":1,"details":[{"mark":"×","explanation":"誤り。請求の認諾は被告が原告の請求を認めて訴訟を終結させる訴訟行為であり、原告の同意は必要ありません。調書に記載されると確定判決と同一の効力を有します。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。民事訴訟では証拠提出は原則として当事者の責任で行い、裁判所が職権で証人を探し出して尋問する一般的な職権証拠調べは認められていません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。弁論主義により、請求を直接基礎付ける主要事実は当事者が主張しなければ裁判所は判決の基礎にできません。","corrected":"","inferredBasis":[]},{"mark":"○","explanation":"正しい。処分権主義により、裁判所が審判できるのは当事者が設定した訴訟物・申立ての範囲内です。","corrected":"","inferredBasis":[]}],"references":["民事訴訟法246条裁判所は、当事者が申し立てていない事項について、判決をすることができない。"],"oldLawNo
